apiVersion: v2
name: sekiban
description: Integrity attestation controller — ValidatingAdmissionWebhook, CRDs, multi-layer signature verification
type: application
version: 0.2.0
appVersion: "0.2.0"
# v0.2.0: SignatureGate CRD gains Phase D (cartorio-native verify path) fields:
#   spec.cartorioUrl, spec.trustedPublisherPubkeys,
#   spec.requiredComplianceProfile, spec.requiredArtifactStatus.
# When cartorioUrl is set, the gate switches from string-equality on
# expectedSignature to cryptographic verify of the SignedRoot fetched
# from cartorio. Back-compat: the legacy fields still work when
# cartorioUrl is unset.

dependencies:
  - name: pleme-lib
    version: ">=0.18.0 <0.19.0"
    repository: "file://../pleme-lib"
