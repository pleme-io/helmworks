{{- if .Values.enabled }}
{{- include "pleme-cnpg.requireClusterName" . }}
{{- include "pleme-cnpg.requireBootstrapMode" . }}
{{- include "pleme-cnpg.requireInitdb" . }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-cnpg.labels" . | nindent 4 }}
    {{- with .Values.clusterLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Defense-in-depth: prevent `helm uninstall` from cascading into
    # CNPG's PVC deletion. Recovery from accidental disable is then
    # at-most a re-install (Helm sees the existing Cluster CR and
    # adopts), never a re-init from empty PVCs.
    helm.sh/resource-policy: keep
spec:
  imageName: {{ .Values.imageName | quote }}
  instances: {{ .Values.instances }}

  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}

  storage:
    size: {{ .Values.storage.size }}
    storageClass: {{ .Values.storage.storageClass }}

  resources:
    {{- toYaml .Values.resources | nindent 4 }}

  postgresql:
    parameters:
      {{- toYaml .Values.postgresql.parameters | nindent 6 }}

  {{- if .Values.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  {{- /*
    CNPG's `spec.affinity` (AffinityConfiguration) is where BOTH pod
    anti-affinity AND the pods' nodeSelector/tolerations live — CNPG does not
    expose a top-level spec.nodeSelector. So a caller that needs to PIN the
    Postgres pods to a specific node pool (e.g. the supacharge-only tainted
    isolation pool — the whole point of Option A) supplies
    `.Values.nodeSelector` / `.Values.tolerations` here and the block renders
    even when anti-affinity is off. Emit the affinity block if ANY of the three
    is requested.
  */}}
  {{- if or .Values.affinity.enabled .Values.nodeSelector .Values.tolerations }}
  affinity:
    {{- if .Values.affinity.enabled }}
    enablePodAntiAffinity: true
    topologyKey: {{ .Values.affinity.topologyKey }}
    podAntiAffinityType: preferred
    {{- end }}
    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- if .Values.walArchive.enabled }}
  # Inject AWS env so barman-cloud's boto3 generates correct SigV4
  # signatures against garage (region != us-east-1; addressing must
  # be path-style because garage doesn't support virtual-hosted
  # without wildcard DNS).
  env:
    - name: AWS_DEFAULT_REGION
      value: {{ .Values.walArchive.region | quote }}
    - name: AWS_S3_ADDRESSING_STYLE
      value: {{ .Values.walArchive.addressingStyle | quote }}
  {{- end }}

  {{- /*
    Bootstrap mode switch. Both renders are post-init no-ops on a
    live cluster — CNPG ignores spec.bootstrap changes after first
    instance creation.
  */}}
  bootstrap:
    {{- if eq .Values.bootstrap.mode "initdb" }}
    initdb:
      database: {{ .Values.bootstrap.initdb.database }}
      owner: {{ .Values.bootstrap.initdb.owner }}
      secret:
        name: {{ .Values.bootstrap.initdb.secretName }}
      {{- with .Values.bootstrap.initdb.postInitSQL }}
      postInitSQL:
        {{- range . }}
        - {{ . | replace "__OWNER__" $.Values.bootstrap.initdb.owner | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.bootstrap.initdb.postInitTemplateSQL }}
      postInitTemplateSQL:
        {{- range . }}
        - {{ . | replace "__OWNER__" $.Values.bootstrap.initdb.owner | quote }}
        {{- end }}
      {{- end }}
    {{- else if eq .Values.bootstrap.mode "recovery" }}
    recovery:
      source: {{ .Values.bootstrap.recovery.source }}
      {{- with .Values.bootstrap.recovery.recoveryTargetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
    {{- end }}

  {{- if and .Values.walArchive.enabled (eq .Values.bootstrap.mode "recovery") }}
  externalClusters:
    - name: {{ .Values.bootstrap.recovery.source }}
      barmanObjectStore:
        destinationPath: {{ printf "s3://%s/" .Values.walArchive.bucket | quote }}
        endpointURL: {{ .Values.walArchive.endpointURL | quote }}
        serverName: {{ include "pleme-cnpg.recoveryServerName" . | quote }}
        s3Credentials:
          accessKeyId:
            name: {{ .Values.walArchive.credentialsSecretName }}
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: {{ .Values.walArchive.credentialsSecretName }}
            key: SECRET_ACCESS_KEY
        wal:
          compression: {{ .Values.walArchive.wal.compression }}
          maxParallel: {{ .Values.walArchive.wal.maxParallel }}
          {{- with .Values.walArchive.wal.restoreAdditionalCommandArgs }}
          restoreAdditionalCommandArgs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  {{- end }}

  {{- if .Values.walArchive.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ printf "s3://%s/" .Values.walArchive.bucket | quote }}
      endpointURL: {{ .Values.walArchive.endpointURL | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.walArchive.credentialsSecretName }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.walArchive.credentialsSecretName }}
          key: SECRET_ACCESS_KEY
      wal:
        compression: {{ .Values.walArchive.wal.compression }}
        maxParallel: {{ .Values.walArchive.wal.maxParallel }}
        {{- with .Values.walArchive.wal.restoreAdditionalCommandArgs }}
        restoreAdditionalCommandArgs:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    retentionPolicy: {{ .Values.walArchive.retentionPolicy | quote }}
  {{- end }}
{{- end }}
