apiVersion: v2
name: shaar-concentrator
description: |
  Shaar VPN concentrator — the SERVER end of the akeyless-identity-gated
  WireGuard mesh, deployed INTO a target cluster as a hostNetwork pod so it
  binds the WireGuard UDP port on the NODE's own address (Camelot Mode-1: the
  single k3s node's EIP). Clients dial that endpoint, lease an
  akeyless-identity-gated short-TTL WG credential, and reach the cluster's k8s
  API + services PRIVATELY through the tunnel. Only the hardened WG UDP port is
  ever public.

  Renders the concentrator's k8s workload from ONE typed values surface:
    - Deployment  — hostNetwork, NET_ADMIN, root; the WG UDP + /sync webhook
      + admin-API pod. Authored DIRECTLY (not via pleme-lib.deployment) because
      pleme-lib's deployment/statefulset templates do NOT render hostNetwork,
      and hostNetwork is load-bearing here (the WG server MUST bind the node's
      own address). See README § "Honest gaps".
    - Service     — the -sync ClusterIP (the akeyless custom-producer's /sync
      webhook, port 8443) + the admin API (8088). Authored directly to preserve
      the `shaar-concentrator-sync` name the producer's /sync URL points at.
    - ConfigMap   — concentrator.yaml, driven from the typed values surface.
      admin.token + webhook_creds are SecretRef::Env references (NEVER inline
      plaintext); the actual values are injected as env vars from a k8s Secret.
    - PVC         — persists the Ed25519 admission-signing key + receipt chain.
    - ServiceAccount + breatheBand — via pleme-lib named templates.

  PRIVATE (skunkworks): Shaar STAYS PRIVATE. This chart is NOT wired into the
  public AUTO-RELEASE / oci://ghcr.io/pleme-io/charts. It is a private chart the
  operator renders with `helm template | kubectl apply` from the pleme-io side,
  into its own `shaar` namespace on borrowed (guest) ground.
type: application
version: 0.1.1
appVersion: "0.1.0"
keywords: [shaar, wireguard, vpn, concentrator, akeyless, mesh, skunkworks, private]
maintainers: [{name: drzzln, email: drzzln@protonmail.com}]
home: https://github.com/pleme-io/helmworks
# PRIVATE — skip-auto-release. Shaar STAYS PRIVATE (skunkworks). This annotation
# makes forge's discover_charts SKIP this chart, so the helmworks auto-release
# NEVER publishes it to oci://ghcr.io/pleme-io/charts (same mechanism the
# cartorio / lacre / openclaw-* private charts use). The operator renders it with
# `helm template | kubectl apply` from the pleme-io side; there is no public OCI
# artifact and no FluxCD/operator wiring for the workload.
annotations:
  org.opencontainers.image.source: https://github.com/pleme-io/helmworks
  pleme.io/oci-auto-release: "false"
dependencies:
  # Only pleme-lib — this chart authors the hostNetwork Deployment / Service /
  # PVC DIRECTLY (pleme-lib can't express hostNetwork) but reuses pleme-lib for
  # the fleet-standard helpers (fullname / namespace / labels / selectorLabels),
  # the ServiceAccount, and the optional breatheBand. Requires >=0.33.0 for
  # values-driven securityContext.capabilities.add and honest runAsUser:0 /
  # runAsNonRoot:false (the root+NET_ADMIN surface — same floor the twin
  # lareira-fortigate-gateway pins).
  - name: pleme-lib
    version: ">=0.33.0"
    repository: "file://../pleme-lib"
