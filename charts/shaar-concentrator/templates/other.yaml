{{/*
The resources pleme-lib CAN express cleanly, delegated to its named templates:
  - pleme-lib.serviceaccount  — the pod's SA (labels + compliance-aware).
  - pleme-lib.networkpolicy   — off by default (hostNetwork NetworkPolicy is a
    CNI no-op; see values.yaml + README § "Honest gaps"). Rendered only when
    networkPolicy.enabled is explicitly true, for a future non-hostNetwork variant.
  - pleme-lib.breatheBand     — optional MemoryBand/CpuBand (default OFF). Targets
    this chart's own Deployment inline (name = <fullname>).
*/}}
{{- $_ := set .Values "serviceAccount" (merge (dict "create" true "name" "") (.Values.serviceAccount | default dict)) -}}
{{ include "pleme-lib.serviceaccount" . }}
{{- include "pleme-lib.networkpolicy" . }}
{{- include "pleme-lib.breatheBand" . }}
