{{/*
shaar-concentrator Deployment — authored DIRECTLY (not via pleme-lib.deployment).

WHY direct: pleme-lib's _deployment.tpl / _statefulset.tpl do NOT render
`hostNetwork` / `dnsPolicy` (they only reference hostNetwork in the compliance
validator, to FORBID it under a baseline). hostNetwork is load-bearing here —
the WG server MUST bind the WireGuard UDP port on the NODE's own address (in
Camelot Mode-1 the node's EIP IS the concentrator's public WG endpoint). So the
pod spec is hand-authored, but every metadata surface reuses the pleme-lib
helpers (fullname / namespace / labels / selectorLabels) so this object is
label-consistent with the rest of the fleet. See README § "Honest gaps".

SECURITY: SHAAR_CONCENTRATOR_CREDS + SHAAR_ADMIN_TOKEN are injected from the
secretRef Secret via valueFrom.secretKeyRef — the ConfigMap only carries the
SecretRef::Env *reference* (kind: env, var: …), never the value.
*/}}
{{- $fullname := include "pleme-lib.fullname" . -}}
{{- $pullPolicy := .Values.image.pullPolicy -}}
{{- if not $pullPolicy }}
{{-   $pullPolicy = ternary "Never" "IfNotPresent" .Values.localImport -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pleme-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-lib.selectorLabels" . | nindent 8 }}
        app: {{ $fullname }}
    spec:
      serviceAccountName: {{ include "pleme-lib.serviceAccountName" . }}
      # Bind the WG UDP port + /sync webhook on the node's own address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Root (uid 0) for server-mode utun + nftables reach enforcer.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: {{ include "pleme-lib.name" . }}
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ $pullPolicy }}
          args: ["--config", "/etc/shaar/concentrator.yaml"]
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]   # server-mode utun + the nftables reach enforcer
          ports:
            - name: wireguard
              containerPort: {{ .Values.listen_port }}
              protocol: UDP
            - name: sync
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- if .Values.admin.enabled }}
            - name: admin
              containerPort: {{ (splitList ":" .Values.admin.bind) | last | int }}
              protocol: TCP
            {{- end }}
          env:
            # The /sync shared bearer — from the secretRef Secret, NEVER inline.
            - name: SHAAR_CONCENTRATOR_CREDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: {{ .Values.secretRef.credsKey }}
            {{- if .Values.admin.enabled }}
            # The admin-API bearer — from the secretRef Secret, NEVER inline.
            - name: SHAAR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: {{ .Values.secretRef.tokenKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/shaar
              readOnly: true
            - name: state
              mountPath: /var/lib/shaar   # Ed25519 signing key + receipt chain
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.webhook.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: state
          persistentVolumeClaim:
            claimName: {{ $fullname }}-state
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
