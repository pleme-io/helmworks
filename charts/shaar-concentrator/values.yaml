# shaar-concentrator — the Shaar VPN concentrator (server end) on a target cluster.
#
# ONE typed authoring surface. The chart's templates translate every key below
# into the rendered Deployment / Service / ConfigMap / PVC. `values.schema.json`
# rejects any key not declared here (additionalProperties:false), so a misspelled
# or dropped key is an INSTALL-TIME ERROR, never a silently-ignored no-op.
#
# One hostNetwork pod:
#   shaar-concentrator — NET_ADMIN + root; server-mode utun + the nftables reach
#   enforcer, the WireGuard UDP port bound on the node's own address, the /sync
#   webhook the akeyless custom-producer calls, and the operator admin API.
#
# HOST-FREE (skunkworks): no account-id / EIP / reach-CIDRs are committed here.
# The reach CIDRs + pool + public endpoint are per-deploy operational detail,
# supplied at `helm template -f <override>.yaml` time (see values-example.yaml).

# ---------------------------------------------------------------------------
# COMPLIANCE — MUST stay empty.
# This workload genuinely needs hostNetwork + NET_ADMIN + root. A FedRAMP
# moderate/high baseline hard-fails on exactly those (AC-6/SC-7/CM-7 — see
# pleme-lib _compliance_security.tpl, which forbids hostNetwork:true under any
# baseline), so any non-empty baseline would refuse to render. Keep it "".
# (The Deployment is authored directly, so pleme-lib's compliance validator does
# not run against it — but the marker documents WHY a baseline can never apply.)
# ---------------------------------------------------------------------------
compliance:
  baseline: ""

# Resource naming. Pins every rendered object to the shared convention. The
# Service takes the fullname + a `-sync` suffix (shaar-concentrator-sync), which
# the akeyless custom-producer's /sync URL points at — do not change it lightly.
fullnameOverride: shaar-concentrator
nameOverride: ""

replicaCount: 1

# The WG session + /dev/net/tun device + the WG UDP port are pod-singletons on
# hostNetwork — never run two at once. Recreate tears the old pod down before the
# new one starts, so two pods never fight over one tun / one host UDP port.
strategy:
  type: Recreate

# ---------------------------------------------------------------------------
# image — the shaar-concentrator container.
# PRIVATE image (Shaar STAYS PRIVATE). Built by CI (image-push.yml) to
# ghcr.io/pleme-io/shaar-concentrator with the AUTOBUMP exact-tag scheme
# (amd64-r<run>-<sha>). NEVER deploy from :latest — pin the exact tag (or set
# `localImport: true` below to use a locally-imported image, pullPolicy Never).
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/pleme-io/shaar-concentrator
  # TODO(operator): pin an exact AUTOBUMP tag (amd64-r<run>-<sha>).
  tag: amd64-latest
  # pullPolicy is DERIVED from localImport (below) when unset:
  #   localImport: true  -> Never   (use a locally `k3s ctr images import`-ed image)
  #   localImport: false -> IfNotPresent (pull the pinned tag from GHCR)
  # Set explicitly to override the derivation.
  pullPolicy: ""

# Local-import mode. When true, pullPolicy defaults to Never (the image is
# imported into the node's containerd out-of-band, e.g. `k3s ctr images import`
# or a mirror into the cluster's own zot) — the raw manifest's `Never` posture.
# When false, the pinned tag is pulled from GHCR using imagePullSecrets below.
localImport: false

# Private GHCR pull credentials (used when localImport:false). The in-namespace
# private-ghcr pull Secret. Empty ⇒ no imagePullSecrets emitted (localImport
# mode, or a public image).
imagePullSecrets:
  - name: ghcr-pleme-io

# Pod placement. hostNetwork binds the WG UDP port on ONE node's address; the
# PVC (RWO) + the single WG session are node singletons — pin the concentrator to
# exactly one node so Recreate never lands it elsewhere. Empty = unpinned.
nodeSelector: {}
  # TODO(operator): pin to the concentrator node, e.g.
  # kubernetes.io/hostname: <node>

# The target node may carry a breathe scheduling taint (Camelot's is
# `breathe.pleme.io/pool=...:NoSchedule`). Tolerate it so the pod schedules.
# Empty = no tolerations (drop this for an untainted node).
tolerations:
  - key: "breathe.pleme.io/pool"
    operator: "Exists"
    effect: "NoSchedule"

# ---------------------------------------------------------------------------
# pool — the /32 client address pool. First usable host (.1) becomes the
# concentrator's own interface address. (ConcentratorConfig.pool_cidr)
# ---------------------------------------------------------------------------
pool:
  cidr: 10.99.0.0/24

# ---------------------------------------------------------------------------
# WireGuard listen port — the server-mode UDP port clients dial. On hostNetwork
# this binds directly on the node's address. (ConcentratorConfig.listen_port)
# ---------------------------------------------------------------------------
listen_port: 51822

# ---------------------------------------------------------------------------
# public_endpoint — the ip:port embedded in EVERY lease. Empty ⇒ OMITTED from
# the ConfigMap so the concentrator SELF-DISCOVERS it from AWS IMDS at startup
# (the config.rs DISCOVERED tier: `public-ipv4 : listen_port`). Set an explicit
# `ip:port` on a non-AWS node or a non-default listen port. HOST-FREE: leave it
# empty on Camelot (the concentrator fills its own EIP).
# ---------------------------------------------------------------------------
public_endpoint: ""

# ---------------------------------------------------------------------------
# reach — the networks the concentrator routes clients to (the server-owned
# grant). REQUIRED, non-empty. HOST-FREE: these reach CIDRs are operational
# detail supplied at deploy time (the k8s API /32 + the pod/svc CIDRs).
# (ConcentratorConfig.target_cidrs)
# ---------------------------------------------------------------------------
reach:
  targetCidrs: []
    # TODO(operator, per-deploy): e.g.
    # - 10.42.0.0/16   # pod CIDR
    # - 10.43.0.0/16   # service CIDR
    # - 10.0.0.10/32   # the k8s API server

# Lease + GC tuning. (ConcentratorConfig.lease_ttl_secs / gc_interval_secs)
leaseTtlSecs: 3600
gcIntervalSecs: 60

# The WireGuard data-plane engine — a RUNTIME knob (ConfigPlane: config selects
# the executor, never a compile-time fork). `kernel` = the measured ~6.3x
# throughput lever (Linux + the wireguard module); `userspace` = portable, no
# kernel module. (ConcentratorConfig.engine)
engine: kernel

# Whether the concentrator installs its own source-NAT (masquerade) so pool
# egress to reach targets works on a node with no NAT profile. Default true
# (self-sufficient); set false where the node-OS already NATs (avoids double-SNAT).
# (ConcentratorConfig.self_masquerade)
selfMasquerade: true

# The base WireGuard interface name (OS iface = wg-<name[..12]>).
# (ConcentratorConfig.tunnel_name)
tunnelName: shaar

# ---------------------------------------------------------------------------
# identity — optional blast-radius controls (least-privilege).
#   leaseQuota      — per-identity concurrent-lease cap. Empty ⇒ unlimited.
#                     (ConcentratorConfig.identity_lease_quota)
#   reachCeilings   — per-principal (access_id -> [CIDR]) reach ceilings; the
#                     server grant is clamped to this ceiling at admit, so a
#                     principal can never reach beyond it. Empty ⇒ the full grant.
#                     (ConcentratorConfig.identity_reach_ceilings)
# ---------------------------------------------------------------------------
identity:
  leaseQuota: ""       # e.g. 4
  reachCeilings: {}    # e.g. { p-ci-runner: ["10.42.1.0/24"], p-admin: ["10.42.0.0/16"] }

# ---------------------------------------------------------------------------
# webhook — the /sync webhook the akeyless custom-producer calls (/sync/create
# + /sync/revoke) to mint / revoke a WG lease. On hostNetwork the webhook binds
# on the node's address at this port; the -sync Service (below) fronts it in
# cluster so the akeyless gateway reaches it as `shaar-concentrator-sync:<port>`.
# (ConcentratorConfig.webhook_bind = 0.0.0.0:<port>)
# ---------------------------------------------------------------------------
webhook:
  port: 8443

# ---------------------------------------------------------------------------
# admin — the optional operator admin API (visibility + offboard surface).
# enabled:false ⇒ the `admin:` block is OMITTED from the ConfigMap and the admin
# API is NOT served. enabled:true ⇒ both a bind and a token are required by
# construction (a token-less admin section is a parse error in config.rs).
# Bind stays localhost by default (trusted-interface posture); the token is a
# SecretRef::Env ref (SHAAR_ADMIN_TOKEN), NEVER inline plaintext. (config.rs admin)
# ---------------------------------------------------------------------------
admin:
  enabled: true
  # Default localhost-only (trusted-interface posture). A localhost bind is NOT
  # reachable via a ClusterIP Service on a hostNetwork pod (the pod uses the
  # node netns) — so `expose` below is OFF by default and honestly so: operator
  # admin reach is `kubectl exec` / a node-local tunnel, not a Service.
  bind: 127.0.0.1:8088
  # expose: only add an `admin` port to the -sync Service. Requires binding the
  # admin API to a Service-reachable address (0.0.0.0 / the pod IP), NOT 127.0.0.1
  # — otherwise the Service port has nothing to route to. Keep OFF unless you also
  # widen admin.bind, and NEVER put the admin port on a public path.
  expose: false
  servicePort: 8088

# ---------------------------------------------------------------------------
# secretRef — the k8s Secret holding the two runtime bearers. The ConfigMap
# references these as SecretRef::Env (kind: env), and the container reads them
# from env vars injected via valueFrom.secretKeyRef — so NO plaintext bearer
# ever lands in the ConfigMap or the chart.
#   <credsKey> -> env SHAAR_CONCENTRATOR_CREDS  (the /sync shared bearer)
#   <tokenKey> -> env SHAAR_ADMIN_TOKEN         (the admin-API bearer; only
#                                                 injected when admin.enabled)
# Create it out-of-band (e.g. from a cofre SecretRef materialization):
#   kubectl -n shaar create secret generic shaar-concentrator-creds \
#     --from-literal=webhook-creds=<bearer> --from-literal=admin-token=<token>
# ---------------------------------------------------------------------------
secretRef:
  name: shaar-concentrator-creds
  credsKey: webhook-creds
  tokenKey: admin-token

# ---------------------------------------------------------------------------
# state — the PVC persisting the Ed25519 admission-signing key + receipt chain
# across restarts, so every receipt re-verifies with a stable published key and
# the chain survives a pod roll. RWO singleton, mounted at /var/lib/shaar.
# ---------------------------------------------------------------------------
state:
  pvcSize: 1Gi
  # storageClassName: ""   # empty ⇒ the cluster default StorageClass
  storageClassName: ""

# ---------------------------------------------------------------------------
# resources — the concentrator container resource requests/limits.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ---------------------------------------------------------------------------
# serviceAccount — created via pleme-lib.serviceaccount.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""

# ---------------------------------------------------------------------------
# NetworkPolicy — OFF by default and honestly so.
# This is a hostNetwork pod, and Kubernetes NetworkPolicy does NOT govern
# hostNetwork pod traffic in most CNIs (the pod uses the node's netns). A
# deny-all here would be a misleading no-op. Node-level firewalling (nftables /
# security-group) is the real control for a hostNetwork WG server. Left as a
# toggle for a future non-hostNetwork variant; see README § "Honest gaps".
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false

# ---------------------------------------------------------------------------
# breathe — optional breathe.pleme.io homeostasis bands (default OFF).
# VERTICAL ONLY: MemoryBand / CpuBand (right-size the one pod). Deliberately NO
# ReplicaBand / spot — a stateful hostNetwork WG server pinned to one node with
# an RWO PVC is a legit skip-breathe on the replica + spot axes (running two
# concentrators would fight over the host UDP port + the RWO PVC). Use
# shadow-first (memory/cpu .dryRun: true) on a new node, then promote per band.
# ---------------------------------------------------------------------------
breathe:
  enabled: false
