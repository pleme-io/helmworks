apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: export-worker
  {{- with .Values.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
