# convergence-controller — K8s operator values
# Inherits pleme-operator security baseline via pleme-lib

image:
  repository: ghcr.io/pleme-io/convergence-controller
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

rbac:
  create: true
  rules:
    # ConvergenceProcess CRDs
    - apiGroups: ["convergence.pleme.io"]
      resources:
        - convergenceprocesses
        - convergenceprocesses/status
        - convergenceplatforms
        - convergenceplatforms/status
        - convergenceservices
        - convergenceservices/status
        - processtables
        - processtables/status
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # InfrastructureFlow (pangea-operator composition)
    - apiGroups: ["pangea.pleme.io"]
      resources:
        - infrastructureflows
        - infrastructureflows/status
        - infrastructuretemplates
        - infrastructuretemplates/status
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # FluxCD resources (monitoring child clusters)
    - apiGroups: ["kustomize.toolkit.fluxcd.io"]
      resources: ["kustomizations"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["helm.toolkit.fluxcd.io"]
      resources: ["helmreleases"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["source.toolkit.fluxcd.io"]
      resources: ["gitrepositories", "helmrepositories"]
      verbs: ["get", "list", "watch"]
    # Core resources (secrets, events, namespaces)
    - apiGroups: [""]
      resources: ["secrets", "configmaps", "events", "namespaces"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Nodes (health monitoring)
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]

ports:
  - name: health
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: health
      port: 8080
      targetPort: health

env:
  - name: RUST_LOG
    value: "info,convergence_controller=debug"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

health:
  path: /healthz
  readyPath: /readyz
  port: health

strategy:
  type: Recreate

monitoring:
  enabled: true
  port: health
  path: /metrics
  interval: 30s

networkPolicy:
  enabled: true
  allowPrometheus: true
  allowDns: true
  additionalEgress:
    # AWS API access (Route53, SSM)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # GitHub API access (Git scaffolding)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
