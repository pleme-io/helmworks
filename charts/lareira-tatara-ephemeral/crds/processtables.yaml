apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: processtables.tatara.pleme.io
spec:
  group: tatara.pleme.io
  names:
    categories: []
    kind: ProcessTable
    plural: processtables
    shortNames:
      - pt
    singular: processtable
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.processCount
          name: Procs
          type: integer
        - jsonPath: .status.readyCount
          name: Ready
          type: integer
        - jsonPath: .spec.nextSequence
          name: NextPID
          type: integer
        - jsonPath: .spec.maxDepth
          name: Depth
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for ProcessTableSpec via `CustomResource`
          properties:
            spec:
              description: |-
                ProcessTable — the cluster-wide `/proc` equivalent.

                One per cluster (singleton by convention, name `"proc"`). Aggregates every `Process` status and hands out PIDs.
              properties:
                dnsDomain:
                  description: DNS domain (e.g., `quero.lol`).
                  nullable: true
                  type: string
                dnsZoneId:
                  description: DNS zone id (e.g., Route53 zone id).
                  nullable: true
                  type: string
                maxChildren:
                  default: 0
                  description: Max concurrent direct children (0 = unlimited).
                  format: uint32
                  minimum: 0.0
                  type: integer
                maxDepth:
                  default: 0
                  description: Max recursion depth from this node (0 = unlimited).
                  format: uint32
                  minimum: 0.0
                  type: integer
                nextSequence:
                  default: 1
                  description: Next hierarchical sequence number to hand out at this level.
                  format: uint32
                  minimum: 0.0
                  type: integer
                orphanReapingEnabled:
                  default: true
                  description: When true, PID 1 adopts and terminates orphaned Processes.
                  type: boolean
                parentPid:
                  description: PID path of this cluster's parent (None at the root).
                  nullable: true
                  type: string
                sigtermTimeoutSeconds:
                  default: 480
                  description: Grace window before escalating SIGTERM → SIGKILL (seconds).
                  format: uint32
                  minimum: 0.0
                  type: integer
                zombieTimeoutSeconds:
                  default: 600
                  description: After this long in Zombie, force-reap.
                  format: uint32
                  minimum: 0.0
                  type: integer
              type: object
            status:
              nullable: true
              properties:
                claims:
                  additionalProperties:
                    description: One stable-name claim record. Cited by holder Process's namespace/name + content-hash PID + when granted + priority that won the arbitration. Used by [`ProcessTableStatus::claims`].
                    properties:
                      grantedAt:
                        description: When the claim was granted to the current holder. Operator- visible "how long has this been the claim holder?" metric.
                        format: date-time
                        type: string
                      holder:
                        description: '`${namespace}/${name}` of the holder Process. Reconciler uses this to resolve the holder during render — every emitted stable-form Ingress carries an ownerRef back to this Process.'
                        type: string
                      pid:
                        description: PID path of the holder (mirror of the Process's `status.pid`). Lets observers detect a stale claim if the holder is reaped but the registry update lags.
                        type: string
                      priority:
                        description: Priority the holder declared (from `RoutingSpec.priority`). Stamped so a new candidate-Process can compare without reading the holder's spec.
                        format: int32
                        type: integer
                    required:
                      - grantedAt
                      - holder
                      - pid
                      - priority
                    type: object
                  description: |-
                    **R6** — Stable-name claim registry. Key: `${cluster}/${app}` (e.g., `pleme-dev/gator`). Value: the Process currently holding the unprefixed-form DNS for that (cluster, app) tuple. At most one Process per key; transfer is atomic on the holder's Failed/Zombie/Reaped transition.

                    The reconciler's claim arbiter (`tatara-reconciler::claim`) is the sole writer; every other actor reads.
                  type: object
                lastReconciled:
                  format: date-time
                  nullable: true
                  type: string
                processCount:
                  format: uint32
                  minimum: 0.0
                  type: integer
                processes:
                  default: []
                  items:
                    description: One row of `/proc`.
                    properties:
                      attestationRoot:
                        nullable: true
                        type: string
                      contentHash:
                        nullable: true
                        type: string
                      lastUpdated:
                        format: date-time
                        nullable: true
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                      parentPid:
                        nullable: true
                        type: string
                      phase:
                        description: |-
                          The Unix-authentic phase a Process is in.

                          Canonical transitions: ```text Pending → Forking → Execing → Running → Attested ↘ Failed Attested → Reconverging → Execing                       (SIGHUP, no zombie) Attested → Releasing  → Exiting → Zombie → Reaped       (export-then-SIGTERM) Attested → Exiting    → Zombie → Reaped                 (no-exports SIGTERM) Failed   → Releasing  → Zombie → Reaped                 (post-mortem exports) Failed   → Zombie     → Reaped                          (no-exports failed) Running  → Exiting    → Zombie → Reaped                 (early SIGTERM, no exports) Running  → Failed                                       (non-zero exit) ```

                          `Releasing` is the export window — the reconciler runs declared `ExportSpec`s (via tatara-export-worker Jobs) between the terminal phase reached (`Attested` or `Failed`) and `Exiting` / `Zombie`. A Process with no `lifetime.ephemeral.exports`, or where no export's trigger matches the phase reached, skips `Releasing` entirely. See [`crate::export`] + [`crate::lifetime`].
                        enum:
                          - Pending
                          - Forking
                          - Execing
                          - Running
                          - Attested
                          - Reconverging
                          - Releasing
                          - Exiting
                          - Failed
                          - Zombie
                          - Reaped
                        type: string
                      pid:
                        type: string
                      pointType:
                        description: Serialized `ConvergencePointType` (e.g., `"Gate"`).
                        type: string
                      substrate:
                        description: Serialized `SubstrateType` (e.g., `"Observability"`).
                        type: string
                    required:
                      - name
                      - namespace
                      - phase
                      - pid
                      - pointType
                      - substrate
                    type: object
                  type: array
                readyCount:
                  format: uint32
                  minimum: 0.0
                  type: integer
              required:
                - processCount
                - readyCount
              type: object
          required:
            - spec
          title: ProcessTable
          type: object
      served: true
      storage: true
      subresources:
        status: {}
