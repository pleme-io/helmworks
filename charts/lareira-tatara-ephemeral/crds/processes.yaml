---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: processes.tatara.pleme.io
spec:
  group: tatara.pleme.io
  names:
    categories: []
    kind: Process
    plural: processes
    shortNames:
      - proc
    singular: process
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.pid
          name: PID
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.classification.pointType
          name: Type
          type: string
        - jsonPath: .spec.classification.substrate
          name: Substrate
          type: string
        - jsonPath: .status.attestation.generation
          name: Gen
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for ProcessSpec via `CustomResource`
          properties:
            spec:
              description: |-
                Process — one element of the tatara convergence lattice, reconciled as a Unix process.

                ```yaml apiVersion: tatara.pleme.io/v1alpha1 kind: Process metadata: name: observability-stack namespace: seph spec: identity: parent: seph.1 classification: pointType: Gate substrate: Observability intent: nix: flakeRef: github:pleme-io/k8s?dir=shared/infrastructure attribute: observability compliance: baseline: fedramp-moderate bindings: - framework: nist-800-53 controlId: SC-7 phase: AtBoundary dependsOn: - name: borealis-injection ```
              properties:
                boundary:
                  default:
                    postconditions: []
                    preconditions: []
                  description: Boundary predicates (preconditions / postconditions).
                  properties:
                    postconditions:
                      default: []
                      items:
                        description: A single boundary predicate.
                        properties:
                          kind:
                            enum:
                              - ProcessPhase
                              - KustomizationHealthy
                              - HelmReleaseReleased
                              - PromQL
                              - Cel
                              - NixEval
                              - JobAttested
                              - ClosedLoopAuth
                            type: string
                          params:
                            description: Kind-specific payload (free-form JSON).
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                        required:
                          - kind
                        type: object
                      type: array
                    preconditions:
                      default: []
                      items:
                        description: A single boundary predicate.
                        properties:
                          kind:
                            enum:
                              - ProcessPhase
                              - KustomizationHealthy
                              - HelmReleaseReleased
                              - PromQL
                              - Cel
                              - NixEval
                              - JobAttested
                              - ClosedLoopAuth
                            type: string
                          params:
                            description: Kind-specific payload (free-form JSON).
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                        required:
                          - kind
                        type: object
                      type: array
                    timeout:
                      description: Max time before VERIFY fails — parsed as a `go`-style duration. Empty = controller default (15m).
                      nullable: true
                      type: string
                  type: object
                classification:
                  description: Lattice position (6 dimensions).
                  properties:
                    calm:
                      default: Monotone
                      description: CALM theorem classification — determines whether coordination is required.
                      enum:
                        - Monotone
                        - NonMonotone
                      type: string
                    dataClassification:
                      default: Internal
                      description: Data sensitivity, drives compliance baseline selection.
                      enum:
                        - Public
                        - Internal
                        - Confidential
                        - Pii
                        - Phi
                        - Pci
                      type: string
                    horizon:
                      default:
                        kind: Bounded
                      description: How long the point runs. Flattened struct-of-optionals so the OpenAPI schema carries a single `kind` discriminator without per-variant merge.
                      properties:
                        direction:
                          description: Whether to minimize or maximize the metric (Asymptotic only).
                          enum:
                            - Minimize
                            - Maximize
                          nullable: true
                          type: string
                        healthyRateThreshold:
                          description: Rate threshold considered healthy (Asymptotic only).
                          format: double
                          nullable: true
                          type: number
                        kind:
                          default: Bounded
                          enum:
                            - Bounded
                            - Asymptotic
                          type: string
                        metric:
                          description: Metric being optimized (Asymptotic only).
                          nullable: true
                          type: string
                      type: object
                    pointType:
                      description: Structural type — how data flows through the point.
                      enum:
                        - Transform
                        - Fork
                        - Join
                        - Gate
                        - Select
                        - Broadcast
                        - Reduce
                        - Observe
                      type: string
                    substrate:
                      description: Operational substrate.
                      enum:
                        - Financial
                        - Compute
                        - Network
                        - Storage
                        - Security
                        - Identity
                        - Observability
                        - Regulatory
                      type: string
                  required:
                    - pointType
                    - substrate
                  type: object
                compliance:
                  default:
                    autoRemediate: false
                    bindings: []
                  description: Compliance bindings + baseline.
                  properties:
                    autoRemediate:
                      default: false
                      description: Allow the reconciler to invoke remediation hooks on violations.
                      type: boolean
                    baseline:
                      description: Canonical baseline (e.g., `fedramp-moderate`, `cis-k8s-v1.8`, `soc2`, `pci-dss`). Semantically the `meet` of all `bindings`.
                      nullable: true
                      type: string
                    bindings:
                      default: []
                      description: Individual control bindings.
                      items:
                        properties:
                          controlId:
                            description: Control id within the framework (e.g., `SC-7`, `5.1.1`).
                            type: string
                          description:
                            description: Optional human description.
                            nullable: true
                            type: string
                          framework:
                            description: 'Framework name: `nist-800-53`, `cis-k8s-v1.8`, `fedramp-moderate`, `soc2`, `pci-dss`.'
                            type: string
                          phase:
                            default: AtBoundary
                            description: When the binding is verified.
                            enum:
                              - PlanTime
                              - AtBoundary
                              - PostConvergence
                            type: string
                        required:
                          - controlId
                          - framework
                        type: object
                      type: array
                  type: object
                dependsOn:
                  default: []
                  description: Lattice dependencies — must reach phase before we proceed.
                  items:
                    description: Dependency edge — constrains this Process to wait for another to reach a phase.
                    properties:
                      mustReach:
                        default: Attested
                        description: Minimum phase the target must reach before we proceed past Forking.
                        enum:
                          - Running
                          - Attested
                        type: string
                      name:
                        description: Target Process `metadata.name`.
                        type: string
                      namespace:
                        description: Target Process namespace. Defaults to this Process's namespace.
                        nullable: true
                        type: string
                    required:
                      - name
                    type: object
                  type: array
                encapsulates:
                  description: Pre-existing in-cluster state this Process wraps. When `None`, the Process is greenfield (Manage mode implicitly applied to nothing pre-existing). See [`crate::encapsulates`] for the three modes (Manage / Adopt / Observe).
                  nullable: true
                  properties:
                    kind:
                      description: What kind of pre-existing state.
                      properties:
                        bareWorkload:
                          description: Pre-existing in-cluster workload (Deployment/StatefulSet/etc) not Flux-managed. The reconciler adds ownerRefs + emits routing only. The workload stays where it is.
                          nullable: true
                          properties:
                            namespace:
                              description: Namespace the workload lives in.
                              type: string
                            selector:
                              additionalProperties:
                                type: string
                              description: Label selector. Must match a single Deployment/StatefulSet/ DaemonSet; multiple matches are a config error.
                              type: object
                          required:
                            - namespace
                            - selector
                          type: object
                        existingHelmRelease:
                          description: An existing FluxCD HelmRelease. The reconciler emits a new HR with the SAME `release_name` — helm-controller finds + adopts the in-cluster release without recreating Pods.
                          nullable: true
                          properties:
                            name:
                              description: Name of the HelmRelease CR.
                              type: string
                            namespace:
                              description: Namespace of the HelmRelease CR.
                              type: string
                            releaseName:
                              description: The `spec.releaseName` Helm used for the actual chart install. For Adopt mode, the reconciler's emitted HR matches this so helm-controller adopts in-place. Required because the HR's `metadata.name` and `spec.releaseName` aren't always equal.
                              type: string
                          required:
                            - name
                            - namespace
                            - releaseName
                          type: object
                        existingKustomization:
                          description: An existing FluxCD Kustomization. The reconciler stops emitting its own and instead references the existing one.
                          nullable: true
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          required:
                            - name
                            - namespace
                          type: object
                      type: object
                    mode:
                      default: Manage
                      description: Reconciler's relationship to that state. Defaults to `Manage` (the operational default when `encapsulates` is set without an explicit mode).
                      enum:
                        - Manage
                        - Adopt
                        - Observe
                      type: string
                  required:
                    - kind
                  type: object
                identity:
                  default: {}
                  description: Identity (parent, name override).
                  properties:
                    nameOverride:
                      description: Human name override — if set, used verbatim instead of the content hash.
                      nullable: true
                      type: string
                    parent:
                      description: Parent PID path (None for init/PID 1).
                      nullable: true
                      type: string
                  type: object
                intent:
                  description: Where rendered artifacts come from. Exactly one variant must be set.
                  properties:
                    aplicacao:
                      description: |-
                        Aplicacao intent — emit a FluxCD `HelmRelease` for a pleme-io typed Aplicacao chart. The chart owns its own sub-chart DAG; the reconciler only watches `HelmRelease.status.conditions[type=Ready]`.

                        This is the canonical handoff from caixa `(defaplicacao …)` declarations (which the typescape renders to this Intent) into in-cluster reconciliation. Closed-loop ephemeral test environments use this variant with `:lifetime :ephemeral` on the surrounding ProcessSpec.

                        Example (Lisp): ```lisp :intent (:aplicacao (:chart-ref "oci://ghcr.io/pleme-io/charts/lareira-borealis-deployment" :version "0.5.5" :profile "gateway-with-internal-saas" :values-overlay (:cluster (:name "ephemeral-test-01") :persistence false :compliance (:overlays [])))) ```
                      nullable: true
                      properties:
                        chartRef:
                          description: Helm chart reference. OCI (`oci://…`) or repo-relative (`pleme-io/lareira-borealis-deployment`).
                          type: string
                        installTimeout:
                          description: Install timeout (`humantime` duration). Empty = chart-controller default.
                          nullable: true
                          type: string
                        profile:
                          description: Architecture profile from the chart's `values/*.yaml` family (e.g. `gateway-with-internal-saas`, `saas-internal`). Leave empty to use chart defaults.
                          type: string
                        releaseName:
                          description: HelmRelease name override. Defaults to the Process's PID-derived name.
                          nullable: true
                          type: string
                        targetNamespace:
                          description: Target namespace for the chart. Defaults to the Process's namespace.
                          nullable: true
                          type: string
                        valuesOverlay:
                          description: Typed values overlay merged on top of the profile. Free-form JSON to keep tatara-process decoupled from chart schemas.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        version:
                          description: Chart version (Helm semver constraint; `">=0.5.5"` allowed).
                          type: string
                      required:
                        - chartRef
                        - version
                      type: object
                    container:
                      description: Container intent — direct Deployment/StatefulSet/etc, no Helm.
                      nullable: true
                      properties:
                        args:
                          default: []
                          items:
                            type: string
                          type: array
                        command:
                          default: []
                          items:
                            type: string
                          type: array
                        env:
                          additionalProperties:
                            type: string
                          default: {}
                          type: object
                        image:
                          type: string
                        replicas:
                          format: int32
                          nullable: true
                          type: integer
                        workloadKind:
                          default: Deployment
                          enum:
                            - Deployment
                            - StatefulSet
                            - DaemonSet
                            - Job
                            - CronJob
                          type: string
                      required:
                        - image
                      type: object
                    flux:
                      description: FluxCD passthrough intent — reuse an existing GitRepository.
                      nullable: true
                      properties:
                        decryptSops:
                          default: true
                          description: SOPS decryption — defaults to true to match pleme-io conventions.
                          type: boolean
                        gitRepository:
                          description: Name of an existing `GitRepository` (typically in `flux-system`).
                          type: string
                        gitRepositoryNamespace:
                          description: Optional namespace of the GitRepository CR (defaults to `flux-system`).
                          nullable: true
                          type: string
                        helmChart:
                          description: If set, additionally emit a HelmRelease for this chart.
                          nullable: true
                          type: string
                        helmValues:
                          additionalProperties: true
                          nullable: true
                          type: object
                        path:
                          description: Path inside the repository that the Kustomization will apply.
                          type: string
                        targetNamespace:
                          description: Optional target namespace for the emitted Kustomization.
                          nullable: true
                          type: string
                      required:
                        - gitRepository
                        - path
                      type: object
                    guest:
                      description: |-
                        Guest intent — the Process is a Linux VM or WASM component supervised by `tatara-hospedeiro`. See `tatara/docs/declarative-guests.md`.

                        The actual `GuestSpec` is stored as a serde JSON value to keep `tatara-process` decoupled from `tatara-vm`. Hospedeiro re-parses the value as the concrete `tatara_vm::GuestSpec` at boot time; a round-trip test on the tatara-vm side guarantees the shape.
                      nullable: true
                      properties:
                        allowRemoteBuild:
                          description: Whether hospedeiro is allowed to pull guest artifacts from a remote transport (Attic, ssh-ng) if not already present locally. The default is taken from the GuestSpec's `buildOn` field; setting this explicitly overrides at the intent layer.
                          nullable: true
                          type: boolean
                        spec:
                          description: The (defguest …) spec as JSON. Shape matches `tatara_vm::GuestSpec`.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        stateDir:
                          description: Where to write per-guest state on the host (logs, socket, PID file). Defaults to `~/.local/state/tatara/guests/<name>/`.
                          nullable: true
                          type: string
                      required:
                        - spec
                      type: object
                    lisp:
                      description: Lisp-sourced intent — tatara-lisp reader + macroexpander produces resources.
                      nullable: true
                      properties:
                        bindings:
                          additionalProperties: true
                          default: {}
                          description: Symbols injected into the reader env (e.g., `cluster`, `region`).
                          type: object
                        reader:
                          default: tatara-lisp
                          description: Reader dialect / version tag.
                          type: string
                        source:
                          description: Raw S-expression source, OR `include:<path>` / `configmap:<name>/<key>` pointer.
                          type: string
                        version:
                          default: v1
                          description: Macro form version.
                          type: string
                      required:
                        - source
                      type: object
                    nix:
                      description: Nix-sourced intent — tatara-engine's nix_eval driver produces resources.
                      nullable: true
                      properties:
                        atticCache:
                          description: Attic cache to push the resulting store path into.
                          nullable: true
                          type: string
                        attribute:
                          description: Attribute path within the flake (e.g., `observability`).
                          type: string
                        delegateToNixBuild:
                          default: false
                          description: Delegate the actual build to a sibling NixBuild CRD (bridges to tatara-operator NATS bare-metal builder path).
                          type: boolean
                        extraArgs:
                          default: []
                          description: Additional `nix build` arguments (e.g., `["--impure"]`).
                          items:
                            type: string
                          type: array
                        flakeRef:
                          description: Flake reference, e.g., `github:pleme-io/k8s?dir=shared/infrastructure`.
                          type: string
                        system:
                          description: Target system. Defaults to the controller host's system.
                          nullable: true
                          type: string
                      required:
                        - attribute
                        - flakeRef
                      type: object
                  type: object
                lifetime:
                  description: Lifetime — `Permanent` (default, re-converging) or `Ephemeral` (auto-SIGTERM per `teardown_policy` + TTL clock).
                  properties:
                    ephemeral:
                      description: |-
                        Ephemeral lifetime — Process auto-terminates per `teardown_policy`.

                        Phase semantics: - On `Attested` with `teardown_policy ∈ {OnAttested, Always}`: reconciler delivers SIGTERM, Process drives Exiting → Zombie → Reaped. - On `Failed`  with `teardown_policy ∈ {OnFailed,   Always}`: same. Otherwise Process stays at Failed for forensic inspection. - `ttl` is a `humantime` duration (`"1h"`, `"30m"`) checked at every reconcile loop tick. TTL expiry while in any non-terminal phase forces SIGTERM regardless of `teardown_policy`.
                      nullable: true
                      properties:
                        exports:
                          description: |-
                            Declared exports — what artifacts survive teardown and where they flow. Empty (default) = nothing survives, matching the "ephemeral leaves no trace" posture. Each `ExportSpec` is independently triggered during the reconciler's `Releasing` phase against the terminal `ProcessPhase` reached.

                            See [`crate::export`] for the full type. All exports flow through the pleme-io Vector + NATS layer — there is no per-spec ad-hoc sink.
                          items:
                            description: |-
                              One declared export from an ephemeral Process.

                              Multiple `ExportSpec`s can be attached to a single ephemeral lifetime — each fires independently during the `Releasing` phase when its [`ExportTrigger`] matches the terminal phase reached.
                            properties:
                              channel:
                                description: Where to ship it. Always Vector-native — pleme-io routes every emission through one of the four canonical channels.
                                properties:
                                  httpEvent:
                                    description: HTTP POST to Vector's `http_server` source.
                                    nullable: true
                                    properties:
                                      endpoint:
                                        description: Vector ingest endpoint. Defaults to the in-cluster Service `http://vector.observability.svc.cluster.local:8080` when unset.
                                        nullable: true
                                        type: string
                                      signalType:
                                        description: '`signal_type` tag added to every emitted event. Vector transforms + shinryu''s analytical schema route by this tag (`receipt`, `test-report`, `ephemeral-marker`, …).'
                                        type: string
                                    required:
                                      - signalType
                                    type: object
                                  natsSubject:
                                    description: Publish to a NATS JetStream subject. Use for tier-1 guaranteed-delivery events (receipts that MUST survive).
                                    nullable: true
                                    properties:
                                      stream:
                                        description: JetStream stream the subject belongs to. The stream itself is declared by the consumer chart (e.g. tatara-pool-reconciler) via the pleme-nats broker-only design.
                                        type: string
                                      subject:
                                        description: Subject to publish to. May contain `{{run_id}}` template substitution — the worker substitutes the resolved run id at publish time.
                                        type: string
                                      url:
                                        description: Optional NATS URL. Defaults to `nats://nats.observability.svc.cluster.local:4222`.
                                        nullable: true
                                        type: string
                                    required:
                                      - stream
                                      - subject
                                    type: object
                                  stdout:
                                    description: Print to the export worker's stdout. Vector's `kubernetes_logs` source picks it up. Lowest-effort channel; fine for debug / one-off exports.
                                    nullable: true
                                    properties:
                                      pretty:
                                        default: false
                                        description: Pretty-print JSON (multi-line) instead of compact NDJSON. Defaults to false — compact NDJSON matches Vector's parser.
                                        type: boolean
                                    type: object
                                type: object
                              experimentIdOverride:
                                description: Override the run-id label that templates into channel subjects / signal-type metadata. Defaults to the Process's PID-derived run id when unset.
                                nullable: true
                                type: string
                              source:
                                description: What artifact to ship.
                                properties:
                                  processSnapshot:
                                    description: The Process's own `ProcessSpec` + `ProcessStatus` snapshot at teardown time, as canonical JSON. Useful for post-mortems on failed ephemeral runs.
                                    nullable: true
                                    properties:
                                      includeAttestationChain:
                                        default: false
                                        description: When true, also bundle Process attestation history.
                                        type: boolean
                                    type: object
                                  receipts:
                                    description: Every `ReceiptEnvelope` emitted by this Process during its lifetime — the BLAKE3-chained typed attestation stream.
                                    nullable: true
                                    type: object
                                  runMarker:
                                    description: A small synthetic event — start/end of run markers, cohort tags, experiment correlation. Worker emits a single timestamped event with the declared `labels`.
                                    nullable: true
                                    properties:
                                      labels:
                                        additionalProperties:
                                          type: string
                                        default: {}
                                        description: Labels emitted on the marker event. Free-form key/value; downstream consumers (shinryu cohort math, vector transforms) read by key name.
                                        type: object
                                    type: object
                                  testReport:
                                    description: A test report stored in a ConfigMap by an in-cluster test runner (Job, gator, closed-loop probe). Worker reads the ConfigMap, packages it per `format`, and forwards.
                                    nullable: true
                                    properties:
                                      configmap:
                                        description: ConfigMap name (in the Process's namespace) the runner wrote to.
                                        type: string
                                      format:
                                        default: Raw
                                        description: Report shape hint — downstream parsers in shinryu key off this.
                                        enum:
                                          - Junit
                                          - TapV13
                                          - NdJson
                                          - Raw
                                        type: string
                                      key:
                                        description: Key inside the ConfigMap holding the report bytes.
                                        type: string
                                      namespace:
                                        description: Optional ConfigMap namespace override.
                                        nullable: true
                                        type: string
                                    required:
                                      - configmap
                                      - key
                                    type: object
                                type: object
                              when:
                                default: OnAttested
                                description: When to ship. Defaults to `OnAttested`.
                                enum:
                                  - OnAttested
                                  - OnFailed
                                  - Always
                                type: string
                            required:
                              - channel
                              - source
                            type: object
                          type: array
                        maxConcurrent:
                          default: 1
                          description: Cluster-wide concurrency budget across ephemeral Processes that share the same `spec.identity.name_override` / chart_ref. `0` = no cap. Enforced by the reconciler before transitioning out of `Pending`.
                          format: uint32
                          minimum: 0.0
                          type: integer
                        teardownPolicy:
                          default: Always
                          description: When the Process auto-terminates.
                          enum:
                            - Always
                            - OnAttested
                            - OnFailed
                            - Never
                          type: string
                        ttl:
                          default: 1h
                          description: '`humantime`-parseable duration from `phaseSince(Forking)` after which the Process is force-SIGTERM''d.'
                          type: string
                      type: object
                    permanent:
                      description: Permanent lifetime — the existing Process behavior. SIGHUP re-converges; SIGTERM terminates only on explicit operator action.
                      nullable: true
                      type: object
                  type: object
                routing:
                  description: External edges — DNS + Ingress. When `None`, the Process is internal-only (matches today's default). See [`crate::routing`] for the full shape.
                  nullable: true
                  properties:
                    backend:
                      description: Single backend Service every hostname routes to. Per-hostname backends are a future extension; v1 keeps the simple shape.
                      properties:
                        ingressAnnotations:
                          additionalProperties:
                            type: string
                          description: 'Annotations stamped on every emitted Ingress. Common keys: `nginx.ingress.kubernetes.io/rate-limit`, `nginx.ingress. kubernetes.io/proxy-body-size`. The reconciler MERGES these with its own annotations; conflict ⇒ this map wins.'
                          type: object
                        port:
                          description: Port number on the Service to route to.
                          format: uint16
                          minimum: 0.0
                          type: integer
                        service:
                          description: In-cluster Service name (same namespace as the Process).
                          type: string
                        tlsIssuer:
                          description: '`ClusterIssuer` name for TLS. None ⇒ reconciler-config default (typically `letsencrypt-prod` or the cluster''s SPIRE-issuing issuer).'
                          nullable: true
                          type: string
                      required:
                        - port
                        - service
                      type: object
                    hostnames:
                      default: []
                      description: Hostnames this Process answers on. Empty list is legal but nonsensical (no Ingress, no DNS) — operators should drop the `routing` slot entirely instead. The reconciler warns on empty hostnames.
                      items:
                        description: |-
                          One entry in `RoutingSpec.hostnames`.

                          Emitted FQDN: `${app}.${ephemeral_id}.${cluster}.${location}.${domain}` where: * `app` and (optional) `instance` come from this struct; * `cluster` falls back to reconciler-config when unset; * `location` and `domain` are reconciler-config (from `nix/lib/fleet-domains.nix`).
                        properties:
                          app:
                            description: 'Application slot — `api`, `gator`, `gateway`, `web`, etc. Must be a valid DNS label (RFC 1123): lowercase alpha-num + hyphen, 1–63 chars, no leading/trailing hyphen. The reconciler validates this at the boundary.'
                            type: string
                          cluster:
                            description: Cluster override. Empty/None ⇒ reconciler-config default (e.g., `pleme-dev`). Used for cross-cluster routing rules, rare in practice.
                            nullable: true
                            type: string
                          instance:
                            description: |-
                              Named instance segment. When `Some("borealis-prod")` the FQDN reads `${app}.borealis-prod.${cluster}.…`. When `None` the reconciler substitutes `blake3(canonical_spec)[:8]` — deterministic per-spec, changes when the spec changes.

                              Must be a valid DNS label when set.
                            nullable: true
                            type: string
                        required:
                          - app
                        type: object
                      type: array
                    priority:
                      default: 0
                      description: Claim arbitration priority. Higher wins. Ties broken by oldest `creationTimestamp`. Negative values legal (signals "prefer not to hold the claim"). Default 0.
                      format: int32
                      type: integer
                    stableNameClaim:
                      default: false
