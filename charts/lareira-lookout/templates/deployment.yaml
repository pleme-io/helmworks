{{/*
deployment.yaml — the Lookout's OWN breathable Grafana face.

Authored directly (not a wrapped subchart Grafana) so the datasource set is a
first-class value computed from the declared feeders. Anonymous + signup OFF;
the human logs in with the admin secret, agents query via the SA token over the
INTERFACE plane. When scaleToZero is on, KEDA's HTTP add-on owns the replica
count (0→1 on the first query); otherwise the Deployment holds `replicas`.
*/}}
{{- $fullname := include "pleme-lib.fullname" . }}
{{- $g := .Values.grafana }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  {{- if .Values.scaleToZero.enabled }}
  replicas: {{ .Values.scaleToZero.minReplicas }}
  {{- else }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pleme-lib.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "pleme-lib.labels" . | nindent 8 }}
        app.kubernetes.io/component: lookout-face
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $g.port }}
          env:
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "https://%s" .Values.lookout.host | quote }}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $g.adminSecret }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $g.adminSecret }}
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ $g.ini.anonymousEnabled | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: {{ $g.ini.allowSignUp | quote }}
          volumeMounts:
            - name: grafana-ini
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $g.resources | nindent 12 }}
      volumes:
        - name: grafana-ini
          configMap:
            name: {{ $fullname }}-grafana-ini
        - name: datasources
          configMap:
            name: {{ $fullname }}-datasources
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
