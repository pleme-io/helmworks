{{- /*
RBAC for the shinka controller, at one of two scopes.

WHY A SCOPE EXISTS AT ALL
This chart used to emit ClusterRole + ClusterRoleBinding unconditionally, which
makes it unusable on BORROWED GROUND -- a cluster we are a guest in and where a
cluster-wide watch of every namespace is exactly the thing we promise not to do.
Camelot hit this and worked around it by hand-rolling a namespaced copy of the
whole operator inside another chart's own operator template. That is the second
declaration of one controller; this value exists so there is never a third.

`scope: namespaced` is the guest-safe shape: a Role + RoleBinding in the release
namespace only. Every rule below names a NAMESPACED resource
(databasemigrations, deployments, cnpg clusters, jobs), so the identical rule
set is valid at either scope and nothing is silently dropped by narrowing.

Pair it with WATCH_NAMESPACE in `env`, which is what makes the controller use
`Api::namespaced` rather than a cluster-wide informer. Setting the scope without
the env var yields a controller that is permitted to see only its own namespace
but still tries to watch them all -- it fails loudly on RBAC rather than
silently, but it fails.

The CRD is deliberately NOT emitted here. CRDs are cluster-scoped by nature and
belong in the chart's `crds/` directory so Helm installs them before any
template and refreshes API discovery in the same release; rendering a CRD as a
template races any same-release CR against Helm's once-per-operation rest-mapper
and yields `no matches for kind "DatabaseMigration"`.
*/ -}}
{{- if .Values.rbac.create }}
{{- $scope := .Values.rbac.scope | default "cluster" }}
{{- $namespaced := eq $scope "namespaced" }}
{{- $guest := eq $scope "guest-cluster" }}
{{- if $guest }}
{{- /*
`guest-cluster` — the third scope, for BORROWED ground that must still
reconcile CRs in namespaces we own but do not know the names of ahead of time
(ephemeral environments, minted per spawn).

`namespaced` cannot express that: it binds the controller to ONE namespace, and
an ephemeral namespace does not exist when the release is installed. `cluster`
over-reaches: it grants read of Secrets and ConfigMaps in every namespace the
HOST owns, which is exactly what the gentlemanly-guest rule forbids.

So the rules are SPLIT by what they can reach:

  cluster-wide : `shinka.pleme.io` only — DatabaseMigration and its status. The
                 host owns zero objects of this kind, so this grant reads
                 nothing of theirs. It is what lets the controller WATCH.
  namespaced   : everything that could touch host data — Secrets, ConfigMaps,
                 Deployments, Jobs, CNPG clusters, Events — bound to the release
                 namespace alone.

A consumer that wants the controller to reconcile in ITS namespace mints a Role
+ RoleBinding there for the same ServiceAccount (viveiro does this per ephemeral
namespace). Access is therefore GRANTED per namespace by the owner of that
namespace, rather than assumed cluster-wide — the guest rule expressed
structurally instead of approximated by a single namespace string.

Pair with WATCH_NAMESPACE UNSET, so the controller watches all namespaces for
its own kind. A namespace it may watch but holds no Secret grant in fails
loudly and typed, which is the correct direction: a missing grant is visible,
never a silent skip.
*/ -}}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaced }}Role{{ else }}ClusterRole{{ end }}
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  {{- if $namespaced }}
  namespace: {{ include "pleme-lib.namespace" . }}
  {{- end }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
rules:
  {{- if $guest }}
  {{- /* Only our own kind reaches cluster scope. */ -}}
  {{- range .Values.rbac.rules }}
  {{- if has "shinka.pleme.io" .apiGroups }}
  - {{ toYaml . | nindent 4 | trim }}
  {{- end }}
  {{- end }}
  {{- else }}
  {{- toYaml .Values.rbac.rules | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $namespaced }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  {{- if $namespaced }}
  namespace: {{ include "pleme-lib.namespace" . }}
  {{- end }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if $namespaced }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "pleme-lib.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pleme-lib.serviceAccountName" . }}
    namespace: {{ include "pleme-lib.namespace" . }}
{{- if $guest }}
---
{{- /* The host-data half: everything NOT our own kind, release namespace only. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pleme-lib.fullname" . }}-local
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
rules:
  {{- range .Values.rbac.rules }}
  {{- if not (has "shinka.pleme.io" .apiGroups) }}
  - {{ toYaml . | nindent 4 | trim }}
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pleme-lib.fullname" . }}-local
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pleme-lib.fullname" . }}-local
subjects:
  - kind: ServiceAccount
    name: {{ include "pleme-lib.serviceAccountName" . }}
    namespace: {{ include "pleme-lib.namespace" . }}
{{- end }}
{{- end }}
