# shinka default values
# GitOps-native database migration operator

image:
  repository: ghcr.io/pleme-io/shinka
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC for cross-namespace migration management
rbac:
  create: true
  # `cluster`    — ClusterRole + ClusterRoleBinding. The controller may watch
  #                every namespace. Correct on a cluster we own.
  # `namespaced` — Role + RoleBinding in the release namespace only. Required on
  #                BORROWED ground (a host cluster we are a guest in), where a
  #                cluster-wide watch is precisely what we promise not to do.
  #
  # Every rule below names a namespaced resource, so the same rule set is valid
  # at either scope and narrowing drops nothing.
  #
  # `guest-cluster` — for BORROWED ground that must still reconcile CRs in
  #                namespaces we own but cannot name at install time (ephemeral
  #                environments, minted per spawn). `namespaced` cannot express
  #                that (it binds to ONE namespace, and the namespace does not
  #                exist yet); `cluster` over-reaches (it grants Secret and
  #                ConfigMap reads in every namespace the HOST owns).
  #
  #                The rules are SPLIT by what they can reach: `shinka.pleme.io`
  #                goes cluster-wide — the host owns zero DatabaseMigrations, so
  #                that grant reads nothing of theirs and is what lets the
  #                controller WATCH — while Secrets, ConfigMaps, Deployments,
  #                Jobs, CNPG clusters and Events stay bound to the release
  #                namespace. A consumer grants access in ITS namespace by
  #                minting a Role + RoleBinding for the same ServiceAccount
  #                (viveiro does this per ephemeral namespace), so reach is
  #                GRANTED by each namespace's owner rather than assumed.
  #
  #                Pair with WATCH_NAMESPACE UNSET. A namespace the controller
  #                may watch but holds no Secret grant in fails loudly and
  #                typed — a missing grant is visible, never a silent skip.
  #
  # `namespaced` MUST be paired with WATCH_NAMESPACE in `env` (see the default
  # env block): the scope decides what the controller is ALLOWED to see, the env
  # var decides what it TRIES to see. Setting one without the other gives a
  # controller that fails on RBAC instead of watching its own namespace.
  scope: cluster
  rules:
    - apiGroups: ["shinka.pleme.io"]
      resources: ["databasemigrations", "databasemigrations/status"]
      verbs: ["get", "list", "watch", "patch", "update"]
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["postgresql.cnpg.io"]
      resources: ["clusters", "clusters/status"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch", "create", "delete"]
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list"]
    # BOTH event API groups, and the pair is the fix rather than belt-and-braces.
    #
    # Kubernetes ships two Events APIs — core/v1 `events` and `events.k8s.io/v1`
    # `events` — and a grant for one does NOT cover the other. This rule listed
    # only `""`, while kube-rs's recorder writes to events.k8s.io, so every event
    # the controller tried to publish was rejected:
    #
    #   events.events.k8s.io is forbidden: User "system:serviceaccount:camelot:
    #   shinka" cannot create resource "events" in API group "events.k8s.io"
    #
    # MEASURED 2026-08-12 in camelot, and the consequence is worse than a missing
    # nicety: six DatabaseMigrations failed with distinct, well-written typed
    # errors, and NONE of them surfaced as a Kubernetes Event. `kubectl describe`
    # and `kubectl get events` showed nothing at all. The only signal was
    # `status.phase: Failed` plus the controller's own stdout — so diagnosing it
    # meant knowing to read the pod logs of a controller you may not know exists.
    #
    # The failure is logged at DEBUG and swallowed, which is the right call for a
    # non-essential side channel; it is also why this went unnoticed. A grant
    # this cheap should never be the reason a typed error is invisible.
    - apiGroups: ["", "events.k8s.io"]
      resources: ["events"]
      verbs: ["create", "patch"]

ports:
  - name: health
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP

env:
  - name: RUST_LOG
    value: "info,shinka=debug"
  - name: LOG_FORMAT
    value: "json"
  - name: HEALTH_ADDR
    value: "0.0.0.0:8080"
  - name: DEFAULT_MIGRATION_TIMEOUT
    value: "300"
  - name: DEFAULT_MAX_RETRIES
    value: "3"
  - name: SHINKA_CONFIG
    value: "/etc/shinka/config.yaml"

envFrom: []

volumeMounts:
  - name: config
    mountPath: /etc/shinka
    readOnly: true

volumes:
  - name: config
    configMap:
      name: shinka-config
      optional: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

health:
  path: /healthz
  readyPath: /readyz
  port: health
  livenessInitialDelay: 5
  livenessPeriod: 10
  livenessFailureThreshold: 3
  readinessInitialDelay: 5
  readinessPeriod: 5
  readinessFailureThreshold: 2

startupProbe:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Singleton operator — Recreate to prevent dual reconciliation
strategy:
  type: Recreate

terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

monitoring:
  enabled: true
  port: health
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true
  allowPrometheus: true
  allowDns: true
  additionalIngress: []
  additionalEgress: []

# Operator config (rendered as ConfigMap by overlay or separately)
configMaps: []

prometheusRules:
  enabled: false
  groups: []
  # Example alert groups — enable and customize per cluster:
  # groups:
  #   - name: shinka-alerts
  #     rules:
  #       - alert: ShinkaOperatorDown
  #         expr: up{job="shinka"} == 0
  #         for: 2m
  #         labels:
  #           severity: critical
  #       - alert: ShinkaMigrationFailed
  #         expr: increase(shinka_migrations_total{status="failed"}[5m]) > 0
  #         labels:
  #           severity: critical
  #       - alert: ShinkaMigrationSlow
  #         expr: histogram_quantile(0.99, rate(shinka_migration_duration_seconds_bucket[10m])) > 300
  #         for: 5m
  #         labels:
  #           severity: warning

command: []
args: []
additionalLabels: {}
sidecars: []
initContainers: []
priorityClassName: ""
lifecycle: {}

downwardApi:
  enabled: false
istio:
  enabled: false
podMonitor:
  enabled: false
autoscaling:
  enabled: false
pdb:
  enabled: false
topologySpreadConstraints: []
