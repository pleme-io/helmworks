              safety:
                default:
                  checksumMode: auto-reconcile
                  continueOnFailure: false
                  maxRetries: 3
                  requireHealthyCluster: true
                description: Safety settings
                properties:
                  checksumMode:
                    default: auto-reconcile
                    description: |-
                      How to handle checksum mismatches when migration files have been modified after being applied.

                      Options: - `strict`: Fail on any mismatch, no auto-reconciliation (recommended for production) - `auto-reconcile`: Automatically fix mismatches (default, safe for idempotent migrations) - `pre-flight`: Validate all checksums before running any migrations
                    enum:
                    - strict
                    - auto-reconcile
                    - pre-flight
                    type: string
                  continueOnFailure:
                    default: false
                    description: |-
                      Continue running subsequent migrators even if one fails

                      When using multiple migrators (`spec.migrators`), this controls what happens when a migrator fails: - `false` (default): Stop immediately on the first failure. The overall migration is marked as Failed and subsequent migrators are not run. - `true`: Continue running remaining migrators. The overall migration is marked as Failed if any migrator failed, but all migrators will execute.

                      Recommended to keep as `false` for production to ensure data consistency.
                    type: boolean
                  maxRetries:
                    default: 3
                    description: Maximum number of retry attempts for failed migrations
                    format: uint32
                    minimum: 0.0
                    type: integer
                  requireHealthyCluster:
                    default: true
                    description: Require CNPG cluster to be healthy before migration
                    type: boolean
                type: object
              timeouts:
                default:
                  migration: 5m
                description: Timeout settings
