                  Each migrator runs in order. By default, if any migrator fails, subsequent migrators are not executed. Set `safety.continueOnFailure` to `true` to continue despite failures.

                  Example: ```yaml migrators: - name: sqlx-migrations type: sqlx deploymentRef: name: backend - name: seaorm-migrations type: seaorm deploymentRef: name: backend ```
