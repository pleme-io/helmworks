apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasemigrations.shinka.pleme.io
spec:
  group: shinka.pleme.io
  names:
    categories: []
    kind: DatabaseMigration
    plural: databasemigrations
    shortNames:
    - dbm
    - migration
    singular: databasemigration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastMigration.imageTag
      name: Last Image
      type: string
    - jsonPath: .status.lastMigration.success
      name: Success
      type: boolean
    - jsonPath: .status.totalMigrators
      name: Migrators
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for DatabaseMigrationSpec via `CustomResource`
        properties:
          spec:
            description: DatabaseMigration is the Schema for the databasemigrations API
            properties:
              database:
                description: Database configuration
                properties:
                  clickhouseRef:
                    description: 'Reference to a ClickHouse **typed-model** source: a create-only converge of an `analitico` typed table model against a Keeper-backed ClickHouse (`ON CLUSTER`, `ReplicatedMergeTree`). Mutually exclusive with `cnpgClusterRef`/`directRef`; exactly one MUST be set.'
                    nullable: true
                    properties:
                      cluster:
                        description: The distributed-DDL cluster for `ON CLUSTER` (e.g. `tendril`).
                        type: string
                      credentialsSecretRef:
                        description: Secret holding the ClickHouse password.
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                        required:
                        - name
                        type: object
                      database:
                        description: The target database the model is created in (e.g. `tendril`).
                        type: string
                      host:
                        description: ClickHouse HTTP service hostname (e.g. `clickhouse.monitoring.svc`).
                        type: string
                      model:
                        default: events
                        description: Which typed `analitico` model to converge (defaults to `events`).
                        enum:
                        - events
                        type: string
                      passwordKey:
                        default: clickhouse-password
                        description: Key within `credentialsSecretRef` holding the password (defaults to `clickhouse-password`).
                        type: string
                      port:
                        description: HTTP port (defaults to 8123).
                        format: uint16
                        minimum: 0.0
                        nullable: true
                        type: integer
                      table:
                        description: Override the model's canonical table name (defaults to the model's own name, e.g. `events`). A distinct name (e.g. `events_m0`) lets a converge prove itself without clobbering a live table of the canonical name.
                        nullable: true
                        type: string
                      username:
                        description: ClickHouse username (defaults to `default`).
                        nullable: true
                        type: string
                    required:
                    - cluster
                    - credentialsSecretRef
                    - database
                    - host
                    type: object
                  cnpgClusterRef:
                    description: Reference to a CloudNativePG (Postgres) cluster. Mutually exclusive with `directRef`; exactly one MUST be set.
                    nullable: true
                    properties:
                      database:
                        description: Database name within the cluster
                        nullable: true
                        type: string
                      name:
                        description: Name of the CNPG Cluster
                        type: string
                    required:
                    - name
                    type: object
                  directRef:
                    description: Reference to a direct (non-CNPG) database connection. Mutually exclusive with `cnpgClusterRef`/`clickhouseRef`; exactly one MUST be set.
                    nullable: true
                    properties:
                      adoptChangelog:
                        description: |-
                          Adopt [`Self::changelog_config_map_ref`] wholesale instead of executing it — only legal ALONGSIDE [`Self::sql_config_map_ref`], which supplies the schema the adoption is claiming.

                          **Why this exists, when the CLI's adoption is deliberately human-only.** A human gate is the right answer when the stop point is a JUDGEMENT: a bound past what the database holds marks never-run changesets applied and nothing downstream can detect it. Here the bound is not a judgement. The SQL ConfigMap is a SNAPSHOT of the schema that this exact changelog produces, and the two are versioned in the same commit — so "every changeset in this changelog is present" is a verifiable property of the pairing, not something an operator is asked to believe.

                          **Why it is a field on the SAME ref rather than a second CR.** Applying the snapshot and recording the adoption must happen in that order, and shinka gives no cross-CR ordering. Two CRs would let the adoption land first, leaving a ledger that claims the whole changelog while the schema is empty — the precise durable lie adoption exists to prevent. One CR makes the order internal and the wrong order unrepresentable.

                          This is what makes a snapshot the base and the changelog the FUTURE, which is the only workable shape when upstream's changelogs cannot build a database from empty (17 akeyless foundation tables have no `createTable` anywhere in them).
                        type: boolean
                      changelogConfigMapRef:
                        description: |-
                          ConfigMap providing Liquibase changelog documents, applied through keifu ([`crate::keifu_apply::run_lineage`]).

                          The difference from [`Self::sql_config_map_ref`] is not the file format, it is **who decides what runs**. A SQL ConfigMap is applied wholesale every time its content hash changes; a changelog is applied against `DATABASECHANGELOG`, so only outstanding changesets run and a re-run is a genuine no-op.

                          Each ConfigMap key is one changelog document. Keys may hold several services' changelogs at once — `keifu_apply::LineageKey` carries the source filename precisely so their changesets cannot collide.
                        nullable: true
                        properties:
                          keys:
                            description: |-
                              Apply only these keys, in the order given. `None` applies every key in lexical order (the historical behaviour, and still the default).

                              Exists because one ConfigMap can carry several databases' snapshots — akeyless ships `authdb.sql`, `uamdb.sql`, … in a single map — while a snapshot+adopt migration is PER DATABASE, since the ledger is. Without a selector each of the six CRs would apply all six dumps, and those dumps open with a table-drop per table: the fifth CR would drop and rebuild what the first four had already adopted. Selecting the key is what makes one shared snapshot artifact safe to reference from many CRs.
                            items:
                              type: string
                            nullable: true
                            type: array
                          name:
                            description: Name of the configmap
                            type: string
                        required:
                        - name
                        type: object
                      credentialsSecretRef:
                        description: Secret holding the admin credentials the migration job authenticates with.
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                        required:
                        - name
                        type: object
                      database:
                        description: Database / schema name to apply DDL against. Optional for multi-database DDL scripts that select their own database (e.g. `USE authdb;`).
                        nullable: true
                        type: string
                      engine:
                        default: mysql
                        description: Engine wire protocol (defaults to mysql).
                        enum:
                        - mysql
                        - postgres
                        type: string
                      host:
                        description: |-
                          Service hostname of the database (e.g. `mysql` or `my-release-mysql.my-namespace.svc.cluster.local`).

                          Deliberately a generic example: this doc comment is rendered into the generated CRD's `description`, which ships in every chart that carries the CRD. A consumer's own service name in that field would put one deployment's private naming into an artifact distributed to all of them.
                        type: string
                      passwordKey:
                        default: password
                        description: Key within `credentialsSecretRef` holding the password.
                        type: string
                      port:
                        description: Port (defaults to the engine's standard port when omitted).
                        format: uint16
                        minimum: 0.0
                        nullable: true
                        type: integer
                      sqlConfigMapRef:
                        description: |-
                          ConfigMap providing the SQL DDL files applied by the migration job.

                          Optional since the changelog source landed: exactly one of this and [`Self::changelog_config_map_ref`] must be set, enforced by [`Self::source`]. It was non-`Option` while it was the only source, and a CR omitting it failed deserialization with `missing field sqlConfigMapRef` — which is the right error for a one-source world and the wrong one for two.
                        nullable: true
                        properties:
                          keys:
                            description: |-
                              Apply only these keys, in the order given. `None` applies every key in lexical order (the historical behaviour, and still the default).

                              Exists because one ConfigMap can carry several databases' snapshots — akeyless ships `authdb.sql`, `uamdb.sql`, … in a single map — while a snapshot+adopt migration is PER DATABASE, since the ledger is. Without a selector each of the six CRs would apply all six dumps, and those dumps open with a table-drop per table: the fifth CR would drop and rebuild what the first four had already adopted. Selecting the key is what makes one shared snapshot artifact safe to reference from many CRs.
                            items:
                              type: string
                            nullable: true
                            type: array
                          name:
                            description: Name of the configmap
                            type: string
                        required:
                        - name
                        type: object
                      username:
                        description: 'Admin username (defaults to the engine convention: `root` for mysql, `postgres` for postgres).'
                        nullable: true
                        type: string
                    required:
                    - credentialsSecretRef
                    - host
                    type: object
                type: object
              migrator:
                description: |-
                  Single migrator configuration (for backward compatibility)

                  Use `migrators` field instead for multiple ordered migrations. If both `migrator` and `migrators` are specified, `migrators` takes precedence.
                nullable: true
