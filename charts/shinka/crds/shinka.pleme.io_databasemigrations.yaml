                      type: object
                    nullable: true
                    type: array
                  serviceAccountName:
                    description: Service account to use for migration jobs
                    nullable: true
                    type: string
                  toolConfig:
                    description: Tool-specific configuration options
                    nullable: true
                    properties:
                      atlasBaseline:
                        description: 'For atlas: baseline version'
                        nullable: true
                        type: string
                      atlasRevisionSchema:
                        description: 'For atlas: revision schema name'
                        nullable: true
                        type: string
                      atlasSchema:
                        description: 'For atlas: schema name'
                        nullable: true
                        type: string
                      dbmateMigrationsTable:
                        description: 'For dbmate: migrations table name'
                        nullable: true
                        type: string
                      dbmateNoDumpSchema:
                        description: 'For dbmate: no dump schema'
                        nullable: true
                        type: boolean
                      dieselMigrationDir:
                        description: 'For diesel: migration directory'
                        nullable: true
