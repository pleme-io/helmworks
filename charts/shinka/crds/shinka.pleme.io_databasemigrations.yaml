                    type: object
                  env:
                    additionalProperties:
                      type: string
                    description: Additional environment variables for the migration job
                    nullable: true
                    type: object
                  envFrom:
                    description: Environment variables from ConfigMaps/Secrets
                    items:
                      description: Source for environment variables
                      properties:
                        configMapRef:
                          description: Reference to a ConfigMap
                          nullable: true
                          properties:
                            keys:
                              description: |-
                                Apply only these keys, in the order given. `None` applies every key in lexical order (the historical behaviour, and still the default).

                                Exists because one ConfigMap can carry several databases' snapshots — akeyless ships `authdb.sql`, `uamdb.sql`, … in a single map — while a snapshot+adopt migration is PER DATABASE, since the ledger is. Without a selector each of the six CRs would apply all six dumps, and those dumps open with a table-drop per table: the fifth CR would drop and rebuild what the first four had already adopted. Selecting the key is what makes one shared snapshot artifact safe to reference from many CRs.
                              items:
                                type: string
                              nullable: true
                              type: array
                            name:
                              description: Name of the configmap
                              type: string
                          required:
                          - name
                          type: object
                        secretRef:
                          description: Reference to a Secret
                          nullable: true
                          properties:
                            name:
                              description: Name of the secret
                              type: string
                          required:
