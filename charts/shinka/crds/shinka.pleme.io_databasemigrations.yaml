                    type: object
                  type:
                    default: sqlx
                    description: |-
                      Type of migration tool to use (defaults to sqlx)

                      Supported types: - Rust: sqlx (default), refinery, diesel, seaorm - Go: goose, golang-migrate, atlas, dbmate - Java: flyway, liquibase - custom: user-defined command
                    enum:
                    - sqlx
                    - refinery
                    - diesel
                    - seaorm
                    - goose
                    - golang-migrate
                    - atlas
