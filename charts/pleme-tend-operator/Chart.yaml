apiVersion: v2
name: pleme-tend-operator
description: Fleet update controller — owns FlakeUpdatePolicy / FlakeUpdateProposal / FlakeUpdateRollout CRDs and reconciles fleet-wide pinned-version DAGs derived from flake.lock
type: application
version: "0.6.0"
appVersion: "0.5.1"

dependencies:
  - name: pleme-lib
    # 0.12.x — quotaPct as source of truth in rate-limit-worker template.
    version: "~0.13.0"
    repository: "file://../pleme-lib"

keywords:
  - tend
  - fleet
  - flake
  - operator
  - convergence

home: https://github.com/pleme-io/tend
sources:
  - https://github.com/pleme-io/tend
maintainers:
  - name: pleme-io
    email: team@pleme.io
