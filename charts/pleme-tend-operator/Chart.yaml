apiVersion: v2
name: pleme-tend-operator
description: Fleet update controller — owns FlakeUpdatePolicy / FlakeUpdateProposal / FlakeUpdateRollout CRDs and reconciles fleet-wide pinned-version DAGs derived from flake.lock
type: application
version: 0.5.0
appVersion: "0.5.0"

dependencies:
  - name: pleme-lib
    # Bumped to 0.11.x for the rate-limit-pattern templates (jetstream
    # + rate-limit-worker.* — even though this chart doesn't consume
    # them yet, the version pin must match across the fleet so chart
    # publish doesn't fail dep resolution against the broker chart).
    version: "~0.11.1"
    repository: "file://../pleme-lib"

keywords:
  - tend
  - fleet
  - flake
  - operator
  - convergence

home: https://github.com/pleme-io/tend
sources:
  - https://github.com/pleme-io/tend
maintainers:
  - name: pleme-io
    email: team@pleme.io
