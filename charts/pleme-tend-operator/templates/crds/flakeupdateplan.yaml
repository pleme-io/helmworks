---
# FlakeUpdatePlan — typed audit trail emitted before any HTTP traffic.
#
# Every reconcile cycle generates one of these (named
# `<policy>-<minute-bucket>`) so operators can `kubectl describe fpl`
# and see exactly which inputs the operator was about to check, why,
# and how that fits within the current rate budget. The plan is
# generated by `operator::planner::plan` from policy + flake.lock +
# flake.nix + cache + budget — pure function, fully replayable.
#
# Lifecycle: owned by the FlakeUpdatePolicy that emitted it. Garbage
# collected when the policy is deleted. Spec is overwritten on the
# same minute bucket; new minute → new plan resource.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flakeupdateplans.fleet.pleme.io
spec:
  group: fleet.pleme.io
  scope: Namespaced
  names:
    kind: FlakeUpdatePlan
    listKind: FlakeUpdatePlanList
    plural: flakeupdateplans
    singular: flakeupdateplan
    shortNames: ["fpl"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [policyName, generatedAt, budgetEffectiveMaxPerHour, budgetSlotsRemaining, checks]
              properties:
                policyName: { type: string }
                generatedAt: { type: string, format: date-time }
                budgetEffectiveMaxPerHour: { type: integer, format: int32 }
                budgetSlotsRemaining: { type: integer, format: int32 }
                checks:
                  type: array
                  items:
                    type: object
                    required: [input, action, rationale]
                    properties:
                      input: { type: string }
                      action:
                        type: string
                        enum: [Refresh, UseCached, Defer, Skip]
                      rationale: { type: string }
            status:
              type: object
              properties:
                freeRequests: { type: integer, format: int32 }
                paidRequests: { type: integer, format: int32 }
                advances: { type: integer, format: int32 }
                errors: { type: integer, format: int32 }
                completedAt: { type: string, format: date-time }
      additionalPrinterColumns:
        - name: Refresh
          type: integer
          jsonPath: '.spec.budgetSlotsRemaining'
        - name: Cap
          type: integer
          jsonPath: '.spec.budgetEffectiveMaxPerHour'
        - name: Advances
          type: integer
          jsonPath: '.status.advances'
        - name: Free
          type: integer
          jsonPath: '.status.freeRequests'
        - name: Age
          type: date
          jsonPath: '.metadata.creationTimestamp'
