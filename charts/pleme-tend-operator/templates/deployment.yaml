apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pleme-tend-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-tend-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pleme-tend-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["operator"]
          env:
            - name: RUST_LOG
              value: {{ .Values.operator.logLevel | quote }}
            - name: TEND_WORKSPACE_CONFIG
              value: {{ .Values.operator.workspaceConfigPath | quote }}
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.secretKey }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace-config
              mountPath: {{ .Values.operator.workspaceConfigPath }}
              subPath: config.yaml
              readOnly: true
            - name: workspace
              mountPath: /var/lib/tend-workspace
      volumes:
        - name: workspace-config
          configMap:
            {{- if .Values.workspaceConfig.existingConfigMap }}
            name: {{ .Values.workspaceConfig.existingConfigMap }}
            {{- else }}
            name: {{ include "pleme-tend-operator.fullname" . }}-workspace
            {{- end }}
        - name: workspace
          {{- if eq .Values.workspace.volume.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ include "pleme-tend-operator.fullname" . }}-workspace
          {{- else if eq .Values.workspace.volume.type "hostPath" }}
          hostPath:
            path: {{ .Values.workspace.volume.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if eq .Values.workspace.volume.type "persistentVolumeClaim" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}-workspace
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ .Values.workspace.volume.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.workspace.volume.pvc.size }}
{{- end }}
