apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pleme-tend-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-tend-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pleme-tend-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # Init container — `tend sync` clones every repo declared in the
      # workspace config so the reconciler can read flake.lock files
      # immediately. Idempotent: re-runs on pod restart, picking up any
      # repos added/removed in the ConfigMap.
      initContainers:
        - name: workspace-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["sync", "--config", "{{ .Values.operator.workspaceConfigPath }}", "--quiet"]
          env:
            - name: RUST_LOG
              value: "info"
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.secretKey }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace-config
              mountPath: {{ .Values.operator.workspaceConfigPath }}
              subPath: config.yaml
              readOnly: true
            - name: workspace
              mountPath: /var/lib/tend-workspace
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["operator"]
          env:
            - name: RUST_LOG
              value: {{ .Values.operator.logLevel | quote }}
            - name: TEND_WORKSPACE_CONFIG
              value: {{ .Values.operator.workspaceConfigPath | quote }}
            # Nix needs a writable HOME for its eval cache; the pod runs
            # as UID 1000 with no /etc/passwd entry so getpwuid_r fails
            # and `nix` aborts with "cannot determine user's home
            # directory" if HOME isn't set explicitly. Same volume serves
            # XDG_CACHE_HOME so eval results survive between gate runs.
            - name: HOME
              value: "/home/tend"
            - name: XDG_CACHE_HOME
              value: "/home/tend/.cache"
            - name: NIX_CONFIG
              value: "experimental-features = nix-command flakes"
            # ── Phase A/D: under-the-radar HTTP knobs ─────────────
            # Operator reads these on startup; defaults in code match
            # the values block above so unsetting them = current behavior.
            - name: TEND_BUDGET_MAX_PER_HOUR
              value: {{ .Values.underTheRadar.budgetMaxPerHour | quote }}
            - name: TEND_REQUEUE_JITTER_PCT
              value: {{ .Values.underTheRadar.requeueJitterPct | quote }}
            # ── Phase B: persistent HEAD cache ────────────────────
            - name: TEND_HEAD_CACHE_PATH
              value: {{ .Values.cache.path | quote }}
            - name: TEND_USE_CACHED_TTL_SECONDS
              value: {{ .Values.cache.useCachedTtlSeconds | quote }}
            # ── Phase C: plan emission ────────────────────────────
            - name: TEND_PLANS_EMIT
              value: {{ .Values.plans.emit | quote }}
            - name: TEND_PLAN_BUCKET_SECONDS
              value: {{ .Values.plans.bucketSeconds | quote }}
            # ── Phase E: GraphQL batching ─────────────────────────
            - name: TEND_GRAPHQL_ENABLED
              value: {{ .Values.graphql.enabled | quote }}
            - name: TEND_GRAPHQL_BATCH_SIZE
              value: {{ .Values.graphql.batchSize | quote }}
            # ── NATS coordination (Phase 2 worker pool) ───────────
            - name: TEND_NATS_ENABLED
              value: {{ .Values.nats.enabled | quote }}
            {{- if .Values.nats.enabled }}
            - name: TEND_NATS_URL
              value: {{ .Values.nats.serverUrl | quote }}
            - name: TEND_NATS_SUBJECT_PREFIX
              value: {{ .Values.nats.subjectPrefix | quote }}
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.secretKey }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace-config
              mountPath: {{ .Values.operator.workspaceConfigPath }}
              subPath: config.yaml
              readOnly: true
            - name: workspace
              mountPath: /var/lib/tend-workspace
            - name: home
              mountPath: /home/tend
      volumes:
        - name: workspace-config
          configMap:
            {{- if .Values.workspaceConfig.existingConfigMap }}
            name: {{ .Values.workspaceConfig.existingConfigMap }}
            {{- else }}
            name: {{ include "pleme-tend-operator.fullname" . }}-workspace
            {{- end }}
        - name: workspace
          {{- if eq .Values.workspace.volume.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ include "pleme-tend-operator.fullname" . }}-workspace
          {{- else if eq .Values.workspace.volume.type "hostPath" }}
          hostPath:
            path: {{ .Values.workspace.volume.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Pod-local writable home for nix eval cache + git config; not
        # persisted across restarts on purpose — the cache is rebuildable.
        - name: home
          emptyDir:
            sizeLimit: 2Gi
{{- if eq .Values.workspace.volume.type "persistentVolumeClaim" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}-workspace
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ .Values.workspace.volume.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.workspace.volume.pvc.size }}
{{- end }}
