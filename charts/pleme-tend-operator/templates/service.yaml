apiVersion: v1
kind: Service
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pleme-tend-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pleme-tend-operator.fullname" . }}
  labels:
    {{- include "pleme-tend-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pleme-tend-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
