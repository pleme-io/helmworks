# linkding — minimal bookmark manager. SQLite by default.

enabled: false

image:
  repository: docker.io/sissbruecker/linkding
  tag: "1.36.0"
  pullPolicy: IfNotPresent

serviceAccount: { create: true }

ports:
  - { name: http, containerPort: 9090, protocol: TCP }

service:
  type: ClusterIP
  ports:
    - { name: http, port: 9090, targetPort: http, protocol: TCP }

envFrom:
  - secretRef: { name: linkding-env, optional: true }

env:
  - { name: LD_HOST_PORT, value: "9090" }
  - { name: LD_DISABLE_BACKGROUND_TASKS, value: "False" }

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 500m, memory: 256Mi }

persistence:
  enabled: false
  storageClass: local-path
  size: 1Gi
  mountPath: /etc/linkding/data
  zfsDataset: pool/data

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: links.rio.lan
      paths: [ { path: /, pathType: Prefix } ]
  tls: { enabled: false, issuer: selfsigned }

authentik: { enabled: false }
cloudflared: { expose: false, hostname: "" }

backup:
  enabled: false
  schedule: "0 3 * * *"
  paths: ["/etc/linkding/data"]
  repositoryEnvFrom: { secretName: "" }
  retention: { daily: 7, weekly: 4, monthly: 6, yearly: 1 }
  image: { repository: restic/restic, tag: "0.18.0", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

monitoring: { enabled: false }
prometheusRules: { enabled: false }
alerts: { common: { enabled: false }, ntfyTopic: rio-linkding }
networkPolicy: { enabled: true }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }
