apiVersion: v1
kind: Service
metadata:
  name: {{ include "pleme-nix-builder.fullname" . }}
  labels:
    {{- include "pleme-nix-builder.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeout }}
  {{- end }}
  selector:
    {{- include "pleme-nix-builder.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
