{{/*
dashboard.yaml — OPTIONAL Grafana dashboard ConfigMap.

pangea-dashboards owns first-class dashboards in pleme-io (typed AST). This is an
attach-local escape hatch only — a ConfigMap carrying the grafana_dashboard
discovery label so a Grafana sidecar picks up a panel set scoped to this target.
Disabled by default.
*/}}
{{- if (.Values.dashboard).enabled }}
{{- $d := .Values.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lareira-observe.fullname" . }}-dashboard
  namespace: {{ include "lareira-observe.targetNamespace" . }}
  labels:
    {{- include "lareira-observe.labels" . | nindent 4 }}
    {{ $d.label | default "grafana_dashboard" }}: "1"
data:
  {{ include "lareira-observe.targetName" . }}.json: |-
    {{- $d.json | default "{}" | nindent 4 }}
{{- end }}
