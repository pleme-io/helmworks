{{- if .Values.orgSeed.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.orgSeed.externalSecret.targetSecretName | default "openclaw-pki-org-seed" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lareira-openclaw-pki.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.orgSeed.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.orgSeed.externalSecret.secretStore.kind }}
    name: {{ .Values.orgSeed.externalSecret.secretStore.name }}
  target:
    name: {{ .Values.orgSeed.externalSecret.targetSecretName | default "openclaw-pki-org-seed" }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "lareira-openclaw-pki.labels" . | nindent 10 }}
          # Sensitive: CA root key material. Never log.
          pleme.io/secret-class: ca-root-key
  data:
    - secretKey: hex
      remoteRef:
        key: {{ .Values.orgSeed.externalSecret.remoteRef.key | quote }}
        property: {{ .Values.orgSeed.externalSecret.remoteRef.property | default "hex" | quote }}
{{- end }}
