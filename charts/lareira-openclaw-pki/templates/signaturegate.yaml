{{- if .Values.sekiban.enabled }}
apiVersion: sekiban.pleme.io/v1alpha1
kind: SignatureGate
metadata:
  name: {{ include "lareira-openclaw-pki.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lareira-openclaw-pki.labels" . | nindent 4 }}
spec:
  layers:
    {{- range .Values.sekiban.signatureGate.layers }}
    - {{ . | quote }}
    {{- end }}
  # Single source of truth: the expected signature is the same one
  # forge stamped onto the deployment via attestation.signature.
  # `sekiban.signatureGate.signatureOverride` is for emergency manual
  # pinning only — defaults to empty so attestation.signature wins.
  {{- $sub := index .Values "pleme-microservice" -}}
  {{- $sig := default "" (dig "attestation" "signature" "" $sub) }}
  expectedSignature: {{ default $sig .Values.sekiban.signatureGate.signatureOverride | quote }}
  targetResources:
    - group: apps
      kind: Deployment
      operations: [CREATE, UPDATE]
    - group: ""
      kind: Service
      operations: [CREATE, UPDATE]
  compliancePolicy: {{ include "lareira-openclaw-pki.fullname" . | quote }}
  verificationIntervalSecs: {{ .Values.sekiban.signatureGate.verificationIntervalSecs | int }}
{{- end }}
