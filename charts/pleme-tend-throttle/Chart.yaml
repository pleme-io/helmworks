apiVersion: v2
name: pleme-tend-throttle
description: Rate-limited GitHub API consumer for tend. Pulls jobs from NATS JetStream and dispatches at a fixed pace (default ≤8 req/min ≈ 9.6% of GitHub's 5000/hr authenticated limit), respecting X-RateLimit-Remaining for adaptive backoff. The single load-bearing primitive that lets the operator publish freely while keeping fleet-wide GitHub usage at ≤10% of the authenticated quota.
type: application
version: 0.2.3
appVersion: "0.2.0"

dependencies:
  - name: pleme-lib
    # Bumped to 0.11.x for rate-limit-worker.* + jetstream library
    # templates. This chart's templates are now one-line includes;
    # all logic lives in pleme-lib.
    version: "~0.11.2"
    repository: "file://../pleme-lib"

keywords:
  - tend
  - throttle
  - rate-limit
  - github
  - nats
  - jetstream

home: https://github.com/pleme-io/tend
sources:
  - https://github.com/pleme-io/tend
maintainers:
  - name: pleme-io
    email: team@pleme.io
