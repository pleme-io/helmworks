apiVersion: v2
name: lareira-keda-http
description: |
  KEDA HTTP add-on (kedacore/http-add-on) for HTTP-driven scale-to-zero.
  Required by lareira-authentik and any other helmworks chart whose
  breathability is HTTP-rate-driven.

  Wraps the upstream KEDA HTTP add-on chart with pleme-io defaults:
  small interceptor + scaler footprint, ServiceMonitor + PrometheusRule
  for the interceptor's request-rate metric, default-OFF.
type: application
version: 0.1.0
appVersion: "0.10.0"

keywords:
  - keda
  - http
  - autoscaling
  - breathable

home: https://github.com/pleme-io/helmworks
sources:
  - https://github.com/pleme-io/helmworks
  - https://github.com/kedacore/http-add-on

maintainers:
  - name: drzzln
    email: drzzln@protonmail.com

dependencies:
  - name: pleme-lib
    version: "~0.10.0"
    repository: "file://../pleme-lib"
  - name: keda-add-ons-http
    version: "0.10.0"
    repository: "https://kedacore.github.io/charts"
    condition: kedaHttp.enabled
