apiVersion: v2
name: lareira-camelot-pitr
description: >-
  Camelot PITR — the enjulho WRAPPER that lets camelot restore its own secrets to
  a point in time. A SEPARATE, PARALLEL consumer of the generic pleme-io PITR
  engine: it pins the SAME ghcr.io/pleme-io/{pitr-tools,function-pitr-drill}@sha256
  digests (TOOL-DISTRIBUTION — consume, never fork/edit) and fills the SAME typed
  RestoreInput surface with CAMELOT values. It NEVER touches the engine repos or the
  resident team's own in-review PITR chart in their environments repo — that team
  reviews THEIR consumer, camelot runs OURS, the two never touch (different repo · branch ·
  Flux scope · ns · creds · data-plane · config). Camelot's data plane is in-cluster
  gp3-PVC MySQL (not RDS), so the restore vector is a CSI VolumeSnapshot of the gp3
  PVC fed to the UNCHANGED engine as extraResources with empty sourceDbInstances
  (the engine skips RDS emission — emitRDS iterates an empty map → nil). breathe-
  managed (Mem/Cpu/Storage bands + 100% spot + scale-to-zero-by-drill-lifecycle),
  camelot-isolated (role: camelot taint + toleration). Peer of lareira-autorevivy.
  Tier-honest: the chart renders + lints + unit-tests green (the layer is WIRED);
  the LIVE drill is OPERATOR-GATED on Crossplane-on-the-camelot-floor + a
  VolumeSnapshotClass + camelot-scoped cofre creds — named, never claimed working.
  Recovery is snapshot-point (the snapshot cadence), NOT arbitrary-second PITR
  (binlog replay is a further increment); a canary round-trip is a recovery
  MITIGATION, not a no-row-lost theorem. See the camelot skill + pitr research.
type: application
version: 0.9.1
# 0.9.1 -- re-pin the drill-step image to the first one published in 34 days
#          (amd64-b98ed9e), which is also the first carrying afc3c25's
#          namespace-ownership guard. PATCH, not minor: no value is added,
#          removed or renamed, and nothing renders differently while
#          `enabled: false`. What changes is WHICH BINARY a drill would run --
#          specifically, one whose /cleanup refuses to delete `camelot`.
# 0.2.1 -- placeholder identifiers in the default values (no environment identity
#          ships in the chart); prose genericized.
# 0.2.0 (2026-08-05) -- ships the mysql 8.0 pin that 168dc27 stranded.
#
# 168dc27 corrected restore.mysqlImage from mysql:8.4 to mysql:8.0 and added the
# render-time guard that couples it to restore.sourceMysqlTag, but left this
# version at 0.1.0. auto-release is 404-idempotent, so the run logged
# `SKIP: lareira-camelot-pitr 0.1.0 already published (immutable)`
# (run 31003440945, 2026-08-05T12:01:38Z) and the published 0.1.0 tarball still
# carries mysql:8.4 -- the exact two-way drill failure that commit existed to
# remove. Minor rather than patch: restore.sourceMysqlTag is a NEW required
# value, and the guard turns a previously-rendering override of
# restore.mysqlImage into a hard `fail`.
#
# appVersion deliberately unchanged -- this chart pins engine images by digest,
# so appVersion tracks the engine, not the wrapper (same shape as
# lareira-camelot-observe 0.1.1/appVersion 1.0.0).
appVersion: "0.1.0"
keywords:
  - camelot
  - pitr
  - point-in-time-restore
  - drill
  - enjulho
  - breathability
  - tool-distribution
  - volume-snapshot
home: https://github.com/pleme-io/theory
sources:
  - https://github.com/pleme-io/helmworks
  - https://github.com/pleme-io/pitr-tools
maintainers:
  - name: drzzln
    email: drzzln@protonmail.com
dependencies:
