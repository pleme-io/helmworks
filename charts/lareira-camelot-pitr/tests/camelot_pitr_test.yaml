suite: lareira-camelot-pitr — the parallel PITR consumer (digest, isolation, restore vector, breathe)
templates:
  - templates/composition.yaml
  - templates/xrd.yaml
  - templates/function.yaml
  - templates/pitrsession.yaml
  - templates/rbac.yaml
  - templates/breatheband.yaml
  - templates/external-secrets.yaml
  - templates/seed.yaml

# Suite-level values so every case can RENDER. store.sourceUrl / store.accessId
# are `required` in the template (a drill pointed at the wrong source store
# verifies a secret it never wrote -- worse than a render error), so without
# these every unrelated case fails on a missing value rather than on its own
# subject. The one case that DELIBERATELY omits sourceUrl overrides it back to
# empty locally.
set:
  # The chart is off by default (see values.yaml's header): a component that
  # restores against a production store is opted into, and the fleet release
  # pipeline lints by templating with defaults. Every case here is testing the
  # chart as DEPLOYED, so the suite turns it on.
  enabled: true
  store.sourceUrl: "https://src.example"
  store.accessId: "p-abc"
tests:
  # ── TOOL-DISTRIBUTION: consume the engine BY DIGEST ────────────────────────
  - it: installs the engine Function pinned by @sha256 (never a moving tag)
    template: templates/function.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: Function
      - matchRegex:
          path: spec.package
          pattern: "^ghcr\\.io/pleme-io/function-pitr-drill@sha256:[a-f0-9]{64}$"

  - it: fails the render when pitrTools is not @sha256-pinned (HERMETIC SUPPLY CHAIN)
    template: templates/function.yaml
    set:
      images.pitrTools: "ghcr.io/pleme-io/pitr-tools:amd64-latest"
    asserts:
      - failedTemplate:
          errorMessage: 'images.pitrTools="ghcr.io/pleme-io/pitr-tools:amd64-latest" must be @sha256-pinned (HERMETIC SUPPLY CHAIN): a release must never resolve a moving tag. Pin the immutable digest read from ghcr.io/pleme-io/pitr-tools.'

  # ── THE ENGINE SEAM: Composition wires the camelot RestoreInput ────────────
  - it: wires the generic engine to the camelot RestoreInput with the pitr-tools digest
    template: templates/composition.yaml
    asserts:
      - equal:
          path: kind
          value: Composition
      - equal:
          path: spec.pipeline[0].functionRef.name
          value: function-camelot-pitr-drill
      - matchRegex:
          path: spec.pipeline[0].input.drillImage
          pattern: "^ghcr\\.io/pleme-io/pitr-tools@sha256:[a-f0-9]{64}$"

  # ── THE HONEST DIVERGENCE: no RDS — sourceDbInstances is EMPTY ─────────────
  - it: supplies EMPTY sourceDbInstances (camelot has no RDS — engine skips emitRDS)
    template: templates/composition.yaml
    asserts:
      - isEmpty:
          path: spec.pipeline[0].input.sourceDbInstances

  # ── THE RESTORE VECTOR: CSI VolumeSnapshot → restore PVC → restore StatefulSet ──
  - it: emits the camelot restore vector as engine extraResources (snapshot, pvc, sts)
    template: templates/composition.yaml
    asserts:
      - equal:
          path: spec.pipeline[0].input.extraResources[0].kind
          value: VolumeSnapshot
      - equal:
          path: spec.pipeline[0].input.extraResources[1].kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.pipeline[0].input.extraResources[2].kind
          value: StatefulSet
      - equal:
          path: spec.pipeline[0].input.extraResources[0].spec.source.persistentVolumeClaimName
          value: saas-mysql-data

  - it: pins the restore StatefulSet to the role=camelot tainted nodes (isolation)
    template: templates/composition.yaml
    asserts:
      - equal:
          path: spec.pipeline[0].input.extraResources[2].spec.template.spec.nodeSelector.role
          value: camelot

  # The restore server mounts a datadir snapshotted from the SOURCE server, so
  # their versions are one decision, not two. The source MySQL subchart pins mysql:8.0.
  # This read mysql:8.4 until 2026-08-05 and would have failed the first drill:
  # 8.4 ships mysql_native_password DISABLED by default, and camelot-bootstrap
  # deliberately sets root@'%' to exactly that plugin (provision_emit.go:32 --
  # caching_sha2 breaks the app's MySQL driver), so the restored root account is
  # unauthenticatable and the temporary restore saas cannot connect at all.
  # MYSQL_ALLOW_EMPTY_PASSWORD does not save it: that only governs FRESH datadir
  # initialization, which a restore never is.
  - it: runs the restore server on the SAME major.minor as the snapshot source
    template: templates/composition.yaml
    asserts:
      - equal:
          path: spec.pipeline[0].input.extraResources[2].spec.template.spec.containers[0].image
          value: mysql:8.0

  - it: FAILS the render when the restore image drifts from the declared source version
    template: templates/composition.yaml
    set:
      restore.mysqlImage: "mysql:8.4"
    asserts:
      - failedTemplate:
          errorMessage: 'restore.mysqlImage="mysql:8.4" must be tag "8.0" to match restore.sourceMysqlTag: the restore server mounts a datadir snapshotted from the source server, so a major.minor mismatch is a broken drill, not a preference. MySQL 8.4 additionally ships mysql_native_password DISABLED by default, and camelot-bootstrap sets root@% to exactly that plugin (caching_sha2 breaks the app''s MySQL driver), so a restored root account cannot authenticate at all. Change both together, or change neither.'

  # ── THE DECLARE TRIGGER: camelot-scoped CR (collision-free) ────────────────
  - it: renders the CamelotPITRSession trigger under the camelot-scoped group
    template: templates/pitrsession.yaml
    asserts:
      - equal:
          path: apiVersion
          value: pitr.camelot.pleme.io/v1
      - equal:
          path: kind
          value: CamelotPITRSession
      - matchRegex:
          path: spec.restoreTime
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T"

  - it: the XRD uses the camelot group — NEVER the team's pitr.akeyless.io
    template: templates/xrd.yaml
    asserts:
      - equal:
          path: spec.group
          value: pitr.camelot.pleme.io
      - notEqual:
          path: spec.group
          value: pitr.akeyless.io

  # ── BREATHE: every restore band carries an EXPLICIT dryRun (shadow-first) ───
  - it: renders Mem + Cpu breathe bands for the transient restore DB with dryRun true
    template: templates/breatheband.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: MemoryBand
      - equal:
          path: spec.dryRun
          value: true
      - equal:
          path: spec.targetRef.name
          value: camelot-mysql-restore

  - it: renders a StorageBand for the restore PVC (grow-on-demand, shadow)
    template: templates/breatheband.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: kind
          value: StorageBand
      - equal:
          path: spec.dryRun
          value: true

  # ── LEAST-PRIVILEGE RBAC: ns-scoped Role, never ClusterRole ────────────────
  - it: grants a namespace-scoped Role (never cluster-scoped — gentlemanly guest)
    template: templates/rbac.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: Role
      - notEqual:
          path: kind
          value: ClusterRole

  # ── COFRE: camelot-scoped SecretRef, NEVER the akeyless one ────────────────
  - it: materializes a camelot-scoped SecretRef (never pitr-akeyless-admin-creds)
    template: templates/external-secrets.yaml
    asserts:
      - equal:
          path: metadata.name
          value: camelot-pitr-admin-creds
      - notEqual:
          path: metadata.name
          value: pitr-akeyless-admin-creds

  # ── FLAG CONTRACT: every emitted arg must be a flag its binary defines ─────
  #
  # THE DEFECT THIS EXISTS FOR (2026-08-18): every drill step passed at least
  # one flag its binary does not define. Go's `flag` exits 2 on an unknown flag
  # BEFORE any work, so no drill step had ever executed -- while this chart
  # rendered green and this suite passed. Nothing compared the emitted args
  # against the binaries receiving them, so a step could be arbitrarily wrong
  # and still look correct at every layer a reviewer inspects.
  #
  # ★ TIER, stated rather than implied: this pins a MEASURED SNAPSHOT of the
  # per-binary flag sets, read from pitr-tools/cmd/* on 2026-08-18. helm-unittest
  # cannot read another repo's Go source, so it CANNOT catch a flag removed on
  # the binary side -- only drift introduced HERE, which is where this drift
  # actually happened. A true cross-repo contract check needs CI with both trees
  # checked out; until then this is the honest half.
  # `pending-flag-contract: cross-repo check needs both trees in one CI job`
  #
  # The flags below are the ones each binary genuinely defines. All four of the
  # removed ones were REAL flags living in OTHER binaries, which is exactly how
  # this drifted:
  #   /canary-create      borealis-access-id, correlation-id, source-borealis-url
  #   /verify             + max-wait, mode, poll-interval, restored-borealis-url,
  #                         restored-uam-url, secret-paths
  #   /wait-for-deps      correlation-id, max-restarts, max-wait, poll-interval
  #   /cleanup            correlation-id, restore-namespace (+ others)
  #   /diagnostic-collect correlation-id, diagnostics-bucket, pitrsession-name,
  #                       tenant, xr-group, xr-resource, xr-version
  - it: emits only flags the drill binaries actually define
    template: templates/composition.yaml
    set:
      store.sourceUrl: "https://src.example"
      store.accessId: "p-abc"
    asserts:
      # canary-create: writes the canary into the SOURCE store, so it needs the
      # source URL + an identity. --secret-paths belongs to /verify, not here.
      - matchRegex:
          path: spec.pipeline[0].input.drillSteps[0].args[0]
          pattern: "^--source-borealis-url=https://src\\.example$"
      - matchRegex:
          path: spec.pipeline[0].input.drillSteps[0].args[1]
          pattern: "^--borealis-access-id=p-abc$"
      - notMatchRegex:
          path: spec.pipeline[0].input.drillSteps[0].args[0]
          pattern: "secret-paths"

      # verify: both restored endpoints must be present. When --restored-uam-url
      # is empty the binary falls back to the borealis URL, which describes items
      # against the AUTH service and fails in a way that names neither.
      - matchRegex:
          path: spec.pipeline[0].input.drillSteps[1].args[0]
          pattern: "^--restored-borealis-url=http://auth\\.\\{\\{restoreNamespace\\}\\}\\."
      - matchRegex:
          path: spec.pipeline[0].input.drillSteps[1].args[1]
          pattern: "^--restored-uam-url=http://uam\\.\\{\\{restoreNamespace\\}\\}\\."
      # --mode is asserted EXPLICITLY. `presence` never reads the secret back and
      # exits 0 even on failure, so a drill running it proves nothing; flipping
      # this value is the single edit that would make every drill pass falsely.
      - matchRegex:
          path: spec.pipeline[0].input.drillSteps[1].args[4]
          pattern: "^--mode=api$"

  - it: refuses to render without a source store, rather than drilling against nothing
    template: templates/composition.yaml
    set:
      store.sourceUrl: ""
      store.accessId: "p-abc"
    asserts:
      - failedTemplate:
          errorMessage: 'store.sourceUrl is required: /canary-create writes the canary into the SOURCE store, and with no URL it has nowhere to write. There is no runtime placeholder for it: the source store is static config, unlike the restored endpoints below which derive from the per-drill restore namespace.'

  # ── RESTORE NAMESPACE: supplied, not derived ──────────────────────────────
  #
  # `.Values.composition` is splatted verbatim into the engine input, so this
  # needs no template change -- which is exactly why it deserves a test: a key
  # the engine does not accept is silently DROPPED on unmarshal rather than
  # rejected, and that is how `akeylessServices` sat in this file emitting
  # nothing. This asserts the key reaches input; the engine build carrying
  # Input.restoreNamespace (pitr-tools 6b7aeec+) is what makes it take effect.
  - it: passes a supplied restoreNamespace through to the engine input
    template: templates/composition.yaml
    set:
      composition.restoreNamespace: "viveiro-env-ff6d4d7f"
    asserts:
      - equal:
          path: spec.pipeline[0].input.restoreNamespace
          value: "viveiro-env-ff6d4d7f"

  - it: omits restoreNamespace by default, leaving the engine to derive it
    template: templates/composition.yaml
    asserts:
      - equal:
          path: spec.pipeline[0].input.restoreNamespace
          value: ""

  # ── THE RESTORE MySQL MUST BE REACHABLE ───────────────────────────────────
  #
  # Until 2026-08-18 the vector emitted a StatefulSet declaring
  # `serviceName: camelot-mysql-restore` and NO Service by that name. A
  # StatefulSet does not create its governing Service — it only names one, and
  # Kubernetes does not complain when the name resolves to nothing. So the
  # restore plane came up healthy, the PVC bound, MySQL started, and the restored
  # data had no DNS name any client could use.
  #
  # This asserts the pair together, because either half alone renders green: the
  # StatefulSet's serviceName and a Service that actually answers to it.
  - it: emits a Service for the restore MySQL, matching the StatefulSet's serviceName
    template: templates/composition.yaml
    asserts:
      - equal:
          path: spec.pipeline[0].input.extraResources[3].kind
          value: Service
      - equal:
          path: spec.pipeline[0].input.extraResources[3].metadata.name
          value: camelot-mysql-restore
      - equal:
          path: spec.pipeline[0].input.extraResources[2].spec.serviceName
          value: camelot-mysql-restore
      # Headless: it governs a StatefulSet, so the per-pod DNS a StatefulSet's
      # identity contract depends on must exist. A ClusterIP would load-balance
      # across replicas, which is wrong for a database addressed as one instance.
      - equal:
          path: spec.pipeline[0].input.extraResources[3].spec.clusterIP
          value: None
      # The selector must actually match the StatefulSet's pods — a Service with a
      # wrong selector is exactly as unreachable as no Service, and reports Healthy.
      - equal:
          path: spec.pipeline[0].input.extraResources[3].spec.selector["app.kubernetes.io/name"]
          value: camelot-mysql-restore

  # ── THE XRD MUST DECLARE restoreNamespace, OR IT IS PRUNED ────────────────
  #
  # `properties` is a CLOSED schema. A field a client sends that the XRD does not
  # declare is stripped by the apiserver before any controller sees it: the CR
  # applies, the apply reports success, and the field is gone. No error, no event,
  # no condition.
  #
  # So the engine reading `spec.restoreNamespace` (pitr-tools function/function.go,
  # with its own end-to-end test) is only half the mechanism. This is the other
  # half. Either half alone renders green and does nothing — which is the shape
  # this chart has now produced four times.
  - it: declares spec.restoreNamespace, without which the field is silently pruned
    template: templates/xrd.yaml
    asserts:
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.restoreNamespace.type
          value: string
      # NOT required, and NOT defaulted. A default would write a namespace into
      # every CR that omitted one, which is exactly the chart-wide behaviour this
      # field exists to override — the fallback belongs in the engine's precedence
      # chain, where the chart-wide input still gets its turn.
      - notContains:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.required
          content: restoreNamespace
      - notExists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.restoreNamespace.default
      # The status field stays too: the engine reports back where the drill
      # actually landed, which is not necessarily what any one CR asked for.
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.restoreNamespace.type
          value: string

  # ── OFF BY DEFAULT MEANS NOTHING RENDERS ──────────────────────────────────
  #
  # `enabled: false` must produce an EMPTY render, not a partial one. A chart that
  # emitted, say, the XRD but not the Composition while "off" would install a CRD
  # into every cluster that pulled it and leave no controller for it.
  #
  # This case overrides the suite-level `set:` back to false, which is why it
  # asserts per-template: helm-unittest evaluates one template per case, and
  # `hasDocuments: 0` on each is how "nothing at all" is expressed.
  - it: renders nothing at all when disabled
    set:
      enabled: false
    templates:
      - templates/xrd.yaml
      - templates/composition.yaml
      - templates/function.yaml
      - templates/rbac.yaml
      - templates/pitrsession.yaml
      - templates/external-secrets.yaml
      - templates/breatheband.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── THE VECTOR AND THE STEPS MUST NAME THE SAME NAMESPACE ─────────────────
  #
  # Until 2026-08-18 the restore vector wrote `namespace: {{ .Release.Namespace }}`
  # — helm-static, baked at chart render — while the drill steps used the runtime
  # `{{restoreNamespace}}`. A drill with a supplied restore namespace therefore put
  # the restored MySQL in one namespace and looked for the SaaS to verify in
  # another.
  #
  # Nothing errors in that state. The snapshot binds, the PVC binds, the
  # StatefulSet runs, every object reports Healthy — the database is simply not
  # where anything expects it. Exactly the shape this chart has now produced five
  # times, and the one that would have silently defeated viveiro's `wireSaas`.
  #
  # It also makes the CSI constraint self-satisfying: VolumeSnapshot is Namespaced
  # and a PVC dataSource is a TypedLocalObjectReference, so snapshot and clone MUST
  # share a namespace. With one placeholder driving all four they cannot diverge.
  - it: places every restore-vector object in the runtime restore namespace
    template: templates/composition.yaml
    asserts:
      # All four: the snapshot, the PVC that clones it, the StatefulSet that
      # mounts it, and the Service that fronts it. Asserting a subset is how three
      # would move and one would stay.
      - equal:
          path: spec.pipeline[0].input.extraResources[0].metadata.namespace
          value: "{{restoreNamespace}}"
      - equal:
          path: spec.pipeline[0].input.extraResources[1].metadata.namespace
          value: "{{restoreNamespace}}"
      - equal:
          path: spec.pipeline[0].input.extraResources[2].metadata.namespace
          value: "{{restoreNamespace}}"
      - equal:
          path: spec.pipeline[0].input.extraResources[3].metadata.namespace
          value: "{{restoreNamespace}}"
      # And NOT the release namespace. The suite renders into "NAMESPACE" by
      # default, so a regression to .Release.Namespace would produce that literal
      # — this catches the specific way it was wrong before.
      - notEqual:
          path: spec.pipeline[0].input.extraResources[0].metadata.namespace
          value: NAMESPACE

  # ── THE shinka SEED ───────────────────────────────────────────────────────
  #
  # The seed exists because the drill's own /canary-create step is a race it
  # always loses: Crossplane gives no intra-response sequencing, so the canary Job
  # and the VolumeSnapshot are created together and the snapshot wins. A reconciled
  # shinka CR replaces that race with a phase to wait on.
  - it: is OFF by default — the seed writes to a real database
    templates:
      - templates/seed.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: emits exactly the SQL ConfigMap and the shinka CR when enabled
    set:
      seed.enabled: true
      seed.mysqlHost: mysql.camelot.svc.cluster.local
    templates:
      - templates/seed.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: emits a shinka DatabaseMigration pointed at the source it was given
    set:
      seed.enabled: true
      seed.mysqlHost: mysql.camelot.svc.cluster.local
      seed.correlationId: drill-borealis-deadbeef
    templates:
      - templates/seed.yaml
    # Test-level, not per-assertion: this helm-unittest honours `documentIndex`
    # here and silently ignores it inside an assert, which reads every path
    # against document 0 and reports "unknown path".
    documentIndex: 1
    asserts:
      - containsDocument:
          apiVersion: shinka.pleme.io/v1alpha1
          kind: DatabaseMigration
      # Fully-qualified host. A bare Service name resolves in whatever namespace
      # the reader sits in, and on 2026-08-12 that aimed an ephemeral
      # environment's migration at camelot's real database — refused only because
      # the root passwords happened to differ.
      - equal:
          path: spec.database.directRef.host
          value: mysql.camelot.svc.cluster.local
      # strict: an edited seed cannot silently re-run against a source a snapshot
      # was already taken from.
      - equal:
          path: spec.safety.checksumMode
          value: strict
      # The CR must point at the ConfigMap this template also emits — the
      # StatefulSet/Service class of defect, where one half names something the
      # other half never produced.
      - equal:
          path: spec.database.directRef.sqlConfigMapRef.name
          value: camelot-pitr-seed-sql

  - it: seeds SQL that is single-quoted and self-checksumming
    set:
      seed.enabled: true
      seed.mysqlHost: mysql.camelot.svc.cluster.local
      seed.correlationId: drill-borealis-deadbeef
    templates:
      - templates/seed.yaml
    documentIndex: 0
    asserts:
      # SINGLE quotes: MySQL reads a double-quoted token as an IDENTIFIER under
      # ANSI_QUOTES, so `quote` would make the same SQL mean two different things
      # depending on a server setting nothing here controls.
      - matchRegex:
          path: data["seed.sql"]
          pattern: "SHA2\\('pitr-drill-marker-v1', 256\\)"
      - notMatchRegex:
          path: data["seed.sql"]
          pattern: 'SHA2\("'
      # The marker carries the correlation, so a drill reads back the row IT
      # seeded rather than any row that happens to be there.
      - matchRegex:
          path: data["seed.sql"]
          pattern: "'drill-borealis-deadbeef'"
      # Idempotent: shinka may re-apply, and a re-apply must not duplicate the row
      # nor change a payload a snapshot may already hold.
      - matchRegex:
          path: data["seed.sql"]
          pattern: "ON DUPLICATE KEY UPDATE"
      # A dedicated database — never an akeyless one. The marker cannot collide
      # with schema the SaaS owns, and its presence after restore is unambiguous.
      - matchRegex:
          path: data["seed.sql"]
          pattern: "CREATE DATABASE IF NOT EXISTS `pitr_drill`"

  - it: refuses to render a seed with no host rather than guessing one
    set:
      seed.enabled: true
    templates:
      - templates/seed.yaml
    asserts:
      - failedTemplate:
          errorMessage: "seed.mysqlHost is required: the seed writes to a real database and must name it in full, host.namespace.svc.cluster.local. There is no safe default — a bare or wrong host writes the marker into whichever database answers."
