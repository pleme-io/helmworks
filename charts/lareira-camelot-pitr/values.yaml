# lareira-camelot-pitr — the camelot PITR wrapper (parallel consumer of the generic engine).
#
# Everything camelot-specific is CONFIG the chart Helm-templates into the UNCHANGED
# engine's RestoreInput; none of it lives in the engine binary. camelot fills the SAME
# surface the resident team's own PITR chart fills, with camelot values. The engine is
# consumed BY DIGEST (below) — never forked, never edited.
#
# TIER-HONEST: this chart RENDERS + LINTS + UNIT-TESTS green (the layer is WIRED). The
# LIVE drill is OPERATOR-GATED (see the two named gates at the bottom). Do not round the
# wired-and-rendering surface up to a running drill.

# ── THE TWO DIGEST REFERENCES (the seam — HERMETIC SUPPLY CHAIN) ──────────────
# Both are pleme-io-owned, public, immutable @sha256 pins read from the engine's GHCR
# (the SAME digests the team's worked example pins — camelot adopts the DISCIPLINE,
# not their file). _helpers.tpl fails the render if either is empty or not @sha256.
images:
  # the store-NEUTRAL drill-step binaries (canary-create / verify / cleanup /
  # wait-for-deps / diagnostic-collect) — internal/borealis, run as Jobs against
  # camelot's OWN in-cluster akeyless. The canary round-trip proof is identical.
  # RE-PINNED 2026-08-18: amd64-886774d (2026-07-16). The previous digest was
  # built from 5d30956 (2026-06-08), which PREDATES the vendor-neutral rename
  # (0078434, 2026-06-10) -- it still expected --source-akeyless-url and would
  # reject every flag the corrected drill steps now emit. Verified at this
  # commit: cmd/canary-create defines source-borealis-url, cmd/verify defines
  # restored-uam-url, cmd/wait-for-deps defines max-restarts.
  #
  # NOTE this image lags pitr-tools HEAD (1908156, 2026-08-05) by ~3 weeks --
  # 886774d is the newest PUBLISHED amd64 image, not the newest commit. The
  # image pipeline has not run since 07-16. Not blocking (886774d is
  # post-rename and defines every flag emitted here), but the pin is a
  # published-artifact ceiling, not a source ceiling.
  pitrTools: "ghcr.io/pleme-io/pitr-tools@sha256:69be0a0831ba17a98678153bdc39c0ee2ea354f93bae7b1dfaf5370330ee375f"

function:
  # the generic drill-orchestration engine (correlation, per-drill ns, per-step Jobs,
  # result observer, status lifecycle, generic extraResources emitter) — zero "akeyless".
  package: "ghcr.io/pleme-io/function-pitr-drill"
  # RE-PINNED 2026-08-18: sha-1908156, built from pitr-tools HEAD (2026-08-05),
  # likewise past the vendor-neutral rename the old digest predated.
  #
  # ORDERING RULE (README): re-pin the ENGINE xpkg BEFORE the drill image on a
  # LIVE release -- reversed, teardown never runs. Both land together here
  # because this chart has no HelmRelease anywhere yet, so there is no live
  # release whose ordering could be violated. When it IS deployed, split the
  # two into separate commits with a reconcile between.
  ref: "@sha256:32795f871b163590c147a461e8e7a741e30b942248270fa671e7c9b028b7109a"
  replicas: 2   # stateless request/response gRPC — HA by replica count, no election
  install: true # install the Function CR + DeploymentRuntimeConfig (OPERATOR-GATED: needs Crossplane)

# ── CAMELOT-SCOPED XRD (collision-free — NOT the resident team's own group) ────
# The gentlemanly-guest move: camelot uses its OWN Crossplane composite group so the
# CLUSTER-SCOPED CRD never collides with the resident team's own PITR group if both
# land in the same cluster. Same client-facing signature invariant, camelot group.
xrd:
  install: true
  group: pitr.camelot.pleme.io
  kind: CamelotPITRSession
  plural: camelotpitrsessions
  singular: camelotpitrsession
  compositionName: camelot-pitr

# ── THE RestoreInput SURFACE camelot fills (fed to the engine as the function input) ──
composition:
  namespaced: true            # crossplane-v2 namespaced emission path (per-drill restore-<corr> ns)
  tenant: "camelot"           # seeds the deterministic correlation id → drill-camelot-<8hex>
  concurrencyLimit: 1         # single-drill camelot; never two restores racing the same PVC snap

  # camelot's OWN saas set (the restore microservices wired to the restored MySQL).
  # PLACEHOLDER ROSTER — the real service names are supplied per-install. The shape
  # is what matters here: N plain services plus one sharded service (the `kfmID`
  # discriminator the engine reads to fan a single appName into replicas).
  akeylessServices:
    service-a: { appName: service-a, dbSource: unified, svc: { appPort: 80 } }
    service-b: { appName: service-b, dbSource: unified, svc: { appPort: 80 } }
    shard1:    { appName: service-c, kfmID: "1", dbSource: unified, svc: { appPort: 80 } }
    shard2:    { appName: service-c, kfmID: "2", dbSource: unified, svc: { appPort: 80 } }
    shard3:    { appName: service-c, kfmID: "3", dbSource: unified, svc: { appPort: 80 } }
    service-d: { appName: service-d, dbSource: unified, svc: { appPort: 80 } }

  # ★ THE HONEST DIVERGENCE (§2.4): camelot has NO RDS — its MySQL is an in-cluster
  # StatefulSet on a gp3 volumeClaimTemplate. sourceDbInstances is EMPTY, so the
  # engine's emitRDS iterates an empty map → nil (zero RDS Instances, no fatal — the
  # M0 gate, VERIFIED read-only against function/rds.go + function/kind_pitr.go). The
  # data-plane restore vector is camelot's OWN CSI VolumeSnapshot (restore.* below),
  # supplied as extraResources.
  sourceDbInstances: {}
  awsRegion: "us-east-2"
  restoreSubnetGroupName: ""
  restoreKmsKeyId: ""
  restoreVpcSecurityGroupIds: []

  # camelot's own in-cluster instance (NEVER a resident one): the drill Jobs
  # canary-create + verify against THIS url with the access-id below; the access-KEY
  # arrives via the camelot-scoped cofre SecretRef (external-secrets.yaml → jobEnv),
  # never the resident team's. PLACEHOLDER service name — supply the real one.
  sourceAkeylessUrl: "http://saas-service-ingress.camelot.svc.cluster.local"
  akeylessAccessId: ""              # set per-drill via the CamelotPITRSession/values (camelot access-id)
  akeylessK8sAuthConfigName: ""

  # camelot image-build-repo pins (the temporary restore saas image set).
  saasImage:
    mode: pinned
    pinned: {}
  restoreSaasImage: "akeyless"
  restoreSaasImageVersion: "amd64-latest"   # camelot's nix-images tag; a real drill resolves from live
  liveSaasNamespace: "camelot"
  imagePullSecretName: "ghcr-pleme-pull"
  imagePullSecretSourceNs: "camelot"
  configmapSourceNs: "camelot"

# ── THE RESTORE VECTOR (camelot's own — CSI VolumeSnapshot, §2.4) ─────────────
# camelot restores its in-cluster gp3-PVC MySQL by cloning a VolumeSnapshot of the
# durable gp3 PVC into a new PVC + standing up an ephemeral camelot-mysql-restore
# StatefulSet on it. These are Helm-templated into input.extraResources; the engine
# emits them verbatim (provider-kubernetes Objects). Snapshot-point recovery — NOT
# arbitrary-second PITR (binlog replay is M3).
restore:
  enabled: true
  # the durable gp3 MySQL PVC in camelot (the break-glass durable PVC, 2026-07-06 fix).
  # PLACEHOLDER — supply the real PVC name per-install.
  sourcePvcName: "saas-mysql-data"
  # the CSI VolumeSnapshotClass (gp3/ebs.csi.aws.com). OPERATOR-GATED: must exist.
  snapshotClassName: "ebs-vsc"
  # restore FROM this pre-existing snapshot (the one at/before restoreTime — selected by
  # the snapshot cadence / autorevivy PROTECT). Empty + createSnapshot:true = snap-now.
  snapshotName: ""
  # snap the live PVC now (the drill smoke path: snapshot-now → restore-now → verify).
  createSnapshot: true
  restorePvcName: "camelot-mysql-restore-data"
  restoreStatefulSetName: "camelot-mysql-restore"
  size: "20Gi"
  storageClassName: "gp3"
  # The SOURCE server's image tag — the source MySQL subchart's own image.tag.
  # Declared here as DATA rather than left implicit, because mysqlImage below is
  # not free to disagree with it and the template enforces that. If the source
  # MySQL subchart moves, move this first, then mysqlImage.
  sourceMysqlTag: "8.0"
  # MUST track the SOURCE server's major.minor — this server mounts a datadir
  # restored from a snapshot of it, so the two are not independent choices.
  # The source MySQL subchart pins `mysql:8.0` (its values.yaml image.tag), so this
  # is 8.0. It read `mysql:8.4` until 2026-08-05, which would have failed the first
  # drill two independent ways:
  #
  #  1. AUTH. MySQL 8.4 ships mysql_native_password DISABLED by default (present
  #     but not loaded; it needs --mysql-native-password=ON, and 9.0 drops it
  #     entirely). camelot-bootstrap deliberately sets root@'%' to that plugin --
  #     `caching_sha2 breaks the app's MySQL driver`, provision_emit.go:32 -- so a
  #     restored datadir carries a root account an 8.4 server will not
  #     authenticate, and the temporary restore saas cannot connect at all.
  #     MYSQL_ALLOW_EMPTY_PASSWORD does NOT rescue this: it only governs
  #     initialization of a FRESH datadir, and a restore is by definition not one.
  #
  #  2. DATADIR. An 8.0 datadir started under 8.4 enters the in-place upgrade
  #     path, which 8.4 accepts only from recent 8.0.x. The `8.0` tag floats, so
  #     whether a given snapshot satisfies that is not knowable in advance.
  #
  # Both are silent-until-the-drill-runs, which is why the version is pinned here
  # with the reason rather than left to look like a free choice.
  mysqlImage: "mysql:8.0"
  # binlog replay forward from the snapshot for arbitrary-second granularity — DESIGN (M3).
  binlogReplay: false

# ── THE DRILL STEPS (ordered — canary-create → wait → verify → cleanup) ───────
# The generic pitr-tools binaries; the chart configures the steps, the engine runs
# each as a Job. GateOnNotification omits notify unless notification.enabled.
drillSteps:
  canaryCreate: true
  verify: true
  cleanup: true
  diagnosticCollect: true   # runs ONLY on phase=Failed
  waitVerifyMaxWait: "45m"
  waitPollInterval: "15s"
  # /wait-for-deps gives up after this many restarts of a dependency it is
  # waiting on — a crashlooping restore plane should fail the drill, not hold it
  # open until waitVerifyMaxWait expires with no explanation.
  waitMaxRestarts: 5
  # /verify's own budget, separate from the initContainer's wait above: one
  # bounds how long we wait for the plane to EXIST, the other how long we wait
  # for the secret to be retrievable through it.
  verifyMaxWait: "10m"
  # api = authenticate against the restored store and describe-item the canary.
  # presence = record the canary path as retrieved WITHOUT reading it back, and
  # exit 0 even on failure. `presence` cannot prove a restore; it is only for
  # exercising the plumbing. Changing this to `presence` makes every drill pass.
  verifyMode: "api"

# store — the endpoints and identity the drill binaries authenticate with.
#
# SPLIT DELIBERATELY between static and derived. The SOURCE store is a fixed
# property of the environment, so it is a plain value. The RESTORED endpoints
# live in a per-drill namespace the engine mints at runtime, so they are printf
# templates taking {{restoreNamespace}} — there is no placeholder for a full URL
# and there should not be, since only the chart knows its own restore topology.
store:
  # Where /canary-create writes the canary. Required: no default is honest here,
  # because a wrong source store means the drill verifies a secret it never wrote.
  sourceUrl: ""
  # Access-id both /canary-create and /verify authenticate with. Paired with the
  # access-key delivered through jobEnv (external-secrets.yaml), never inlined.
  accessId: ""
  # The restored endpoints are assembled as
  #   http://<service>.<restoreNamespace>.<clusterDomain>:<port>
  # with the namespace supplied at runtime by the engine. Parts rather than one
  # format string: Helm's lexer closes an action at the first `}}`, so a runtime
  # placeholder cannot be nested inside a printf here.
  #
  # borealis -> the AUTH microservice (/auth); uam -> the UAM one
  # (/describe-item). Both are passed explicitly: when --restored-uam-url is
  # empty the binary falls back to the borealis URL, which would describe items
  # against the auth service and fail in a way that names neither.
  restoredAuthService: "auth"
  restoredUamService: "uam"
  restoredPort: 80
  clusterDomain: "svc.cluster.local"

# ── OBSERVABILITY / NOTIFICATION ──────────────────────────────────────────────
# STEALTH: no host-facing artifacts. Notification OFF (no Slack to the host).
notification:
  enabled: false

failureHandling:
  defaultDiagnosticsBucket: ""   # camelot-scoped enjulho retention (optional S3)

# ── THE CamelotPITRSession CR (the declare trigger) ───────────────────────────
# The operator's ONLY authoring verb is: commit this CR (or edit restoreTime/secretNames)
# → Flux converges → observe status.retrievedSecrets. Never plan/apply by hand.
pitrsession:
  create: true
  name: camelot-self-restore
  restoreTime: "2026-07-07T09:00:00Z"   # RFC3339 UTC (edit to the snapshot point)
  secretNames: []                        # empty ⇒ auto-canary at /drill-canary/<corr>
  retention:
    mode: Drill                          # Drill (auto-teardown) | Recover (hold for retrieval)
    maxHold: "6h"

# ── RBAC (least-privilege, ns-scoped — never reaches a resident namespace) ────
rbac:
  create: true
serviceAccount:
  create: true
  name: camelot-pitr-job-runner

# ── COFRE SECRETREF (camelot-scoped — NEVER a resident admin-creds Secret) ────
externalSecrets:
  create: true
  # the camelot-scoped ExternalSecret → the k8s Secret the jobEnv reads. Points at
  # camelot's OWN access-key. OPERATOR-GATED: needs external-secrets + a camelot
  # ClusterSecretStore + the camelot access-key provisioned in cofre.
  secretName: camelot-pitr-admin-creds
  secretStoreRef: camelot-akeyless          # a camelot-scoped SecretStore/ClusterSecretStore
  accessKeyRemoteRef: "/camelot/pitr/access-key"

# ── CAMELOT POSTURE (§III non-negotiables — every workload is pinned + tolerated) ──
nodeSelector:
  role: camelot
tolerations:
  - key: camelot-only
    operator: Exists
    effect: NoSchedule
imagePullSecrets:
  - name: ghcr-pleme-pull

# ── BREATHE (every restore workload carries a band with EXPLICIT dryRun) ───────
# Shadow-first (dryRun: true) — the camelot band footgun guard. The drill's own
# create→verify→teardown lifecycle IS the scale-to-zero; the bands right-size the
# transient restore StatefulSet while it exists.
breathe:
  enabled: true
  # Mem/Cpu bands for the ephemeral camelot-mysql-restore StatefulSet.
  restoreDb:
    dryRun: true
    mode: shadow
    setpoint: 0.8
    growAbove: 0.85
    shrinkBelow: 0.70
    memFloor: "256Mi"
    memCeiling: "2Gi"
    cpuFloor: "100m"
    cpuCeiling: "2000m"
    cooldownSeconds: 300
    maxStalenessSeconds: 120
  # StorageBand for the restore PVC (grow-on-demand; the snapshot's inherited size).
  storage:
    enabled: true
    dryRun: true
    mode: shadow
    setpoint: 0.80
    growAbove: 0.85
    shrinkBelow: 0.70
    growFactor: 1.25
    shrinkFactor: 0.90
    floor: "20Gi"
    ceiling: "100Gi"
    cooldownSeconds: 600
    maxStalenessSeconds: 300
    disruptionPolicy: restartFreeOnly
  # DatabaseBand topology classification (LANDING — typed contract + CI, CRD not
  # installed → emitCR:false by default). The transient restore is a SingleWriter with
  # NO failover target: failover management is VACUOUS (nothing to promote, torn down
  # after verify). Flip emitCR:true ONLY where the DatabaseBand CRD + controller exist.
  database:
    enabled: true
    emitCR: false
    engine: mysql
    class: MasterSlave           # SingleWriter → has_failover_target()==false → MasterSlave
    topology: SingleWriter
    spot: Allowed
    replicaPolicy: Park          # no read-replica scale — a lone transient writer parks
    failoverPolicy: None         # vacuous for a transient restore
