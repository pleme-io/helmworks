{{- if .Values.enabled }}
{{- if .Values.pitrsession.create }}
{{- $p := .Values.pitrsession }}
{{- $x := .Values.xrd }}
---
# THE DECLARE TRIGGER — the operator's ONLY authoring verb. Committing this CR (or
# editing restoreTime / secretNames) is the whole "declare" half of declare-and-observe;
# Flux converges it, the engine runs the drill, the operator observes status.
# retrievedSecrets. Never plan/apply/destroy by hand. camelot-scoped kind (no collision).
apiVersion: {{ $x.group }}/v1
kind: {{ $x.kind }}
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
spec:
  restoreTime: {{ $p.restoreTime | quote }}
  secretNames:
    {{- toYaml $p.secretNames | nindent 4 }}
  retention:
    {{- toYaml $p.retention | nindent 4 }}
{{- end }}
{{- end }}
