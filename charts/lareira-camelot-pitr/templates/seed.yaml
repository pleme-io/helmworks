{{- if and .Values.enabled .Values.seed.enabled }}
{{- $s := .Values.seed }}
---
# ── THE DRILL'S SOURCE DATA, SEEDED BY shinka ───────────────────────────────
#
# ★ WHY THIS EXISTS AT ALL, AND WHY IT IS NOT A DRILL STEP.
#
# The drill ships a `/canary-create` step whose job is to write a marker before
# the snapshot so `/verify` can read it back after the restore. That step cannot
# work, and no amount of wiring fixes it:
#
#   function/jobs.go:71 emits EVERY drill Job into the same desired set on the
#   first reconcile — the only filter is GateOnNotification, never Phase. The
#   engine says so itself: "Crossplane applies the desired set as a whole and
#   gives no intra-response sequencing."
#
# So `canary-create` and the VolumeSnapshot are created at the same instant. The
# canary has to schedule a pod, pull `imagePullPolicy: Always`, authenticate, then
# POST /auth and /create-secret. A CSI snapshot is cut in seconds. The snapshot
# wins essentially always, the restored volume never contains the canary, and
# `verify --mode=api` fails BY CONSTRUCTION.
#
# Ordering therefore has to come from controller convergence rather than from
# luck — which is what shinka is. A DatabaseMigration is a reconciled CR with an
# observable phase, so "the source is seeded" becomes a state to WAIT ON instead
# of a race to lose. That is the whole reason the seed is a separate artifact and
# not another step in the drill's desired set.
#
# ★ WHY shinka SPECIFICALLY, rather than a bespoke Job.
#
# Doctrine, and it is executable rather than aspirational: "The shinka
# schema-change family — one DDL algebra. Every schema concern is a keifu::Change
# through ONE renderer and ONE applier... Data seeding grows that ledger; it is
# not a new citizen." Verified: keifu::Change carries `Sql(RawSql)` and `Update`
# alongside the DDL arms (shinka/src/keifu.rs:346-362), so DML is already in the
# algebra. shinka runs on camelot and viveiro already emits DatabaseMigration CRs
# through all_backing. Nothing here is invented.
#
# ★ ORDERING IS THE OPERATOR'S, AND IT IS NOT OPTIONAL.
#
# Land this, wait for the DatabaseMigration to report Succeeded, and only THEN
# take the snapshot. A snapshot cut before shinka converges captures a source
# without the marker, and the drill then fails for a reason that looks like a
# restore bug. `kubectl get databasemigration -n {{ $s.namespace }} {{ $s.name }}`
# is the gate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $s.name }}-sql
  namespace: {{ $s.namespace }}
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
data:
  # A DEDICATED database, never an akeyless one. Two reasons: a marker table
  # cannot collide with a schema the SaaS owns, and its presence in the restored
  # volume is unambiguous evidence rather than something to disentangle from real
  # application state.
  #
  # The checksum is computed BY MySQL from the payload, so the verifier recomputes
  # it the same way and a row that was truncated, re-encoded or partially written
  # fails the comparison instead of passing on a matching id alone.
  seed.sql: |
    CREATE DATABASE IF NOT EXISTS `{{ $s.database }}`
      CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;

    CREATE TABLE IF NOT EXISTS `{{ $s.database }}`.`{{ $s.table }}` (
      correlation_id VARCHAR(64)  NOT NULL,
      seeded_at      DATETIME(6)  NOT NULL,
      payload        VARCHAR(255) NOT NULL,
      checksum       CHAR(64)     NOT NULL,
      PRIMARY KEY (correlation_id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    -- Idempotent: shinka may re-apply, and a re-apply must not create a second
    -- row nor change the payload a snapshot may already have captured.
    -- SINGLE quotes, deliberately. Helm's `quote` emits double quotes, and MySQL
    -- reads a double-quoted token as an IDENTIFIER rather than a string whenever
    -- ANSI_QUOTES is in sql_mode — so the same SQL means two different things
    -- depending on a server setting nothing here controls. Single quotes are a
    -- string literal under every sql_mode.
    --
    -- Consequence the operator owns: seed.payload and seed.correlationId must not
    -- contain a single quote. They are short identifiers by design; the seed is
    -- not a place to put free text.
    INSERT INTO `{{ $s.database }}`.`{{ $s.table }}`
      (correlation_id, seeded_at, payload, checksum)
    VALUES
      ({{ $s.correlationId | squote }}, UTC_TIMESTAMP(6), {{ $s.payload | squote }},
       SHA2({{ $s.payload | squote }}, 256))
    ON DUPLICATE KEY UPDATE
      payload  = VALUES(payload),
      checksum = VALUES(checksum);
---
apiVersion: shinka.pleme.io/v1alpha1
kind: DatabaseMigration
metadata:
  name: {{ $s.name }}
  namespace: {{ $s.namespace }}
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
spec:
  database:
    directRef:
      engine: mysql
      # The SOURCE database — the one whose volume gets snapshotted. Carried
      # explicitly rather than resolved from a bare Service name: a bare name
      # resolves in whatever namespace the reader sits in, and the failure mode is
      # not an error but a write to the WRONG database. Measured on 2026-08-12,
      # when a migration aimed at an ephemeral environment presented credentials to
      # camelot's real MySQL and was refused ONLY because the root passwords
      # happened to differ.
      host: {{ $s.mysqlHost | required "seed.mysqlHost is required: the seed writes to a real database and must name it in full, host.namespace.svc.cluster.local. There is no safe default — a bare or wrong host writes the marker into whichever database answers." }}
      port: {{ $s.mysqlPort }}
      username: {{ $s.mysqlUser }}
      credentialsSecretRef:
        name: {{ $s.credentialsSecretName }}
      passwordKey: {{ $s.passwordKey }}
      sqlConfigMapRef:
        name: {{ $s.name }}-sql
  safety:
    # strict: the applier refuses if the SQL changed under a checksum it already
    # recorded, so an edited seed cannot silently re-run against a source a
    # snapshot was already taken from.
    checksumMode: strict
    maxRetries: 3
    continueOnFailure: false
{{- end }}
