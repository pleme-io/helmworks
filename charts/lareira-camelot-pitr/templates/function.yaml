{{- if .Values.enabled }}
{{- include "camelot-pitr.validateConfig" . -}}
{{- if .Values.function.install }}
---
# The generic drill-orchestration engine, INSTALLED BY DIGEST (TOOL-DISTRIBUTION —
# consume, never fork). This is the SAME pleme-io Function the team's chart consumes;
# camelot references the immutable digest, it does not host or rebuild it.
#
# OPERATOR-GATED: requires Crossplane core on the camelot floor. Rendered so the layer
# is WIRED + provable; the live reconcile is gated (Chart.yaml names the gate).
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-camelot-pitr-drill
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
    app.kubernetes.io/component: crossplane-function
spec:
  package: {{ .Values.function.package }}{{ .Values.function.ref }}
  runtimeConfigRef:
    name: function-camelot-pitr-drill
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-camelot-pitr-drill
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
    app.kubernetes.io/component: crossplane-function
spec:
  deploymentTemplate:
    spec:
      replicas: {{ .Values.function.replicas | default 2 }}
      selector: {}
      template:
        spec:
          # the function pods are camelot workloads too — pin them to our own nodes.
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
{{- end }}
{{- end }}
