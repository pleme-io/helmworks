{{- if .Values.externalSecrets.create }}
{{- $e := .Values.externalSecrets }}
---
# COFRE SECRETREF — camelot-scoped, NEVER the akeyless one. The drill's source-store
# creds materialize as a camelot-scoped Secret ({{ $e.secretName }}) that the jobEnv
# reads (composition.yaml). It points at CAMELOT's OWN akeyless access-key via a
# camelot SecretStore — the drill reads camelot's akeyless, restores camelot's MySQL.
# NEVER references akeyless's pitr-akeyless-admin-creds.
#
# OPERATOR-GATED: requires external-secrets + the camelot SecretStore + the camelot
# access-key provisioned in cofre. Rendered so the layer is WIRED.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $e.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $e.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ $e.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: {{ $e.accessKeyRemoteRef | quote }}
{{- end }}
