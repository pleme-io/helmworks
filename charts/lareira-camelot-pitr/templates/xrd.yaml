{{- if .Values.enabled }}
{{- if .Values.xrd.install }}
{{- $x := .Values.xrd }}
---
# The camelot-scoped composite type — the client-facing PITR trigger surface.
#
# GENTLEMANLY GUEST: camelot uses its OWN group ({{ $x.group }}, kind {{ $x.kind }}) so
# the CLUSTER-SCOPED CRD this XRD generates can NEVER collide with the resident team's
# own PITR composite if both land in the same cluster. Same client-facing signature
# invariant — (spec.restoreTime, spec.secretNames) → status.retrievedSecrets — camelot
# group. OPERATOR-GATED: requires Crossplane core.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: {{ $x.plural }}.{{ $x.group }}
  labels:
    {{- include "camelot-pitr.labels" . | nindent 4 }}
spec:
  group: {{ $x.group }}
  names:
    kind: {{ $x.kind }}
    listKind: {{ $x.kind }}List
    plural: {{ $x.plural }}
    singular: {{ $x.singular }}
  defaultCompositionRef:
    name: {{ $x.compositionName }}
  defaultCompositionUpdatePolicy: Manual
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A single camelot PITR drill: restore camelot's OWN in-cluster secret-store
            data plane (gp3-PVC MySQL) to a snapshot point and prove a canary written before
            it is retrievable after restore. The engine runs the drill; the restore
            VECTOR (CSI VolumeSnapshot) is camelot config, not RDS.
          properties:
            spec:
              type: object
              required: [restoreTime]
              properties:
                restoreTime:
                  type: string
                  format: date-time
                  description: RFC3339 UTC snapshot point to restore to. Explicit only.
                secretNames:
                  type: array
                  items: { type: string }
                  default: []
                  description: >-
                    camelot secret paths to verify in the restored env. Empty ⇒
                    auto-canary at /drill-canary/<correlationId>.
                # ★ DECLARED HERE OR IT DOES NOT EXIST. `properties` is a CLOSED
                # schema: a field a client sends that this omits is PRUNED by the
                # apiserver before the controller ever sees it. The CR applies, the
                # apply reports success, and the field is simply gone — there is no
                # error anywhere in that sequence. So the engine reading
                # `spec.restoreNamespace` (pitr-tools function/function.go) is only
                # half of the mechanism; this is the other half, and either alone
                # renders green.
                restoreNamespace:
                  type: string
                  description: >-
                    Namespace every artifact of THIS drill lands in, overriding the
                    chart-wide function input. Empty ⇒ the chart-wide value, and if
                    that is also empty, the engine-derived restore-<correlationId>.

                    Set it when something else already owns a namespace the drill
                    belongs inside. viveiro spawns viveiro-env-<8hex>, owns its whole
                    lifecycle and reaps it by finalizer, so a drill scattering half
                    its artifacts elsewhere leaves them outside the thing that cleans
                    up.

                    It is per-CR rather than chart-wide because the chart-wide input
                    is per-Composition: under one release, N drills would all restore
                    into one namespace, and each one after the first would verify a
                    different drill's data. That failure is silent — two drills
                    writing one namespace is not an error, just a wrong answer.

                    REQUIRED, not merely tidier, for the CSI vector: VolumeSnapshot is
                    Namespaced and a PVC dataSource is a TypedLocalObjectReference
                    (same namespace only), so a restore PVC can only clone a snapshot
                    beside it. Supplying the namespace makes that constraint vacuous
                    rather than working around it.
                retention:
                  type: object
                  default: {}
                  properties:
                    mode:
                      type: string
                      enum: [Drill, Recover]
                      default: Drill
                    maxHold:
                      type: string
                      default: "6h"
                    release:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Restoring, Verifying, Succeeded, Held, Releasing, Failed, Canceling, Canceled]
                correlationId: { type: string }
                restoreNamespace: { type: string }
                retrievedSecrets:
                  type: array
                  items: { type: string }
                canarySecretsCreated:
                  type: array
                  items: { type: string }
                cleanupStatus: { type: string }
                failureReason: { type: string }
                startTime: { type: string, format: date-time }
                completionTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
{{- end }}
{{- end }}
