suite: super-cache-ci — the STORE KEYSTONE (matching DNS + shadow-first bands + egress netpol)
templates:
  - templates/backend-configmap.yaml
  - templates/postgres-alias-service.yaml
  - templates/breatheband.yaml
  - templates/networkpolicy.yaml
  - templates/postgres-owner-secret.yaml
  - templates/namespace.yaml
release:
  name: scc
  namespace: super-cache-ci
tests:
  # ── THE LOAD-BEARING DNS CONTRACT: the two endpoints the consumers dial ────
  - it: renders the tiered BackendConfig with the exact consumer-referenced Redis + Postgres DNS
    template: templates/backend-configmap.yaml
    asserts:
      - equal:
          path: kind
          value: ConfigMap
      - equal:
          path: metadata.name
          value: super-cache-ci-backend-config
      # The single data key MUST be the env var name src/agent.rs reads.
      - isNotNullOrEmpty:
          path: data.SUI_CACHE_BACKEND_CONFIG
      # L1 Redis endpoint == redis.super-cache-ci.svc:6379 (the prewarmer's url).
      - matchRegex:
          path: data.SUI_CACHE_BACKEND_CONFIG
          pattern: 'redis://redis\.super-cache-ci\.svc:6379'
      # L2 Postgres endpoint == postgres.super-cache-ci.svc:5432/sui (the prewarmer's url).
      - matchRegex:
          path: data.SUI_CACHE_BACKEND_CONFIG
          pattern: 'postgres://sui@postgres\.super-cache-ci\.svc:5432/sui'
      # The tiered posture is what the daemon fronts.
      - matchRegex:
          path: data.SUI_CACHE_BACKEND_CONFIG
          pattern: '"type":"tiered"'

  # ── THE POSTGRES ALIAS: `postgres` → CNPG rw Service, on :5432 ─────────────
  - it: aliases the flat `postgres` Service to CNPG's rw Service on 5432
    template: templates/postgres-alias-service.yaml
    asserts:
      - equal:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: postgres
      - equal:
          path: spec.type
          value: ExternalName
      - equal:
          path: spec.externalName
          value: super-cache-ci-pg-rw.super-cache-ci.svc.cluster.local
      - equal:
          path: spec.ports[0].port
          value: 5432

  # ── SHADOW-FIRST BANDS: every emitted band ships dryRun:true ───────────────
  - it: emits the serve daemon MemoryBand shadow-first (dryRun:true)
    template: templates/breatheband.yaml
    documentSelector:
      path: metadata.name
      value: sui-serve-memory
    asserts:
      - equal:
          path: kind
          value: MemoryBand
      - equal:
          path: spec.dryRun
          value: true
      - equal:
          path: spec.targetRef.name
          value: sui-serve

  - it: emits the serve daemon CpuBand shadow-first (dryRun:true)
    template: templates/breatheband.yaml
    documentSelector:
      path: metadata.name
      value: sui-serve-cpu
    asserts:
      - equal:
          path: kind
          value: CpuBand
      - equal:
          path: spec.dryRun
          value: true

  - it: emits the Redis L1 MemoryBand shadow-first (dryRun:true)
    template: templates/breatheband.yaml
    documentSelector:
      path: metadata.name
      value: redis-memory
    asserts:
      - equal:
          path: kind
          value: MemoryBand
      - equal:
          path: spec.dryRun
          value: true

  - it: emits the Redis PVC StorageBand shadow-first (dryRun:true), grow-only, targeting data-redis-0
    template: templates/breatheband.yaml
    documentSelector:
      path: metadata.name
      value: data-redis-0-storage
    asserts:
      - equal:
          path: kind
          value: StorageBand
      - equal:
          path: spec.dryRun
          value: true
      - equal:
          path: spec.targetRef.name
          value: data-redis-0

  - it: NO band is ever emitted live by default (shadow-first is universal)
    template: templates/breatheband.yaml
    asserts:
      - notEqual:
          path: spec.dryRun
          value: false

  # ── EGRESS-SCOPED NETWORKPOLICY: default-deny + explicit store/DNS egress ──
  - it: emits a default-deny NetworkPolicy over both directions for the serve daemon
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: super-cache-ci-serve-default-deny
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: serve

  - it: scopes serve egress to the in-namespace Redis + Postgres store ports only
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: super-cache-ci-serve-allow-store
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: super-cache-ci
      - contains:
          path: spec.egress[0].ports
          content: { protocol: TCP, port: 6379 }
      - contains:
          path: spec.egress[0].ports
          content: { protocol: TCP, port: 5432 }

  # ── SELF-CONTAINED: the CNPG owner Secret is emitted (username: sui) ───────
  - it: emits the CNPG owner-credentials Secret so a first install is self-contained
    template: templates/postgres-owner-secret.yaml
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: super-cache-ci-pg-owner
      - equal:
          path: stringData.username
          value: sui

  # ── NAMESPACE LABEL: consumers' egress namespaceSelector matches ──────────
  - it: stamps the well-known namespace label the consumers' egress selector matches
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.labels["kubernetes.io/metadata.name"]
          value: super-cache-ci
