{{- if .Values.postgres.enabled }}
{{/*
The `postgres` alias Service — the load-bearing DNS bridge.

CNPG names the read-write Service `<clusterName>-rw`; the committed consumer
contract dials the flat `postgres.super-cache-ci.svc:5432`. An ExternalName
Service aliases CNPG's rw Service under the expected name — drift-free (CNPG
owns the real Service + its selector; this only re-labels the DNS name). A
selector-Service would have to duplicate CNPG's pod selector and risk drift, so
ExternalName is the correct alias.

targetPort is irrelevant for ExternalName (DNS CNAME only); the consumer's :5432
resolves against CNPG's rw Service, which listens on 5432.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: super-cache-ci
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres-alias
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: super-cache-ci
spec:
  type: ExternalName
  externalName: {{ printf "%s-rw.%s.svc.cluster.local" .Values.postgres.clusterName .Release.Namespace }}
  ports:
    - name: pg
      port: {{ .Values.store.postgresPort }}
      targetPort: {{ .Values.store.postgresPort }}
      protocol: TCP
{{- end }}
