{{- if and .Values.postgres.enabled .Values.postgresOwnerSecret.create }}
{{/*
The CNPG owner-credentials Secret (username + password) the initdb bootstrap
consumes. Emitted here so a first install is self-contained (no pre-seeded
Secret). Password is generated ONCE and pinned across upgrades via a live-Secret
lookup — a re-render must NOT rotate the DB owner's password out from under a
running cluster. For the durable posture, supply a cofre/ESO-materialized Secret
and set postgresOwnerSecret.create=false.

CNPG expects keys `username` + `password`.

★ THE PIN ONLY HOLDS WHERE `lookup` CAN REACH A CLUSTER (noted 2026-08-01).
`lookup` returns an EMPTY dict whenever the render has no API access —
`helm template`, `helm install/upgrade --dry-run`, and any GitOps flow that
renders client-side and applies the YAML. On those paths `$existing` is empty,
the `else` branch fires, and `randAlphaNum 32` mints a NEW password. Applying
that output ROTATES the live DB owner's credential and CNPG auth starts
failing — the exact outcome this lookup exists to prevent, produced by the
mechanism meant to prevent it.

Measured here: two consecutive `helm template` runs emit two DIFFERENT
passwords. That is not a bug in this template, it is what `lookup` does without
a cluster — and it is invisible, because a render that silently regenerates
looks identical to one that correctly preserved.

Flux's helm-controller runs a real server-side upgrade and DOES resolve
`lookup`, so the GitOps path this chart targets is safe. The unsafe paths are
`helm template | kubectl apply` and any renderer without credentials.

NOT URGENT TODAY: no HelmRelease in any of our GitOps repos deploys this chart
(checked, with a control — lareira-clickhouse IS found deployed that way), so
the hazard is latent. It becomes live the moment super-cache-ci ships. The
durable fix is the one already named above: a cofre/ESO-materialized Secret
with `postgresOwnerSecret.create=false`, which removes the generation branch
entirely rather than relying on a lookup that some renderers cannot perform.
*/}}
{{- $secretName := .Values.postgresOwnerSecret.name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: super-cache-ci
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres-owner
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: super-cache-ci
  annotations:
    # Keep the Secret across a `helm uninstall` so a cluster re-adopt keeps the
    # same owner credentials as the persisted PVCs.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresOwnerSecret.username | quote }}
  password: {{ $password | quote }}
{{- end }}
