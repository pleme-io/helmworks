{{- if and .Values.postgres.enabled .Values.postgresOwnerSecret.create }}
{{/*
The CNPG owner-credentials Secret (username + password) the initdb bootstrap
consumes. Emitted here so a first install is self-contained (no pre-seeded
Secret). Password is generated ONCE and pinned across upgrades via a live-Secret
lookup — a re-render must NOT rotate the DB owner's password out from under a
running cluster. For the durable posture, supply a cofre/ESO-materialized Secret
and set postgresOwnerSecret.create=false.

CNPG expects keys `username` + `password`.
*/}}
{{- $secretName := .Values.postgresOwnerSecret.name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: super-cache-ci
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres-owner
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: super-cache-ci
  annotations:
    # Keep the Secret across a `helm uninstall` so a cluster re-adopt keeps the
    # same owner credentials as the persisted PVCs.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresOwnerSecret.username | quote }}
  password: {{ $password | quote }}
{{- end }}
