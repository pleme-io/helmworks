apiVersion: v2
name: lareira-cert-manager
description: |
  cert-manager for pleme-io home-edge clusters. Wraps the upstream
  jetstack/cert-manager chart with bounded resources, optional self-
  signed ClusterIssuer, and the pleme-io alert pattern.

  Default-OFF (enabled: false). Cluster opts in by setting enabled: true.
type: application
version: 0.1.0
appVersion: "v1.17.1"

keywords: [cert-manager, tls, lareira]
maintainers:
  - name: drzzln
    email: drzzln@protonmail.com

dependencies:
  - name: pleme-lib
    version: "~0.13.0"
    repository: "file://../pleme-lib"
  - name: cert-manager
    version: "v1.17.1"
    repository: "https://charts.jetstack.io"
    condition: certManager.enabled
