suite: pleme-spegel — the CO-LOCATED SERVE tier (adopted-not-forked, shadow-first, netpol-scoped)
templates:
  - templates/daemonset.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/networkpolicy.yaml
  - templates/breatheband.yaml
  - templates/namespace.yaml
release:
  name: pleme-spegel
  namespace: super-cache-ci
tests:
  # ── ADOPTED, NOT FORKED: the upstream Spegel binary, config-only ───────────
  - it: runs the ADOPTED upstream Spegel image via its own `registry` command
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: kind
          value: DaemonSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/spegel-org/spegel:v0.7.3"
      # The behaviour is Spegel's own command — the chart adds no swarm logic.
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: registry

  - it: pins the adopted image by DIGEST when set (hermetic adoption path)
    template: templates/daemonset.yaml
    set:
      image.digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/spegel-org/spegel@sha256:[0-9a-f]{64}$'

  # ── THE LOAD-BEARING DNS BOOTSTRAP CONTRACT ────────────────────────────────
  - it: derives the router's dns-bootstrap-domain from the headless bootstrap Service name
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dns-bootstrap-domain=pleme-spegel-bootstrap.super-cache-ci.svc.cluster.local
      - contains:
          path: spec.template.spec.containers[0].args
          content: --bootstrap-kind=dns

  - it: emits a headless, notReady-publishing bootstrap Service the router resolves peers through
    template: templates/service.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: pleme-spegel-bootstrap
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: exposes the served mirror as a NodePort so peers can dial this node
    template: templates/service.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: pleme-spegel-registry
      - equal:
          path: spec.type
          value: NodePort

  # ── SHADOW-FIRST: default reroutes NOTHING ─────────────────────────────────
  - it: does NOT write containerd mirror hosts by default (no initContainer, no hostPort)
    template: templates/daemonset.yaml
    asserts:
      # No `configuration` initContainer ⇒ no node's containerd is mutated.
      - isNull:
          path: spec.template.spec.initContainers
      # No hostPort ⇒ the same-node kubelet is not wired to the mirror.
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: registry
            containerPort: 5000
            hostPort: 30020
            protocol: TCP

  - it: PROMOTES to live only when registryMirror.enabled — the initContainer + hostPort appear
    template: templates/daemonset.yaml
    set:
      registryMirror.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: configuration
      - equal:
          path: spec.template.spec.initContainers[0].args[0]
          value: configuration
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: registry
            containerPort: 5000
            hostPort: 30020
            protocol: TCP

  # ── SHADOW-FIRST breathe bands ─────────────────────────────────────────────
  - it: emits a MemoryBand targeting the DaemonSet, dryRun:true
    template: templates/breatheband.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: MemoryBand
      - equal:
          path: spec.targetRef.kind
          value: DaemonSet
      - equal:
          path: spec.targetRef.name
          value: pleme-spegel
      - equal:
          path: spec.dryRun
          value: true

  - it: emits a CpuBand targeting the DaemonSet, dryRun:true
    template: templates/breatheband.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: CpuBand
      - equal:
          path: spec.dryRun
          value: true

  # ── NETWORKPOLICY-SCOPED: default-deny both directions ─────────────────────
  - it: fronts the DaemonSet with a default-deny (Ingress+Egress) NetworkPolicy
    template: templates/networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: NetworkPolicy
      - equal:
          path: metadata.name
          value: pleme-spegel-default-deny
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: opens the P2P router mesh on tcp+udp both directions and nothing else wildcard
    template: templates/networkpolicy.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: pleme-spegel-allow-router-mesh
      - contains:
          path: spec.ingress[0].ports
          content: { protocol: TCP, port: 5001 }
      - contains:
          path: spec.ingress[0].ports
          content: { protocol: UDP, port: 5001 }
      - contains:
          path: spec.egress[0].ports
          content: { protocol: UDP, port: 5001 }

  - it: opens the served registry port for peers + kubelet
    template: templates/networkpolicy.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: pleme-spegel-allow-registry-serve
      - contains:
          path: spec.ingress[0].ports
          content: { protocol: TCP, port: 5000 }

  # ── LEAST-PRIVILEGE: dns-bootstrap needs no ClusterRole ────────────────────
  - it: creates a ServiceAccount and grants NO ClusterRole (dns-bootstrap needs no API read)
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: pleme-spegel
