{{/*
ServiceAccount only — no ClusterRole. In dns-bootstrap mode (the adopted
default) Spegel discovers peers purely via the headless -bootstrap Service's
DNS records; it needs ZERO Kubernetes API read access. Upstream v0.7.3's chart
grants no ClusterRole in this mode either. Least-privilege by construction.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pleme-spegel.serviceAccountName" . }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
