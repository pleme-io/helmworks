apiVersion: v2
name: lareira-openclaw-stack
description: |
  openclaw stack — umbrella chart composing the publisher PKI, the
  attested artifact registry (cartorio), the wire-level OCI gate
  (lacre), the skill-store API, the continuous re-attestation scanner,
  and an optional bundled backing OCI registry (Zot) into a single
  deploy unit. Every sub-chart inherits the fedramp-high compliance
  overlay; sub-charts can be enabled/disabled independently via
  top-level toggles.
type: application
version: 0.3.0
appVersion: "0.3.0"

keywords: [openclaw, fedramp-high, attestation, lareira, umbrella]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]

dependencies:
  - name: lareira-openclaw-pki
    alias: pki
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-pki"
    condition: pki.enabled
  - name: lareira-cartorio
    alias: registry
    version: "~0.4.0"
    repository: "file://../lareira-cartorio"
    condition: registry.enabled
  - name: lareira-lacre
    alias: gate
    version: "~0.1.0"
    repository: "file://../lareira-lacre"
    condition: gate.enabled
  - name: lareira-openclaw-store
    alias: store
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-store"
    condition: store.enabled
  - name: lareira-openclaw-scanner
    alias: scanner
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-scanner"
    condition: scanner.enabled
  - name: pleme-zot
    alias: backingRegistry
    version: "~0.1.0"
    repository: "file://../pleme-zot"
    condition: backingRegistry.enabled
