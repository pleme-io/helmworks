apiVersion: v2
name: lareira-openclaw-stack
description: |
  openclaw stack — umbrella chart composing the publisher PKI, the
  attested artifact registry (cartorio), the wire-level OCI gate
  (lacre), the skill-store API, the continuous re-attestation scanner,
  and an optional bundled backing OCI registry (Zot) into a single
  deploy unit. Every sub-chart inherits the fedramp-high compliance
  overlay; sub-charts can be enabled/disabled independently via
  top-level toggles.
type: application
version: 0.6.5
appVersion: "0.6.4"

keywords: [openclaw, fedramp-high, attestation, lareira, umbrella]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]

dependencies:
  - name: lareira-openclaw-pki
    alias: pki
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-pki"
    condition: pki.enabled
  - name: lareira-cartorio
    alias: registry
    version: "~0.5.0"
    repository: "file://../lareira-cartorio"
    condition: registry.enabled
  - name: lareira-lacre
    alias: gate
    version: "~0.1.2"
    repository: "file://../lareira-lacre"
    condition: gate.enabled
  - name: lareira-openclaw-store
    alias: store
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-store"
    condition: store.enabled
  - name: lareira-openclaw-scanner
    alias: scanner
    version: "~0.1.0"
    repository: "file://../lareira-openclaw-scanner"
    condition: scanner.enabled
  # Aliased as `backing-registry` (lowercase + hyphen) — alias bytes
  # propagate into resource names via pleme-lib.fullname, so a camelCase
  # alias would emit RFC-1123-violating Service / NetworkPolicy names.
  # BREAKING in 0.4.0: consumers that referenced `backingRegistry:` in
  # their values must rename to `backing-registry:`. (camelCase keys
  # in YAML need quoting OR hyphenated; we pick the canonical form.)
  - name: pleme-zot
    alias: backing-registry
    version: "~0.1.2"
    repository: "file://../pleme-zot"
    condition: backing-registry.enabled
  # The public read-only browser view. Off by default — operators
  # opt in per cluster (pleme-dev does, fleet clusters running their
  # own UI front don't).
  - name: lareira-openclaw-web
    alias: web
    version: "~0.2.5"
    repository: "file://../lareira-openclaw-web"
    condition: web.enabled
