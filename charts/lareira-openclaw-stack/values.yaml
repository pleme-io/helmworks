# lareira-openclaw-stack — umbrella for the openclaw proof chain.
#
# Default posture deploys the full chain at fedramp-high:
#
#   ┌─ pki              (publisher PKI — issues + revokes signing certs)
#   ├─ registry         (cartorio — the merkle ledger / source of truth)
#   ├─ gate             (lacre — the wire-level OCI gate; asks cartorio)
#   ├─ backingRegistry  (Zot — what lacre forwards to once cartorio admits)
#   ├─ store            (skill-store API; reads from cartorio)
#   └─ scanner          (re-attestation; quarantines drifted artifacts)
#
# Flip any of these to false to deploy a subset (e.g. only registry +
# gate + backingRegistry for a minimal demo, or only pki + registry +
# store + scanner if you already operate Zot + lacre elsewhere).

pki:
  enabled: true
registry:
  enabled: true
gate:
  enabled: true
backingRegistry:
  enabled: true   # bundles `pleme-zot` for self-contained demos.
                  # Set to false when you have an external OCI
                  # registry; then override gate.backend.url to it.
store:
  enabled: true
scanner:
  enabled: true

# Sub-chart overrides flow through the alias names declared in
# Chart.yaml dependencies. Example: bump store image digest.
#
#   store:
#     pleme-microservice:
#       image:
#         tag: "sha256:abc123..."
#
# This shape is identical to installing each sub-chart standalone;
# the umbrella adds composition + a single release lifecycle, not new
# values structure.

# Cross-service wiring — overrides the gate sub-chart's env block to
# point at the umbrella's actual service names. Each sub-chart's
# default values assume standalone install; the umbrella patches in
# the cross-sub-chart names here. Operators using external services
# (e.g. a shared cartorio in another namespace) override this block.
gate:
  enabled: true
  pleme-microservice:
    env:
      - name: LACRE_ORG
        value: "pleme-io"
      - name: LACRE_CARTORIO_URL
        # nameOverride=cartorio in the registry sub-chart → service is `<release>-cartorio`.
        # Helm subchart aliases don't change Service names; only the
        # release-name prefix and the `nameOverride` are used.
        value: "http://stack-cartorio:8082"
      - name: LACRE_BACKEND_URL
        # pleme-zot uses the dependency alias `backingRegistry` → service
        # is `<release>-backingRegistry`. (Yes, camelCase preserved by Helm.)
        value: "http://stack-backingRegistry:5000"
      - name: RUST_LOG
        value: "info,lacre=debug"

# Image tags are NOT defaulted here — at fedramp-high every workload
# must be digest-pinned, and the pinning is the responsibility of CI
# (forge injects digests at release). Operators supply real tags via
# overrides; the placeholder zeros in each sub-chart's defaults are
# structurally valid (sha256: shape), but image pull will fail at
# runtime if a real digest hasn't been substituted — surfacing the
# missing substitution as a deploy-time error.
