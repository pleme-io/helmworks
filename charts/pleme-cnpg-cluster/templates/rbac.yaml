{{- if and .Values.enabled .Values.walArchive.enabled }}
{{- include "pleme-cnpg-cluster.requireClusterName" . }}
---
# Role + RoleBinding granting the per-cluster CNPG instance
# ServiceAccount read access to the WAL-archive credentials Secret.
#
# CNPG's instance-manager fetches the s3 credentials Secret at every
# reconcile to push WAL segments. Without this RBAC the manager logs
# "secrets ... is forbidden" and archive_count never advances.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.clusterName }}-wal-archive-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-cnpg-cluster.labels" . | nindent 4 }}
    {{- with .Values.clusterLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.walArchive.credentialsSecretName }}
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.clusterName }}-wal-archive-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-cnpg-cluster.labels" . | nindent 4 }}
    {{- with .Values.clusterLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.clusterName }}-wal-archive-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterName }}    # CNPG names instance SA after Cluster
    namespace: {{ .Release.Namespace }}
{{- end }}
