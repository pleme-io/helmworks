{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "pleme-lib.fluxcdPruneDisabled" . | nindent 4 }}
spec:
  serviceName: {{ include "pleme-lib.fullname" . }}-headless
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "pleme-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-lib.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "pleme-lib.prometheusAnnotations" . | nindent 8 }}
        sidecar.istio.io/inject: "false"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pleme-lib.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "pleme-lib.podSecurityContext" . | nindent 8 }}
      {{- if include "pleme-cache.initDelivery" . }}
      initContainers:
        - name: config-init
          image: {{ include "pleme-lib.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              # COMPOSE the config; never rewrite it in place.
              #
              # This was `sed -i "s/__REDIS_PASSWORD__/$PASS/"`, which put the
              # cache password through a REGEX REPLACEMENT: `&` means the whole
              # match there, so a password containing `&` silently set a
              # different password than intended, with sed exiting 0 and valkey
              # booting healthy. `/` was the delimiter and aborted outright.
              #
              # Appending has no pattern and no placeholder, so that class does
              # not exist rather than being handled. `set -eu` is new too: with
              # no `set -e`, a failed `cp` or unreadable credential produced an
              # empty `requirepass` and a cache that answered to nothing.
              #
              # Both `printf` and the redirect are shell builtins, so the value
              # never reaches any process's argv — unlike the old form, where
              # the shell expanded $PASS into sed's command line and it landed
              # in world-readable /proc/<pid>/cmdline.
              #
              # Known remaining constraint, stated rather than silently assumed:
              # redis parses `requirepass` as a bare token, so a password
              # containing whitespace needs quoting the generator would have to
              # agree on. That was equally true of the sed form; it is not a
              # regression, and it is the reason to keep passwords alphanumeric.
              set -eu
              cp /config/redis.conf /tmp/redis/redis.conf
              PASS=$(cat /credentials/{{ .Values.cache.password.key }})
              printf 'requirepass %s\n' "$PASS" >> /tmp/redis/redis.conf
          securityContext:
            {{- include "pleme-lib.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: runtime-config
              mountPath: /tmp/redis
            - name: credentials
              mountPath: /credentials
              readOnly: true
      {{- end }}
      containers:
        - name: {{ include "pleme-lib.name" . }}
          image: {{ include "pleme-lib.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if include "pleme-cache.initDelivery" . }}
            - /tmp/redis/redis.conf
            {{- else }}
            - /config/redis.conf
            {{- end }}
            {{- with .Values.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.cache.port | default 6379 }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "pleme-lib.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: {{ .Values.health.livenessInitialDelay | default 10 }}
            periodSeconds: {{ .Values.health.livenessPeriod | default 10 }}
            failureThreshold: {{ .Values.health.livenessFailureThreshold | default 3 }}
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: {{ .Values.health.readinessInitialDelay | default 5 }}
            periodSeconds: {{ .Values.health.readinessPeriod | default 5 }}
            failureThreshold: {{ .Values.health.readinessFailureThreshold | default 2 }}
          volumeMounts:
            {{- if include "pleme-cache.initDelivery" . }}
            - name: runtime-config
              mountPath: /tmp/redis
            {{- else }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- if and .Values.cache.password.enabled (not (include "pleme-cache.initDelivery" .)) }}
            - name: credentials
              mountPath: /credentials
              readOnly: true
            {{- end }}
            {{- if .Values.cache.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- if .Values.cache.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.exporter.enabled }}
        - name: exporter
          image: {{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port | default 9121 }}
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: {{ ternary "rediss" "redis" .Values.cache.tls.enabled }}://localhost:{{ .Values.cache.port }}
            {{- if .Values.cache.tls.enabled }}
            - name: REDIS_EXPORTER_SKIP_TLS_VERIFICATION
              value: "true"
            {{- end }}
            {{- if .Values.cache.password.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cache.password.secretName }}
                  key: {{ .Values.cache.password.key }}
            {{- end }}
          {{- with .Values.exporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "pleme-lib.containerSecurityContext" . | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pleme-lib.fullname" . }}-config
        {{- if include "pleme-cache.initDelivery" . }}
        - name: runtime-config
          emptyDir: {}
        {{- end }}
        {{- if .Values.cache.password.enabled }}
        - name: credentials
          secret:
            secretName: {{ .Values.cache.password.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.cache.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.cache.tls.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.cache.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          {{- include "pleme-lib.fluxcdPruneDisabled" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.cache.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.persistence.size | default "1Gi" }}
  {{- end }}
{{- end }}
