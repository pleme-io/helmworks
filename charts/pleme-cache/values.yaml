# pleme-cache default values
# Valkey/Redis cache with auto-generated redis.conf, optional exporter sidecar

enabled: true

# -- image: the upstream default keeps existing consumers (super-cache-ci, supacharge-cache) rendering.
# Distroless target: add `hardened-valkey` to the hardened-images catalog through substrate's mkHardenedImageSet
# (static valkey-server from nixpkgs, no shell, writablePaths /data, non-root uid 999, entrypoint valkey-server),
# publish it to the cluster registry, then override image.repository and image.tag with that pair.
# cache.password.delivery include needs no shell in the image; delivery init does.
image:
  repository: valkey/valkey
  tag: "8-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP

# -- Cache configuration
cache:
  # -- Redis/Valkey port
  port: 6379
  # -- Max memory allocation
  maxmemory: "256mb"
  # -- Eviction policy
  maxmemoryPolicy: allkeys-lru
  # -- Password configuration
  password:
    enabled: false
    # -- Existing Secret; the chart renders no password and no Secret
    secretName: ""
    # -- Secret key holding the bare password (client side, exporter, init delivery)
    key: password
    # -- include: valkey reads requirepass from includeKey, no shell in the image; init: a shell initContainer appends it
    delivery: include
    # -- Secret key holding the line "requirepass <password>" (include delivery)
    includeKey: valkey-auth.conf
  tls:
    enabled: false
    # -- Secret with tls.crt, tls.key and ca.crt
    secretName: ""
    # -- Require client certificates
    clientAuth: false
  # -- Persistence (AOF) configuration
  persistence:
    enabled: false
    # -- Storage size for AOF data
    size: 1Gi
    # -- fsync policy: always, everysec, no
    appendfsync: everysec
    # -- Storage class
    # storageClass: local-path
  # -- Extra redis.conf directives (raw string)
  # extraConfig: ""

# -- Redis exporter sidecar
exporter:
  enabled: true
  image:
    repository: oliver006/redis_exporter
    tag: "v1.62.0"
    pullPolicy: IfNotPresent
  port: 9121
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

command:
  - valkey-server

env: []
volumeMounts: []
volumes: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  livenessInitialDelay: 10
  livenessPeriod: 10
  livenessFailureThreshold: 3
  readinessInitialDelay: 5
  readinessPeriod: 5
  readinessFailureThreshold: 2

terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

monitoring:
  enabled: true
  port: "9121"
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true
  allowPrometheus: true
  allowDns: true
  additionalIngress: []
  additionalEgress: []

additionalLabels: {}
args: []

# Required by pleme-lib helpers
ports: []
startupProbe:
  enabled: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
configMaps: []
downwardApi:
  enabled: false
istio:
  enabled: false
podMonitor:
  enabled: false
prometheusRules:
  enabled: false
