apiVersion: v2
name: pleme-lareira
description: |
  Home-services library chart — layered specialization of pleme-lib for
  family / household / single-author homelab workloads. Adds Authentik
  SSO, Cloudflare Tunnel exposure, ZFS-backed persistence, restic
  CronJob backups, common alert rules, and a default-off convention so
  every consumer chart is opt-in.
type: library
version: 0.2.1
appVersion: "0.1.0"
keywords:
  - homelab
  - home-services
  - library
  - authentik
  - cloudflared
  - restic
  - zfs
  - breathability
home: https://github.com/pleme-io/helmworks
sources:
  - https://github.com/pleme-io/helmworks
dependencies:
  - name: pleme-lib
    version: ">=0.23.0"
    repository: "file://../pleme-lib"
