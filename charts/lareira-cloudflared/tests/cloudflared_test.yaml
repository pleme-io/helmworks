suite: lareira-cloudflared — the secure-tunnel-access cluster-side agent
templates:
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
tests:
  # ── The master enable knob (GitOps "bring it down without deleting") ──────────
  - it: renders NOTHING when disabled (the down-without-delete contract)
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Deployment when enabled
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: renders the ServiceAccount when enabled
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: pins the resource name via fullnameOverride (no drift across upgrades)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: cloudflared

  # ── The tunnel token: outbound-only auth, sourced from an external Secret ─────
  - it: sources TUNNEL_TOKEN from the configured secret (default name+key)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_TOKEN")].valueFrom.secretKeyRef.name
          value: cloudflared-token
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_TOKEN")].valueFrom.secretKeyRef.key
          value: token

  - it: honours an overridden token secret name + key
    template: templates/deployment.yaml
    set:
      tunnel:
        tokenSecretName: lookout-tunnel-token
        tokenSecretKey: connector
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_TOKEN")].valueFrom.secretKeyRef.name
          value: lookout-tunnel-token
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_TOKEN")].valueFrom.secretKeyRef.key
          value: connector

  # ── Metrics + transport ──────────────────────────────────────────────────────
  - it: wires TUNNEL_METRICS to the metrics address (also the /ready endpoint)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_METRICS")].value
          value: "0.0.0.0:2000"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 2000

  - it: sets the http2 transport (QUIC/UDP-7844 blocked on private subnets)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TUNNEL_TRANSPORT_PROTOCOL")].value
          value: http2

  - it: omits the transport override when unset (cloudflared default)
    template: templates/deployment.yaml
    set:
      tunnel:
        transportProtocol: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TUNNEL_TRANSPORT_PROTOCOL
          any: true

  # ── The run args (no self-update; image bumps come through GitOps) ───────────
  - it: runs `tunnel … run` with --no-autoupdate
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["tunnel", "--no-autoupdate", "run"]

  # ── Health: cloudflared's native /ready tunnel-connection probe ───────────────
  - it: probes /ready on the metrics port (tunnel connection health)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /ready
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  # ── Mesh integration (enxerto inject + the /ready skip-inbound for kubelet) ───
  - it: requests mesh injection + skips the metrics port for the plaintext probe
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["mesh.pleme.io/inject"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["enxerto.mesh.pleme.io/skip-inbound-ports"]
          value: "2000"

  - it: drops the mesh wiring when injection is off
    template: templates/deployment.yaml
    set:
      mesh:
        inject: false
        skipInboundPorts: ""
    asserts:
      - notExists:
          path: spec.template.metadata.labels["mesh.pleme.io/inject"]

  # ── Identity + footprint ──────────────────────────────────────────────────────
  - it: runs under its own ServiceAccount (SPIFFE identity)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: cloudflared

  - it: carries a bounded resource envelope (outbound agent, small)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: respects replicaCount + node placement overrides
    template: templates/deployment.yaml
    set:
      replicaCount: 2
      nodeSelector:
        role: tendril
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.nodeSelector.role
          value: tendril
