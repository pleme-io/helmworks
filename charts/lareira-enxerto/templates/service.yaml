apiVersion: v1
kind: Service
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pleme-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.webhook.port }}
      targetPort: webhook
      protocol: TCP
