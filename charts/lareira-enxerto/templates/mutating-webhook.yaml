apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    # cert-manager auto-rotates the caBundle in this MWC's webhooks[*]
    # whenever the underlying Certificate renews. Without this
    # annotation the caBundle would go stale at every renewal.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "pleme-lib.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: enxerto.mesh.pleme.io
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "pleme-lib.fullname" . }}
        path: /mutate
        port: {{ .Values.webhook.port }}
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ .Values.webhook.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        mesh.pleme.io/inject: "true"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.webhook.excludeNamespaces }}
            - {{ . | quote }}
            {{- end }}
    sideEffects: None
    admissionReviewVersions: ["v1"]
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
