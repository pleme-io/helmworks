{{- if and .Values.enabled .Values.webhook.certManager.enabled }}
{{- $svc := include "pleme-lib.fullname" . }}
{{- $selfsignedIssuerName := printf "%s-selfsigned" $svc }}
{{- /* Self-signed Issuer — only emitted when the operator hasn't
       referenced an existing Issuer/ClusterIssuer via
       webhook.certManager.issuerName. */}}
{{- if not .Values.webhook.certManager.issuerName }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $selfsignedIssuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
# Certificate for the webhook Service. cert-manager populates the
# Secret named `tls.secretName`; the MWC's caBundle is auto-injected
# via the cert-manager.io/inject-ca-from annotation on the
# MutatingWebhookConfiguration.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $svc }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  dnsNames:
    - {{ $svc }}.{{ .Release.Namespace }}.svc
    - {{ $svc }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: {{ .Values.webhook.certManager.issuerKind | default "Issuer" }}
    name: {{ .Values.webhook.certManager.issuerName | default $selfsignedIssuerName }}
{{- end }}
