apiVersion: v2
name: lareira-enxerto
description: |
  enxerto — pleme-io mesh sidecar-injection MutatingAdmissionWebhook.
  Watches pods labeled `mesh.pleme.io/inject=true` and grafts the
  aresta proxy sidecar + iptables-init initContainer + spiffe-csi
  volume + per-pod skip lists / probe rewrites. Wraps
  https://github.com/pleme-io/enxerto on top of pleme-lib.

  Fleet-wide infrastructure — install ONCE per cluster. Per-mesh
  declarations (ClusterSPIFFEIDs, peer allowlists, NetworkPolicy)
  live in `lareira-mesh-spec`.
type: application
version: 0.2.0
appVersion: "0.1.0"

keywords: [mesh, sidecar, admission-webhook, spiffe, mtls, lareira]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]
home: https://github.com/pleme-io/enxerto

dependencies:
  - name: pleme-lib
    version: "~0.13.0"
    repository: "file://../pleme-lib"
