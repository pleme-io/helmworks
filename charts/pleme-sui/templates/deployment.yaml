apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pleme-sui.fullname" . }}
  labels:
    {{- include "pleme-sui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.breathability.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pleme-sui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-sui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pleme-sui.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nixAgent.enabled }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: sui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.mode.agent.enabled .Values.mode.cache.enabled }}
          # Both agent + cache: start agent (it also serves cache)
          args:
            - agent
            - --nats-url={{ .Values.mode.agent.nats.url }}
            - --stream={{ .Values.mode.agent.nats.stream }}
            - --consumer={{ .Values.mode.agent.nats.consumer }}
            - --cache-url=http://localhost:5000
            - --cache-name={{ default "main" .Values.mode.cache.s3.bucket }}
            - --strategy={{ .Values.mode.agent.strategy }}
          {{- else if .Values.mode.cache.enabled }}
          # Cache-only mode
          args:
            - cache
            - serve
            - --listen={{ .Values.mode.cache.listen }}
            - --store-path={{ .Values.mode.cache.storePath }}
            {{- if .Values.mode.cache.backendConfig }}
            # A raw sui_cache::BackendConfig JSON (the {type:tiered,l1,l2,l3,
            # write_policy} shape) rendered into a ConfigMap + mounted below.
            # Takes precedence over --store-path (main.rs Serve: --backend-config
            # wins over the disk floor), switching the cache-only daemon onto the
            # tiered Redis L1 + Postgres L2 backend. Empty (default) keeps the
            # --store-path local floor — backward-compatible.
            - --backend-config=/etc/sui/backend.json
            {{- end }}
            {{- if .Values.mode.cache.signing.secretName }}
            # Sign every narinfo at ingest. Without this the daemon logs
            # "signing DISABLED … consumers cannot verify integrity" and serves
            # unsigned, so a client can only consume it with `?trusted=true` —
            # blanket trust in place of provenance. The value is a FILE PATH
            # (sui/src/main.rs `--signing-key`), read once at startup by
            # sui-cache's server, holding a standard Nix
            # `nix-store --generate-binary-cache-key` secret key
            # (`<name>:<base64 64-byte seed||pubkey>`); its public half goes
            # straight into consumers' trusted-public-keys.
            - --signing-key=/etc/sui/signing/{{ .Values.mode.cache.signing.secretKey }}
            {{- end }}
          {{- else if .Values.mode.agent.enabled }}
          # Agent-only mode
          args:
            - agent
            - --nats-url={{ .Values.mode.agent.nats.url }}
            - --stream={{ .Values.mode.agent.nats.stream }}
            - --consumer={{ .Values.mode.agent.nats.consumer }}
          {{- end }}
          env:
            - name: RUST_LOG
              value: info
            {{- if .Values.mode.cache.s3.bucket }}
            - name: AWS_REGION
              value: {{ .Values.mode.cache.s3.region }}
            {{- end }}
            {{- if .Values.mode.agent.enabled }}
            - name: XDG_CACHE_HOME
              value: /var/lib/sui
            {{- end }}
            {{- if .Values.nixAgent.enabled }}
            - name: NIX_CONFIG
              value: "experimental-features = nix-command flakes"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.nixAgent.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nix-store
              mountPath: /nix/var
            - name: tmp
              mountPath: /tmp
          {{- else }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.mode.agent.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: eval-cache
              mountPath: /var/lib/sui
          {{- else if .Values.mode.cache.enabled }}
          volumeMounts:
            - name: cache-store
              mountPath: {{ .Values.mode.cache.storePath }}
            {{- if .Values.mode.cache.backendConfig }}
            - name: backend-config
              mountPath: /etc/sui
              readOnly: true
            {{- end }}
            {{- if .Values.mode.cache.signing.secretName }}
            - name: signing-key
              mountPath: /etc/sui/signing
              readOnly: true
            {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.health.port }}
            failureThreshold: {{ .Values.health.startupFailureThreshold }}
            periodSeconds: {{ .Values.health.startupPeriodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.health.port }}
            periodSeconds: {{ .Values.health.livenessPeriodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.health.port }}
            periodSeconds: {{ .Values.health.readinessPeriodSeconds }}
      {{- if .Values.nixAgent.enabled }}
      volumes:
        - name: nix-store
          emptyDir:
            sizeLimit: {{ .Values.nixAgent.storageSize }}
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
      {{- else if .Values.mode.agent.enabled }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: eval-cache
          emptyDir:
            sizeLimit: 20Gi
      {{- else if .Values.mode.cache.enabled }}
      volumes:
        - name: cache-store
          emptyDir:
            sizeLimit: {{ .Values.mode.cache.storeSizeLimit }}
            {{- if .Values.mode.cache.storeMedium }}
            medium: {{ .Values.mode.cache.storeMedium }}
            {{- end }}
        {{- if .Values.mode.cache.backendConfig }}
        - name: backend-config
          configMap:
            name: {{ include "pleme-sui.fullname" . }}-backend-config
        {{- end }}
        {{- if .Values.mode.cache.signing.secretName }}
        - name: signing-key
          secret:
            secretName: {{ .Values.mode.cache.signing.secretName }}
        {{- end }}
      {{- end }}
