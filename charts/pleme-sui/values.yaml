# pleme-sui — unified Nix build + cache platform (ro)
# One binary: sui agent (NATS consumer) + sui cache serve (HTTP binary cache)

image:
  repository: ghcr.io/pleme-io/sui
  tag: amd64-latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

# --- sui modes ---
# Both agent and cache run in the same pod.
# sui agent consumes NATS builds; sui cache serves HTTP.
mode:
  # Build agent — consumes from NATS, builds, pushes to S3
  agent:
    enabled: true
    strategy: lockfile  # lockfile | eval | nix
    nats:
      url: "nats://nats.nats.svc:4222"
      stream: BUILD
      consumer: sui-agent
  # Cache server — serves nix binary cache HTTP protocol
  cache:
    enabled: true
    listen: "0.0.0.0:5000"
    priority: 40
    # backend: s3 | tiered | local
    #   s3     — single S3 store (legacy default)
    #   tiered — the super-cache-ci posture: Redis(L1) → Postgres(L2) → S3/local(L3),
    #            write-through, never-touch-durable-disk. Config-selected from the
    #            mounted TOML (sui `cache serve --backend-config`, resolve_serve_backend).
    #            REQUIRES an image built `--features tiered` (Redis + Postgres arms);
    #            a stock image returns CacheError::NotImplemented, never a silent
    #            disk fallback.
    backend: s3
    s3:
      bucket: ""
      region: us-east-1
      endpoint: ""
    signing:
      secretName: ""
      secretKey: signing-key
    # --- tiered super-cache (used only when backend: tiered) ---
    tiered:
      # Where the BackendConfig TOML is mounted (key: backend.toml).
      mountPath: /etc/sui/tiered
      # Provide the tiered BackendConfig as inline TOML -> this chart renders the
      # ConfigMap `{fullname}-tiered`. See sui contrib/ground-truth/tiered-backend.toml.
      backendConfigToml: ""
      # OR reference an externally-managed ConfigMap (key: backend.toml). Takes
      # precedence over the inline render when set (lets a composing chart own it).
      configMapName: ""
      # OR source the backend.toml from a Secret (key: backend.toml) — use this
      # when the DSN carries a password (Postgres L2), so no plaintext credential
      # lands in a ConfigMap. Highest precedence.
      secretName: ""
      # The L3 local floor. When the tiered resolver's L3 is a local path AND the
      # container runs readOnlyRootFilesystem, back it with an emptyDir so the
      # floor path is writable (own writes never reach it on a never-touch-disk node).
      l3:
        emptyDir: true
        path: /var/cache/sui-l3
        sizeLimit: 20Gi

# --- Resources ---
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# --- Ports ---
ports:
  - name: cache
    containerPort: 5000
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: cache
      port: 80
      targetPort: cache

# --- Health ---
health:
  path: /nix-cache-info
  port: cache
  startupFailureThreshold: 5
  startupPeriodSeconds: 10
  livenessPeriodSeconds: 30
  readinessPeriodSeconds: 10

# --- Breathability (KEDA zero-scale + HPA serving) ---
breathability:
  enabled: true
  targetKind: Deployment
  min: 0
  max: 4
  cooldown: 300
  pollingInterval: 15
  trigger:
    type: nats-jetstream
    nats:
      serverURL: "nats://nats.nats.svc:4222"
      stream: BUILD
      consumer: sui-agent
      lagThreshold: "1"
      activationLagThreshold: "0"
  hpa:
    enabled: true
    min: 1
    max: 3
    targetCPU: 70

# --- Delivery ---
delivery:
  enabled: true
  tier: durable
  nats:
    url: "nats://nats.nats.svc:4222"
    stream: BUILD
    consumer: sui-agent

# --- Alerts ---
alerts:
  enabled: true
  podRestarting:
    enabled: true
    threshold: 3
    severity: critical
  highMemory:
    enabled: true
    threshold: 85
    severity: warning

# --- PDB ---
pdb:
  enabled: true
  minAvailable: 1

# --- Build sandbox (never-touch-durable-disk) ---
# The tmpfs RAMDISK the eval+build sandbox writes to. emptyDir{medium:Memory}.
# When enabled, SUI_BUILD_DIR + TMPDIR point at mountPath so LocalBuilder keeps
# eval + build off durable disk (the super-cache-ci invariant). Off by default;
# turn on for a build-capable daemon (e.g. the camelot super-cache).
sandbox:
  ramdisk:
    enabled: false
    mountPath: /build
    sizeLimit: 8Gi
    setTmpdir: true

# --- Writable state dir (cache-serve under readOnlyRootFilesystem) ---
# In cache-only mode the daemon still needs a writable XDG_CACHE_HOME/HOME; this
# emptyDir provides it without relaxing readOnlyRootFilesystem.
state:
  sizeLimit: 2Gi

# --- Nix build agent ---
# Phase 1: sui shells out to `nix build`. Needs writable /nix/store, root user.
# Phase 2 (sui-eval + sui-build): can re-lock to nonRoot.
nixAgent:
  enabled: false  # override in cluster patch when agent mode runs nix
  storageSize: 50Gi  # PVC for /nix/store (persists built paths between restarts)

# --- Security ---
# When nixAgent.enabled, podSecurityContext/securityContext are overridden
# in the deployment template to allow nix builds.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# --- Scheduling ---
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
