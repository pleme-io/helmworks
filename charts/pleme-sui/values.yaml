# pleme-sui — unified Nix build + cache platform (ro)
# One binary: sui agent (NATS consumer) + sui cache serve (HTTP binary cache)

image:
  repository: ghcr.io/pleme-io/sui
  tag: amd64-latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

# --- sui modes ---
# Both agent and cache run in the same pod.
# sui agent consumes NATS builds; sui cache serves HTTP.
mode:
  # Build agent — consumes from NATS, builds, pushes to S3
  agent:
    enabled: true
    strategy: lockfile  # lockfile | eval | nix
    nats:
      url: "nats://nats.nats.svc:4222"
      stream: BUILD
      consumer: sui-agent
  # Cache server — serves nix binary cache HTTP protocol
  cache:
    enabled: true
    listen: "0.0.0.0:5000"
    priority: 40
    backend: s3
    s3:
      bucket: ""
      region: us-east-1
      endpoint: ""
    signing:
      secretName: ""
      secretKey: signing-key
    # Cache-only (non-agent) deployment mode's on-disk store. Without
    # this, `sui cache serve` writes into the container's unmanaged
    # root filesystem — no sizing, no eviction floor. Consumed by
    # templates/deployment.yaml's cache-only args + cache-store volume.
    storePath: "/var/lib/sui/cache"
    storeSizeLimit: "20Gi"
    # emptyDir.medium override -- "" (default) is disk-backed, node-local
    # storage (the original, backward-compatible shape). "Memory" makes the
    # cache-store volume a tmpfs RAM disk: substitute/save round-trips avoid
    # disk I/O entirely, at the cost of consuming node RAM equal to whatever
    # is actually written (kubelet counts it against the pod's memory limit,
    # capped by storeSizeLimit above as the volume's own ceiling). Size
    # storeSizeLimit conservatively when enabling this -- it must fit
    # comfortably under the node's real allocatable memory alongside every
    # other resident workload, not just under the raw instance RAM.
    storeMedium: ""

# --- Extra environment ---
# Additional container env vars appended to the fixed set. The super-cache-ci
# umbrella uses this to inject SUI_CACHE_BACKEND_CONFIG (the JSON-encoded
# sui_cache::BackendConfig the serve daemon fronts — the Redis L1 + Postgres L2
# tiered posture). Standard k8s EnvVar list shape (name/value or valueFrom).
extraEnv: []
# Extra envFrom sources (configMapRef / secretRef). Use for a
# cofre/ESO-materialized Secret carrying the backend config or credentials.
extraEnvFrom: []

# --- Resources ---
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# breathe resource-homeostasis bands (breathe.pleme.io) — carves
# resources.limits.{memory,cpu} to hold this Deployment at a target
# utilization band. Shadow-first (dryRun: true): the controller
# decides + reports but never mutates until an operator flips it live
# via the breathe MCP, matching every other pleme-microservice
# consumer's safety posture. See helmworks/charts/pleme-lib/templates/
# _breatheband.tpl for the full field set.
breathe:
  enabled: true
  memory:
    dryRun: true
    disruptionPolicy: restartFreeOnly
  cpu:
    enabled: true
    dryRun: true
    disruptionPolicy: restartFreeOnly

# --- Ports ---
ports:
  - name: cache
    containerPort: 5000
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: cache
      port: 80
      targetPort: cache

# --- Health ---
health:
  path: /nix-cache-info
  port: cache
  startupFailureThreshold: 5
  startupPeriodSeconds: 10
  livenessPeriodSeconds: 30
  readinessPeriodSeconds: 10

# --- Breathability (KEDA zero-scale + HPA serving) ---
breathability:
  enabled: true
  targetKind: Deployment
  min: 0
  max: 4
  cooldown: 300
  pollingInterval: 15
  trigger:
    type: nats-jetstream
    nats:
      serverURL: "nats://nats.nats.svc:4222"
      stream: BUILD
      consumer: sui-agent
      lagThreshold: "1"
      activationLagThreshold: "0"
  hpa:
    enabled: true
    min: 1
    max: 3
    targetCPU: 70

# --- Delivery ---
delivery:
  enabled: true
  tier: durable
  nats:
    url: "nats://nats.nats.svc:4222"
    stream: BUILD
    consumer: sui-agent

# --- Alerts ---
alerts:
  enabled: true
  podRestarting:
    enabled: true
    threshold: 3
    severity: critical
  highMemory:
    enabled: true
    threshold: 85
    severity: warning

# --- PDB ---
pdb:
  enabled: true
  minAvailable: 1

# --- Nix build agent ---
# Phase 1: sui shells out to `nix build`. Needs writable /nix/store, root user.
# Phase 2 (sui-eval + sui-build): can re-lock to nonRoot.
nixAgent:
  enabled: false  # override in cluster patch when agent mode runs nix
  storageSize: 50Gi  # PVC for /nix/store (persists built paths between restarts)

# --- Security ---
# When nixAgent.enabled, podSecurityContext/securityContext are overridden
# in the deployment template to allow nix builds.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# --- Scheduling ---
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
