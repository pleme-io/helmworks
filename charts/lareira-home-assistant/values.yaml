# Home Assistant — smart-home automation hub.

enabled: false

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: "2024.12.5"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true

ports:
  - name: http
    containerPort: 8123
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP

env:
  - name: TZ
    value: America/New_York

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

persistence:
  enabled: false
  storageClass: local-path
  size: 5Gi
  mountPath: /config
  zfsDataset: pool/data

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: ha.rio.lan
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
    issuer: selfsigned
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Home Assistant uses websockets heavily
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

authentik:
  enabled: false

cloudflared:
  expose: false
  hostname: ""

backup:
  enabled: false
  schedule: "0 3 * * *"
  paths: ["/config"]
  repositoryEnvFrom:
    secretName: ""
  retention:
    daily: 7
    weekly: 4
    monthly: 6
    yearly: 1
  image:
    repository: restic/restic
    tag: "0.18.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

monitoring:
  enabled: false

prometheusRules:
  enabled: false

alerts:
  common:
    enabled: false
  ntfyTopic: rio-ha

networkPolicy:
  enabled: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
