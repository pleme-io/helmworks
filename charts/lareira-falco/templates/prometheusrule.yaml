{{- if .Values.enabled }}
{{- if and .Values.observability .Values.observability.prometheusRule .Values.observability.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lareira-falco.fullname" . }}
  labels:
    {{- include "lareira-falco.labels" . | nindent 4 }}
    role: alert-rules
spec:
  groups:
    - name: lareira-falco
      interval: 30s
      rules:
        {{- range .Values.observability.prometheusRule.rules }}
        - alert: {{ .alert }}
          expr: {{ .expr | toYaml | nindent 12 }}
          for: {{ .for | default "0m" }}
          labels: {{ toYaml .labels | nindent 12 }}
          annotations: {{ toYaml .annotations | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
