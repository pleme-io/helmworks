apiVersion: v2
name: pleme-admission-policies
description: Cluster-side admission policies (Kyverno ClusterPolicy + Gatekeeper Constraints) auto-generated from the declared compliance overlay set. Closes the symmetric proof loop — chart-time validators and cluster-time admission both flow from the same overlay declaration.
type: application
version: 0.1.0
appVersion: "1.0.0"
# (No oci-auto-release opt-out: the chart declares compliance.workload.kind=policy
# so pleme-lib's workload-only validators skip it — it lints + publishes like any
# other chart.)
dependencies:
  - name: pleme-lib
    version: ">=0.18.1 <0.19.0"
    repository: "file://../pleme-lib"
