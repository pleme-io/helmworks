# Calibre-Web — web UI for an existing Calibre library.
# Default expects a Calibre `metadata.db` at /books (hostPath mount).

enabled: false

image:
  repository: lscr.io/linuxserver/calibre-web
  tag: "0.6.24"
  pullPolicy: IfNotPresent

serviceAccount: { create: true }

ports:
  - name: http
    containerPort: 8083
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP

env:
  - name: TZ
    value: America/New_York
  - name: PUID
    value: "1000"
  - name: PGID
    value: "1000"

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 1000m, memory: 512Mi }

persistence:
  enabled: false
  storageClass: local-path
  size: 1Gi
  mountPath: /config
  zfsDataset: pool/data

volumes:
  - name: books
    hostPath:
      path: /srv/pool/media/books
      type: DirectoryOrCreate

volumeMounts:
  - name: books
    mountPath: /books

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: books.rio.lan
      paths:
        - path: /
          pathType: Prefix
  tls: { enabled: false, issuer: selfsigned }

authentik: { enabled: false }
cloudflared: { expose: false, hostname: "" }

backup:
  enabled: false
  schedule: "0 4 * * 0"
  paths: ["/config"]
  repositoryEnvFrom: { secretName: "" }
  retention: { daily: 0, weekly: 4, monthly: 6, yearly: 1 }
  image: { repository: restic/restic, tag: "0.18.0", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

monitoring: { enabled: false }
prometheusRules: { enabled: false }
alerts: { common: { enabled: false }, ntfyTopic: rio-calibre-web }
networkPolicy: { enabled: true }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }
