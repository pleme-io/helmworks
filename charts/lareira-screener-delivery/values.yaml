# screener-delivery — custom Rust service that:
#   1. Receives a request: { source_path, recipient_email, expires }
#   2. Burns recipient_email into the bottom-left of the video via ffmpeg
#   3. Uploads to MinIO / S3
#   4. Returns a time-limited presigned URL
#
# The Rust binary is intentionally a separate repo (TBD: scaffold via
# repo-forge with archetype rust-microservice). This chart pins the image
# tag once that repo publishes ghcr.io/pleme-io/screener-delivery:<tag>.
#
# Until the binary exists, the chart references a placeholder image that
# helm-lints and -templates cleanly but won't run.
#
# Required Secret (SOPS-rendered): screener-delivery-env with
#   S3_ACCESS_KEY=...
#   S3_SECRET_KEY=...
#   S3_ENDPOINT=...
#   S3_BUCKET=...
#   SIGNING_SECRET=...

enabled: false

image:
  repository: ghcr.io/pleme-io/screener-delivery
  tag: "0.1.0-placeholder"
  pullPolicy: IfNotPresent

serviceAccount: { create: true }

ports:
  - { name: http, containerPort: 8080, protocol: TCP }

service:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }

envFrom:
  - secretRef: { name: screener-delivery-env, optional: true }

env:
  - { name: RUST_LOG, value: info }
  - { name: SCREENER_PORT, value: "8080" }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 4000m, memory: 1Gi }

# Reads source media from the projects share (read-only); writes proxies
# to scratch volume.
persistence:
  enabled: false
  storageClass: local-path
  size: 5Gi
  mountPath: /scratch
  zfsDataset: pool/data

volumes:
  - name: source
    hostPath: { path: /srv/pool/media/projects, type: Directory }
volumeMounts:
  - { name: source, mountPath: /source, readOnly: true }

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: screeners.rio.lan
      paths: [ { path: /, pathType: Prefix } ]
  tls: { enabled: false, issuer: selfsigned }
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

authentik: { enabled: false }
cloudflared:
  # Screener URLs are inherently public — Cloudflare Tunnel exposure is
  # the typical path. Requires presigned-URL signing in the service.
  expose: false
  hostname: ""

backup: { enabled: false }   # stateless; output is in S3

monitoring: { enabled: false }   # /metrics arrives once the Rust binary lands
prometheusRules: { enabled: false }
alerts: { common: { enabled: false }, ntfyTopic: rio-screener-delivery }
networkPolicy: { enabled: true }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
