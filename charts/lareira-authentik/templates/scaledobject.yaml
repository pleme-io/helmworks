{{/*
KEDA HTTP ScaledObject — scales authentik-server 0→N→0 on inbound auth
requests via the KEDA HTTP add-on's interceptor.

Only renders when breathability.enabled AND breathability.http.enabled.
Default off; existing v0.x values clusters keep their always-on
authentik server.
*/}}
{{- if .Values.enabled }}
{{- if and .Values.breathability .Values.breathability.enabled .Values.breathability.http.enabled }}
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ include "lareira-authentik.fullname" . }}-server
  labels:
    {{- include "lareira-authentik.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  pathPrefixes:
    - /
  scaleTargetRef:
    name: {{ printf "%s-authentik-server" .Release.Name }}
    kind: Deployment
    apiVersion: apps/v1
    service: {{ printf "%s-authentik-server" .Release.Name }}
    port: 80
  replicas:
    min: {{ .Values.breathability.scaling.minReplicas }}
    max: {{ .Values.breathability.scaling.maxReplicas }}
  scaledownPeriod: {{ .Values.breathability.scaling.cooldownPeriod }}
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: {{ .Values.breathability.scaling.targetPendingRequests }}
      window: 30s
{{- end }}
{{- end }}
