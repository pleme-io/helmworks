apiVersion: apps/v1
kind: Deployment
metadata:
  name: lava-operator
  labels:
    app: lava-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lava-operator
  template:
    metadata:
      labels:
        app: lava-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.providerPlugins }}
      {{- if .enabled }}
      initContainers:
        {{- range .images }}
        - name: install-{{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          volumeMounts:
            - name: provider-plugins
              mountPath: /plugins
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: lava-operator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
          env:
            - name: LAVA_OPERATOR_OUTCOME_CHAIN_PATH
              value: {{ .Values.outcomeChain.sink.path | quote }}
            - name: LAVA_OPERATOR_DRIFT_INTERVAL
              value: {{ .Values.drift.scanIntervalSeconds | quote }}
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            - name: LAVA_OPERATOR_CLUSTER
              value: "rio"
            {{- if .Values.providerPlugins.enabled }}
            - name: LAVA_OPERATOR_PROVIDER_PLUGIN_DIR
              value: {{ .Values.providerPlugins.mountPath | quote }}
            - name: MAGMA_PROVIDER_DIR
              value: {{ .Values.providerPlugins.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          volumeMounts:
            - name: chains
              mountPath: /var/lib/lava-operator/chains
            {{- if .Values.providerPlugins.enabled }}
            - name: provider-plugins
              mountPath: {{ .Values.providerPlugins.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: chains
          emptyDir: {}
        {{- if .Values.providerPlugins.enabled }}
        - name: provider-plugins
          emptyDir: {}
        {{- end }}
