replicaCount: 1
image:
  repository: ghcr.io/pleme-io/lava-operator
  tag: latest
  pullPolicy: Always
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
executor:
  embedded:
    enabled: true
  remote:
    enabled: false
    endpoint: ''
outcomeChain:
  sink:
    kind: filesystem
    path: /var/lib/lava-operator/chains
  signing:
    kind: ed25519
    secretRef: lava-operator-signing-key
drift:
  scanIntervalSeconds: 60
  cosmeticAttributePrefixes:
  - tags.
  - labels.
anomaly:
  defaultPolicy:
    cosmetic: Alert
    functional: AutoCorrect
    critical: RequireApproval
viggy:
  tickBudgetMs: 30000
  requeueOnFailureSeconds: 60
serviceAccount:
  create: true
  name: lava-operator
metrics:
  enabled: true
  port: 9090
logging:
  level: info
  format: json
extraEnv: []
extraEnvFrom: []
# Terraform provider binaries the operator's embedded magma engine needs
# at runtime (spawned via gRPC + PATH lookup). Each entry is a thin OCI
# image whose entrypoint copies its binary into the shared emptyDir
# volume mounted at `providerPlugins.mountPath`. Disabled by default so
# the plain (drift-detection-only) install path stays a no-op — turn it
# on when act-beat apply support is wanted end-to-end.
providerPlugins:
  enabled: false
  mountPath: /var/lib/lava-operator/plugins
  images: []
  # Example (uncomment in the HelmRelease values):
  #   images:
  #     - name: discord
  #       image: ghcr.io/pleme-io/lava-discord-provider:v2.7.0
nodeSelector: {}
tolerations: null
affinity: {}
