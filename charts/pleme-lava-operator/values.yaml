replicaCount: 1
image:
  repository: ghcr.io/pleme-io/lava-operator
  tag: v0.5.0
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
executor:
  embedded:
    enabled: true
  remote:
    enabled: false
    endpoint: ''
outcomeChain:
  sink:
    kind: filesystem
    path: /var/lib/lava-operator/chains
  signing:
    kind: ed25519
    secretRef: lava-operator-signing-key
drift:
  scanIntervalSeconds: 60
  cosmeticAttributePrefixes:
  - tags.
  - labels.
anomaly:
  defaultPolicy:
    cosmetic: Alert
    functional: AutoCorrect
    critical: RequireApproval
viggy:
  tickBudgetMs: 30000
  requeueOnFailureSeconds: 60
serviceAccount:
  create: true
  name: lava-operator
metrics:
  enabled: true
  port: 9090
logging:
  level: info
  format: json
nodeSelector: {}
tolerations: null
affinity: {}
