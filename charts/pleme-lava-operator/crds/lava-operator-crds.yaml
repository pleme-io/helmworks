apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lavaarchitectures.lava.pleme.io
spec:
  group: lava.pleme.io
  names:
    categories: []
    kind: LavaArchitecture
    plural: lavaarchitectures
    shortNames: []
    singular: lavaarchitecture
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for LavaArchitectureSpecCR via `CustomResource`
        properties:
          spec:
            description: kube-rs typed shape. Mirrors [`crate::LavaArchitectureSpec`] but carries the `#[derive(CustomResource)]` plumbing kube-rs needs to dispatch the watch + patch loop.
            properties:
              bindings:
                additionalProperties:
                  type: string
                default: {}
                type: object
              engine:
                default: embedded
                type: string
              gate:
                nullable: true
                type: string
              source:
                description: |-
                  Flat source descriptor — `inline`, `name`, and the three git fields are all optional + the consumer picks the populated one. Flat shape avoids kube-rs JsonSchema discriminated-union pitfalls + matches the YAML authoring shape operators expect:

                  source: inline: | (deflava-architecture ...)

                  source: name: aws-vpc-network

                  source: url:  https://github.com/... rev:  main path: infra/vpc.tlisp
                properties:
                  inline:
                    nullable: true
                    type: string
                  name:
                    nullable: true
                    type: string
                  path:
                    nullable: true
                    type: string
                  rev:
                    nullable: true
                    type: string
                  url:
                    nullable: true
                    type: string
                type: object
            required:
            - source
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              lastAppliedAt:
                nullable: true
                type: string
              lastSynthesizedHash:
                nullable: true
                type: string
              phase:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: LavaArchitecture
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationpolicies.lava.pleme.io
spec:
  group: lava.pleme.io
  names:
    categories: []
    kind: RemediationPolicy
    plural: remediationpolicies
    shortNames: []
    singular: remediationpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RemediationPolicySpec via `CustomResource`
        properties:
          spec:
            description: Typed kube-rs CRD for [`lava_anomaly::RemediationPolicy`]. Operators attach one of these per cluster (or per environment) and reference it from `LavaArchitectureSpecCR.remediationPolicyRef`.
            properties:
              cosmetic:
                type: string
              critical:
                type: string
              escalation:
                nullable: true
                properties:
                  tiers:
                    items:
                      properties:
                        target:
                          description: Flat notify-target shape — `kind` is a free string + remaining fields are optional. The lava-anomaly typed enum (`Slack | Ntfy | Pagerduty | Email | Webhook | Custom`) is reconstructed at use-site. Flat layout keeps the JsonSchema derivation simple (kube-rs apiextensions/v1 rejects tagged-enum CRDs with per-variant property schemas).
                          properties:
                            address:
                              nullable: true
                              type: string
                            kind:
                              description: '`slack` | `ntfy` | `pagerduty` | `email` | `webhook`.'
                              type: string
                            secretRef:
                              nullable: true
                              type: string
                            serviceKeySecretRef:
                              nullable: true
                              type: string
                            topic:
                              nullable: true
                              type: string
                            url:
                              nullable: true
                              type: string
                            webhookSecretRef:
                              nullable: true
                              type: string
                          required:
                          - kind
                          type: object
                        waitBeforeNext:
                          default: PT15M
                          description: ISO-8601 duration string (`PT15M`, `PT1H`) — parsed at use site. Kept as String here so the CRD schema stays simple + JsonSchema-derivable without a chrono::Duration crater.
                          type: string
                      required:
                      - target
                      type: object
                    type: array
                required:
                - tiers
                type: object
              functional:
                type: string
            required:
            - cosmetic
            - critical
            - functional
            type: object
        required:
        - spec
        title: RemediationPolicy
        type: object
    served: true
    storage: true
    subresources: {}
---
