apiVersion: v2
name: lareira-tatara-runtime
description: |
  tatara-lisp evaluator for pleme-io clusters. Runs `tatara-lisp-script`
  as a service that compiles and submits Lisp programs published to
  openclaw → ComputeUnit CRs picked up by the wasm-operator.

  Default-OFF; depends on lareira-wasm-platform + lareira-openclaw.
type: application
version: 0.1.0
appVersion: "0.1.0"

keywords: [tatara-lisp, lisp, compiler, lareira]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]

dependencies:
  - name: pleme-lib
    version: "~0.5.0"
    repository: "file://../pleme-lib"
