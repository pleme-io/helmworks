{{- if .Values.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lareira-tatara-runtime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lareira-tatara-runtime.labels" . | nindent 4 }}
{{- if .Values.autoSubmit.enabled }}
---
# When auto-submit is on, the runtime needs to create ComputeUnit CRs
# in the configured namespace. Scoped Role + RoleBinding rather than
# cluster-wide RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lareira-tatara-runtime.fullname" . }}-submit
  namespace: {{ .Values.autoSubmit.computeUnitNamespace }}
  labels: {{- include "lareira-tatara-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: ["wasm.pleme.io"]
    resources: [computeunits]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lareira-tatara-runtime.fullname" . }}-submit
  namespace: {{ .Values.autoSubmit.computeUnitNamespace }}
  labels: {{- include "lareira-tatara-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lareira-tatara-runtime.fullname" . }}-submit
subjects:
  - kind: ServiceAccount
    name: {{ include "lareira-tatara-runtime.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range $name, $cfg := .Values.persistence }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lareira-tatara-runtime.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "lareira-tatara-runtime.labels" $ | nindent 4 }}
  {{- with $cfg.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  storageClassName: {{ $cfg.storageClass }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $cfg.size }}
{{- end }}
{{- end }}
{{- end }}
