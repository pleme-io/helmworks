keywords: [registry, artifacts, attestation, blake3, lareira]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]

dependencies:
  - name: pleme-lib
    version: "~0.13.0"
    repository: "file://../pleme-lib"
