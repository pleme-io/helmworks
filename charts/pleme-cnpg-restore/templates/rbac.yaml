{{- if .Values.enabled }}
{{- include "pleme-cnpg-restore.requireClusterName" . }}
---
# Role + RoleBinding granting the per-cluster CNPG instance
# ServiceAccount read access to the WAL-archive credentials Secret.
#
# CNPG creates a ServiceAccount named after the Cluster (here:
# .Values.clusterName) for every instance pod. The instance manager
# uses that SA to fetch the s3 credentials Secret referenced under
# Cluster.spec.bootstrap.recovery.externalClusters[].barmanObjectStore
# .s3Credentials. Without this Role + RoleBinding, the instance
# manager logs:
#
#   secrets "<credentials-secret-name>" is forbidden:
#   User "system:serviceaccount:<ns>:<clusterName>"
#   cannot get resource "secrets" ...
#
# and the recovery never starts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.clusterName }}-wal-archive-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-cnpg-restore.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.walArchive.credentialsSecretName }}
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.clusterName }}-wal-archive-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-cnpg-restore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.clusterName }}-wal-archive-reader
subjects:
  - kind: ServiceAccount
    # CNPG names the instance SA after the Cluster CR.
    name: {{ .Values.clusterName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
