apiVersion: v2
name: lareira-ingress-nginx
description: |
  ingress-nginx for pleme-io home-edge clusters. Wraps the upstream
  ingress-nginx/ingress-nginx chart with single-node K3s NodePort
  defaults, ServiceMonitor + PrometheusRule alerts.
type: application
version: 0.1.0
appVersion: "4.13.0"

keywords: [ingress, nginx, lareira]
maintainers:
  - name: drzzln
    email: drzzln@protonmail.com

dependencies:
  - name: pleme-lib
    version: "~0.10.0"
    repository: "file://../pleme-lib"
  - name: ingress-nginx
    version: "4.13.0"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingressNginx.enabled
