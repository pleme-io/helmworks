# lareira-openclaw-web — minimal nginx-served SPA chart.

replicaCount: 1

image:
  repository: ghcr.io/pleme-io/openclaw-web
  tag: amd64-latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Runtime configuration injected as /config.js (loaded before main.tsx).
# Fed to window.__OPENCLAW_RUNTIME_CONFIG__.
runtimeConfig:
  cartorioUrl: "https://cartorio.dev.use1.quero.cloud"

# Hanabi server config (mounted at /etc/hanabi/config.yaml).
# Static-only — no BFF / no GraphQL / no auth / no DB.
hanabiConfig: |
  environment: production
  security:
    csp:
      api_domains: []
      ws_domains: []
      additional_connect_src:
        - https://cartorio.dev.use1.quero.cloud
  server:
    listen_address: "0.0.0.0"
    port: 80
    health_port: 8080
    worker_threads: 0
    service_name: openclaw-web
  static:
    root: /app/static
    spa_fallback: true
    spa_fallback_path: index.html
  features:
    enable_bff: false
    enable_metrics: true
    enable_detailed_health_checks: true
    enable_bug_reports: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: "openclaw.dev.use1.quero.cloud"
  tls:
    enabled: true
    issuer: letsencrypt-prod
    secretName: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
