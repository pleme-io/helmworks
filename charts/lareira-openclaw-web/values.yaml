# lareira-openclaw-web — minimal nginx-served SPA chart.

replicaCount: 1

image:
  repository: ghcr.io/pleme-io/openclaw-web
  tag: amd64-latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Runtime configuration injected as /config.js (loaded before main.tsx).
# Fed to window.__OPENCLAW_RUNTIME_CONFIG__.
runtimeConfig:
  cartorioUrl: "https://cartorio.dev.use1.quero.cloud"

# Hanabi server config (mounted at /etc/hanabi/config.yaml).
# Static-only — features.enable_bff: false + bff.mode: disabled keep
# hanabi from spinning up GraphQL / federation / WebSocket subsystems.
# Field names match hanabi/src/config/server.rs (http_port, static_dir,
# bind_address) — `port`/`listen_address`/`static.root` are NOT the
# real keys and serde defaults silently produce port 0 → fatal at boot.
hanabiConfig: |
  environment: production
  security:
    csp:
      api_domains: []
      ws_domains: []
      additional_connect_src:
        - https://cartorio.dev.use1.quero.cloud
    cors:
      allowed_origins: []
      allow_credentials: false
      max_age_secs: 3600
    hsts:
      max_age: 31536000
      include_subdomains: true
      preload: false
    headers:
      x_frame_options: "DENY"
      referrer_policy: "strict-origin-when-cross-origin"
      permissions_policy: "geolocation=(), microphone=(), camera=(), payment=()"
  preflight:
    critical_files:
      - index.html
      - config.js
    verify_react_bundle: true
    index_html_path: index.html
  api:
    graphql_url: /graphql
    ws_url: /graphql
  bff:
    mode: disabled
  server:
    static_dir: /app/static
    http_port: 80
    health_port: 8080
    bind_address: "0.0.0.0"
    service_name: openclaw-web
    service_version: "0.2.0"
    worker_threads: 0
  compression:
    enable_brotli: true
    enable_gzip: true
    min_compress_size: 1024
  cache:
    enable_cache_headers: true
    static_max_age: 31536000
    html_max_age: 3600
  health:
    disk_warn_threshold: 10.0
    disk_critical_threshold: 5.0
    memory_warn_threshold: 10.0
    memory_critical_threshold: 5.0
  metrics:
    enabled: false
  logging:
    format: json
    level: info
  features:
    enable_bff: false
    enable_metrics: false
    enable_detailed_health_checks: true
    enable_bug_reports: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: "openclaw.dev.use1.quero.cloud"
  tls:
    enabled: true
    issuer: letsencrypt-prod
    secretName: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
