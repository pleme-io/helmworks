apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw-web.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw-web.labels" . | nindent 4 }}
data:
  # Lilitu pattern: hanabi preflight checks for /app/static/env.js by
  # default. Loaded as /env.js by index.html before main.tsx; sets
  # window.__OPENCLAW_RUNTIME_CONFIG__ which shared/config.ts reads.
  env.js: |
    window.__OPENCLAW_RUNTIME_CONFIG__ = {{ toJson .Values.runtimeConfig }};
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw-web.fullname" . }}-hanabi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw-web.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.hanabiConfig | indent 4 }}
