apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openclaw-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openclaw-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openclaw-web.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the deployment when runtime config changes.
        checksum/runtime-config: {{ toJson .Values.runtimeConfig | sha256sum }}
    spec:
      # Phase E1 — full PSS Restricted hardening (audit gap closure).
      # Runtime is hanabi (Rust BFF, /nix/store/.../bin/hanabi) serving
      # HTTP directly — NO nginx, no auxiliary processes. Image's USER
      # directive is `web` (numeric uid baked in by the substrate
      # rust-service flake builder); we don't override it, but
      # runAsNonRoot=true is asserted at admission time.
      serviceAccountName: {{ include "openclaw-web.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openclaw-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Hanabi uses tracing-subscriber; an emptyDir tmp keeps the
            # rest of the rootfs read-only without breaking ephemeral
            # writes (e.g. tokio runtime tempfiles).
            - name: tmp
              mountPath: /tmp
            # Lilitu pattern — env.js mounted into hanabi's static root.
            # Hanabi's preflight check uses 'env.js' as a critical_files
            # default; matching that name avoids any preflight override.
            - name: env-config
              mountPath: /app/static/env.js
              subPath: env.js
              readOnly: true
            # Hanabi's own config (server, ports, static_dir, etc.).
            - name: hanabi-config
              mountPath: /etc/hanabi/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: env-config
          configMap:
            name: {{ include "openclaw-web.fullname" . }}-env
            items:
              - key: env.js
                path: env.js
        - name: hanabi-config
          configMap:
            name: {{ include "openclaw-web.fullname" . }}-hanabi
            items:
              - key: config.yaml
                path: config.yaml
