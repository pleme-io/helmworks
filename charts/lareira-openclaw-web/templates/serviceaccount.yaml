apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openclaw-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw-web.labels" . | nindent 4 }}
# Phase E1 — least-privilege ServiceAccount for openclaw-web.
# The pod is a static-asset server; it talks to no K8s API. Token
# auto-mount is disabled at pod-spec level (Phase E1 deployment
# patch). This SA exists only so the chart can avoid the `default`
# ServiceAccount per CIS Kubernetes Benchmark §5.1.5.
automountServiceAccountToken: false
