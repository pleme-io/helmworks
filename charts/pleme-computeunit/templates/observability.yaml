{{- if .Values.enabled }}
{{- if and .Values.observability .Values.observability.serviceMonitor .Values.observability.serviceMonitor.enabled .Values.trigger.service }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pleme-computeunit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-computeunit.labels" . | nindent 4 }}
    release: victoria-metrics-k8s-stack
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      pleme.pleme.io/computeunit: {{ include "pleme-computeunit.fullname" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ default "30s" .Values.observability.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.observability .Values.observability.prometheusRule .Values.observability.prometheusRule.enabled .Values.observability.prometheusRule.rules }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pleme-computeunit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-computeunit.labels" . | nindent 4 }}
    role: alert-rules
spec:
  groups:
    - name: {{ include "pleme-computeunit.fullname" . }}
      interval: 30s
      rules:
        {{- range .Values.observability.prometheusRule.rules }}
        - alert: {{ .alert }}
          expr: {{ .expr | toYaml | nindent 12 }}
          for: {{ .for | default "0m" }}
          labels: {{ toYaml .labels | nindent 12 }}
          annotations: {{ toYaml .annotations | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
