[package]
name = "pleme-storage-elastic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["drzzln <drzzln@protonmail.com>"]
description = "PVC autosize watcher implementing theory/BREATHABILITY.md §V"
repository = "https://github.com/pleme-io/helmworks"

[[bin]]
name = "pleme-storage-elastic"
path = "src/main.rs"

[dependencies]
# Kubernetes client + types
kube         = { version = "0.96", features = ["runtime", "client", "derive", "rustls-tls"], default-features = false }
k8s-openapi  = { version = "0.23", features = ["latest"] }
# Async runtime
tokio        = { version = "1.40", features = ["macros", "rt-multi-thread"] }
# HTTP client for Prometheus queries
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# CLI / config
clap         = { version = "4.5", features = ["derive", "env"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
serde_yaml   = "0.9"
# Errors + logging
anyhow       = "1.0"
thiserror    = "2.0"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# Time math
chrono       = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# byte-quantity parsing (Kubernetes-style: "30Gi" → 32212254720 bytes)
parse-size   = "1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"

[lints.clippy]
pedantic = "warn"
