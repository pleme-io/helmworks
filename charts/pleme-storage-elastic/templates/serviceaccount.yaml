{{- if .Values.enabled }}
{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pleme-storage-elastic.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-storage-elastic.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pleme-storage-elastic.fullname" . }}
  labels:
    {{- include "pleme-storage-elastic.labels" . | nindent 4 }}
rules:
  # Read + patch PVCs cluster-wide.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch"]
  # Read kubelet metrics (volume usage stats) via the metrics-server
  # proxy. Falls back to scraping each kubelet's /metrics/resource
  # if metrics-server is missing.
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "nodes/proxy"]
    verbs: ["get", "list"]
  # Emit Events when expanding a PVC.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pleme-storage-elastic.fullname" . }}
  labels:
    {{- include "pleme-storage-elastic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pleme-storage-elastic.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pleme-storage-elastic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
