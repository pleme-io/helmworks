{{- /*
The tiered BackendConfig, rendered as a Secret (the L2 DSN carries the Postgres
password → Secret, never a ConfigMap). Mounted at the daemon's --backend-config
path by the pleme-sui subchart (mode.cache.tiered.secretName = this).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tiered.secretName }}
  labels:
    {{- include "lareira-sui.labels" . | nindent 4 }}
type: Opaque
stringData:
  backend.toml: |
    {{- include "lareira-sui.backendToml" . | nindent 4 }}
