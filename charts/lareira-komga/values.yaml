# Komga — sibling to Kavita; better at large comic libraries with
# OPDS / Tachiyomi clients. Choose one or both based on family preference.

enabled: false

image:
  repository: docker.io/gotson/komga
  tag: "1.21.3"
  pullPolicy: IfNotPresent

serviceAccount: { create: true }

ports:
  - name: http
    containerPort: 25600
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 25600
      targetPort: http
      protocol: TCP

env:
  - name: TZ
    value: America/New_York

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits:   { cpu: 2000m, memory: 1Gi }

persistence:
  enabled: false
  storageClass: local-path
  size: 1Gi
  mountPath: /config
  zfsDataset: pool/data

volumes:
  - name: comics
    hostPath: { path: /srv/pool/media/comics, type: DirectoryOrCreate }

volumeMounts:
  - { name: comics, mountPath: /comics }

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: komga.rio.lan
      paths:
        - path: /
          pathType: Prefix
  tls: { enabled: false, issuer: selfsigned }

authentik: { enabled: false }
cloudflared: { expose: false, hostname: "" }

backup:
  enabled: false
  schedule: "0 4 * * 0"
  paths: ["/config"]
  repositoryEnvFrom: { secretName: "" }
  retention: { daily: 0, weekly: 4, monthly: 6, yearly: 1 }
  image: { repository: restic/restic, tag: "0.18.0", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

monitoring: { enabled: false }
prometheusRules: { enabled: false }
alerts: { common: { enabled: false }, ntfyTopic: rio-komga }
networkPolicy: { enabled: true }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }
