# pleme-zot — cluster-local Zot OCI registry
#
# Deployment shapes:
#   - cache mode (default): Zot has zero external egress; image-sync pushes
#                           into Zot. Most secure; matches pure air-gap.
#   - pull mode:            Zot pulls upstream itself via extensions.sync,
#                           with an upstream allowlist NetworkPolicy.

# -- Fully-qualified Zot service hostname; used for the ServiceMonitor +
#    cosign config + Ingress. Auto-derived from name+namespace+domain.
hostname: ""

# -- The Zot image. At fedramp-high the validator requires a digest pin;
#    CI/forge injects the digest at release. v2.1.5 digest verified
#    2026-05-08 via `skopeo inspect docker://ghcr.io/project-zot/zot-linux-amd64:v2.1.5`.
image:
  repository: ghcr.io/project-zot/zot-linux-amd64
  tag: "sha256:73c2356539d1e6339a25fe957d59f91627479f1a5627b3c4cfce93efcf488158"
  pullPolicy: IfNotPresent

# -- Replicas. At fedramp-high the validator requires >= 2.
replicaCount: 2

# -- Resource shape. Zot is mostly CPU-light, IO-heavy; tune for your
#    fleet's image volume.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

# -- StatefulSet pod management policy. Parallel brings replicas up/down
#    together (fine for an RWO-per-replica registry); set OrderedReady if you
#    need sequential rollout.
podManagementPolicy: Parallel

# -- Extra environment variables passed through to the zot container.
extraEnv: []
#  - name: TZ
#    value: UTC

# -- Scheduling. Passthroughs for placing the registry pod. On a single-node
#    dev cluster a nodeSelector/toleration may be needed; priorityClassName
#    helps the registry survive eviction under node pressure.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# -- ServiceAccount: dedicated, no automount.
serviceAccount:
  create: true
  automountServiceAccountToken: false

# -- Pod-level security context. Zot's official distroless image runs as the
#    nonroot UID 65532; fsGroup 65532 lets the registry write to its PVC at
#    /var/lib/registry under a read-only root filesystem. seccompProfile is
#    emitted at every compliance baseline (pleme-lib default RuntimeDefault),
#    so the pod is PodSecurity `restricted`-admissible even at baseline: none.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (CM-7/AC-6/SC-39 hardened).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Container ports.
ports:
  - name: http
    containerPort: 5000
    protocol: TCP
  - name: metrics
    containerPort: 5050
    protocol: TCP

# -- Service config.
service:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 5050
      targetPort: metrics
      protocol: TCP

# -- Health probe. Zot's /v2/ API root is auth-gated (htpasswd/oidc), so an
#    HTTPGet probe gets 401 and kubelet crash-loops the pod. A TCPSocket probe
#    on the registry port is the correct liveness/readiness shape for an
#    authenticated registry. Switch to `type: HTTPGet` (path /v2/) only when
#    running with `auth.backend: none`.
health:
  type: TCPSocket
  port: http
  livenessInitialDelay: 10
  readinessInitialDelay: 5

# -- Persistent storage. At fedramp-high, the storage class must be
#    in compliance.storage.encryptedClasses (encrypted CSI driver).
persistence:
  enabled: true
  storageClass: encrypted
  size: 200Gi
  mountPath: /var/lib/registry

# -- Zot storage engine tuning (rendered into config.json). dedupe collapses
#    identical blobs; gc reclaims untagged/expired manifests on gcInterval
#    after gcDelay. Tune gcInterval down on busy mirrors, up on cold archives.
storage:
  dedupe: true
  gc: true
  gcDelay: 1h
  gcInterval: 24h

# -- Mode: "cache" (default; image-sync pushes) or "pull" (Zot itself
#    pulls from upstream via extensions.sync).
mode: cache

# -- Auth backend: htpasswd (default) or oidc (Authentik). When oidc, the
#    Ingress is the auth boundary; in-cluster pulls use a Bearer token
#    issued by Authentik.
auth:
  backend: htpasswd
  htpasswdSecret: zot-htpasswd
  oidc:
    issuer: ""               # e.g. https://authentik.identity.example.com/application/o/zot/
    clientID: ""
    clientSecretSecret: ""

# -- Cosign signature verification at the registry boundary (SI-7).
#    When enabled, Zot's extensions.scrub + extensions.sign verify
#    cosign signatures before serving an image. Required at fedramp-high.
cosign:
  enabled: true
  # publicKeySecret: cosign-pub
  # publicKeyKey: cosign.pub

# -- Audit logging. Zot writes structured JSON to stdout; Vector scrapes.
audit:
  enabled: true

# -- Zot extensions (rendered into config.json). `search` enables the built-in
#    Trivy-backed CVE scanning of stored images (Zot scans its own contents on
#    cveUpdateInterval); `metrics` enables the Prometheus /metrics endpoint
#    (scraping is separately gated by monitoring.enabled / the ServiceMonitor).
extensions:
  metrics: true
  search: true
  cveUpdateInterval: 2h

# -- Pull-mode upstream registries (used when mode=pull). Each entry is
#    an URL the Zot extensions.sync mirror will pull from.
upstream:
  registries:
    # - urls: ["https://ghcr.io"]
    #   pollInterval: "1h"
    #   onDemand: true
    #   credentialsSecret: ghcr-creds
    #   content:
    #     - prefix: "pleme-io/**"
    #       tags:
    #         regex: "^v?\\d+\\.\\d+\\.\\d+$"

# -- Compliance. Pre-set for the registry-mirror air-gap role.
compliance:
  baseline: fedramp-high
  # Default-off so the chart's release flow (`forge helm release`) can
  # template-validate without injected attestation values. Consumers
  # that want FedRAMP-High enforcement at admission flip this to true
  # in their values and supply attestation.* + a digest-pinned image.
  enforce: false
  audit:
    logLevel: info
    retentionDays: 365
  airgap:
    enabled: true
    role: registry-mirror
    requireSignedImages: true
    # upstream.allowedCidrs is REQUIRED at high (or upstream.allowedHosts +
    # useCilium=true). image-sync uses the same role; pleme-zot in cache
    # mode strictly speaking has no upstream egress, but we allow declaring
    # an empty list to satisfy the validator. In cache mode, set
    # upstream.allowedCidrs = ["127.0.0.1/32"] (no real egress) and
    # upstream.credentialSecret = "" with allowList.anonymousUpstream.
    upstream:
      # In cache mode (default), Zot doesn't fetch — image-sync does.
      # We declare a sentinel CIDR + Secret to satisfy the validator;
      # NetworkPolicy is functionally a deny-all for this Zot.
      allowedCidrs:
        - "127.0.0.1/32"
      credentialSecret: zot-cache-mode-sentinel
  attestation:
    enabled: true
    # signature / certificationHash / complianceHash / changesetHash
    # injected by forge at release time
  authn:
    # mTLS in front of Zot for service-to-service pulls. In pull mode the
    # Ingress is auth-gated by Authentik; consumers in-cluster present a
    # short-lived projected SA token.
    istio:
      mtls:
        required: null
    token:
      audience: zot.cluster.local
      expirationSeconds: 3600

# -- Monitoring. ServiceMonitor scrapes /metrics.
monitoring:
  enabled: true
  port: metrics
  path: /metrics
  interval: 30s

# -- NetworkPolicy. Fully expresses the registry's ingress/egress posture so
#    the gitops layer carries no raw NetworkPolicy YAML. At compliance
#    baseline >= fedramp-moderate the deny-all + DNS + air-gap egress trio is
#    rendered by pleme-lib's compliance helpers and `enabled/allowDns/
#    allowEgressHttps` below are no-ops; the additionalIngress rules render at
#    every baseline. At baseline: none (e.g. pleme-dev) the chart renders the
#    equivalent lockdown itself:
#      enabled        -> <fullname>-deny-all (default-deny ingress + egress)
#      allowDns       -> <fullname>-allow-dns (egress :53)
#      allowEgressHttps -> <fullname>-allow-egress-https (egress :443, pull mode)
#      additionalIngress[] -> one NetworkPolicy each
networkPolicy:
  enabled: true
  # Cluster DNS resolution.
  allowDns: true
  # Upstream :443 egress to the public internet (minus RFC1918). Only needed
  # in `mode: pull`, where Zot fetches upstream itself. In cache mode (default)
  # image-sync does the pulling, so Zot needs zero upstream egress.
  allowEgressHttps: false
  additionalIngress:
    # Any in-cluster workload may pull images over :5000.
    - name: allow-pulls
      rules:
        - from:
            - namespaceSelector: {}
          ports:
            - port: 5000
              protocol: TCP
    # image-sync pushes mirrored upstream images into the cache.
    - name: allow-image-sync
      rules:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: image-sync
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: image-sync
          ports:
            - port: 5000
              protocol: TCP
    # Operator laptop push (private-push.sh). The egress CIDR is per-cluster,
    # so it is supplied as a values override rather than a chart default:
    # - name: allow-laptop-push
    #   rules:
    #     - from:
    #         - ipBlock:
    #             cidr: "203.0.113.10/32"
    #       ports:
    #         - port: 5000
    #           protocol: TCP
  additionalEgress: []

# -- PDB at fedramp-high (auto-emitted via compliance.availability.pdb).
pdb:
  enabled: true
  minAvailable: 1

# -- Ingress for external pushes/pulls. When enabled, a v1 Ingress is
#    rendered at `.Values.ingress.host`. Push bodies (OCI layers) routinely
#    blow past nginx's default 1 MiB request size; the proxy-body-size
#    annotation default of 5g covers any reasonable image layer.
ingress:
  enabled: false
  className: nginx
  host: ""
  servicePort: 5000
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  tls:
    enabled: true
    issuer: letsencrypt-prod
    secretName: ""           # default: "<release>-tls"

# -- Optional standalone cert-manager Certificate for the registry hostname.
#    Use when TLS terminates somewhere other than an nginx Ingress (e.g. a
#    Cloudflare Tunnel origin) but cert-manager should still provision/renew
#    the cert into a Secret. Leave disabled when ingress.enabled +
#    ingress.tls.enabled, since the Ingress's cluster-issuer annotation already
#    provisions an equivalent cert (avoids a duplicate Certificate).
certificate:
  enabled: false
  host: ""                   # defaults to ingress.host
  issuer: letsencrypt-prod
  issuerKind: ClusterIssuer
  secretName: ""             # defaults to "<fullname>-tls"
  duration: 2160h
  renewBefore: 360h
  extraDnsNames: []
