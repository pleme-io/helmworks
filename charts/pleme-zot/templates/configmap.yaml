{{- /*
  Zot config.json — rendered from values. TLS is terminated at the edge
  (Ingress or Cloudflare Tunnel), so Zot itself serves plain HTTP on :5000.
  The in-process settings driven from values are the audit/access log paths,
  signature verification (cosign extensions), and the pull-mode sync policy.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pleme-lib.fullname" . }}-config
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "pleme-lib.compliance.annotations" . | nindent 4 }}
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": {{ .Values.persistence.mountPath | quote }},
        "dedupe": {{ dig "dedupe" true (.Values.storage | default dict) }},
        "gc": {{ dig "gc" true (.Values.storage | default dict) }},
        "gcDelay": {{ dig "gcDelay" "1h" (.Values.storage | default dict) | quote }},
        "gcInterval": {{ dig "gcInterval" "24h" (.Values.storage | default dict) | quote }}
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"{{ if eq .Values.auth.backend "htpasswd" }},
        "auth": {
          "htpasswd": {
            "path": "/etc/zot-auth/htpasswd"
          }
        }{{ else if eq .Values.auth.backend "oidc" }},
        "auth": {
          "openid": {
            "providers": {
              "oidc": {
                "name": "authentik",
                "issuer": {{ .Values.auth.oidc.issuer | quote }},
                "clientid": {{ .Values.auth.oidc.clientID | quote }},
                "scopes": ["openid", "profile", "email"]
              }
            }
          }
        }{{ end }}
      },
      "log": {
        "level": {{ ((.Values.compliance).audit).logLevel | default "info" | quote }},
        "output": "/var/log/zot/access.log",
        "audit": "/var/log/zot/audit.log"
      },
      "extensions": {
        "metrics": {
          "enable": {{ dig "metrics" true (.Values.extensions | default dict) }},
          "prometheus": {
            "path": "/metrics"
          }
        },
        "search": {
          "enable": {{ dig "search" true (.Values.extensions | default dict) }},
          "cve": {
            "updateInterval": {{ dig "cveUpdateInterval" "2h" (.Values.extensions | default dict) | quote }}
          }
        }{{ if .Values.cosign.enabled }},
        "scrub": {
          "enable": true,
          "interval": "24h"
        },
        "sign": {
          "enable": true
        }{{ end }}{{ if eq .Values.mode "pull" }},
        "sync": {
          "enable": true,
          "credentialsFile": "/etc/zot/sync-creds.json",
          "registries": [
            {{- range $i, $r := .Values.upstream.registries }}
            {{- if $i }},{{ end }}
            {
              "urls": {{ $r.urls | toJson }},
              "pollInterval": {{ $r.pollInterval | default "1h" | quote }},
              "onDemand": {{ $r.onDemand | default true }},
              "tlsVerify": true,
              "content": {{ $r.content | toJson }}
            }
            {{- end }}
          ]
        }{{ end }}
      }
    }
