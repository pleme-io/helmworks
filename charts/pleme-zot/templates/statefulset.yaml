{{- include "pleme-lib.compliance.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "pleme-lib.fluxcdPruneDisabled" . | nindent 4 }}
    {{- $cAnnot := include "pleme-lib.compliance.annotations" . | trim }}
    {{- if $cAnnot }}
    {{- $cAnnot | nindent 4 }}
    {{- end }}
spec:
  serviceName: {{ include "pleme-lib.fullname" . }}-headless
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "pleme-lib.selectorLabels" . | nindent 6 }}
  podManagementPolicy: {{ .Values.podManagementPolicy | default "Parallel" }}
  template:
    metadata:
      labels:
        {{- include "pleme-lib.selectorLabels" . | nindent 8 }}
        {{- $cl := include "pleme-lib.compliance.labels" . | trim }}
        {{- if $cl }}
        {{- $cl | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "pleme-lib.prometheusAnnotations" . | nindent 8 }}
        {{- include "pleme-lib.compliance.annotations" . | nindent 8 }}
        {{- include "pleme-lib.compliance.audit.annotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pleme-lib.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "pleme-lib.compliance.automountServiceAccountToken" . }}
      securityContext:
        {{- include "pleme-lib.podSecurityContext" . | nindent 8 }}
      containers:
        - name: zot
          image: {{ include "pleme-lib.compliance.image" . }}
          imagePullPolicy: {{ include "pleme-lib.compliance.image.pullPolicy" . }}
          args:
            - "serve"
            - "/etc/zot/config.json"
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- toYaml .Values.ports | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "pleme-lib.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            {{- include "pleme-lib.livenessProbe" . | nindent 12 }}
          readinessProbe:
            {{- include "pleme-lib.readinessProbe" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: logs
              mountPath: /var/log/zot
            {{- if eq .Values.auth.backend "htpasswd" }}
            # Mount the htpasswd Secret to its OWN path, not subPath'd
            # into /etc/zot/. The combo of (a) /etc/zot mounted as a
            # configmap volume + (b) htpasswd subPath'd onto /etc/zot/htpasswd
            # trips a runc "not a directory" bug on K3s/containerd
            # (the subPath bind-mount can't lay a file overlay onto
            # the configmap mount target). Mounting to /etc/zot-auth
            # avoids the overlap; the configmap's `auth.htpasswd.path`
            # is updated to match.
            - name: htpasswd
              mountPath: /etc/zot-auth
              readOnly: true
            {{- end }}
            {{- if eq .Values.mode "pull" }}
            - name: sync-creds
              mountPath: /etc/zot/sync-creds.json
              subPath: sync-creds.json
              readOnly: true
            {{- end }}
            {{- if and (or .Values.cosign.enabled .Values.cosign.verify) .Values.cosign.publicKeySecret }}
            - name: cosign-pub
              mountPath: /etc/zot/cosign
              readOnly: true
            {{- end }}
            {{- if eq .Values.tls.mode "inPod" }}
            - name: zot-tls
              mountPath: /etc/zot-tls
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pleme-lib.fullname" . }}-config
        - name: logs
          emptyDir: {}
        {{- if eq .Values.auth.backend "htpasswd" }}
        - name: htpasswd
          secret:
            secretName: {{ .Values.auth.htpasswdSecret }}
        {{- end }}
        {{- if eq .Values.mode "pull" }}
        - name: sync-creds
          secret:
            secretName: {{ .Values.upstream.credentialsSecret | default "zot-sync-creds" }}
        {{- end }}
        {{- if and (or .Values.cosign.enabled .Values.cosign.verify) .Values.cosign.publicKeySecret }}
        - name: cosign-pub
          secret:
            secretName: {{ .Values.cosign.publicKeySecret }}
        {{- end }}
        {{- if eq .Values.tls.mode "inPod" }}
        - name: zot-tls
          secret:
            secretName: {{ required "tls.inPod.certSecret is required when tls.mode=inPod" .Values.tls.inPod.certSecret }}
        {{- end }}
      {{- $availReq := include "pleme-lib.compliance.availability.required" . }}
      {{- if eq $availReq "true" }}
      topologySpreadConstraints:
      {{- include "pleme-lib.compliance.availability.topologySpread" . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          {{- include "pleme-lib.fluxcdPruneDisabled" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
