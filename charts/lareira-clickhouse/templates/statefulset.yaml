{{/*
statefulset.yaml — the DATA tier ClickHouse StatefulSet.

TAP  (keeper disabled): replicas start at 0; KEDA (templates/breathability.yaml)
owns the count and wakes it 0->1 on NATS-JetStream lag, back to 0 on idle. The
PVC persists data + schema across sleep/wake; the 3h NATS buffer makes a sleeping
tap lossless. Plain MergeTree, single `events` table.

LAKE (keeper enabled): a fixed `replicasPerShard` HA floor (KEDA off — a sleeping
replica can't hold a Keeper-coordinated seat). Each pod is a ReplicatedMergeTree
replica of shard {shardId}, coordinating through Keeper (zookeeper.xml) — a lost
replica RE-REPLICATES from a peer (MultiWriter), it does not fail over. The
config.d overlay (config.yaml) carries macros/remote_servers/zookeeper/storage.

The PVC is labelled breathe-expandable so a StorageBand grows it GrowOnly.
*/}}
{{- $fullname := include "pleme-lib.fullname" . }}
{{- $ch := .Values.clickhouse }}
{{- $ns := include "pleme-lib.namespace" . }}
{{- $secretName := $ch.auth.existingSecret | default (printf "%s-auth" $fullname) }}
{{- $lake := $ch.keeper.enabled }}
{{- $replicas := include "lareira-clickhouse.data.replicas" . }}
{{- $serviceName := ternary (include "lareira-clickhouse.data.headless" .) $fullname $lake }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
  {{- if $lake }}
  annotations:
    # DatabaseBand architecture INTENT (Landing — no live CR). The data plane is
    # breathe's MultiWriter (G2 gap): every replica writable, a reclaim
    # re-replicates from a peer (never a promotion). ShardSurvivorWitness intent.
    breathe.pleme.io/db-class: {{ .Values.breathe.database.data.class | quote }}
    breathe.pleme.io/db-topology: {{ .Values.breathe.database.data.topology | quote }}
    breathe.pleme.io/db-replica-policy: {{ .Values.breathe.database.data.replica | quote }}
    breathe.pleme.io/db-failover-policy: {{ .Values.breathe.database.data.failover | quote }}
    breathe.pleme.io/db-spot: {{ .Values.breathe.database.data.spot | quote }}
    breathe.pleme.io/db-shards: {{ $ch.topology.shards | quote }}
    breathe.pleme.io/db-replicas-per-shard: {{ $ch.topology.replicasPerShard | quote }}
    breathe.pleme.io/isolation-class: "standard"
    breathe.pleme.io/qos: "burstable"
  {{- end }}
spec:
  serviceName: {{ $serviceName }}
  replicas: {{ $replicas }}
  {{- if $lake }}
  podManagementPolicy: Parallel
  {{- end }}
  selector:
    matchLabels:
      {{- include "pleme-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-lib.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse-store
      annotations:
        {{- if $ch.init.enabled }}
        checksum/initdb: {{ include (print $.Template.BasePath "/init-sql.yaml") . | sha256sum }}
        {{- end }}
        {{- if $lake }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with $ch.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* nodeSelector + tolerations honor the pleme-lib 0.36.0 global.*
             fallback: a chart-level value wins, else the top-level global
             (propagated by Helm to every subchart) applies. This is how the
             tendril release pins the whole cluster onto the tainted
             `role: tendril` scale-to-zero pool from ONE global block. */}}
      {{- $sched := .Values.global | default dict }}
      {{- with (.Values.nodeSelector | default $sched.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.tolerations | default $sched.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $lake }}
      {{- /* In lake mode, spread a shard's replicas across nodes/AZs so a
             single-AZ spot storm never takes a whole shard (design §5/§6). A
             chart-level affinity override still wins. */}}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pleme-lib.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: clickhouse-store
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pleme-lib.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: clickhouse-store
      {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ $ch.image.repository }}:{{ $ch.image.tag }}"
          imagePullPolicy: {{ $ch.image.pullPolicy }}
          {{- with $ch.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $ch.ports.http }}
            - name: native
              containerPort: {{ $ch.ports.native }}
            {{- if $lake }}
            - name: interserver
              containerPort: {{ $ch.ports.interserver }}
            {{- end }}
          env:
            - name: CLICKHOUSE_DB
              value: {{ $ch.auth.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $ch.auth.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $ch.auth.passwordKey }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            {{- if $lake }}
            # {shard}/{replica} macros — {replica} = pod name (the per-pod
            # replication identity), {shard} = the logical shard id.
            - name: CH_SHARD
              value: {{ $ch.topology.shardId | quote }}
            - name: CH_REPLICA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # interserver_http_host — the pod IP so peers can fetch parts.
            - name: CH_INTERSERVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if and $ch.storagePolicy.enabled $ch.storagePolicy.s3.enabled $ch.storagePolicy.s3.existingSecret }}
            - name: CH_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $ch.storagePolicy.s3.existingSecret }}
                  key: {{ $ch.storagePolicy.s3.accessKeyIdKey }}
            - name: CH_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $ch.storagePolicy.s3.existingSecret }}
                  key: {{ $ch.storagePolicy.s3.secretAccessKeyKey }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: varlog
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
            {{- if $lake }}
            - name: config
              mountPath: /etc/clickhouse-server/config.d
              readOnly: true
            {{- end }}
            {{- if $ch.init.enabled }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $ch.resources | nindent 12 }}
          # startupProbe gates liveness/readiness until the server is actually
          # serving. A ReplicatedMergeTree replica must connect to Keeper and
          # replay its replication queue before HTTP comes up — that can exceed a
          # 30s liveness initialDelay, so without this gate a slow-starting replica
          # is killed by liveness ("/ping connection refused") in a restart loop.
          # 30 x 10s = up to 5m of startup grace; liveness/readiness only run after.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        # readOnlyRootFilesystem: true (values.yaml securityContext) makes the
        # container root read-only, so every path ClickHouse writes that is NOT
        # the data PVC needs a writable mount. These two are that set; adding the
        # flag without them crash-loops the server, which is why they land in the
        # same commit.
        - name: varlog
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $lake }}
        - name: config
          configMap:
            name: {{ $fullname }}-config
        {{- end }}
        {{- if $ch.init.enabled }}
        - name: initdb
          configMap:
            name: {{ $fullname }}-initdb
        {{- end }}
  # volumeClaimTemplates is an IMMUTABLE StatefulSet field: the apiserver
  # rejects any update to it (server-side apply forbids all StatefulSet spec
  # changes except replicas/template/updateStrategy/...). pleme-lib.labels
  # embeds version-bearing labels (helm.sh/chart, app.kubernetes.io/version),
  # so using it here churns the PVC metadata on every chart bump and wedges
  # the upgrade ("the field is immutable") — hit + fixed the same way in
  # pleme-nats 0.3.2. Pin the PVC labels to the version-STABLE selector set
  # (name + instance), identical to spec.selector.matchLabels, so a version
  # bump never touches this immutable field.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "pleme-lib.selectorLabels" . | nindent 10 }}
          breathe.pleme.io/expandable: "true"
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $ch.persistence.storageClass }}
        storageClassName: {{ $ch.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $ch.persistence.size }}
