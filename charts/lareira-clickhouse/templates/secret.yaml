{{/*
secret.yaml — the ClickHouse user password.

Rendered ONLY when no existingSecret is provided (the dev/kind fallback). Real
clusters set clickhouse.auth.existingSecret to a cofre/SOPS-sealed Secret and
this template emits nothing — the chart never carries a real credential.
*/}}
{{- if and (not .Values.clickhouse.auth.existingSecret) .Values.clickhouse.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pleme-lib.fullname" . }}-auth
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clickhouse.auth.passwordKey }}: {{ .Values.clickhouse.auth.password | quote }}
{{- end }}
