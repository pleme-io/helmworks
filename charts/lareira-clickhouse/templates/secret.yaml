{{/*
secret.yaml — the ClickHouse user password.

Rendered ONLY when an explicit dev opt-in is given. Real clusters set
clickhouse.auth.existingSecret to a cofre/SOPS-sealed Secret and this template
emits nothing — the chart never carries a real credential.

★ THIS TEMPLATE FAILS CLOSED (2026-07-31). It used to render whenever
`existingSecret` was empty and `password` was set — and `password` shipped with a
non-empty default of "tendril". The consequence was not a weak password; it was
that the WRONG CONFIGURATION SUCCEEDED. `helm install` with no overrides produced
a healthy ClickHouse whose credential is committed in this repo, with no error,
no warning and a green rollout — so a real deploy that merely forgot
`existingSecret` was indistinguishable from a correct one.

That is the failure-looks-like-success shape, in the one place where it costs a
credential. The fix is not a stronger default: ANY default reproduces the defect.
It is refusing to render a credential the operator did not choose.

★ CORRECTION (2026-08-01). The first version of this guard also `fail()`ed when
NOTHING was configured. That was wrong, and it was wrong in a way that made the
guard protect nothing at all: `helm template` with default values is exactly what
the release pipeline lints, so the chart stopped being publishable — every commit
to it since has been stranded in git, unable to reach any cluster. A guard on a
chart that cannot ship is not a strong guard, it is an absent one.

The unconfigured case now renders NO Secret and does not fail. The security
property survives because it never depended on the `fail()`: it came from deleting
the built-in "tendril" default. With no Secret rendered, the StatefulSet still
references `<fullname>-auth` (statefulset.yaml:20), so a deploy that forgot
`existingSecret` gets a container that never starts — CreateContainerConfigError,
naming the missing Secret. That is still a loud failure and still not a silent
success; it is merely later than template-time. Template-time refusal is only
better when the chart can also be released, and here it could not.

The remaining `fail()` covers the genuinely inconsistent case — an operator who
actively opted in to a dev password and then supplied none — where rendering would
produce an EMPTY credential, which IS a silent success.
*/}}
{{- $auth := .Values.clickhouse.auth }}
{{- if and (not $auth.existingSecret) $auth.devPasswordOptIn }}
  {{- if not $auth.password }}
    {{- fail "lareira-clickhouse: clickhouse.auth.devPasswordOptIn=true also requires clickhouse.auth.password.\n  Opting in to a dev password without supplying one would render an empty credential." }}
  {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pleme-lib.fullname" . }}-auth
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $auth.passwordKey }}: {{ $auth.password | quote }}
{{- end }}
