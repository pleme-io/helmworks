# lareira-clickhouse — the columnar tap store AND the breathable analytics lake
# for the tendril nervous system.
#
# TWO postures, one lattice (design: clickhouse-breathable-design.md):
#
#   • TAP  (default) — the degenerate `1 shard × 1 replica × 0 Keeper` corner:
#     zero-scale by default (KEDA wakes the StatefulSet on NATS lag), plain
#     MergeTree, a single `events` table, NATS-JetStream-as-WAL. Correct for the
#     tap role; renders identically to the pre-lake chart.
#
#   • LAKE (opt-in) — fill out the two banded tiers:
#       – ClickHouse Keeper: an ODD Raft ensemble (FullyDistributed → Quorum),
#         Guaranteed QoS, anti-affine + AZ-spread, Critical-sealed. `voters` odd
#         ≥ 3; a single-AZ spot storm takes ≤ 1 voter → majority survives.
#       – Data plane: S shards × R replicas of ReplicatedMergeTree — every
#         replica writable (MultiWriter); a lost replica RE-REPLICATES from a
#         peer, it does not fail over. HA floor = replicasPerShard ≥ 2.
#     ReplicatedMergeTree + macros ({shard}/{replica}) + remote_servers +
#     zookeeper→Keeper + a tiered storage_policy (hot → cold → s3) + the
#     logs/metrics/traces OTel lake schema.
#
# Breathable on every dimension breathe can carve (memory + cpu + disk bands,
# shadow-first). The DatabaseBand architecture intent (Keeper = fully-distributed
# quorum, data = multi-writer shards) is recorded as declarative annotations —
# the DatabaseBand CRD/controller is "Landing" (a typed Rust contract, no live
# k8s controller yet), so the chart does NOT emit a DatabaseBand CR by default.

nameOverride: ""
fullnameOverride: ""

clickhouse:
  image:
    # ── MIGRATED TO THE HARDENED LANE 2026-08-02 (operator decision). ────────
    # Was clickhouse/clickhouse-server:24.8 from Docker Hub. Until this change,
    # of 141 helmworks charts with a templates/ dir, ZERO referenced any
    # ghcr.io/pleme-io/hardened-* image -- the entire hardened-images program
    # (CVE gates, Zot admission faucet, 2F promotion) produced artifacts that no
    # chart in this repo deployed. Getting an image to 2F and getting a cluster
    # to RUN it are two different achievements; only the first had been worked.
    #
    # THE SWAP IS COUPLED — FOUR VALUES MOVE TOGETHER OR THE POD CRASH-LOOPS.
    # The hardened images run as uid/gid 65532:65532 (hardened-image-module.nix's
    # typed default). This chart previously pinned runAsUser/fsGroup 101, which
    # is UPSTREAM's uid. Repointing the repository alone gives a pod whose
    # process (65532) is not in the volume's group (101), so
    # /var/lib/clickhouse is unwritable -- the exact failure class measured on
    # hardened-nats-server and hardened-clickhouse-keeper. The four:
    #   clickhouse.image.repository + .tag
    #   keeper.image.repository     + .tag
    #   podSecurityContext.fsGroup: 65532
    #   securityContext.runAsUser:  65532
    #
    # TAG IS AN EXACT PIN, never "latest" (AUTOBUMP rule). 1.0.53 is the
    # `release-version` mint in hardened-images and matches the image's own
    # org.opencontainers.image.version label. NOTE: the registry also carries a
    # `2.0.0` tag which resolves to the IDENTICAL digest
    # (sha256:12915f19...) and whose version label reads 1.0.53 -- a mislabelled
    # alias, not a newer build. Do not pin it.
    #
    # /docker-entrypoint-initdb.d IS VESTIGIAL ON THIS LANE and is left mounted
    # deliberately. That directory is scanned by the OFFICIAL image's shell
    # entrypoint; the hardened image's Entrypoint is clickhouse-server directly,
    # with no docker-entrypoint.sh, so files there are silently ignored -- init
    # SQL would never run, with a healthy pod and no error anywhere. The chart
    # already carries the lane-independent path: init-job.yaml runs the same
    # ConfigMap through `clickhouse-client --queries-file`. The mount is inert,
    # not load-bearing.
    #
    # ALSO NOT EQUIVALENT SOFTWARE, and that is the point: upstream 24.8 vs
    # 26.7.1.1315-stable in the hardened lane. The hardened lane moved channels
    # because 24.05-era ClickHouse had a hard-red vulnix gate (7 affected
    # derivations) -- this chart had been running the version whose CVE profile
    # the hardening work exists to escape.
    #
    # HERMETIC SUPPLY CHAIN: ghcr.io/pleme-io is the pleme-io-owned coordinate,
    # so this now satisfies the mirror-before-airgap rule that the Docker Hub
    # reference violated. The 2F coordinate for an air-gapped consumer is
    # registry.secondfront.com/akeyless/akeyless/hardened-clickhouse.
    repository: ghcr.io/pleme-io/hardened-clickhouse
    tag: "1.0.53"
    pullPolicy: IfNotPresent

  ports:
    http: 8123
    native: 9000
    # The Keeper-coordinated interserver port (ReplicatedMergeTree fetches).
    interserver: 9009

  # ── Topology — the two scale axes of the ClickHouse lattice. ───────────────
  #   axis A — replicasPerShard: HA copies within a shard (also readers).
  #   axis B — shards:           horizontal capacity partitions.
  # `1 × 1` = the tap corner. The I0 interim StatefulSet realizes ONE logical
  # shard (shard "0") with `replicasPerShard` ReplicatedMergeTree replicas —
  # genuine Keeper-coordinated replication HA. Multi-shard (shards > 1, an
  # add-shard reshard/rebalance) is the D1 Altinity-operator destination.
  topology:
    shards: 1
    replicasPerShard: 1
    # The logical shard id stamped into the {shard} macro (interim: single shard).
    shardId: "0"
    clusterName: tendril

  # ── ClickHouse Keeper — the coordination tier (FullyDistributed/Quorum). ───
  # enabled:false = the tap (NATS-as-WAL, no Keeper). enabled:true arms the odd
  # Raft ensemble that coordinates the ReplicatedMergeTree replication queue,
  # part metadata, distributed DDL, and merge leases.
  keeper:
    enabled: false
    image:
      repository: ghcr.io/pleme-io/hardened-clickhouse-keeper
      tag: "1.0.53"
      pullPolicy: IfNotPresent
    # ODD ≥ 3 — breathe's Quorum.has_failover_target() guard is voters>=3 && odd.
    voters: 3
    ports:
      client: 9181       # ZooKeeper-compatible client port the data nodes reach
      raft: 9234         # inter-Keeper Raft port
      prometheus: 9363
    # Guaranteed QoS (requests == limits, both cpu AND memory) — the isolation
    # Critical seal for the coordination tier. Never BestEffort, never zero-floor.
    # The keeper StatefulSet renders limits == requests structurally, so this
    # block is Guaranteed by construction; keep them equal here too.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      # Fast SSD for the raft log + snapshots (latency-sensitive); anti-affine to
      # the data PVCs. MUST be allowVolumeExpansion:true for the StorageBand grow.
      storageClass: ""
      size: 2Gi
    # AZ anti-affinity + topology spread — 3 voters across ≥ 3 AZs so a
    # single-AZ spot storm takes at most 1 voter (majority survives, re-elect).
    antiAffinity: true
    topologySpreadZone: true

  # Resources are BREATHE-managed (the bands below carve the real limits in
  # band); these are the conservative starting envelope before the first band
  # decision. cpu/memory deliberately small — the store sleeps most of the time.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  # ── CH-aware server tuning (design §2/§4) — the memory + merge co-tune as
  # real config.d (lake mode). All optional (unset = upstream defaults). On a
  # SMALL node, ClickHouse's 5Gi default mark_cache_size can let the kernel
  # OOM-killer front-run CH's own tracker — shrink it + cap max_server_memory_usage
  # to <= 0.9 x the cgroup limit. background_pool_size co-tunes up with CPU so a
  # CpuBand shrink can't starve merges (`too many parts`). Values are bytes
  # (memory/cache) or counts (pool/queries). ───────────────────────────────────
  serverSettings:
    maxServerMemoryUsage: ""      # e.g. 3221225472 (3Gi) — <= 0.9 x cgroup limit
    markCacheSize: ""             # e.g. 536870912 (512Mi) — off the 5Gi default
    uncompressedCacheSize: ""
    backgroundPoolSize: ""        # co-tune up with CpuBand (never starve merges)
    maxConcurrentQueries: ""

  # ── ClickHouse's OWN tiered storage_policy (app-level carve, complementary to
  # the breathe StorageBand's volume-level carve). hot (SSD PVC, StorageBand-
  # banded) → cold (optional cheap HDD) → s3 (unbounded object-store cold). The
  # right posture is a SMALL hot PVC + an unbounded S3 cold disk: the StorageBand
  # grows the small hot tier on ingest pressure while `TTL … TO DISK 's3'`
  # evacuates cold parts off it. Off by default (the tap keeps a plain default
  # disk). ───────────────────────────────────────────────────────────────────
  storagePolicy:
    enabled: false
    name: tiered
    moveFactor: 0.1
    cold:
      enabled: false
      # A second (cheaper/larger) PVC-backed disk. Left minimal in the interim.
      class: ""
      size: 50Gi
    s3:
      enabled: false
      endpoint: ""           # e.g. https://s3.us-east-2.amazonaws.com/<bucket>/ch/
      region: us-east-2
      # cofre/SOPS-sealed Secret carrying the S3 access key id / secret key.
      existingSecret: ""
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key

  persistence:
    enabled: true
    # "" = cluster default StorageClass (gp3 on EKS, local-path alias on kind).
    # MUST be allowVolumeExpansion:true for the StorageBand grow to actuate.
    storageClass: ""
    size: 10Gi

  auth:
    user: tendril
    database: tendril
    # Password resolution order: existingSecret (cofre/SOPS, real clusters) →
    # password (dev/kind fallback only). Never commit a real password here.
    existingSecret: ""
    passwordKey: clickhouse-password

    # ── FAILS CLOSED AS OF 2026-07-31 ────────────────────────────────────────
    # This used to read `password: "tendril"`, a NON-EMPTY default, while
    # secret.yaml renders whenever existingSecret is unset. So `helm install`
    # with no overrides produced a WORKING ClickHouse with a password published
    # in a public git repo -- and it worked, which is the whole problem. A
    # production deploy that simply forgot `existingSecret` got the dev
    # credential silently: no error, no warning, healthy pods, green rollout.
    # The insecure path was the DEFAULT and it SUCCEEDED, so nothing ever
    # prompted anyone to look. (The comment above already said "dev/kind
    # fallback only" -- prose does not fail a deploy.)
    #
    # Now: password is empty, and using a literal one requires opting in
    # EXPLICITLY via devPasswordOptIn. A missing credential is loud instead of
    # defaulted, which is the only version of this a reviewer can trust.
    #
    # ── SCOPE CORRECTION (2026-08-02): this chart is NOT on the 2F path ───
    # Findings recorded here on 2026-08-01 (plaintext 8123/9000/9009/9181, no
    # TLS, zero NetworkPolicies on a default render) were reported during a 2F
    # image campaign in language that implied they described "the ClickHouse
    # stack's network path". They do not. Measured 2026-08-02:
    #
    #   references in k8s/ (the FluxCD GitOps repo that deploys clusters):  0
    #     controls, same probe: lareira-vaultwarden 1, pleme-lib 112
    #   references elsewhere in the fleet, outside this chart's own dir:    4
    #     (akeyless-k8s 1, helmworks-akeyless 1, helmworks 2 -- not examined
    #      for whether any of them actually deploys it)
    #   akeylesslabs camelot clickhouse refs:                               9
    #     -- all hardened IMAGES + zot-admission pointers, NOT this chart
    #
    # So the 2F consumer takes our hardened images and deploys them with ITS
    # OWN manifests. The lareira-* family is the homelab/hearth line. A defect
    # in this chart is a real defect in this chart and says nothing about the
    # exposure of anything shipped to 2F.
    #
    # WHY THIS IS WRITTEN DOWN rather than quietly rescoped: the original audit
    # never asked who deploys the chart. Reading a chart tells you what it
    # WOULD create; only the consumer graph tells you whether anything creates
    # it. That is the same "a dead dependency is invisible in source" lesson
    # that caught a NXDOMAIN registry in blackmatter-akeyless -- applied there
    # to someone else's code, missed here in my own finding.
    #
    # The defects remain worth fixing; the SEVERITY claim was inflated by
    # unstated scope.
    # ── TIER, STATED HONESTLY (corrected 2026-08-01) ──────────────────────
    # This block previously said "the chart refuses to render, naming both
    # fixes." IT DOES NOT REFUSE, and secret.yaml's own header says so —
    # the two files described the same guard at two different tiers, and the
    # stronger claim lived in the file operators actually read and copy from.
    #
    # MEASURED: `helm template` with stock values exits 0 and emits 7 kinds.
    # Secret count is ZERO, while the StatefulSet still carries a
    # secretKeyRef to `<fullname>-auth`. So the real tier is a RUNTIME
    # failure — CreateContainerConfigError naming the missing Secret — not a
    # render-time rejection.
    #
    # That is deliberate, not a bug: secret.yaml explains a template-time
    # `fail()` would also block the chart from being released at all. The
    # surviving `fail()` covers only the genuinely inconsistent case
    # (devPasswordOptIn=true with no password), which would otherwise render
    # an EMPTY credential — a silent success, the one outcome worth refusing
    # outright.
    #
    # WHY THE WORDING MATTERED: "refuses to render" implies `helm template`
    # / `helm lint` in CI catch a missing credential BEFORE anything reaches
    # a cluster. They do not — both go green. The failure surfaces only after
    # deploy, to whoever is watching pod status. Still loud, still not a
    # silent success, but later and in a different place than the sentence
    # promised. Never round a runtime failure up to a parse-time rejection.
    password: ""
    # Set true ONLY for kind/dev. Requires `password` to be set too. Never in a
    # cluster anyone else can reach.
    devPasswordOptIn: false

  # Idempotent auto-initialization. Rendered into /docker-entrypoint-initdb.d
  # so ClickHouse runs it on first start (empty data dir); the PVC then persists
  # the schema across wake/sleep cycles. Every statement is IF NOT EXISTS so a
  # re-run is a no-op. In LAKE mode (replication.enabled), the tables become
  # ReplicatedMergeTree so each replica registers the same Keeper path.
  init:
    enabled: true
    # Analytical retention tier — longer than the 3h hot VictoriaOps buffer
    # (ClickHouse is the deep-query store). Disk grows GrowOnly via StorageBand.
    ttl: "7 DAY"
    # DESTINATION: evacuate cold parts to cheap S3 cold instead of DELETE, so
    # retention is cheap-cold-forever. Set to "TO DISK 's3'" (or
    # "TO VOLUME 'cold'") in lake mode with storagePolicy.enabled. "DELETE" is
    # the tap default (no S3 tier).
    ttlAction: "DELETE"
    # Schema shape: "events" (the tap's single-table corner) or "lake"
    # (logs/metrics/traces OTel-shaped tables). Lake mode auto-selects "lake".
    schema: events
    extraSQL: ""

  # ── ReplicatedMergeTree replication. When enabled, the init schema uses
  # ReplicatedMergeTree('/clickhouse/tables/{shard}/<table>','{replica}') so
  # every replica coordinates through Keeper. REQUIRES keeper.enabled. Off by
  # default (the tap runs plain MergeTree). ──────────────────────────────────
  replication:
    enabled: false

  podSecurityContext:
    fsGroup: 65532
  securityContext:
    runAsUser: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    # ── ADDED 2026-07-31 ────────────────────────────────────────────────────
    # helmworks/CLAUDE.md documents readOnlyRootFilesystem: true as part of the
    # enforced security baseline. Counted 2026-07-31: 74 of 84 charts that set a
    # securityContext actually carried it; this chart was one of the ten that did
    # not, so the "All charts enforce" claim was false and this container ran
    # with a writable root filesystem.
    #
    # It is enabled here TOGETHER with the emptyDir mounts it requires, never
    # alone: ClickHouse writes outside its PVC (/var/log/clickhouse-server and
    # /tmp), so flipping this flag by itself would crash-loop the server. That
    # coupling is exactly why the other nine are being done per-chart with their
    # writable set measured, rather than swept.
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# ── Zero-scale: KEDA scales the DATA StatefulSet 0<->1 on NATS-JetStream lag. ─
# TAP MODE ONLY. In lake mode (keeper.enabled) the data StatefulSet runs a fixed
# `replicasPerShard` floor (HA — a sleeping replica can't hold a Keeper quorum
# seat), so KEDA zero-scale is disabled. The store wakes on the SAME MTE_STAGING
# lag that wakes its respiro consumer; the 3h NATS buffer makes a sleeping tap
# lossless.
breathability:
  enabled: true
  targetKind: StatefulSet
  min: 0
  max: 1
  cooldown: 600
  pollingInterval: 15
  trigger:
    type: nats-jetstream
    nats:
      serverURL: "nats://pleme-nats.tendril.svc:4222"
      account: "$G"
      stream: MTE_STAGING
      consumer: clickhouse
      lagThreshold: "1"
      activationLagThreshold: "0"

# ── Breathe homeostasis: memory + cpu limits carved in-band, disk grown
# GrowOnly via StorageBand. SHADOW-first (dryRun / mode:shadow) — observe the
# decisions, then flip to actuate. The data-tier memory + cpu bands are emitted
# by the canonical pleme-lib.breatheBand helper (targeting the data StatefulSet);
# the StorageBand + the Keeper band-set are hand-emitted in templates/breathe.yaml.
#
# CH-AWARE MEMORY (design §2): a MemoryBand that ignores ClickHouse's own memory
# tracker either OOM-kills (cgroup shrunk below what CH thinks it may use) or
# wastes. So the LAKE floor exceeds the reserved caches (5Gi default mark cache +
# a per-query working set), and `appParamCotune.max_server_memory_usage` keeps
# CH's ceiling ≤ ratioOfLimit × the carved cgroup limit — the kernel OOM-killer
# can never front-run CH's tracker. The tap keeps a small 512Mi floor (tiny
# caches). appParamCotune is a DECLARED intent today (the live co-tune actuator
# is the DatabaseBand/config-reload destination — recorded, not yet actuated).
breathe:
  enabled: true
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
  memory:
    enabled: true
    setpoint: 0.80
    floor: "512Mi"
    ceiling: "8Gi"
    growAbove: 0.85
    shrinkBelow: 0.70
    cooldownSeconds: 600
    disruptionPolicy: restartFreeOnly
    # shadow-first: mode:shadow AND dryRun:true both mean "observe the band's
    # decision, don't actuate the limit" — flip mode:live once trusted.
    mode: shadow
    dryRun: true
    # CH-aware co-tune (design §2, gap G4). Declared intent for the paired
    # AppParam carve; the live actuator is the DatabaseBand destination.
    appParamCotune:
      knob: max_server_memory_usage
      ratioOfLimit: 0.90
  cpu:
    enabled: true
    setpoint: 0.80
    floor: "200m"
    ceiling: "4000m"
    growAbove: 0.85
    shrinkBelow: 0.70
    cooldownSeconds: 600
    disruptionPolicy: restartFreeOnly
    mode: shadow
    dryRun: true
    # Never starve the merges (design §4.1): CpuBand co-tunes background_pool_size
    # up with CPU; a shrink that starves merge threads yields `too many parts`.
    appParamCotune:
      knob: background_pool_size
  storage:
    enabled: true
    setpoint: 0.80
    floor: "10Gi"
    ceiling: "100Gi"
    growAbove: 0.85
    shrinkBelow: 0.70
    growFactor: 1.25
    shrinkFactor: 0.90
    cooldownSeconds: 600
    maxStalenessSeconds: 300
    mode: shadow
    disruptionPolicy: restartFreeOnly
  # Keeper band-set (hand-emitted, external targetRef = the Keeper StatefulSet).
  # Only rendered when keeper.enabled. Guaranteed-QoS floor for the Critical
  # coordination tier; small fast-SSD StorageBand for the raft log/snapshots.
  keeper:
    memory:
      enabled: true
      setpoint: 0.80
      floor: "512Mi"
      ceiling: "2Gi"
      cooldownSeconds: 600
      disruptionPolicy: restartFreeOnly
      mode: shadow
      dryRun: true
    cpu:
      enabled: true
      setpoint: 0.80
      floor: "200m"
      ceiling: "1000m"
      cooldownSeconds: 600
      disruptionPolicy: restartFreeOnly
      mode: shadow
      dryRun: true
    storage:
      enabled: true
      setpoint: 0.80
      floor: "2Gi"
      ceiling: "20Gi"
      growFactor: 1.25
      shrinkFactor: 0.90
      cooldownSeconds: 600
      maxStalenessSeconds: 300
      mode: shadow
      disruptionPolicy: restartFreeOnly
  # ── DatabaseBand architecture INTENT (the ReplicationOverlay). ─────────────
  # The DatabaseBand CRD/controller is "Landing" (a typed Rust contract in
  # breathe-invariant, fa9468e — no deployable k8s controller yet), so the chart
  # records the two-tier architecture as DECLARATIVE ANNOTATIONS on the Keeper +
  # data StatefulSets rather than emitting a DatabaseBand CR. `emitCR:false` is
  # the honest default; flip it only where the DatabaseBand CRD + controller are
  # installed. The Keeper mapping (fully-distributed / quorum) uses SHIPPED
  # breathe types; the data mapping (multi-writer / re-replicate) names the
  # G2 gap (no MultiWriter ReplicationClass arm ships yet).
  database:
    enabled: true
    emitCR: false
    keeper:
      class: fully-distributed      # ReplicationClass::FullyDistributed (shipped)
      topology: quorum              # ReplicationTopology::Quorum { voters } (shipped)
      spot: spot-even-primary
      replica: quorum-odd-steps
      failover: quorum-re-elect
    data:
      class: multi-writer           # G2 gap: no MultiWriter arm ships yet
      topology: sharded-multi-writer
      spot: spot-even-primary
      replica: scale-readers-freely
      failover: re-replicate-from-peer

# ── ReplicaBand architecture INTENT. The ReplicaBand CRD is NOT installed in
# the camelot/tendril cluster (only Memory/Cpu/Storage bands are live), so the
# chart records the two scale axes as annotations and does NOT emit a ReplicaBand
# CR by default. Flip emitCR only where the ReplicaBand CRD is installed. ──────
replicaBand:
  enabled: true
  emitCR: false
  data:
    topologyKind: multiWriter
    floor: 2            # HA floor: replicasPerShard >= 2
  keeper:
    topologyKind: fullyDistributed
    floor: 3            # odd quorum floor
    ceiling: 5

# ── Lockdown: deny-all NetworkPolicy via the canonical pleme-lib helper. ─────
# DELIBERATELY EMPTY. pleme-lib resolves `.Values.networkPolicy | default
# global.networkPolicy`, and sprig's `default` only falls back on an EMPTY
# value — so a populated per-chart block here (even `enabled: false`) would
# DEFEAT the global fallback. Leaving it empty is what lets the tendril /
# Camelot release lock this store "born locked" (deny-all ingress + egress)
# from ONE top-level `global.networkPolicy.enabled: true`, with DNS + the
# respiro-consumer ingress added back as explicit allow rules. To take
# chart-level control instead, populate a full block here
# (e.g. `networkPolicy: { enabled: true, allowDns: true, additionalIngress: [ … ] }`)
# — it then wins wholesale over the global fallback.
networkPolicy: {}

# ── Global fallbacks (pleme-lib 0.36.0). Normally set at the top level and
# propagated by Helm to every subchart; declared here (empty) only to document
# the surface. nodeSelector/tolerations fall back to global.* in the
# StatefulSet, breathe to global.breathe in the band helper, networkPolicy to
# global.networkPolicy in the lock helper. ───────────────────────────────────
global: {}

serviceMonitor:
  enabled: false
  interval: 30s

# Node placement — generic by default; the tendril release pins the tainted,
# scale-to-zero `role: tendril` pool (taint tendril-only=true:NoSchedule) so the
# store lands on the carve-out, not on resident workloads.
nodeSelector: {}
tolerations: []
affinity: {}
