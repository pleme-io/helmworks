apiVersion: v2
name: lareira-breathe-observability
description: >-
  Observability LAYER over the breathe resource-homeostasis framework — the
  typed dashboard + alerts that let an operator always observe breathability
  through the rio stack (vector → VictoriaMetrics/VictoriaLogs → Grafana +
  vmalert → Alertmanager → ntfy). One pleme-lib.observabilityBundle border
  emits the breathe VMRule + Grafana dashboard ConfigMap. The breathe chart
  keeps owning its own metric exposure (the breathe-controller :metrics port +
  its VMServiceScrape); this chart sits OVER that, interpreting the metrics.
  The dashboard JSON + alert groups are GENERATED by pangea-dashboards
  (Pangea::Architectures::Breathe) — re-gen via pangea-architectures
  workspaces/breathe-observability/render.rb (CLOSED-LOOP persistent spec).
type: application
version: 0.1.1
appVersion: "0.1.0"
dependencies:
  - name: pleme-lib
    version: ">=0.27.0"
    repository: "file://../pleme-lib"
