# lareira-breathe-observability — the observability layer over breathe.
#
# ── pleme-lib.observabilityBundle border (the abstracted telemetry surface) ──
# ONE typed border → VMRule + dashboard ConfigMap via pleme-lib
# (templates/observability.yaml). flavor:vm = rio-native VictoriaMetrics.
# The rules groups + dashboards/breathe.json are GENERATED by pangea-dashboards
# (Pangea::Architectures::Breathe) and persisted here (CLOSED-LOOP persistent
# spec). Re-gen: pangea-architectures workspaces/breathe-observability/render.rb.
observability:
  flavor: vm

  # Scrape is OWNED by the breathe chart (the breathe-controller :metrics port +
  # its VMServiceScrape/breathe-controller). This layer does NOT re-declare it —
  # it sits OVER breathe's metric exposure and only interprets it.
  scrape:
    enabled: false

  # ── Alerts (vmalert → Alertmanager → ntfy) ───────────────────────────────
  rules:
    enabled: true
    groups:
      - name: breathe
        interval: 30s
        rules:
          - alert: BreatheControllerStalled
            expr: sum(rate(breathe_reconciles_total[15m])) == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: breathe controller stalled
              description: "No breathe reconciles in 15m — the controller is down or wedged; every band is now unmanaged (no carve, no shadow attestation)."
          - alert: BreatheBandErrors
            expr: sum by (dim, namespace, name) (rate(breathe_errors_total[10m])) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "breathe band erroring: {{ $labels.dim }} {{ $labels.namespace }}/{{ $labels.name }}"
              description: "A band has produced reconcile errors for 15m (RBAC/target-missing/metric-source). A band on a scaled-to-zero workload reports \"metrics missing\" — expected; a running workload erroring is not."
          - alert: BreatheBandConflict
            expr: sum by (dim, namespace, name) (rate(breathe_conflicts_total[10m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "breathe single-writer conflict: {{ $labels.namespace }}/{{ $labels.name }}"
              description: "Another controller is writing the same limit field breathe owns ({{ $labels.dim }}). The single-writer guard is deferring — resolve the co-owner."
          - alert: BreatheBandStale
            expr: max by (dim, namespace, name) (breathe_band_staleness_seconds) > 300
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "breathe driving metric stale: {{ $labels.namespace }}/{{ $labels.name }}"
              description: "The band's driving metric is >5m stale — breathe is flying blind on {{ $labels.dim }} for this workload (metrics-server / PromQL source gap)."
          - alert: BreatheBandAtCeiling
            expr: "(breathe_band_current_limit >= breathe_band_ceiling) and on (dim, namespace, name) (breathe_band_util_ratio > 0.85)"
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "breathe band pinned at ceiling: {{ $labels.namespace }}/{{ $labels.name }}"
              description: "Limit is at the L2 ceiling AND util >85% for 15m — the workload wants more than the ceiling allows ({{ $labels.dim }}). Raise the band ceiling or right-size."
          - alert: BreatheLiveBandSaturated
            expr: "breathe_band_util_ratio > 0.95 and on (dim, namespace, name) (breathe_band_dry_run == 0)"
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "breathe live band saturated: {{ $labels.namespace }}/{{ $labels.name }}"
              description: "A LIVE band's workload is >95% utilized for 10m ({{ $labels.dim }}) — near the carve-up trigger; if it cannot grow it is under real pressure."

  # ── Dashboard (Grafana sidecar loads the CM via grafana_dashboard=1 label) ─
  dashboard:
    enabled: true
    name: breathe
    deploy: sidecar
    file: dashboards/breathe.json
