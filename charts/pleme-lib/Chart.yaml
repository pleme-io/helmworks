name: pleme-lib
description: Shared library chart for pleme-io internal services
type: library
version: 0.42.0
# 0.42.0 (2026-07-26) -- breatheBand: the RequestBand (RESERVATION) arm.
#
# Every band arm before this one carves a LIMIT. A limit bounds blast radius,
# but it is not the field that decides survival: `oom_score_adj` and the QoS
# class are derived from the REQUEST, and a BestEffort pod (no requests AND no
# limits) is unbandable by every other dimension. Receipt: sui-cache-pg took 34
# OOMKills at a 202.8Mi high-water against a 1Gi limit with cgroup failcnt=0 —
# the limit was never binding, and no MemoryBand setting at any value could
# have saved it.
#
# Three deliberate departures from the arms above, each a safety property:
#   * defaults OFF, and when on defaults to `mode: shadow`;
#   * emits NO `dryRun` key at all — breathe retired it (inert for 8 of 10 band
#     kinds), and shipping an inert field that LOOKS like a safety gate is worse
#     than shipping none;
#   * `resource` is REQUIRED with no default — guessing between the OOM lever
#     (memory) and the scheduling lever (cpu) is the ambiguity this dimension
#     exists to remove.
#
# `manifestRef: {path, marker}` is the durable half: the in-place resize mutates
# the POD, not the template, so without a committed manifest the reservation —
# and with it the QoS posture — evaporates on the next rollout.
#
# NOT DELIVERED BY THIS COMMIT. The last pleme-lib published to
# ghcr.io/pleme-io/charts is 0.40.1 (verified against the registry tag list);
# 0.40.2, 0.41.0 and this 0.42.0 are all in git and NOT on ghcr. Nothing here
# reaches a cluster until the publish pipeline is fixed.
#
# 0.41.0 (2026-07-26) -- breatheBand: honor `postureRef`.
#
# The template previously emitted the full tuning tuple (setpoint /
# growAbove / growFactor / shrinkBelow / shrinkFactor / cooldownSeconds /
# disruptionPolicy / maxStalenessSeconds) UNCONDITIONALLY from its own
# hardcoded defaults -- which happen to be the retired `platform-default`
# numbers. breathe resolves each field `inline.or(posture).or(default)` PER
# FIELD, so a `postureRef` set alongside those inline keys resolved LAST and
# did nothing. Every Helm-emitted band in the fleet was therefore pinned to
# the retired tuple with NO WAY to opt into the criticality tiers, while
# raw-YAML bands moved to postures freely -- a whole class of workload
# (including a database and the fleet control plane) invisible to any
# file-based posture audit, because there was no file to audit.
#
# A tuning field is now omitted exactly when a posture is named AND values
# did not set it explicitly, so the posture actually binds. Rendering is
# byte-equivalent (modulo field order) when no postureRef is set -- verified
# by a normalized before/after diff across pleme-microservice.
#
# See the template header for why `hasKey` and not `default`: the
# never-shrink postures use `shrinkBelow: 0`, which a `default` filter would
# silently rewrite to 0.7.
