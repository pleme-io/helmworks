apiVersion: v2
name: pleme-nats
description: Cluster-local NATS JetStream — typed queue plane for tend throttling, shinryu delivery, and any rate-limited consumer pattern across the fleet.
type: application
version: "0.3.0"
appVersion: "2.10.20"
dependencies:
  - name: pleme-lib
    # Bumped to 0.11.x for the rate-limit-pattern templates
    # (pleme-lib.jetstream, pleme-lib.rate-limit-worker.*).
    version: ">=0.18.0"
    repository: "file://../pleme-lib"
keywords:
  - nats
  - jetstream
  - queue
  - throttle
  - rate-limit
home: https://github.com/pleme-io/k8s
sources:
  - https://github.com/pleme-io/helmworks
maintainers:
  - name: pleme-io
    email: team@pleme.io
