{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pleme-nats.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-nats.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pleme-nats.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pleme-nats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pleme-nats.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when nats.conf changes — config is mounted from
        # the ConfigMap, but NATS only reads it at startup. Without
        # this annotation, a values.yaml change to extraConfig wouldn't
        # take effect until something else triggered a restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "pleme-nats.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        # ── nats-server ───────────────────────────────────────────
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            - name: monitoring
              containerPort: {{ .Values.server.monitoringPort }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # NATS exposes /healthz on the monitoring HTTP port. js=true
          # ensures we only report ready when JetStream is actually
          # serving (not just the gnatsd protocol).
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitoring
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: jetstream
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}

        {{- if .Values.exporter.enabled }}
        # ── prometheus exporter sidecar ───────────────────────────
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - -varz
            - -jsz=all
            - -connz
            - -channelz
            - -subz
            - -port={{ .Values.service.ports.metrics }}
            - "http://localhost:{{ .Values.server.monitoringPort }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ include "pleme-nats.fullname" . }}-config
        {{- if not .Values.persistence.enabled }}
        - name: jetstream
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  {{- if .Values.persistence.enabled }}
  # PVC managed by the StatefulSet — survives pod restart.
  #
  # volumeClaimTemplates is an IMMUTABLE StatefulSet field: the apiserver
  # rejects any update to it (server-side apply forbids all StatefulSet
  # spec changes except replicas/template/updateStrategy/…). The full
  # `pleme-nats.labels` set embeds version-bearing labels — `helm.sh/chart`
  # (chart version) and `app.kubernetes.io/version` (image tag) — so using
  # it here made the PVC metadata churn on every chart bump, wedging the
  # upgrade (0.3.0 -> 0.3.1 flipped helm.sh/chart -> "the field is immutable").
  # Pin the PVC labels to the version-STABLE selector set (name + instance),
  # identical to spec.selector.matchLabels, so a version bump never touches
  # this immutable field.
  volumeClaimTemplates:
    - metadata:
        name: jetstream
        labels:
          {{- include "pleme-nats.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
{{- end }}
