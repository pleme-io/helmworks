{{- if .Values.enabled }}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pleme-nats.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pleme-nats.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pleme-nats.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
