{{- include "pleme-lib.compliance.validate" . -}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "pleme-lib.compliance.labels" . | nindent 4 }}
    {{- include "pleme-lib.compliance.namespace.podSecurityLabels" . | nindent 4 }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "pleme-lib.compliance.annotations" . | nindent 4 }}
    {{- with .Values.namespace.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
