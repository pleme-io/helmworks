{{- /*
  One ClusterRoleBinding per participating namespace, binding the
  ns's `system:serviceaccounts:<ns>` Group to the cluster-singleton
  resolver ClusterRole shipped by lareira-aresta-defaults.
*/ -}}
{{- range $ns := fromJsonArray (include "lareira-mesh-spec.allNamespaces" $) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Values.mesh.name }}-resolver-{{ $ns }}
  labels:
    {{- include "pleme-lib.labels" $ | nindent 4 }}
    mesh.pleme.io/spec: {{ $.Values.mesh.name }}
    mesh.pleme.io/component: aresta-resolver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Values.resolverClusterRole }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ $ns }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
