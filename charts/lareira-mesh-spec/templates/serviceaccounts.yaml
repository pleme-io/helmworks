{{- if .Values.enabled }}
# Per-Servico SA fallback — for Servicos whose chart didn't create
# one (e.g. openclaw-web in lareira-openclaw-stack 0.6.x).
{{- range .Values.servicos }}
{{- if .createServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .serviceAccount }}
  namespace: {{ $.Values.mesh.namespace }}
  labels:
    {{- include "pleme-lib.labels" $ | nindent 4 }}
    mesh.pleme.io/spec: {{ $.Values.mesh.name }}
{{- end }}
{{- end }}

# Per-participant SA — created in each participant's namespace.
{{- range .Values.participants }}
{{- if .createServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .serviceAccount }}
  namespace: {{ .namespace }}
  labels:
    {{- include "pleme-lib.labels" $ | nindent 4 }}
    mesh.pleme.io/spec: {{ $.Values.mesh.name }}
{{- end }}
{{- end }}
{{- end }}
