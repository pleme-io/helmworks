apiVersion: v2
name: lareira-mesh-spec
description: |
  Per-Aplicacao mesh declaration. Renders the typed `(defmesh …)`
  surface to its concrete K8s manifests:

    - one `ClusterSPIFFEID` per Servico (and per cross-namespace
      participant)
    - the shared `aresta-config` ConfigMap with peer + upstream
      allowlists derived from servicos[]+participants[]
    - a per-participant-namespace copy of the aresta-config CM so
      cross-ns participants (e.g. cloudflared) can mount it locally
    - one `ClusterRoleBinding` per participating namespace, binding
      `system:serviceaccounts:<ns>` to the cluster-singleton
      `aresta-resolver` ClusterRole shipped by `lareira-aresta-defaults`
    - a mesh-wide `NetworkPolicy` allowing all ingress on meshed pods
      (mesh authn is the trust boundary at L4)
    - per-participant `ServiceAccount` fallback (if the participant's
      chart doesn't create one — e.g. cloudflared)

  Pairs with `lareira-enxerto` (cluster-singleton webhook) and
  `lareira-aresta-defaults` (cluster-singleton resolver ClusterRole).
type: application
version: 0.3.1
appVersion: "0.3.0"
keywords: [mesh, spiffe, mtls, aresta, openclaw, lareira]
maintainers: [{name: drzzln, email: drzzln@protonmail.com}]
home: https://github.com/pleme-io/aresta
dependencies:
  - name: pleme-lib
    version: ">=0.18.0"
    repository: "file://../pleme-lib"
annotations:
  org.opencontainers.image.source: https://github.com/pleme-io/helmworks
