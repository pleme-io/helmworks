apiVersion: v2
name: lareira-cartorio
description: |
  cartorio — the central merkle ledger for OCI images,
  helm charts, and skills. Admits artifacts only with valid tameshi
  attestation chains; tampering anywhere breaks a hash and the artifact
  is rejected. Wraps https://github.com/pleme-io/cartorio
  on top of pleme-microservice with the fedramp-high compliance overlay.
type: application
version: 0.3.0
appVersion: "0.5.0"

keywords: [openclaw, registry, artifacts, merkle, attestation, fedramp-high, lareira]
maintainers: [{ name: drzzln, email: drzzln@protonmail.com }]

dependencies:
  - name: pleme-microservice
    version: "~0.1.0"
    repository: "file://../pleme-microservice"
