# lareira-vm-stack — pleme-io defaults for victoria-metrics-k8s-stack.
#
# Single-replica everything (rio is single-node). Tunable per cluster.
# VMCluster is intentionally OFF (use VMSingle for home-edge); turn on
# only if running multi-node with HA.

enabled: false

vmStack:
  enabled: true
  nameOverride: vm
  fullnameOverride: vm

  # ── VMSingle: the metric store ──────────────────────────────────────
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "14d"
      storageDataPath: /vm-data
      storage:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 30Gi }
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits:   { cpu: 2000m, memory: 2Gi }

  vmcluster:
    enabled: false

  # ── VMAgent: scrape ServiceMonitor + PodMonitor + VMScrape ──────────
  vmagent:
    enabled: true
    spec:
      replicaCount: 1
      scrapeInterval: 30s
      externalLabels: {}            # cluster: rio etc → set in cluster overlay
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 1000m, memory: 1Gi }
      selectAllByDefault: true

  # ── VMAlert: evaluate rules → Alertmanager ─────────────────────────
  vmalert:
    enabled: true
    spec:
      evaluationInterval: 30s
      replicaCount: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 1000m, memory: 512Mi }
      selectAllByDefault: true
      notifier:
        url: "http://vmalertmanager-vm.monitoring.svc:9093"

  # ── Alertmanager: routing tree owned by AlertmanagerConfig CRDs ─────
  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
      retention: 120h
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 5Gi } }
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits:   { cpu: 500m, memory: 256Mi }
    config:
      route:
        receiver: blackhole
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: blackhole

  # ── Grafana: queries vmsingle + victoria-logs ──────────────────────
  # Pangea-grafana / pangea-dashboards owns folders + dashboards via the
  # Grafana HTTP API. Sidecar dashboards/datasources are DISABLED.
  grafana:
    enabled: true
    replicas: 1
    adminUser: admin
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 1000m, memory: 512Mi }
    sidecar:
      dashboards: { enabled: false }
      datasources: { enabled: false }
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: vm
            access: proxy
            url: http://vmsingle-vm.monitoring.svc:8429
            isDefault: true
          - name: VictoriaLogs
            type: VictoriaLogs
            uid: vlogs
            access: proxy
            url: http://victoria-logs.monitoring.svc:9428
    plugins:
      - victoriametrics-logs-datasource

  # ── Default scrape targets — K3s/embedded-only ─────────────────────
  kubelet: { enabled: true }
  kubeApiServer: { enabled: true }
  coreDns: { enabled: true }
  kubeControllerManager: { enabled: false }
  kubeScheduler: { enabled: false }
  kubeEtcd: { enabled: false }
  kubeProxy: { enabled: false }
  nodeExporter: { enabled: false }   # NixOS host runs node_exporter directly

  defaultRules:
    create: true

# ── Grafana OIDC injection — driven by global.grafanaSso ───────────────
#
# CORRECT dependency key: the upstream subchart is declared with NO alias,
# so subchart values flow under its real name `victoria-metrics-k8s-stack`
# (NOT the dead `vmStack:` key above — see report). Grafana is a
# sub-dependency, hence `.grafana.*`.
#
# Map leaf values are `tpl`-gated on `global.grafanaSso.enabled`. This block
# DEEP-MERGES into grafana's own grafana.ini defaults (paths/analytics/log/
# server.domain) — it adds sections, never clobbers them.
#
# Default-OFF footprint: a single inert `[auth.generic_oauth] enabled=false`
# section (Grafana treats enabled=false as OAuth OFF → identical behavior:
# login form present, no redirect). No client_secret env, no login-form
# override, no server.root_url change when off. This inert section is the
# minimal unavoidable static-values footprint; see report for why a true
# byte-no-op is not reachable for a subchart-map gated by a parent flag.
victoria-metrics-k8s-stack:
  grafana:
    # client_secret → env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, sourced from
    # the existing K8s Secret (NEVER in grafana.ini). `optional: true` so the
    # env is harmless when SSO is OFF (the [auth.generic_oauth] enabled=false
    # already disables OAuth, and an absent secret won't block pod start). The
    # secret name is always non-empty (never `name: ''`, which K8s rejects).
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ $.Values.global.grafanaSso.clientSecret.secretName }}'
          key: '{{ $.Values.global.grafanaSso.clientSecret.key }}'
          optional: true
    grafana.ini:
      server:
        # root_url + serve_from_sub_path only take effect when SSO is on.
        root_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.rootUrl }}{{ end }}'
      auth:
        disable_login_form: '{{ and $.Values.global.grafanaSso.enabled $.Values.global.grafanaSso.autoLogin }}'
        oauth_auto_login: '{{ and $.Values.global.grafanaSso.enabled $.Values.global.grafanaSso.autoLogin }}'
      auth.generic_oauth:
        enabled: '{{ $.Values.global.grafanaSso.enabled }}'
        name: '{{ $.Values.global.grafanaSso.name }}'
        allow_sign_up: '{{ $.Values.global.grafanaSso.allowSignUp }}'
        client_id: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.clientId }}{{ end }}'
        scopes: '{{ $.Values.global.grafanaSso.scopes }}'
        auth_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.authUrl }}{{ end }}'
        token_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.tokenUrl }}{{ end }}'
        api_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.apiUrl }}{{ end }}'
        role_attribute_path: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.roleAttributePath }}{{ end }}'
        allowed_groups: '{{ if $.Values.global.grafanaSso.enabled }}{{ join "," $.Values.global.grafanaSso.allowedGroups }}{{ end }}'

# Grafana scale-to-zero — opt-in; requires lareira-keda-http installed.
# When enabled, an HTTPScaledObject scales the Grafana Deployment 0→1
# on first inbound request (cooldown 600s default).
grafanaBreathability:
  enabled: false
  scaling:
    minReplicas: 0
    maxReplicas: 2
    cooldownPeriod: 600
    targetPendingRequests: 1
  hosts:
    - grafana.example.com   # cluster overrides

# ── Grafana SSO via the fleet Authentik IdP (native OIDC) ──────────────
#
# Default-OFF reusable capability: gate the bundled Grafana behind the
# fleet Authentik IdP using Grafana's native [auth.generic_oauth].
#
# CANONICAL SURFACE: global.grafanaSso (NOT a bare top-level key).
#
# WHY `global`: Grafana is a sub-dependency of the victoria-metrics-k8s-stack
# subchart. A Helm parent CANNOT inject computed values into a subchart, and a
# parent's bare top-level value is invisible inside a subchart's `tpl` context —
# only Helm `global.*` propagates parent→subchart. The subchart-side injection
# below (under `victoria-metrics-k8s-stack.grafana`) reads `global.grafanaSso.*`
# via the grafana subchart's `tpl`-evaluated `grafana.ini` string values, so the
# single switch `global.grafanaSso.enabled=true` is the only mechanism that
# actually reaches the rendered Grafana. (The dead `vmStack:` key above is a
# separate pre-existing passthrough bug — see report; left untouched here so as
# not to change default behavior.)
#
# When global.grafanaSso.enabled=false (default) NOTHING is injected — the
# subchart grafana.ini section, env, and login-form overrides are all empty,
# so rendered output is byte-identical to the no-SSO baseline.
global:
  grafanaSso:
    enabled: false
    # Public-facing Grafana URL — sets [server] root_url + serve_from_sub_path=false.
    rootUrl: ""                # e.g. https://grafana.rio.pleme.lol
    name: "Authentik"          # OAuth button label
    clientId: ""               # e.g. grafana-rio
    authUrl:  "https://auth.quero.cloud/application/o/authorize/"
    tokenUrl: "https://auth.quero.cloud/application/o/token/"
    apiUrl:   "https://auth.quero.cloud/application/o/userinfo/"
    scopes: "openid email profile"
    allowedGroups: []          # e.g. [saguao] → CSV in [auth.generic_oauth] allowed_groups
    roleAttributePath: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
    autoLogin: true            # disable_login_form=true + oauth_auto_login=true → straight to Authentik
    allowSignUp: true          # auto-create Grafana users on first OIDC login (Google-federated first logins)
    # client_secret is NEVER placed in grafana.ini — it is read from an existing
    # K8s Secret via env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (envValueFrom below).
    clientSecret:
      secretName: grafana-oidc # existing Secret in the monitoring namespace
      key: client-secret

observability:
  prometheusRule:
    enabled: true
    rules:
      - alert: VMSingleDown
        expr: |
          absent(kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"})
          or kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: lareira-vm-stack
        annotations:
          summary: "VMSingle has 0 ready replicas — metric ingest broken"
          description: "vmagent → VMSingle write path is down. New metrics aren't being persisted; existing ones still queryable from buffer if vmagent is still running."
          runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/vmsingle-down"
      - alert: VMAgentScrapeErrors
        expr: |
          sum(rate(vm_promscrape_scrapes_failed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: lareira-vm-stack
        annotations:
          summary: "vmagent failing >1 scrape/sec for 10m"
          description: "Some scrape targets unreachable. Check ServiceMonitor selectors, network policies, or target pod readiness."
          runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/scrape-errors"
