# lareira-vm-stack — pleme-io defaults for victoria-metrics-k8s-stack.
#
# Single-replica everything (rio is single-node). Tunable per cluster.
# VMCluster is intentionally OFF (use VMSingle for home-edge); turn on
# only if running multi-node with HA.

enabled: false

# ── VM metric-path workloads — the pleme-io primitive (pleme-lib >= 0.24.0) ──
#
# VMSingle (store) + VMAgent (scrape) + VMAlert (rule-eval) + VMRule (the alert
# WHAT) are rendered by templates/vm-workloads.yaml via the pleme-lib VM CRD
# family — the abstracted "VictoriaMetrics expressed in pleme-io primitives"
# surface. The upstream subchart's own vmsingle/vmagent/vmalert are DISABLED
# (above); it keeps only the controller surface (operator + CRDs + Grafana +
# kube-state-metrics + scrapes + VMAlertmanager).
#
# `name:` is verbatim and matches the upstream-release-derived CR name, so each
# CR ADOPTS the existing operator-managed Deployment/Service/PVC in place — the
# 30Gi metric PVC and every service-DNS the mesh depends on are preserved. The
# specs below reproduce the live operator-effective spec field-for-field so the
# operator no-ops (verified by a `helm template`-vs-live diff before merge).
# Operator-injected fields (license:{}, configMaps:[], externalLabels:{}) are
# re-added by the operator and intentionally omitted here.
vm:
  apiVersion: operator.victoriametrics.com/v1beta1
  single:
    enabled: true
    name: lareira-vm-stack-victoria-metrics-k8s-stack
    image: { tag: v1.113.0 }
    port: "8429"
    replicaCount: 1
    retentionPeriod: "10d"
    extraArgs:
      vmalert.proxyURL: http://vmalert-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8080
    storage:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests: { storage: 30Gi }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: 2000m, memory: 2Gi }
  agent:
    enabled: true
    name: lareira-vm-stack-victoria-metrics-k8s-stack
    image: { tag: v1.113.0 }
    port: "8429"
    replicaCount: 1
    scrapeInterval: 30s
    selectAllByDefault: true
    externalLabels:
      cluster: rio
      datacenter: bristol-tn
    extraArgs:
      promscrape.dropOriginalLabels: "true"
      promscrape.streamParse: "true"
    remoteWrite:
      - url: http://vmsingle-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8429/api/v1/write
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
  alert:
    enabled: true
    name: lareira-vm-stack-victoria-metrics-k8s-stack
    image: { tag: v1.113.0 }
    port: "8080"
    replicaCount: 1
    selectAllByDefault: true
    evaluationInterval: 30s
    datasource:
      url: http://vmsingle-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8429
    remoteRead:
      url: http://vmsingle-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8429
    remoteWrite:
      url: http://vmsingle-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8429/api/v1/write
    extraArgs:
      http.pathPrefix: "/"
      remoteWrite.disablePathAppend: "true"
    # Notify the pleme-lib VMAlertmanager (below) via its Service DNS. The short
    # name fixes the upstream's 63-char STS-label bug (the old CR name produced a
    # 69-char controller-revision-hash label → the Alertmanager pod could never
    # be created → the operator error-looped for 20h). Service-DNS (not pod-0
    # StatefulSet DNS) is robust to pod identity.
    notifiers:
      - url: http://vmalertmanager-lareira-vm-stack.monitoring.svc.cluster.local.:9093
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 1000m, memory: 512Mi }
  # ── VMAlertmanager — the alert sink, expressed via pleme-lib ──────────────
  # Migrated off the upstream subchart to FIX a pre-existing 20h outage: the
  # upstream CR name `lareira-vm-stack-victoria-metrics-k8s-stack` (43 chars)
  # made the StatefulSet pod's controller-revision-hash label exceed K8s's
  # 63-char limit → FailedCreate, 0/1 forever. A short `name` (the pleme-lib
  # 0.24.0 override) keeps the label well under 63. Config is the inline
  # blackhole base (reproduces the live config; no ntfy target exists on rio
  # yet — a future VMAlertmanagerConfig via pleme-lib.vmAlertmanagerConfig adds
  # real routing). selectAllByDefault picks up any VMAlertmanagerConfig later.
  alertmanager:
    enabled: true
    name: lareira-vm-stack
    image: { tag: v0.27.0 }
    port: "9093"
    replicaCount: 1
    retention: 120h
    selectAllByDefault: true
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 5Gi }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    configRawYaml: |
      receivers:
        - name: blackhole
      route:
        receiver: blackhole
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
  # The alert WHAT, now a native VMRule (replaces the disabled PrometheusRule).
  # vmalert evaluates it via selectAllByDefault.
  rules:
    enabled: true
    groups:
      - name: lareira-vm-stack
        interval: 30s
        rules:
          - alert: VMSingleDown
            expr: |
              absent(kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"})
              or kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"} == 0
            for: 2m
            labels:
              severity: critical
              component: lareira-vm-stack
            annotations:
              summary: "VMSingle has 0 ready replicas — metric ingest broken"
              description: "vmagent → VMSingle write path is down. New metrics aren't being persisted; existing ones still queryable from buffer if vmagent is still running."
              runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/vmsingle-down"
          - alert: VMAgentScrapeErrors
            expr: |
              sum(rate(vm_promscrape_scrapes_failed_total[5m])) > 1
            for: 10m
            labels:
              severity: warning
              component: lareira-vm-stack
            annotations:
              summary: "vmagent failing >1 scrape/sec for 10m"
              description: "Some scrape targets unreachable. Check ServiceMonitor selectors, network policies, or target pod readiness."
              runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/scrape-errors"

# ── Upstream subchart overrides ────────────────────────────────────────
#
# The upstream dependency in Chart.yaml is declared with NO `alias:`, so
# Helm routes subchart values ONLY under its real name:
# `victoria-metrics-k8s-stack`. (A `vmStack:` block here would SILENTLY
# NO-OP — that was the pre-existing dead-key bug this chart fixed by
# re-keying every override under the real subchart name.)
#
# `grafana:` is a sub-dependency of this subchart (declared `name: grafana`,
# no alias), so its overrides live under `victoria-metrics-k8s-stack.grafana`.
# The base Grafana config below DEEP-MERGES with the `global.grafanaSso`
# OIDC injection block at the bottom of this file — Grafana ends up with
# datasources + persistence + admin + sidecar AND the (default-off, gated)
# [auth.generic_oauth] injection.
victoria-metrics-k8s-stack:
  enabled: true

  # ── VMSingle: the metric store ──────────────────────────────────────
  # MIGRATED to the pleme-lib VM primitive (templates/vm-workloads.yaml + the
  # top-level `vm:` block below). Disabled here so the upstream subchart stops
  # rendering it; the pleme-lib VMSingle adopts the operator-managed
  # Deployment/Service/PVC in place via the `vm.single.name` override (the 30Gi
  # data PVC survives). The spec below is retained as the reproduction source.
  vmsingle:
    enabled: false
    spec:
      retentionPeriod: "10d"
      # NO custom storageDataPath: the VM-operator mounts the `storage` PVC at
      # its default data path and serves from there. Setting a custom path
      # (was `/vm-data`) without a matching raw `volumes` entry makes the
      # operator's admission webhook reject the VMSingle ("spec.volumes must
      # have at least 1 value for storageDataPath=/vm-data") — which left rio
      # with NO metric store (vmsingle absent) + a wedged HR rollback loop.
      # The 30Gi PVC below already provides persistence at the default path.
      storage:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 30Gi }
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits:   { cpu: 2000m, memory: 2Gi }

  vmcluster:
    enabled: false

  # ── VMAgent: scrape ServiceMonitor + PodMonitor + VMScrape ──────────
  # MIGRATED to the pleme-lib VM primitive (see the top-level `vm:` block).
  vmagent:
    enabled: false
    spec:
      replicaCount: 1
      scrapeInterval: 30s
      externalLabels:
        cluster: rio
        datacenter: bristol-tn
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 1000m, memory: 1Gi }
      selectAllByDefault: true

  # ── VMAlert: evaluate rules → Alertmanager ─────────────────────────
  # MIGRATED to the pleme-lib VM primitive (see the top-level `vm:` block).
  vmalert:
    enabled: false
    spec:
      evaluationInterval: 30s
      replicaCount: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 1000m, memory: 512Mi }
      selectAllByDefault: true
      notifier:
        url: "http://vmalertmanager-vm.monitoring.svc:9093"

  # ── Alertmanager: MIGRATED to the pleme-lib VM primitive (top-level `vm:`
  #    block) with a SHORT name that fixes the 63-char STS-label outage.
  #    Disabled here so the upstream stops rendering the long-named (broken) CR;
  #    helm deletes it + the operator GCs the failed 0/1 StatefulSet. The spec
  #    below is retained as the reproduction source.
  alertmanager:
    enabled: false
    spec:
      replicaCount: 1
      retention: 120h
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 5Gi } }
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits:   { cpu: 500m, memory: 256Mi }
    config:
      route:
        receiver: blackhole
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: blackhole

  # ── Grafana: queries vmsingle + victoria-logs ──────────────────────
  # Pangea-grafana / pangea-dashboards owns folders + dashboards via the
  # Grafana HTTP API. Sidecar dashboards/datasources are DISABLED.
  #
  # This base config DEEP-MERGES with the `global.grafanaSso` OIDC
  # injection block at the bottom of this file (Helm merges two values
  # under the same `victoria-metrics-k8s-stack.grafana` path): the
  # `grafana.ini` + `envValueFrom` keys the SSO block contributes land
  # ALONGSIDE the datasources/persistence/admin/sidecar config here.
  grafana:
    enabled: true
    replicas: 1
    adminUser: admin
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 1000m, memory: 512Mi }
    sidecar:
      dashboards: { enabled: false }
      datasources: { enabled: false }
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: vm
            access: proxy
            # The operator names the VMSingle Service `vmsingle-<CR name>`. The CR
            # name is `lareira-vm-stack-victoria-metrics-k8s-stack` (the upstream
            # release-derived name the pleme-lib VMSingle adopts). The previous
            # `vmsingle-vm` target was a non-existent Service → Grafana's metric
            # datasource silently could not reach VM. Fixed to the real Service.
            url: http://vmsingle-lareira-vm-stack-victoria-metrics-k8s-stack.monitoring.svc:8429
            isDefault: true
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            uid: vlogs
            access: proxy
            url: http://victoria-logs.monitoring.svc:9428
    plugins:
      - victoriametrics-logs-datasource

    # ── Grafana OIDC injection — driven by global.grafanaSso ───────────
    #
    # Grafana is a sub-dependency of this subchart, so this injection lives
    # under `victoria-metrics-k8s-stack.grafana` and DEEP-MERGES with the
    # base Grafana config above (Helm merges both definitions under the
    # same path). It ADDS the `envValueFrom` + `grafana.ini` SSO sections;
    # it does not clobber datasources/persistence/admin/sidecar.
    #
    # Map leaf values are `tpl`-gated on `global.grafanaSso.enabled`. This
    # block DEEP-MERGES into grafana's own grafana.ini defaults
    # (paths/analytics/log/server.domain) — it adds sections, never clobbers.
    #
    # Default-OFF footprint: a single inert `[auth.generic_oauth] enabled=false`
    # section (Grafana treats enabled=false as OAuth OFF → identical behavior:
    # login form present, no redirect). No client_secret env, no login-form
    # override, no server.root_url change when off. This inert section is the
    # minimal unavoidable static-values footprint; see report for why a true
    # byte-no-op is not reachable for a subchart-map gated by a parent flag.
    #
    # client_secret → env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, sourced from
    # the existing K8s Secret (NEVER in grafana.ini). `optional: true` so the
    # env is harmless when SSO is OFF (the [auth.generic_oauth] enabled=false
    # already disables OAuth, and an absent secret won't block pod start). The
    # secret name is always non-empty (never `name: ''`, which K8s rejects).
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ $.Values.global.grafanaSso.clientSecret.secretName }}'
          key: '{{ $.Values.global.grafanaSso.clientSecret.key }}'
          optional: true
    grafana.ini:
      server:
        # root_url + serve_from_sub_path only take effect when SSO is on.
        root_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.rootUrl }}{{ end }}'
      auth:
        disable_login_form: '{{ and $.Values.global.grafanaSso.enabled $.Values.global.grafanaSso.autoLogin }}'
        oauth_auto_login: '{{ and $.Values.global.grafanaSso.enabled $.Values.global.grafanaSso.autoLogin }}'
      auth.generic_oauth:
        enabled: '{{ $.Values.global.grafanaSso.enabled }}'
        name: '{{ $.Values.global.grafanaSso.name }}'
        allow_sign_up: '{{ $.Values.global.grafanaSso.allowSignUp }}'
        client_id: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.clientId }}{{ end }}'
        scopes: '{{ $.Values.global.grafanaSso.scopes }}'
        auth_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.authUrl }}{{ end }}'
        token_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.tokenUrl }}{{ end }}'
        api_url: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.apiUrl }}{{ end }}'
        role_attribute_path: '{{ if $.Values.global.grafanaSso.enabled }}{{ $.Values.global.grafanaSso.roleAttributePath }}{{ end }}'
        allowed_groups: '{{ if $.Values.global.grafanaSso.enabled }}{{ join "," $.Values.global.grafanaSso.allowedGroups }}{{ end }}'
        # GOTCHA #2 (the second of the two non-obvious Authentik-OIDC blockers):
        # Grafana extracts the user's groups for allowed_groups + role_attribute_path
        # via THIS JMESPath. If unset, Grafana ignores the groups claim entirely →
        # every SSO login fails "user not a member of one of the required groups"
        # even when Authentik emits groups correctly. `groups` is the claim key the
        # Authentik groups scope mapping emits. (GOTCHA #1, IdP-side: that scope
        # mapping MUST return a dict {'groups': [...]} — a bare list is silently
        # dropped by Authentik's userinfo endpoint. See pleme-lib.authentikGroupsScope.)
        groups_attribute_path: '{{ if $.Values.global.grafanaSso.enabled }}groups{{ end }}'

  # ── Default scrape targets — K3s/embedded-only ─────────────────────
  kubelet: { enabled: true }
  kubeApiServer: { enabled: true }
  coreDns: { enabled: true }
  kubeControllerManager: { enabled: false }
  kubeScheduler: { enabled: false }
  kubeEtcd: { enabled: false }
  kubeProxy: { enabled: false }

  # NixOS host runs node_exporter directly. The upstream toggle is the
  # node-exporter SUBCHART's own condition `prometheus-node-exporter.enabled`
  # (there is NO top-level `nodeExporter:` key upstream — the old
  # `vmStack.nodeExporter` was doubly dead: wrong namespace AND wrong key).
  prometheus-node-exporter:
    enabled: false

  defaultRules:
    create: true

# Grafana scale-to-zero — opt-in; requires lareira-keda-http installed.
# When enabled, an HTTPScaledObject scales the Grafana Deployment 0→1
# on first inbound request (cooldown 600s default).
#
# The Grafana Service/Deployment name is the grafana subchart default
# `<release>-grafana` (e.g. `lareira-vm-stack-grafana`) — there is no
# fullnameOverride forcing `vm-grafana` (that override never reached the
# subchart and has been dropped). The scaledobject template targets the
# release-derived name accordingly.
grafanaBreathability:
  enabled: false
  scaling:
    minReplicas: 0
    maxReplicas: 2
    cooldownPeriod: 600
    targetPendingRequests: 1
  hosts:
    - grafana.example.com   # cluster overrides

# ── Grafana SSO via the fleet Authentik IdP (native OIDC) ──────────────
#
# Default-OFF reusable capability: gate the bundled Grafana behind the
# fleet Authentik IdP using Grafana's native [auth.generic_oauth].
#
# CANONICAL SURFACE: global.grafanaSso (NOT a bare top-level key).
#
# WHY `global`: Grafana is a sub-dependency of the victoria-metrics-k8s-stack
# subchart. A Helm parent CANNOT inject computed values into a subchart, and a
# parent's bare top-level value is invisible inside a subchart's `tpl` context —
# only Helm `global.*` propagates parent→subchart. The subchart-side injection
# above (under `victoria-metrics-k8s-stack.grafana`) reads `global.grafanaSso.*`
# via the grafana subchart's `tpl`-evaluated `grafana.ini` string values, so the
# single switch `global.grafanaSso.enabled=true` is the only mechanism that
# actually reaches the rendered Grafana.
#
# When global.grafanaSso.enabled=false (default) NOTHING active is injected —
# the [auth.generic_oauth] section renders enabled=false, root_url/client_id are
# empty, no login-form override — so Grafana behaves identically to the no-SSO
# baseline.
global:
  grafanaSso:
    enabled: false
    # Public-facing Grafana URL — sets [server] root_url + serve_from_sub_path=false.
    rootUrl: ""                # e.g. https://grafana.rio.pleme.lol
    name: "Authentik"          # OAuth button label
    clientId: ""               # e.g. grafana-rio
    authUrl:  "https://auth.quero.cloud/application/o/authorize/"
    tokenUrl: "https://auth.quero.cloud/application/o/token/"
    apiUrl:   "https://auth.quero.cloud/application/o/userinfo/"
    scopes: "openid email profile"
    allowedGroups: []          # e.g. [saguao] → CSV in [auth.generic_oauth] allowed_groups
    roleAttributePath: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
    autoLogin: true            # disable_login_form=true + oauth_auto_login=true → straight to Authentik
    allowSignUp: true          # auto-create Grafana users on first OIDC login (Google-federated first logins)
    # client_secret is NEVER placed in grafana.ini — it is read from an existing
    # K8s Secret via env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (envValueFrom above).
    clientSecret:
      secretName: grafana-oidc # existing Secret in the monitoring namespace
      key: client-secret

observability:
  prometheusRule:
    enabled: true
    rules:
      - alert: VMSingleDown
        expr: |
          absent(kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"})
          or kube_statefulset_status_replicas_available{statefulset=~"vmsingle.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: lareira-vm-stack
        annotations:
          summary: "VMSingle has 0 ready replicas — metric ingest broken"
          description: "vmagent → VMSingle write path is down. New metrics aren't being persisted; existing ones still queryable from buffer if vmagent is still running."
          runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/vmsingle-down"
      - alert: VMAgentScrapeErrors
        expr: |
          sum(rate(vm_promscrape_scrapes_failed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: lareira-vm-stack
        annotations:
          summary: "vmagent failing >1 scrape/sec for 10m"
          description: "Some scrape targets unreachable. Check ServiceMonitor selectors, network policies, or target pod readiness."
          runbook_url: "https://runbooks.pleme.io/lareira-vm-stack/scrape-errors"
