{{- /*
VM metric-path workloads — expressed via the pleme-lib VM CRD family.

The DESTINATION half of lareira-vm-stack: the metric ingest → store → rule-eval
path (VMSingle + VMAgent + VMAlert) and the alert rules (VMRule) are rendered by
the pleme-io primitive (`pleme-lib.vm*`, pleme-lib >= 0.24.0) — NOT by the
upstream victoria-metrics-k8s-stack subchart's templating (those three are
disabled there; see values.yaml). The upstream subchart now provides only the
controller surface: the VM operator + CRDs, Grafana, kube-state-metrics, the
default scrape targets (kubelet/apiServer/coreDns), defaultRules, and the
config-Secret-entangled VMAlertmanager.

Adoption-in-place (no-op migration): each CR carries `vm.<kind>.name:
lareira-vm-stack-victoria-metrics-k8s-stack` (verbatim, via the pleme-lib name
override) so it ADOPTS the operator-managed Deployment/Service/PVC that already
exists under the upstream-derived name. The VMSingle keeps its 30Gi data PVC;
the service-DNS the mesh depends on (vmagent→vmsingle remoteWrite,
vmalert→vmsingle datasource, vmalert→vmalertmanager notifiers, Grafana
datasource) is unchanged. Specs reproduce the live operator-effective spec
field-for-field — a clean `helm template`-vs-live diff is the merge gate.

Gated on the chart master `.Values.enabled` (default-off), exactly like the
chart's other templates. Inter-component URLs are service-DNS (deterministic
from the matched names); the VMAlert→VMAlertmanager notifier pod-DNS is
reproduced verbatim from the live spec (a future pleme-lib.vmStack auto-wiring
helper is the destination for computing it).
*/ -}}
{{- if .Values.enabled }}
{{- /* Portability knob #1 — `vm.serviceNamespace`. The inter-component URLs
       (vmagent→vmsingle remoteWrite, vmalert→vmsingle datasource/remoteRead/
       remoteWrite, vmalert→vmalertmanager notifier, vmsingle→vmalert proxyURL)
       default to rio's `monitoring` namespace verbatim in values.yaml. When a
       consumer in ANOTHER namespace sets `vm.serviceNamespace`, recompute those
       URLs from the deterministic CR Service names + that namespace, so the mesh
       wires itself in-namespace with ONE value instead of six URL overrides.
       OPT-IN: unset (rio) → values used verbatim → byte-identical render. The
       rewrite touches only these URL fields — never vm.rules (VMRule Go-template
       exprs) or vm.alertmanager.configRawYaml (Alertmanager Go-templates). */ -}}
{{- if (.Values.vm).serviceNamespace }}
{{- $ns := .Values.vm.serviceNamespace -}}
{{- $singleName := (((.Values.vm).single).name) | default (include "lareira-vm-stack.fullname" .) -}}
{{- $amName := (((.Values.vm).alertmanager).name) | default (include "lareira-vm-stack.fullname" .) -}}
{{- $singleBase := printf "http://vmsingle-%s.%s.svc.cluster.local.:8429" $singleName $ns -}}
{{- $amBase := printf "http://vmalertmanager-%s.%s.svc.cluster.local.:9093" $amName $ns -}}
{{- $proxyUrl := printf "http://vmalert-%s.%s.svc.cluster.local.:8080" $singleName $ns -}}
{{- if and ((.Values.vm).single) (((.Values.vm).single).extraArgs) (hasKey .Values.vm.single.extraArgs "vmalert.proxyURL") }}
{{- $_ := set .Values.vm.single.extraArgs "vmalert.proxyURL" $proxyUrl -}}
{{- end }}
{{- if and ((.Values.vm).agent) (((.Values.vm).agent).remoteWrite) }}
{{- range $rw := .Values.vm.agent.remoteWrite }}{{- $_ := set $rw "url" (printf "%s/api/v1/write" $singleBase) -}}{{- end }}
{{- end }}
{{- with (.Values.vm).alert }}
{{- if .datasource }}{{- $_ := set .datasource "url" $singleBase -}}{{- end }}
{{- if .remoteRead }}{{- $_ := set .remoteRead "url" $singleBase -}}{{- end }}
{{- if .remoteWrite }}{{- $_ := set .remoteWrite "url" (printf "%s/api/v1/write" $singleBase) -}}{{- end }}
{{- if .notifiers }}{{- range $n := .notifiers }}{{- $_ := set $n "url" $amBase -}}{{- end }}{{- end }}
{{- end }}
{{- end }}
{{- /* Portability knob #2 — `vm.storageClassName`. The PVC storageClassName
       defaults to rio's `local-path`. One value cascades to the VMSingle data
       PVC and the VMAlertmanager volumeClaimTemplate so a portable consumer
       (EKS gp3, etc.) sets ONE knob instead of editing each nested storage spec.
       OPT-IN: unset → values verbatim → byte-identical render. */ -}}
{{- if (.Values.vm).storageClassName }}
{{- $sc := .Values.vm.storageClassName -}}
{{- if (((.Values.vm).single).storage) }}{{- $_ := set .Values.vm.single.storage "storageClassName" $sc -}}{{- end }}
{{- if ((((((.Values.vm).alertmanager).storage)).volumeClaimTemplate).spec) }}{{- $_ := set .Values.vm.alertmanager.storage.volumeClaimTemplate.spec "storageClassName" $sc -}}{{- end }}
{{- end }}
{{- /* Drive the Alertmanager config from the `alerting:` toggle surface: the
       computed blackhole-or-ntfy config replaces vm.alertmanager.configRawYaml
       before the VMAlertmanager renders. One switch (alerting.receiver) flips
       the whole receiver/route tree. */ -}}
{{- if and .Values.alerting .Values.alerting.enabled ((.Values.vm).alertmanager) }}
{{- $_ := set .Values.vm.alertmanager "configRawYaml" (include "lareira-vm-stack.alertmanagerConfig" .) }}
{{- end }}
{{- if ((.Values.vm).single).enabled }}
---
{{- include "pleme-lib.vmSingle" . }}
{{- end }}
{{- if ((.Values.vm).agent).enabled }}
---
{{- include "pleme-lib.vmAgent" . }}
{{- end }}
{{- if ((.Values.vm).alert).enabled }}
---
{{- include "pleme-lib.vmAlert" . }}
{{- end }}
{{- if ((.Values.vm).alertmanager).enabled }}
---
{{- include "pleme-lib.vmAlertmanager" . }}
{{- end }}
{{- if ((.Values.vm).rules).enabled }}
---
{{- include "pleme-lib.vmRule" . }}
{{- end }}
{{- end }}
