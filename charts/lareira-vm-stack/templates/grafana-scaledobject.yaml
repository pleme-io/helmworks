{{/*
Optional Grafana HTTPScaledObject — scale 0→1→0 on inbound dashboard
traffic. Requires lareira-keda-http to be installed in the cluster.
Default off; enable per-cluster via grafanaBreathability.enabled: true.
*/}}
{{- if .Values.enabled }}
{{- if and .Values.grafanaBreathability .Values.grafanaBreathability.enabled }}
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ include "lareira-vm-stack.fullname" . }}-grafana
  labels:
    {{- include "lareira-vm-stack.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.grafanaBreathability.hosts }}
    - {{ . | quote }}
    {{- end }}
  pathPrefixes: ["/"]
  # The grafana subchart names its Deployment + Service `<release>-grafana`
  # (no fullnameOverride reaches the subchart — see values.yaml). Target that
  # real name off the release name rather than the stale `vm-grafana` artifact.
  scaleTargetRef:
    name: {{ .Release.Name }}-grafana
    kind: Deployment
    apiVersion: apps/v1
    service: {{ .Release.Name }}-grafana
    port: 80
  replicas:
    min: {{ .Values.grafanaBreathability.scaling.minReplicas }}
    max: {{ .Values.grafanaBreathability.scaling.maxReplicas }}
  scaledownPeriod: {{ .Values.grafanaBreathability.scaling.cooldownPeriod }}
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: {{ .Values.grafanaBreathability.scaling.targetPendingRequests }}
      window: 30s
{{- end }}
{{- end }}
