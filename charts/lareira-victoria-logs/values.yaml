# lareira-victoria-logs — pleme-io VictoriaLogs defaults.

enabled: false

victoria-logs-single:
  enabled: true
  server:
    # ONLY the mutable retention args are set here. The PVC (volumeClaimTemplate
    # size + storageClassName) and other immutable StatefulSet fields are left at
    # the subchart defaults — which is exactly what built the LIVE rio STS
    # (10Gi PVC, empty storageClassName). Setting persistentVolume.size or
    # storageClassName here re-keyed those immutable fields and the helm upgrade
    # was Forbidden (StatefulSet spec immutability) → rollback (0.1.1, 0.1.2).
    # Retention args live on the pod template (mutable) so they apply cleanly.
    retentionPeriod: 10d
    retentionDiskSpaceUsage: 8GiB
  serviceMonitor:
    enabled: true

observability:
  prometheusRule:
    enabled: true
    rules:
      - alert: VictoriaLogsDown
        expr: |
          absent(kube_statefulset_status_replicas_available{statefulset="victoria-logs"})
          or kube_statefulset_status_replicas_available{statefulset="victoria-logs"} == 0
        for: 5m
        labels:
          severity: critical
          component: lareira-victoria-logs
        annotations:
          summary: "VictoriaLogs has 0 ready replicas"
          description: "Log ingest from Vector is failing. New logs are buffered in Vector's local disk; resolve before that buffer fills."
          runbook_url: "https://runbooks.pleme.io/lareira-victoria-logs/down"
      - alert: VictoriaLogsDiskNearFull
        expr: |
          kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"vl-volume.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"vl-volume.*"} > 0.85
        for: 10m
        labels:
          severity: warning
          component: lareira-victoria-logs
        annotations:
          summary: "VictoriaLogs PVC >85% full"
          description: "Retention will start dropping data. pleme-storage-elastic should auto-expand if labelled breathable=true; otherwise the operator must intervene."
          runbook_url: "https://runbooks.pleme.io/lareira-victoria-logs/disk-full"
