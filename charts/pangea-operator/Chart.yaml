apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 11 CRDs for infrastructure lifecycle, AMI pipeline, compliance testing, and dynamic synthesizer formats. v0.8.4 adds per-workspace tri-state pause to OperatorPolicy/default (spec.workspaceSuspend.{templates, catalogs} with `state: inherit | paused | active` per entry). Specific overrides general — template entries override catalog cascade, both override controllerSuspend/globalSuspend. `Active` is the surgical carve-out: keep reconciling under a more-general pause. Adds `pangea_workspace_active_override` gauge + `target` label on `pangea_policy_skipped_total` + 2 new alerts (PangeaWorkspacePaused, PangeaActiveOverridesActive) + `WorkspaceOverrides` printer column on OperatorPolicy. v0.8.5 ships the Q-set operability quick wins: `runbook_url` annotations on all 18 alerts pointing at pangea-operator/docs/RUNBOOKS.md; `helm.sh/resource-policy: keep` on every CRD; pinned compiler-sidecar default tag (no more `:latest`); new `logLevel` value threaded into RUST_LOG so debug toggles don't require an env-list edit; `category: pangea` on all 13 CRDs so `kubectl get pangea` works fleet-wide; pause-state alerts (info) bumped to 1h `for:` so short maintenance windows stay silent. v0.8.6 ships values.schema.json covering the OperatorPolicy surface + the useEmbeddedRuby/gemAuth dependency + the workspaceSuspend.state enum. Helm now fail-louds on typos (e.g. `state: paused-urgently`) and missing required fields (e.g. `useEmbeddedRuby=true` without a gem-auth Secret). v0.8.7 fixes PangeaDashboard CRD scope (was rendering Cluster; deployed as Namespaced — the kube derive needed the explicit `namespaced` flag). All 13 CRDs now render with the scope they were originally applied as; no CRD-scope-immutable conflicts on upgrade. v0.8.8 switches values.schema.json to auto-generated from a typed Rust mirror (`pangea_operator::chart_values::ChartValues` + schemars). Schema-affecting values changes now flow from the struct → `cargo run -- --generate-values-schema` instead of hand-edits. v0.8.9 ships PangeaFleetStatus — a new cluster-scoped operator-driven singleton CRD that surfaces the operator's running rollup of every pangea CRD class. `kubectl get pangeafleetstatus default` becomes the canonical at-a-glance fleet command (printer columns: WCATS, TEMPLATES, READY, FAILED, GEMS, NAMESPACES, UPDATED, AGE). The fleet-status controller refreshes the singleton every 30s and bypasses OperatorPolicy.globalSuspend so fleet visibility stays live during a pause. New ClusterRole rules: pangeafleetstatuses (with create) + pangeadashboards. Pairs with operator @acb4e1a. v0.8.10 surfaces executor.rubyWorkers in helm values (threaded into PANGEA_RUBY_WORKERS env). Default 1 = today's single-owner shape; consumers bump to N≥2 to engage the magnus thread pool. Pairs with operator @65d89d5+ which provides the RubyPool round-robin dispatcher. v0.8.11 wires the OpenTelemetry OTLP-gRPC exporter (X1 of the Crossplane-absorb plan). New observability.otel.{endpoint,serviceName} values surface as OTEL_EXPORTER_OTLP_ENDPOINT + OTEL_SERVICE_NAME env. When endpoint is empty (default), operator emits no traces (logs unchanged); when set, per-phase reconcile spans (handle_pending, handle_compiling, handle_planning, handle_applying, …) export to a Tempo / VictoriaTraces / Jaeger backend the consumer configures separately. v0.8.12 ships outputBindings (X2 of the Crossplane-absorb plan). Each InfrastructureTemplate may declare `spec.outputBindings[]` pairing a tofu output address with a target Secret/key/namespace (and an optional `sensitive: true` label). The operator publishes each binding via server-side apply after a successful apply, cross-namespace, with managed-by + provenance labels and a same-namespace ownerRef. RBAC widens secrets to get/list/watch/create/update/patch (was get/list/watch). New metric `pangea_output_bindings_published_total{template, namespace, result}` (result ∈ published|output_missing|errored). v0.8.13 regenerates the InfrastructureTemplate CRD bundle so the X2 `spec.outputBindings[]` field actually surfaces in the apiserver schema. 0.8.12 shipped only the operator-side hookup + the RBAC widen; the chart's `crds/infrastructuretemplate.yaml` was hand-authored upstream of the operator's `--generate-crds` output and didn't pick up the new field, so on rio the chart- controller deploy succeeded but `kubectl explain infrastructuretemplate.spec.outputBindings` returned empty. 0.8.13 swaps in the regenerated bundle (still preserving the `helm.sh/resource-policy: keep` annotation that the generator doesn't yet emit). v0.8.14 ships a defense-in-depth alert family for the bug class that hit rio on 2026-05-07 — status-write feedback loops in `template_controller` (~123 PATCH/sec) and `operator_policy_controller` (~76 reconciles/sec). New values block `prometheusRules.reconcileRateAnomaly` (default OFF) ships three alerts: PangeaControllerReconcileRateHigh (warning, >1/sec 1m), PangeaControllerReconcileRateCritical (critical, >10/sec 5m), PangeaOperatorErrorRateHigh (warning, >0.5 err/sec 10m). Flip `enabled: true` per cluster after baselining the steady- state reconcile rate. v0.8.15 surfaces the M0.10–M0.12 magma backend (in-process IaC executor) under `executor.magma.{enabled, shape, planCheckpoint}`. When `enabled: true`, the deployment renders three new env vars (PANGEA_EXECUTOR, PANGEA_MAGMA_SHAPE, PANGEA_MAGMA_PLAN_CHECKPOINT) that wire the operator-wide default to MagmaExecutor. Per-CR override via `Pangea.spec.executor: magma|tofu` still wins. The operator image must be built with the `executor_magma` cargo feature for the flag to take effect — image builds remain on the existing release-train, so `enabled: false` (default) keeps every deployment on TofuExecutor regardless of feature bits. Per theory/MAGMA-OPERATOR-BACKEND.md §VI (canonical dual-backend selection model). v0.8.17 adds `rubyIsolation` (embedded|process; only consulted when useEmbeddedRuby=true). `process` sets PANGEA_COMPILER_BACKEND=process — each Ruby DSL compile runs in a fresh `pangea-operator --compile-worker` child that boots its own magnus VM, serves one request, and exits, so cross-template VM contamination ($LOADED_FEATURES rows, sticky Pangea::Resources autoloads, leaked constants — the class root-caused 2026-06-05) is unrepresentable by construction rather than chased by an in-VM purge. Costs a magnus boot (~1-3s) per compile; PANGEA_RUBY_WORKERS bounds concurrent worker processes. Default `embedded` keeps the long-lived in-thread VM; requires an embedded_ruby-feature operator image (release-train default). Pairs with operator @be7bbd6 (ruby::process_backend + ruby::worker + ruby::wire, 9 tests). v0.8.30 adds the enjulho tiered-config surface — a new `config:` values block + `templates/tiered-config.yaml` consuming the pleme-lib.tieredConfig mixin, rendering the operator's shikumi OperatorConfig FILE tier as a reconciled ConfigMap (config-as-reconciled-Helm). DESTINATION FORM, default-off (`config.file.enabled: false`) so the live render is byte-unchanged; the committed target for the config.rs file-tier ConfigStore discovery follow-on (the env → reconciled-Helm cutover). Secrets are never rendered (PGPASSWORD / API tokens stay direct env / secretKeyRef). v0.8.32 adds a breathe.pleme.io CpuBand for the operator's own Deployment (breathe.cpu.enabled, default true, dryRun:true, restartFreeOnly). MemoryBand is deliberately omitted -- an external one already targets this Deployment (lareira-observe-operator); declaring a second here would collide. `breathe.enabled: false` disables both. v0.8.33 adds `executor.magma.postgres` — a convenience surface (theory/MAGMA-POSTGRES-LIFECYCLE.md M1) that renders `PGHOST`/`PGPORT`/`PGUSER`/`PGDATABASE`/`PGPASSWORD` env vars plus a pg-wait initContainer automatically when `postgres.host` is set, instead of every magma-enabled consumer hand-authoring ~30 lines of `env:`/`initContainers:` YAML (the shape a magma-enabled consumer's HelmRelease hand-wrote before this landed). Default empty `host` renders neither; byte-identical for every existing deployment (rio included) that does not set it. v0.8.34 adds `executor.magma.postgres.clusterName` — when set and `host` is empty, the chart derives `host` as `<clusterName>-rw.<namespace>.svc.cluster.local`, CNPG's own deterministic Service-naming convention, instead of requiring the FQDN to be hand-typed (which drifts/typos — the exact incident class that broke a first magma cutover, see theory/MAGMA-POSTGRES-LIFECYCLE.md's Secret-naming-collision entry). `host` remains a direct override for non-CNPG or cross-namespace backends. Fleet doctrine confirms this is the right shape: "discovery" here always means confirming a well-known, deterministic name — there is no live cluster-introspection primitive in the fleet (kanchi's cluster-discovery tier is real Rust code but unmerged and, by design, can only resolve a pre-known name, never enumerate by label) and reaching for one would reinvent what Kubernetes' own Service DNS already guarantees. v0.8.35 syncs the InfrastructureTemplate CRD's `spec.providerCredentials.porkbun` field (operator commit c0d195f) into the chart's `crds/infrastructuretemplate.yaml` — a surgical insert of just the porkbun block (matching aws/cloudflare/github's shape: a `secretRef` to a Secret holding the two-part `api_key`/`secret_api_key` pair), confirmed byte-identical to `--generate-crds`'s output for that subtree. This unblocks platform-dns, quero-dns, pleme-dns, example-com-dns, and cloudflare-pleme's registrar-delegation templates (all fixed to stop resolving Porkbun credentials at synth time in pangea-architectures) from actually getting real credentials at apply time via `InfrastructureTemplate.spec.providerCredentials.porkbun.secretRef`. Does NOT resolve this CRD's other, pre-existing baselined drift (tracked separately in pangea-operator's `scripts/crd-drift-baseline.txt` since 2026-06-24) — scoped strictly to the porkbun field, same surgical-insert discipline the operator commit itself used. v0.8.36 finishes the porkbun sync that 0.8.35 started: `spec.providerCredentials.porkbun` is a shared field on the `ProviderCredentials` struct embedded by every CRD in this chart, not just InfrastructureTemplate — 0.8.35 only regenerated `infrastructuretemplate.yaml`, leaving `amitest.yaml`, `complianceschedule.yaml`, `imagepipeline.yaml`, and `packerbuild.yaml` drifted against the operator's own `--generate-crds` output (caught by the crd-drift CI gate, red on main since the porkbun field landed). This regenerates all four — purely additive (the porkbun block only), confirmed byte-identical to `--generate-crds` for the changed subtree, `helm.sh/resource-policy: keep` annotation preserved. `infrastructuretemplate.yaml` and `operatorpolicy.yaml` keep their separate, pre-existing baselined drift (tracked since 2026-06-24) — untouched here. v0.8.37 adds `spec.approvedPlanHash` to `crds/infrastructuretemplate.yaml`, mirroring operator commit b61c2a0 (`feat(crd): spec.approvedPlanHash — GitOps-native plan approval`) — until now the field existed only under `status.approvedPlanHash`; the new spec field is checked as an OR-alternative in `handle_planning`'s `is_approved` gate, so existing direct `kubectl patch --subresource status` workflows keep working unchanged, but a cluster whose guardrails refuse that exact imperative mutation (a `guardrail` rule refusing imperative kubectl mutation is the field's own motivating case per the operator's doc comment) now has a real committed-manifest approval path: bump this field, commit, let Flux apply it, observe `status.lastCycle`. The operator never writes this field itself (spec is git-owned). Confirmed byte-identical to `--generate-crds`'s output for the added property via `yq`/`kubectl apply --dry-run=client`/`helm lint`; a surgical insert in the same spirit as 0.8.35/0.8.36, not a full CRD regen. Unblocks an IAM policy-widen plan pending approval from being approved without violating a FluxCD-only guardrail. v0.8.38 bumps the bundled `pleme-lib` dependency (file://../pleme-lib) to 0.40.2, which adds `livenessTimeout`/`readinessTimeout` overrides (default 1, Kubernetes' own implicit default, byte-identical render for every consumer not setting them) to `_probes.tpl` — root-caused live: this operator's health/readiness handlers (a trivial literal `"OK"` return for `/healthz`; a 2-second-bounded Postgres schema-presence check for `/readyz`) were intermittently missing the chart's previously-hardcoded 1-second `timeoutSeconds` under a burst of concurrent controller reconcile work — real work was in progress (visible in logs) each time a probe timed out, and a live cgroup `cpu.stat` read (`nr_throttled: 0`) ruled out kernel-enforced CPU throttling as the cause, pointing instead at tokio worker-thread contention from synchronous, unyielding reconcile-cycle compute (the permanent fix — wrapping that compute in `spawn_blocking` — is a Rust source change tracked separately, gated on the same upstream CI credential fix blocking a fresh image build). This chart-only change (no new image needed) is the immediately-deployable mitigation: widen the probe budget so kubelet stops killing a pod that's merely busy. v0.8.39 stops this operator's own CpuBand from carving the fleet control plane, and fixes the reason it could: `spec.dryRun` is DEAD CODE for CpuBand/MemoryBand/StorageBand — the band trait's `promotion_mode()` is `mode_spec().unwrap_or(ShadowConfirmEffect)` and never consults `dry_run()` — so this band, authored `dryRun: true` and documented "shadow-first", auto-graduated to live and carved the operator's CPU limit 2000m → 359m over 283 carves, re-opening the 2026-07-24 crash-loop incident (25 restarts/8h) by undoing the fix that closed it. The emergency response was a static `floor: "2000m"` pin at the consumer HelmRelease, which clamps the range but does not withhold the write. This bumps `pleme-lib` to 0.41.0 and sets `breathe.cpu.mode: shadow` (the only field that actually withholds a carve, structural so it survives the floor pin being relaxed) plus `breathe.cpu.postureRef: critical` (never-shrink tier, shrinkBelow 0 — belt to the mode's braces, so even a deliberate flip to `effect` cannot shrink the control plane). pleme-lib 0.41.0 is what makes `postureRef` bind at all: the breatheBand template previously emitted the full tuning tuple unconditionally, and breathe resolves `inline.or(posture).or(default)` per field, so a postureRef alongside those inline keys resolved last and did nothing. v0.8.40 makes the auto-injected `pg-wait` initContainer's `resources` overridable at `executor.magma.postgres.pgWait.resources` (default unchanged: 10m/16Mi requests, 50m/32Mi limits, byte-identical to the previous hardcoded dict, so every existing consumer renders exactly what it rendered before). Kubernetes computes pod QoS across init containers too, so this 16Mi init container was the last thing holding the operator pod at Burstable after its main-container requests were raised — Guaranteed needs requests == limits on EVERY container including init. This ships only the knob; reaching Guaranteed still requires the consumer HelmRelease to set it, and is not necessarily achievable while an external MemoryBand carves this Deployment's memory limit off its request (see the v0.8.39 note on `spec.dryRun` being dead code for MemoryBand — verify the band's mode before concluding the QoS goal is reachable). v0.9.3 regenerates `crds/infrastructuretemplate.yaml` wholesale from `--generate-crds`, clearing the pre-existing baselined drift tracked in pangea-operator's scripts/crd-drift-baseline.txt since 2026-06-24 — the last two syncs (0.8.35, 0.8.37) were surgical inserts that each added one field and explicitly left that drift in place. A full `.spec` replace is safe now because the only remaining difference IS the operator's structs: measured before the change, exactly 1 of 15 CRDs drifted on `.spec` (this one), and `operatorpolicies` is a STALE baseline entry — already in sync — so both names come off the ratchet. Carries the three status fields operator commit beffbc0 added (status.driftFingerprint, status.driftTotal, status.policyEvaluation.evaluatedCount); without them the apiserver prunes the fields and the settling fingerprint silently keeps re-deriving from a display-capped list. Only `.spec` was replaced, never the whole document, because the generator still does not emit `helm.sh/resource-policy: keep`. v0.9.7 adds `compilerBackend` — one typed field (lava|embedded|process|http) selecting the compiler, with gem auth, the compiler sidecar and the gem cache all DERIVED from it instead of each keying off `useEmbeddedRuby` independently. This is what makes a Ruby-free operator deployable at all: the old bool x enum encoding could express only three of the four backends, and `useEmbeddedRuby: false` selected `http`, which points the operator at a Ruby compiler SIDECAR — so a Ruby-free image had NO reachable configuration and the chart, not the image, was the blocker. An unknown backend now fails the helm render (parse-time-rejected) rather than becoming a pod that crash-loops on `Refusing to fall back to HTTP`. Back-compat is proven, not asserted: with `compilerBackend` unset both legacy settings render BYTE-IDENTICALLY (`useEmbeddedRuby: true` and the `http` default were diffed against the pre-change chart). The Ruby backends stay fully expressible — retirement here is a selection, never a deletion (★★ MODULARIZE, DON'T DELETE). v0.9.8 syncs crds/infrastructuretemplate.yaml's spec.dialect enum with the operator's regenerated --generate-crds output, adding the fourth variant `lava` (auto|ruby|lava|json). This is the load-bearing half of the operator-side change, not a follow-up: `properties` is a CLOSED schema, so a `dialect: lava` this yaml does not list is PRUNED by the API server before the controller ever sees it — the CR applies, the field vanishes, and NOTHING errors. Confirmed byte-identical to the generator's output for the dialect subtree; a surgical insert in the same discipline as 0.8.35/0.8.37, no other property touched. v0.9.9 flips crds/infrastructuretemplate.yaml spec.importPolicy.autoOnConflict from `default: false` to `default: true`, matching pangea-operator@f525e09. A CRD schema default is APISERVER-APPLIED, so this is the half that reaches CRs which declare an `importPolicy` block without the field; the operator-side Rust default covers the other spelling of silence (no `importPolicy` block at all). Both had to move because they were the same rule stored twice and they disagreed. Why it matters: `false` meant a template that said nothing about importing got create-instead-of-import — a plan proposing to CREATE resources that already exist, failing at apply with `422 already exists`, per resource — which is the same dangerous-posture-reached-by-SAYING-NOTHING that destroyProtection closed on the deletion path, left open on the import path. Measured on camelot 2026-08-26: 5 of 21 live templates carried autoOnConflict false, every one by omission rather than a stated decision. Safe as a default because it is a CANDIDACY switch and not an action — an address still needs an id from importHints → naturalIds → operator-bundled defaults, so a resource with no resolvable natural id imports nothing and stays a plain create; the flip cannot invent an import, only stop one from being skipped. An explicit `false` is still honoured. Surgical insert (one property default + its description), not a regen: this CRD carries pre-existing generator drift tracked in pangea-operator scripts/crd-drift-baseline.txt, and a wholesale replace would fold an unrelated unreviewed schema change into this one. THE VERSION BUMP IS THE LOAD-BEARING PART: this HelmRelease sources the chart from a GitRepository with reconcileStrategy ChartVersion, so a chart CONTENT change at an unchanged version is fetched by Flux and never upgraded — measured, the artifact revision already carried the CRD edit while the live CRD still read false.
type: application
version: 0.9.10 v0.9.10 genericizes the workspace, guardrail-rule and ticket identifiers carried in six generated CRD descriptions plus three values notes and four notes in this description (one of which also carried a live plan hash). The operator genericized its own doc comments in d7544c3 (2026-08-17) and this bundle was never resynced, so the chart shipped the pre-genericization text for nine days. The parsed descriptions now match the operator's Rust doc comments; no schema property changed.
appVersion: "0.8.17"
dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.27.0"
    repository: "file://../pleme-lib"
annotations:
  org.opencontainers.image.source: https://github.com/pleme-io/helmworks
