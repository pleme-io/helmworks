apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 11 CRDs for infrastructure
  lifecycle, AMI pipeline, compliance testing, and dynamic synthesizer
  formats. v0.8.4 adds per-workspace tri-state pause to
  OperatorPolicy/default (spec.workspaceSuspend.{templates, catalogs}
  with `state: inherit | paused | active` per entry). Specific
  overrides general — template entries override catalog cascade,
  both override controllerSuspend/globalSuspend. `Active` is the
  surgical carve-out: keep reconciling under a more-general pause.
  Adds `pangea_workspace_active_override` gauge + `target` label on
  `pangea_policy_skipped_total` + 2 new alerts (PangeaWorkspacePaused,
  PangeaActiveOverridesActive) + `WorkspaceOverrides` printer column
  on OperatorPolicy. v0.8.5 ships the Q-set operability quick wins:
  `runbook_url` annotations on all 18 alerts pointing at
  pangea-operator/docs/RUNBOOKS.md; `helm.sh/resource-policy: keep`
  on every CRD; pinned compiler-sidecar default tag (no more `:latest`);
  new `logLevel` value threaded into RUST_LOG so debug toggles don't
  require an env-list edit; `category: pangea` on all 13 CRDs so
  `kubectl get pangea` works fleet-wide; pause-state alerts (info)
  bumped to 1h `for:` so short maintenance windows stay silent.
type: application
version: 0.8.5
appVersion: "0.8.5"

dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.10.0,<1.0.0"
    repository: "file://../pleme-lib"
