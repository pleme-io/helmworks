apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 9 CRDs for infrastructure lifecycle,
  AMI pipeline, compliance testing, and dynamic synthesizer formats.
  v0.7.3 ships the InfrastructureTemplate.status.lastCycle typed
  receipt: per-resource ResourceOutcome entries (Matched / Updated /
  Created / Destroyed / Imported / Drifted / Failed) plus aggregate
  CycleSummary counts, populated from tofu plan/apply outcomes after
  every reconcile cycle. New printer columns (Cycle / Matched /
  Updated / Drifted) on `kubectl get infrastructuretemplate`. Pairs
  with the operator-side ArchitectureGem hot-loop fix
  (pangea-operator@4f7c22b). v0.5.0+ kept: gitRepository workspace
  source pattern, compiler sidecar template_path + workspaces
  emptyDir mount, operator-side path-passing.
type: application
version: 0.7.3
appVersion: "0.7.3"

dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.10.0,<1.0.0"
    repository: "file://../pleme-lib"
