apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 9 CRDs for infrastructure lifecycle,
  AMI pipeline, compliance testing, and dynamic synthesizer formats. v0.4.0
  fully straps observability: dedicated metrics endpoint on 9090, six new
  Prometheus metrics (policy decisions, settled gauge, drift cycles, stuck
  resources, settling failures, drift detail by action+risk), four new
  PrometheusRules covering not-settled / escalation / refuse-firing /
  high-risk-pending, and a Grafana dashboard ConfigMap loaded automatically
  by the kube-prometheus-stack sidecar. Builds on v0.3.x policy + settling.
type: application
version: 0.4.0
appVersion: "0.4.0"

dependencies:
  - name: pleme-lib
    version: "~0.10.0"
    repository: "file://../pleme-lib"
