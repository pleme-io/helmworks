apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 9 CRDs for infrastructure lifecycle,
  AMI pipeline, compliance testing, and dynamic synthesizer formats. v0.5.0
  enables canonical Pangea workspace patterns through gitRepository sources:
  the compiler sidecar accepts a template_path field and load()s the file
  from disk with CWD set to the workspace dir, so __dir__ + require_relative
  + __dir__-relative File.read all resolve to the cloned workspace's
  siblings. Operator passes the path instead of reading the file's contents
  into a string. Compiler sidecar gains the workspaces emptyDir mount it
  was missing in 0.4.0. Inline + configMapRef sources continue to use the
  legacy eval(source) path unchanged. Builds on v0.4.0 observability strap.
type: application
version: 0.5.0
appVersion: "0.5.0"

dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.10.0,<1.0.0"
    repository: "file://../pleme-lib"
