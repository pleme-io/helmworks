apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 11 CRDs for infrastructure
  lifecycle, AMI pipeline, compliance testing, and dynamic synthesizer
  formats. v0.8.4 adds per-workspace tri-state pause to
  OperatorPolicy/default (spec.workspaceSuspend.{templates, catalogs}
  with `state: inherit | paused | active` per entry). Specific
  overrides general — template entries override catalog cascade,
  both override controllerSuspend/globalSuspend. `Active` is the
  surgical carve-out: keep reconciling under a more-general pause.
  Adds `pangea_workspace_active_override` gauge + `target` label on
  `pangea_policy_skipped_total` + 2 new alerts (PangeaWorkspacePaused,
  PangeaActiveOverridesActive) + `WorkspaceOverrides` printer column
  on OperatorPolicy. v0.8.5 ships the Q-set operability quick wins:
  `runbook_url` annotations on all 18 alerts pointing at
  pangea-operator/docs/RUNBOOKS.md; `helm.sh/resource-policy: keep`
  on every CRD; pinned compiler-sidecar default tag (no more `:latest`);
  new `logLevel` value threaded into RUST_LOG so debug toggles don't
  require an env-list edit; `category: pangea` on all 13 CRDs so
  `kubectl get pangea` works fleet-wide; pause-state alerts (info)
  bumped to 1h `for:` so short maintenance windows stay silent.
  v0.8.6 ships values.schema.json covering the OperatorPolicy
  surface + the useEmbeddedRuby/gemAuth dependency + the
  workspaceSuspend.state enum. Helm now fail-louds on typos (e.g.
  `state: paused-urgently`) and missing required fields (e.g.
  `useEmbeddedRuby=true` without a gem-auth Secret). v0.8.7 fixes
  PangeaDashboard CRD scope (was rendering Cluster; deployed as
  Namespaced — the kube derive needed the explicit `namespaced`
  flag). All 13 CRDs now render with the scope they were originally
  applied as; no CRD-scope-immutable conflicts on upgrade. v0.8.8
  switches values.schema.json to auto-generated from a typed Rust
  mirror (`pangea_operator::chart_values::ChartValues` + schemars).
  Schema-affecting values changes now flow from the struct →
  `cargo run -- --generate-values-schema` instead of hand-edits.
  v0.8.9 ships PangeaFleetStatus — a new cluster-scoped operator-driven
  singleton CRD that surfaces the operator's running rollup of every
  pangea CRD class. `kubectl get pangeafleetstatus default` becomes the
  canonical at-a-glance fleet command (printer columns: WCATS,
  TEMPLATES, READY, FAILED, GEMS, NAMESPACES, UPDATED, AGE). The
  fleet-status controller refreshes the singleton every 30s and
  bypasses OperatorPolicy.globalSuspend so fleet visibility stays
  live during a pause. New ClusterRole rules: pangeafleetstatuses
  (with create) + pangeadashboards. Pairs with operator @acb4e1a.
  v0.8.10 surfaces executor.rubyWorkers in helm values (threaded into
  PANGEA_RUBY_WORKERS env). Default 1 = today's single-owner shape;
  consumers bump to N≥2 to engage the magnus thread pool. Pairs with
  operator @65d89d5+ which provides the RubyPool round-robin
  dispatcher.
type: application
version: 0.8.10
appVersion: "0.8.10"

dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.10.0,<1.0.0"
    repository: "file://../pleme-lib"
