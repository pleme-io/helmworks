apiVersion: v2
name: pangea-operator
description: >-
  Pangea infrastructure operator — manages 11 CRDs for infrastructure
  lifecycle, AMI pipeline, compliance testing, and dynamic synthesizer
  formats. v0.7.4 wires the WorkspaceCatalog reconciler (typed
  workspace primitive: status.{templateCount, verified,
  conditions:[Reachable, GemsLoaded, Verified]}) and the tofu import
  pre-apply path (spec.importHints map → operator runs
  `tofu import` before apply for create-actions with hints, marks
  resources Outcome::Imported in the cycle receipt). Pairs with
  operator @d1530e1. Inherits 0.7.3's status.lastCycle typed
  receipt + ArchitectureGem hot-loop fix.
type: application
version: 0.8.0
appVersion: "0.8.0"

dependencies:
  - name: pleme-lib
    # Loose constraint — pleme-lib bumps minor versions frequently and
    # the operator chart only depends on its template stability surface.
    version: ">=0.10.0,<1.0.0"
    repository: "file://../pleme-lib"
