                    description: Master switch. When `false` (default), no auto-import fires regardless of `naturalIds` or bundled defaults — you stay on today's per-address `importHints`-only behaviour. When `true`, every `create`-action is a candidate for auto-import.
                    type: boolean
                  naturalIds:
                    additionalProperties:
                      type: string
                    description: |-
                      Per-resource-type natural-ID extraction templates. Keys are terraform resource types (`github_repository`, `aws_iam_role`, etc.); values are substitution templates like `{{ .planned.name }}` or `{{ .planned.zone_id }}/{{ .planned.id }}`.

