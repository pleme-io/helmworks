---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infrastructuretemplates.pangea.pleme.io
spec:
  group: pangea.pleme.io
  names:
    categories: []
    kind: InfrastructureTemplate
    plural: infrastructuretemplates
    shortNames:
    - infra
    - it
    singular: infrastructuretemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.pangeaNamespace
      name: Namespace
      type: string
    - jsonPath: .status.resources.total
      name: Resources
      type: integer
    - jsonPath: .status.cycleCount
      name: Cycle
      type: integer
    - jsonPath: .status.lastCycle.summary.matched
      name: Matched
      type: integer
    - jsonPath: .status.lastCycle.summary.updated
      name: Updated
      type: integer
    - jsonPath: .status.lastCycle.summary.driftedUncorrected
      name: Drifted
      type: integer
    - jsonPath: .spec.destroyProtection
      name: Protected
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for InfrastructureTemplateSpec via
          `CustomResource`
        properties:
          spec:
            description: InfrastructureTemplate represents a Pangea infrastructure
              template to be compiled, planned, and applied by the operator.
            properties:
              autoApprove:
                default: false
                description: Whether to automatically apply changes without manual
                  approval.
                type: boolean
              complianceProfiles:
                description: InSpec compliance profiles to run after apply.
                items:
                  type: string
                type: array
              defaultDecision:
                description: "Decision applied to changes that match no rule in `policies`.\
                  \ If unset, defaults to `autoApply` \u2014 the operator aggressively\
                  \ settles drift on every change at every risk level. Set this to\
                  \ `refuse` to make the policy list strictly opt-in (only changes\
                  \ explicitly allowed by a rule may be applied), or to `requireApproval`\
                  \ to gate everything not explicitly auto-applied.\n\n`spec.autoApprove`\
                  \ is no longer consulted by this engine; it remains in the schema\
                  \ for legacy compatibility but does not override `defaultDecision`."
                enum:
                - autoApply
                - requireApproval
                - refuse
                nullable: true
                type: string
              destroyProtection:
                default: false
                description: "Prevent destruction of the managed infrastructure.\n\
                  \nWhen enabled, the operator will refuse to run `tofu destroy` even\
                  \ if the CR is deleted. Plan and apply continue to work normally\
                  \ for drift correction. This is critical for self-managed bootstrap\
                  \ infrastructure \u2014 the cluster, database, and network that\
                  \ the operator itself runs on.\n\nTo actually destroy protected\
                  \ infrastructure, first set this to false, then delete the CR."
                type: boolean
              importHints:
                additionalProperties:
                  type: string
                description: "Hints used by the operator to import out-of-band cloud\
                  \ resources into tofu state instead of creating duplicates.\n\n\
                  Keys are tofu resource addresses (e.g. `cloudflare_dns_record.foo`),\
                  \ values are import IDs (the provider-specific shape, e.g. `<zone_id>/<record_id>`\
                  \ for cloudflare DNS, role name for `aws_iam_role`, etc.). Values\
                  \ support `{{ .varName }}` substitution from `spec.variables` \u2014\
                  \ e.g. `\"{{ .cloudflare_zone_id }}/foo\"` resolves `varName` against\
                  \ `spec.variables` (string-coerced) before passing to `tofu import`.\n\
                  \nOperator behavior: before each `tofu apply`, for every plan action\
                  \ with `action: create` whose resource address matches a key here,\
                  \ the operator runs `tofu import <addr> <substituted-id>`. After\
                  \ import the resource is in state, the apply becomes a no-op or\
                  \ update, and the cycle receipt records the resource as `Outcome::Imported`\
                  \ instead of `Outcome::Created`. This is the typed answer to \"\
                  auto-import any state\".\n\nEmpty map (default) = no imports \u2014\
                  \ every `create` action goes straight to the apply and creates a\
                  \ fresh resource as before. Hint values that fail substitution are\
                  \ skipped with a Warning event; hint imports that fail (e.g. ID\
                  \ doesn't match) leave the resource for the apply to handle."
                type: object
              pangeaNamespace:
                description: Pangea namespace for state isolation. This determines
                  the PostgreSQL schema used for state storage.
                type: string
              policies:
                description: "Per-resource policy rules controlling what the operator\
                  \ may do without human approval. Evaluated top-to-bottom against\
                  \ each resource change in a plan; the FIRST matching rule's `decision`\
                  \ applies. Changes that match no rule fall back to `defaultDecision`\
                  \ (or to `autoApprove` if `defaultDecision` is unset).\n\nAggregation\
                  \ across all changes: - any `refuse`          \u2192 operator marks\
                  \ plan Failed, won't apply - else any `requireApproval` \u2192 operator\
                  \ waits for `approvedPlanHash` - else                  \u2192 operator\
                  \ applies immediately\n\nEmpty list = behave exactly as before (`autoApprove`\
                  \ controls everything). Use this to express things like \"auto-apply\
                  \ low-risk DNS creates, require approval for any `cloudflare_dns_record`\
                  \ delete, refuse any `cloudflare_zone` destroy\"."
                items:
                  description: One policy rule. Match clauses use AND semantics (all
                    set fields must match the change); within a clause, list entries
                    use OR semantics (any list entry that matches counts). Empty /
                    omitted clauses are wildcards.
                  properties:
                    decision:
                      description: What the controller may do for changes this rule
                        matches.
                      enum:
                      - autoApply
                      - requireApproval
                      - refuse
                      type: string
                    match:
                      description: Match criteria. All set fields must match (AND);
                        within each list, any entry counts (OR).
                      properties:
                        actions:
                          description: 'Restrict to specific actions. Empty = any
                            action. Valid values: `create`, `update`, `delete`, `replace`.'
                          items:
                            type: string
                          type: array
                        addressPatterns:
                          description: "Regular expressions matched against the full\
                            \ resource address (e.g. `^cloudflare_dns_record\\\\.rio-.*$`).\
                            \ Invalid regexes are rejected at evaluation time and\
                            \ logged \u2014 they never silently match nothing."
                          items:
                            type: string
                          type: array
                        attributes:
                          description: Glob patterns against the changed-attribute
                            names. Matches if ANY of the change's attributes matches
                            ANY of these patterns. Useful for "require approval if
                            `ttl` or any `secret*` field changes".
                          items:
                            type: string
                          type: array
                        resourceTypes:
                          description: "Glob patterns against the terraform resource\
                            \ type (e.g. `cloudflare_dns_record`, `cloudflare_*`,\
                            \ `aws_iam_*`). Only `*` (zero-or-more chars) is supported\
                            \ \u2014 keeps matching trivial and predictable."
                          items:
                            type: string
                          type: array
                        riskLevels:
                          description: 'Restrict to specific risk levels. Empty =
                            any risk. Valid values: `none`, `low`, `medium`, `high`.'
                          items:
                            type: string
                          type: array
                      type: object
                    name:
                      description: Human-readable label. Surfaced in `status.driftDetails[].matchedPolicy`
                        and in the per-rule planSummary, so a quick `kubectl describe`
                        shows which rule triggered which decision.
                      type: string
                  required:
                  - decision
                  - match
                  - name
                  type: object
                type: array
              providerCredentials:
                description: Provider credentials configuration.
                nullable: true
                properties:
                  aws:
                    description: AWS credentials configuration.
                    nullable: true
                    properties:
                      region:
                        description: Region to use for AWS operations.
                        nullable: true
                        type: string
                      roleArn:
                        description: Optional role ARN to assume.
                        nullable: true
                        type: string
                      secretRef:
                        description: Secret containing AWS credentials.
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same
                              namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  cloudflare:
                    description: Cloudflare credentials configuration.
                    nullable: true
                    properties:
                      secretRef:
                        description: Secret containing Cloudflare API token.
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same
                              namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                type: object
              refreshInterval:
                default: 5m
                description: Interval for drift detection checks. Defaults to "5m"
                  (5 minutes).
                type: string
              retryPolicy:
                description: Retry policy for failed operations.
                nullable: true
                properties:
                  backoffSeconds:
                    default: 30
                    description: Base delay between retries in seconds.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  maxRetries:
                    default: 3
                    description: Maximum number of retry attempts.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              settlingPolicy:
                description: "Bounds on how long the operator may keep cycling through\
                  \ drift\u2192apply\u2192drift loops before declaring the template\
                  \ stuck. State settling is the operator's primary success metric\
                  \ \u2014 when it can't reach a settled state after the configured\
                  \ number of cycles, this is escalated loudly via a `Settled=False`\
                  \ condition + Warning event.\n\nDefaults: 5 cycles, then `fail`\
                  \ (transition to Failed, surface the address list of resources that\
                  \ keep re-drifting)."
                nullable: true
                properties:
                  maxConsecutiveDriftCycles:
                    default: 5
                    description: "Maximum allowed consecutive drift cycles before\
                      \ escalation. A \"cycle\" is one Ready\u2192Drifted\u2192(plan\u2192\
                      apply)\u2192Ready transition where the post-apply drift check\
                      \ still reports changes. Defaults to 5."
                    format: uint32
                    minimum: 0.0
                    type: integer
                  onExhaustion:
                    default: fail
                    description: "What to do when `maxConsecutiveDriftCycles` is exceeded.\
                      \ Defaults to `fail` \u2014 the loudest signal: phase Failed,\
                      \ error message naming the stuck resources, Warning event, condition\
                      \ `Settled=False reason=StuckInDriftLoop`. The point is to make\
                      \ it impossible to ignore a system that can't reach steady state."
                    enum:
                    - fail
                    - alert
                    - continue
                    type: string
                type: object
              source:
                description: Source of the infrastructure template.
                properties:
                  configMapRef:
                    description: Reference to a ConfigMap containing the template.
                    nullable: true
                    properties:
                      key:
                        description: Key within the ConfigMap containing the template.
                        type: string
                      name:
                        description: Name of the ConfigMap.
                        type: string
                      namespace:
                        description: Namespace of the ConfigMap (defaults to same
                          namespace as the InfrastructureTemplate).
                        nullable: true
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  gitRepository:
                    description: Reference to a Git repository containing the template.
                    nullable: true
                    properties:
                      path:
                        description: Path to the template file within the repository.
                        type: string
                      ref:
                        default: main
                        description: Git reference (branch, tag, or commit SHA).
                        type: string
                      secretRef:
                        description: Reference to a Secret containing Git credentials.
                        nullable: true
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same
                              namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                      url:
                        description: Git repository URL.
                        type: string
                    required:
                    - path
                    - url
                    type: object
                  inline:
                    description: Inline Ruby DSL template content.
                    nullable: true
                    type: string
                type: object
              suspend:
                default: false
                description: Suspend reconciliation for this template.
                type: boolean
              templateName:
                description: Optional specific template name to deploy if the source
                  file contains multiple templates.
                nullable: true
                type: string
              variableRefs:
                additionalProperties:
                  description: Cross-template variable reference. Fetches an output
                    from another template.
                  properties:
                    outputKey:
                      description: Key in the source template's status.outputs to
                        read.
                      type: string
                    templateRef:
                      description: Reference to the source template.
                      properties:
                        name:
                          description: Name of the InfrastructureTemplate.
                          type: string
                        namespace:
                          description: Namespace (defaults to same namespace as the
                            referencing template).
                          nullable: true
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - outputKey
                  - templateRef
                  type: object
                description: 'Cross-template variable references. Resolved before
                  compilation by fetching the referenced template''s outputs.


                  Example: ```yaml variableRefs: vpc_id: templateRef: { name: vpc-template
                  } outputKey: vpc_id ```'
                nullable: true
                type: object
              variables:
                additionalProperties: true
                description: Variables to pass to the template during compilation.
                nullable: true
                type: object
            required:
            - pangeaNamespace
            - source
            type: object
          status:
            description: Status of an InfrastructureTemplate.
            nullable: true
            properties:
              approvedPlanHash:
                description: Hash of the approved plan. Set by the user to approve
                  a pending plan. When this matches `pendingPlanHash`, the operator
                  proceeds to apply.
                nullable: true
                type: string
              compliance:
                description: Compliance check results.
                nullable: true
                properties:
                  failedControls:
                    description: Number of failed controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  lastCheckAt:
                    description: Last compliance check timestamp.
                    format: date-time
                    type: string
                  passedControls:
                    description: Number of passed controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  profiles:
                    description: Per-profile results.
                    items:
                      description: Result for a single compliance profile.
                      properties:
                        failedControlIds:
                          description: IDs of failed controls.
                          items:
                            type: string
                          type: array
                        profile:
                          description: Profile name.
                          type: string
                        score:
                          description: Profile score (0-100).
                          format: double
                          type: number
                        status:
                          description: Profile status (compliant, non-compliant).
                          type: string
                      required:
                      - profile
                      - score
                      - status
                      type: object
                    type: array
                  score:
                    description: Compliance score (0-100).
                    format: double
                    type: number
                  skippedControls:
                    description: Number of skipped controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  status:
                    description: Overall compliance status.
                    type: string
                required:
                - failedControls
                - lastCheckAt
                - passedControls
                - score
                - skippedControls
                - status
                type: object
              conditions:
                description: Conditions representing the current state.
                items:
                  description: Kubernetes-style condition.
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: Machine-readable reason for the condition.
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown).
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveDriftCycles:
                default: 0
                description: "State-settling counter. Counts consecutive drift cycles\
                  \ where applying a plan does NOT result in a clean drift check.\
                  \ Reset to zero when a Ready\u2192Ready transition sees no drift.\
                  \ Drives `SettlingPolicy` escalation."
                format: uint32
                minimum: 0.0
                type: integer
              cycleCount:
                default: 0
                description: "Monotonic cycle counter \u2014 bumped once per completed\
                  \ reconcile (every plan\u2192apply pair, or every plan-only when\
                  \ no changes). Lets observers detect the operator's heartbeat without\
                  \ polling timestamps."
                format: uint64
                minimum: 0.0
                type: integer
              driftDetails:
                default: []
                description: "Per-resource drift / change detail from the last plan.\
                  \ Populated whenever a plan reports `has_changes`. Lets external\
                  \ observers see WHICH resources changed and HOW without parsing\
                  \ raw tofu output. Capped to 50 entries (full list available via\
                  \ the operator's GraphQL API for large plans).\n\nAlways serialized\
                  \ (no skip-if-empty) so an explicit empty array clears the field\
                  \ via JSON Merge Patch \u2014 otherwise stale drift would survive\
                  \ a clean settle."
                items:
                  description: "Per-resource drift / change detail from a plan.\n\n\
                    One entry per resource the plan would touch. Action is the terraform\
                    \ action category; risk is a heuristic so observers can quickly\
                    \ triage (a `delete` on a destroy-protected resource is `high`,\
                    \ a no-op refresh is `none`, a single-attribute update is `low`).\
                    \ `attributes` lists the field names that differ \u2014 values\
                    \ are intentionally elided so secrets don't leak into the K8s\
                    \ API."
                  properties:
                    action:
                      description: 'Action category: create | update | delete | replace
                        | noop.'
                      type: string
                    address:
                      description: Terraform resource address (e.g. `cloudflare_dns_record.foo`).
                      type: string
                    attributes:
                      description: Attribute names that differ between current and
                        desired state. Empty for create / delete (no per-attr diff
                        applies).
                      items:
                        type: string
                      type: array
                    matchedPolicy:
                      description: Name of the `PolicyRule` that matched this change,
                        or `<default>` if no rule matched and the default decision
                        was applied. Absent means policy evaluation didn't run.
                      nullable: true
                      type: string
                    policyDecision:
                      description: 'Resolved policy decision for this specific change.
                        Set when `spec.policies` is non-empty or `spec.defaultDecision`
                        is non-null. Values: `autoApply` | `requireApproval` | `refuse`.
                        Absent means policy evaluation didn''t run (legacy `autoApprove`-only
                        mode).'
                      nullable: true
                      type: string
                    risk:
                      description: 'Risk heuristic: none | low | medium | high.'
                      type: string
                  required:
                  - action
                  - address
                  - risk
                  type: object
                type: array
              failureCount:
                default: 0
                description: Number of consecutive failures.
                format: uint32
                minimum: 0.0
                type: integer
              lastAppliedAt:
                description: Timestamp of the last successful apply.
                format: date-time
                nullable: true
                type: string
              lastAppliedRevision:
                description: Last successfully applied revision (content hash or git
                  commit).
                nullable: true
                type: string
              lastCycle:
                description: 'Receipt for the most recent reconcile cycle: per-resource
                  outcomes (Matched / Updated / Created / Destroyed / Imported / Drifted
                  / Failed) plus aggregate counts. The shape the user reads to answer
                  "what did the operator just do, and to what?"'
                nullable: true
                properties:
                  completedAt:
                    description: When the cycle completed (after apply, or after plan-with-no-changes).
                    format: date-time
                    type: string
                  cycle:
                    description: Monotonic cycle number (mirrors `status.cycleCount`
                      at the moment this cycle was emitted; redundant but lets observers
                      snapshot the receipt with its cycle number atomically).
                    format: uint64
                    minimum: 0.0
                    type: integer
                  outcomes:
                    description: "Per-resource outcomes for resources the cycle TOUCHED\
                      \ \u2014 i.e. resources that the plan reported a change on (Created\
                      \ / Updated / Destroyed) or that the apply failed on (Failed)\
                      \ or that policy gated (Drifted).\n\nResources that had no planned\
                      \ change are NOT individually listed here (they're rolled up\
                      \ into `summary.matched`); listing every untouched resource\
                      \ per cycle would balloon status payloads unbounded. Capped\
                      \ at 100 entries."
                    items:
                      description: Per-resource cycle outcome. The typed answer to
                        "what happened to THIS resource this cycle?".
                      properties:
                        action:
                          description: Original tofu action category (`create`, `update`,
                            `delete`, `replace`, `noop`) when known. Lets observers
                            see the raw terraform shape behind the typed Outcome.
                          nullable: true
                          type: string
                        address:
                          description: Terraform resource address (e.g. `cloudflare_dns_record.foo`).
                          type: string
                        message:
                          description: "Optional context \u2014 for `Drifted` outcomes,\
                            \ the policy decision that gated the change; for `Failed`,\
                            \ the tofu error excerpt."
                          nullable: true
                          type: string
                        outcome:
                          description: What happened.
                          enum:
                          - Matched
                          - Updated
                          - Created
                          - Destroyed
                          - Imported
                          - Drifted
                          - Failed
                          type: string
                      required:
                      - address
                      - outcome
                      type: object
                    type: array
                  planSummary:
                    description: 'Human-readable plan summary, mirroring tofu''s `Plan:
                      +X ~Y -Z` shape. Same string as top-level `status.planSummary`
                      at the moment this cycle ran.'
                    nullable: true
                    type: string
                  sourceRevision:
                    description: "Source revision the cycle reconciled against \u2014\
                      \ git commit SHA for git-sourced templates, content hash for\
                      \ inline / configmap. Mirrors `status.lastAppliedRevision` for\
                      \ the cycle that just landed; lets observers correlate cycles\
                      \ to source changes."
                    nullable: true
                    type: string
                  startedAt:
                    description: When the cycle started (immediately after Verified
                      gate).
                    format: date-time
                    type: string
                  summary:
                    default:
                      created: 0
                      destroyed: 0
                      driftedUncorrected: 0
                      failed: 0
                      imported: 0
                      matched: 0
                      updated: 0
                    description: Aggregate outcome counts for the cycle. `matched`
                      = total managed resources minus everything that planned a change.
                      Other counts are per-Outcome variant.
                    properties:
                      created:
                        default: 0
                        description: Resources newly created by this cycle's apply.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      destroyed:
                        default: 0
                        description: Resources destroyed by this cycle's apply.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      driftedUncorrected:
                        default: 0
                        description: Resources where drift was detected but NOT corrected
                          (policy = requireApproval / refuse, or apply was skipped).
                        format: uint32
                        minimum: 0.0
                        type: integer
                      failed:
                        default: 0
                        description: Resources where the apply errored.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      imported:
                        default: 0
                        description: "Resources adopted into state by `tofu import`\
                          \ (reserved \u2014 set to 0 until the import path lands\
                          \ in a follow-up)."
                        format: uint32
                        minimum: 0.0
                        type: integer
                      matched:
                        default: 0
                        description: "Resources whose declared state matched actual\
                          \ state \u2014 no plan action (`no-op`)."
                        format: uint32
                        minimum: 0.0
                        type: integer
                      updated:
                        default: 0
                        description: Resources updated to declared state by this cycle's
                          apply.
                        format: uint32
                        minimum: 0.0
                        type: integer
                    type: object
                required:
                - completedAt
                - cycle
                - startedAt
                type: object
              lastDriftCheckAt:
                description: Timestamp of the last drift check.
                format: date-time
                nullable: true
                type: string
              lastError:
                description: Last error message if in Failed state.
                nullable: true
                type: string
              lastPlannedAt:
                description: Timestamp of the last successful plan.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                default: 0
                description: Last observed generation of the spec.
                format: int64
                type: integer
              outputs:
                additionalProperties: true
                description: Outputs from the last successful apply.
                nullable: true
                type: object
              pendingPlanHash:
                description: Hash of the pending plan awaiting approval. Set by the
                  operator after planning. Users approve by copying this value to
                  `approvedPlanHash` via kubectl patch or GraphQL mutation.
                nullable: true
                type: string
              phase:
                description: Current phase of the template lifecycle.
                enum:
                - Pending
                - Verifying
                - Verified
                - Compiling
                - Initializing
                - Planning
                - Applying
                - Ready
                - Drifted
                - Failed
                - Destroying
                nullable: true
                type: string
              planSummary:
                description: Human-readable summary of the last plan.
                nullable: true
                type: string
              policyEvaluation:
                description: "Aggregate result of evaluating `spec.policies` against\
                  \ the last plan's drift details. Drives the plan\u2192apply gate.\
                  \ Absent when the template uses legacy `autoApprove`-only mode (no\
                  \ `policies` and no `defaultDecision`)."
                nullable: true
                properties:
                  aggregate:
                    description: "Worst decision across all changes. Drives the plan\u2192\
                      apply transition."
                    type: string
                  autoApplyCount:
                    default: 0
                    description: Number of changes that resolved to `autoApply`.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  refuseCount:
                    default: 0
                    description: Number of changes that resolved to `refuse`. Non-zero
                      means `aggregate == refuse` and the plan is blocked.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  refusedAddresses:
                    description: Sample of refused resource addresses (capped at 10)
                      to give quick triage signal in `kubectl describe`.
                    items:
                      type: string
                    type: array
                  requireApprovalCount:
                    default: 0
                    description: Number of changes that resolved to `requireApproval`.
                    format: uint32
                    minimum: 0.0
                    type: integer
                required:
                - aggregate
                type: object
              resources:
                description: Summary of managed resources.
                nullable: true
                properties:
