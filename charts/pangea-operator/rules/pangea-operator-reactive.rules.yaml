groups:
  - name: pangea-operator-truth
    interval: 30s
    rules:
      - alert: PangeaConditionBehindGeneration
        expr: pangea_template_condition_generations_behind{type=~"Ready|Settled"} > 0 and on (template, namespace, type) pangea_template_condition{status="True"} == 1
        for: 10m
        labels:
          severity: warning
          remedy_mode: auto
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} reports {{ $labels.type }}=True for a generation {{ $value }} behind spec"
          remedy: "auto: the pass watchdog re-dispatches a generation not started within its deadline (stall pendingNotStarted); PangeaGenerationLagUnremedied pages if it does not converge"
      - alert: PangeaGenerationLagUnremedied
        expr: pangea_template_generations_behind > 0
        for: 30m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} has trailed its spec by {{ $value }} generation(s) for 30m"
          remedy: "page: the automatic re-dispatch did not converge; read status.pass and status.reactions, then the operator log for the template"
  - name: pangea-operator-progress
    interval: 30s
    rules:
      - alert: PangeaPassStalled
        expr: pangea_template_stall{state!="unnamed"} == 1
        for: 5m
        labels:
          severity: warning
          remedy_mode: auto
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} pass stalled ({{ $labels.state }})"
          remedy: "auto: queuedBehind waits on the blocking pass; pendingNotStarted, heartbeatLost and noProgress re-dispatch the reconcile; orphanedPhase resumes under this incarnation"
      - alert: PangeaPassStallUnremedied
        expr: pangea_template_stall{state!="unnamed"} == 1
        for: 30m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} pass stalled ({{ $labels.state }}) for 30m despite its remedy"
          remedy: "page: the re-dispatch did not move the pass; check pangea_template_reactions and the in-flight provider RPC"
      - alert: PangeaPassStallUnnamed
        expr: pangea_template_stall{state="unnamed"} == 1
        for: 1m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} pass is in a stall state the operator cannot name"
          remedy: "page: name the state in StallState and give it a remedy"
      - alert: PangeaProviderRpcHung
        expr: pangea_template_in_flight_rpc_age_seconds > 900
        for: 2m
        labels:
          severity: warning
          remedy_mode: auto
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} provider RPC {{ $labels.rpc }} outstanding for {{ $value }}s"
          remedy: "auto: no progress past the phase deadline names the stall noProgress and re-dispatches, which restarts the provider process"
      - alert: PangeaPhaseTooLong
        expr: pangea_template_phase_age_seconds > 3600 and on (template, namespace) pangea_template_phase{phase=~"Compiling|Planning|Applying"} == 1
        for: 5m
        labels:
          severity: warning
          remedy_mode: auto
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} has been in one expensive phase for over an hour"
          remedy: "auto: the reactive policy escalates a phase past its bound; PangeaPassStallUnremedied pages if the pass is also stalled"
      - alert: PangeaOperatorWedged
        expr: pangea_operator_progress{reading="wedged"} == 1
        for: 1m
        labels:
          severity: critical
          remedy_mode: auto
        annotations:
          summary: pangea-operator has pending work and no template reconcile finished inside the wedge window
          remedy: "auto: /healthz fails on the same gate, so the kubelet restarts the operator; PangeaOperatorRestarting pages if restarts repeat"
      - alert: PangeaProjectionStale
        expr: time() - pangea_operator_progress{reading="projection_timestamp_seconds"} > 300 unless on (job, instance) pleme:target_host_settling
        for: 5m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: pangea-operator's status projection has not ticked for over 5m
          remedy: "page: every projected alert is blind until it ticks; read the operator log for 'status projection'"
      - alert: PangeaAdmissionDeferring
        expr: sum by (scope, phase) (rate(pangea_admission_deferred_total[15m])) > 0
        for: 1h
        labels:
          severity: info
          remedy_mode: page
        annotations:
          summary: "workspace {{ $labels.scope }} has deferred {{ $labels.phase }} for an hour"
          remedy: "page: real contention; raise the workspace concurrency budget or spread the work"
  - name: pangea-operator-imports
    interval: 30s
    rules:
      - alert: PangeaImportLooping
        expr: sum by (template, namespace, workspace) (increase(pangea_template_events_total{reason="ImportFailed"}[1h])) >= 3
        for: 5m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} failed {{ $value }} imports in an hour"
          remedy: "page: a retry cannot import an object that does not exist; fix importHints or the declared resource"
  - name: pangea-operator-stack
    interval: 30s
    rules:
      - alert: PangeaCronJobFailing
        expr: pangea_cronjob_consecutive_failures >= 2
        for: 1m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} failed {{ $value }} runs in a row"
          remedy: "page: the job's program is red (read the newest failed pod's log); the CronJob retries on its schedule"
      - alert: PangeaCronJobNoSuccess
        expr: time() - pangea_cronjob_last_success_timestamp_seconds > 7200
        for: 5m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded for over 2h"
          remedy: "page: fix the program the job runs; nothing downstream of it is current"
      - alert: PangeaPostgresRestartStorm
        expr: increase(pangea_stack_container_restarts{app="pangea-postgres"}[1h]) >= 3 unless on (job, instance) max_over_time(pleme:target_host_settling[1h])
        for: 1m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "pangea-postgres restarted {{ $value }} times in an hour"
          remedy: "page, never auto: each restart is a crash recovery of the state store; read its log for the shutdown cause before anything restarts it again"
      - alert: PangeaPostgresNotReady
        expr: pangea_stack_container_ready{app="pangea-postgres"} == 0 unless on (job, instance) pleme:target_host_settling
        for: 5m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: pangea-postgres is not ready
          remedy: "page: every magma pass blocks on the state store"
      - alert: PangeaOperatorRestarting
        expr: increase(pangea_stack_container_restarts{app="pangea-operator"}[1h]) >= 3 unless on (job, instance) max_over_time(pleme:target_host_settling[1h])
        for: 1m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "pangea-operator restarted {{ $value }} times in an hour"
          remedy: "page: repeated restarts mean the liveness remedy is not curing the cause; read the previous container's log"
  - name: pangea-operator-leaves
    interval: 30s
    rules:
      - alert: PangeaWorkspaceLeavesUnhealthy
        expr: sum by (workspace, namespace, state) (pangea_workspace_leaves{state=~"failed|stalled|rate_limited|blocked"}) > 0
        for: 15m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.workspace }} has {{ $value }} leaves {{ $labels.state }}"
          remedy: "page: the siblings keep converging; read the parent status.leaves for the named leaves, then each leaf's status.pass"
  - name: pangea-operator-sync
    interval: 30s
    rules:
      - alert: PangeaTemplateFailed
        expr: pangea_template_phase{phase="Failed"} == 1 unless on (workspace, namespace) group by (workspace, namespace) (pangea_workspace_leaves)
        for: 5m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} is in phase Failed"
          remedy: "page: read status.lastError and the operator log for the template, fix the cause, then let it reconcile; a catalog's leaves page through PangeaWorkspaceLeavesUnhealthy instead"
      - alert: PangeaTemplateNotReady
        expr: pangea_template_condition{type="Ready",status!="True"} == 1 unless on (template, namespace, workspace) pangea_template_phase{phase=~"Failed|Drifted|Pending"} == 1 unless on (workspace, namespace) group by (workspace, namespace) (pangea_workspace_leaves)
        for: 2h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} has reported Ready={{ $labels.status }} for over 2h"
          remedy: "page: read the Ready condition's reason and message, then status.pass; Failed, Drifted and Pending have their own alerts, and a suspended template is not projected"
      - alert: PangeaTemplateDriftedUnreconciled
        expr: pangea_template_phase_age_seconds > 7200 and on (template, namespace, workspace) pangea_template_phase{phase="Drifted"} == 1 unless on (workspace, namespace) group by (workspace, namespace) (pangea_workspace_leaves)
        for: 5m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} has been Drifted for {{ $value | humanizeDuration }} without a reconcile"
          remedy: "page: with autoApprove false the drift waits for approval; approve the plan, set autoApprove, or undo the out-of-band change"
      - alert: PangeaTemplatePendingTooLong
        expr: pangea_template_phase_age_seconds > 7200 and on (template, namespace, workspace) pangea_template_phase{phase="Pending"} == 1 unless on (workspace, namespace) group by (workspace, namespace) (pangea_workspace_leaves)
        for: 5m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} has been Pending for {{ $value | humanizeDuration }}"
          remedy: "page: no pass started; check admission (PangeaAdmissionDeferring), the source, and status.pass"
      - alert: PangeaWorkspaceLeavesNotSynced
        expr: count by (workspace, namespace) (pangea_template_phase_age_seconds > 7200 and on (template, namespace, workspace) pangea_template_phase{phase!~"Ready|Failed"} == 1 and on (workspace, namespace) group by (workspace, namespace) (pangea_workspace_leaves)) > 0
        for: 5m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.workspace }} has {{ $value }} leaves out of Ready for over 2h"
          remedy: "page: the parent status.leaves names them; read each leaf's phase and status.pass (a Drifted leaf waits for approval when autoApprove is false)"
      - alert: PangeaWorkspaceLeavesUnlabeled
        expr: pangea_workspace_leaves_unlabeled > 0
        for: 6h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "workspace {{ $labels.workspace }} has had unhealthy leaves past the per-leaf series cap for 6h ({{ $value }} now)"
          remedy: "page: these leaves carry no per-leaf series, so no age; read the parent status.leaves"
      - alert: PangeaWorkspaceCatalogSuspended
        expr: pangea_workspace_catalog_suspended == 1
        for: 1h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "WorkspaceCatalog {{ $labels.workspace }} has been suspended for over 1h; none of its templates reconcile"
          remedy: "page: a manual brake left on; set spec.suspend to false once its reason is gone"
      - alert: PangeaOperatorMetricsAbsent
        expr: absent(pangea_operator_progress{reading="projection_timestamp_seconds"}) unless on () pleme:target_host_settling{job="pangea-operator"}
        for: 10m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: pangea-operator metrics are absent; every pangea alert is blind
          remedy: "page: check the scrape target (up{job=\"pangea-operator\"}), the operator pod, and whether the /metrics body finishes inside the scrape timeout"
  - name: pangea-operator-credentials
    interval: 5m
    rules:
      - alert: PangeaRolesAnywhereCertExpiring
        expr: (pangea_roles_anywhere_cert_not_after_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.cert }} Roles Anywhere certificate expires in {{ printf \"%.0f\" $value }} days"
          remedy: "page: reissue the leaf from the workload-identity CA, sops set workload-identity/<leaf>/tls-crt and tls-key in nix secrets.yaml, then rebuild the node that seeds the Secret"
      - alert: PangeaRolesAnywhereCertExpired
        expr: pangea_roles_anywhere_cert_not_after_seconds - time() < 0
        for: 5m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.cert }} Roles Anywhere certificate has expired; every leaf using it fails to sign in"
          remedy: "page: reissue the leaf from the workload-identity CA, sops set workload-identity/<leaf>/tls-crt and tls-key in nix secrets.yaml, then rebuild the node that seeds the Secret"
  - name: pangea-operator-errors
    interval: 1m
    rules:
      - alert: PangeaReconcileErrors
        expr: sum by (error_type, reason) (increase(pangea_reconciliation_errors_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.error_type }} reconciles failed {{ printf \"%.0f\" $value }} times in the last hour ({{ $labels.reason }}), every hour for an hour"
          remedy: "page: the environment is not error-free; open the pangea-operator dashboard's errors row for the failing objects, then read each one's status.lastError"
      - alert: PangeaTemplateErrorLoop
        expr: sum by (name, target_namespace, reason) (increase(pangea_reconciliation_errors_total{error_type="template"}[1h])) >= 6
        for: 30m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.target_namespace }}/{{ $labels.name }} failed {{ printf \"%.0f\" $value }} reconciles in an hour ({{ $labels.reason }})"
          remedy: "page: the requeue retries a cause that does not clear; read status.lastError and the operator log for the template, fix the source or its credentials"
      - alert: PangeaTemplateStallLoop
        expr: sum by (template, namespace, state) (increase(pangea_template_stalls_total[6h])) >= 3 unless on () count(sum by (template, namespace) (increase(pangea_template_stalls_total[6h])) >= 3) > 10
        for: 10m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} stalled {{ printf \"%.0f\" $value }} times in 6h ({{ $labels.state }})"
          remedy: "page: each re-dispatch clears the stall but the next pass stalls again; read status.pass and the in-flight provider RPC for the cause"
      - alert: PangeaStallLoopWidespread
        expr: count(sum by (template, namespace) (increase(pangea_template_stalls_total[6h])) >= 3) > 10
        for: 10m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $value }} templates stalled 3 or more times each in the last 6h"
          remedy: "page: one cause behind many templates (provider, state store, operator saturation); read pangea_template_stalls_total by state on the pangea-operator dashboard, fix the shared cause, not single templates"
      - alert: PangeaStallStorm
        expr: sum(increase(pangea_template_stalls_total[1h])) > 100
        for: 30m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "pangea templates entered Stalled {{ printf \"%.0f\" $value }} times in the last hour"
          remedy: "page: a fleet-wide cause (provider rate limit, state store, operator saturation); read pangea_template_stalls_total by state and the compile queue depth before touching single templates"
      - alert: PangeaCompileFailing
        expr: pangea_template_consecutive_compile_failures >= 3
        for: 15m
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "{{ $labels.target_namespace }}/{{ $labels.name }} failed {{ $value }} compiles in a row"
          remedy: "page: the template source does not compile; read status.lastError, fix the source in pangea-architectures, and let the next pass compile it"
      - alert: PangeaPassHeartbeatUnwatched
        expr: pangea_template_pass_heartbeat_age_seconds > 300 and on (template, namespace, workspace) pangea_template_pass{kind=~"planning|applying"} == 1 unless on (template, namespace, workspace) pangea_template_stall == 1
        for: 10m
        labels:
          severity: critical
          remedy_mode: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.template }} pass has not beaten for {{ $value }}s and the watchdog has not named a stall"
          remedy: "page: the pass watchdog is blind to this pass; read status.pass and the operator log, then restart the pass by bumping spec"
  - name: pangea-operator-latency
    interval: 5m
    rules:
      - record: pangea:leaf_plan_seconds:p95_1h
        expr: histogram_quantile(0.95, sum by (le, workspace) (rate(pangea_leaf_plan_seconds_bucket[1h])))
      - alert: PangeaLeafPlanRegressed
        expr: pangea:leaf_plan_seconds:p95_1h > 2 * quantile_over_time(0.5, pangea:leaf_plan_seconds:p95_1h[7d] offset 1h) and pangea:leaf_plan_seconds:p95_1h > 30
        for: 1h
        labels:
          severity: warning
          remedy_mode: page
        annotations:
          summary: "workspace {{ $labels.workspace }} leaf plan p95 is {{ printf \"%.0f\" $value }}s, over twice its 7-day median"
          remedy: "page: plans got slower; compare provider RPC latency (pangea_provider_rpc_seconds) and the compile queue depth, then the operator change that landed when the curve moved"
