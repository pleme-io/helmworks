# -- Number of replicas (singleton operator)
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/pleme-io/pangea-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
# -- Override full name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount annotations
  annotations: {}
  # -- ServiceAccount name (auto-generated if empty)
  name: ""

rbac:
  # -- Create ClusterRole and ClusterRoleBinding
  create: true
  # -- RBAC rules for the operator
  rules:
    # ── Infrastructure CRDs ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["infrastructuretemplates", "infrastructuretemplates/status", "infrastructuretemplates/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["pangea.pleme.io"]
      resources: ["pangeanamespaces", "pangeanamespaces/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["pangea.pleme.io"]
      resources: ["infrastructureflows", "infrastructureflows/status", "infrastructureflows/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Image Pipeline CRDs ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["packerbuilds", "packerbuilds/status", "packerbuilds/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["pangea.pleme.io"]
      resources: ["amitests", "amitests/status", "amitests/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["pangea.pleme.io"]
      resources: ["imagepipelines", "imagepipelines/status", "imagepipelines/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Compliance CRDs ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["complianceschedules", "complianceschedules/status", "complianceschedules/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["pangea.pleme.io"]
      resources: ["compliancebindings", "compliancebindings/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Meta CRDs ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["synthesizerformats", "synthesizerformats/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── M1: ArchitectureGem (typed gem registry, smoke-test gate) ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["architecturegems", "architecturegems/status", "architecturegems/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── M3: WorkspaceCatalog (workspace-level cascade policy) ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["workspacecatalogs", "workspacecatalogs/status", "workspacecatalogs/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── 0.8.0: OperatorPolicy (cluster-scoped fleet kill-switch) ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["operatorpolicies", "operatorpolicies/status"]
      verbs: ["get", "list", "watch", "patch", "update"]
    # ── PangeaDashboard (rendered Grafana dashboards) ──
    - apiGroups: ["pangea.pleme.io"]
      resources: ["pangeadashboards", "pangeadashboards/status"]
      verbs: ["get", "list", "watch", "patch", "update"]
    # ── PangeaAlert (declare-once alert rules; AlertController reconciles
    # each into an owned VMRule / PrometheusRule). The controller self-
    # patches status and GC-owns the rendered rule CR, so it needs the
    # full verb set on the CR and its /status subresource.
    - apiGroups: ["pangea.pleme.io"]
      resources: ["pangeaalerts", "pangeaalerts/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Alert-rule CRs the AlertController renders + owns via
    # ownerReference: VMRule (operator.victoriametrics.com/v1beta1, the rio
    # default — vmalert reads VMRule) and PrometheusRule
    # (monitoring.coreos.com/v1, the prometheus-operator shape). Without
    # these the controller 403s on the rule upsert.
    - apiGroups: ["operator.victoriametrics.com"]
      resources: ["vmrules"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["prometheusrules"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── 0.8.9: PangeaFleetStatus (cluster-scoped operator-driven
    # fleet aggregation singleton; bypasses globalSuspend so this
    # CR keeps refreshing under a pause). The operator self-creates
    # the `default` CR on startup, so `create` verb is required in
    # addition to the usual list/watch/patch/update.
    - apiGroups: ["pangea.pleme.io"]
      resources: ["pangeafleetstatuses", "pangeafleetstatuses/status"]
      verbs: ["get", "list", "watch", "create", "patch", "update"]
    # ── 0.8.19: ReconciliationLoop (roda — the loop-granularity axis,
    # theory/RECONCILIATION-TOPOLOGY.md §II). Cluster-scoped; the
    # reconciliation_loop_controller lists InfrastructureTemplates fleet-wide
    # to resolve each loop's membership + writes the loop's status.
    - apiGroups: ["pangea.pleme.io"]
      resources: ["reconciliationloops", "reconciliationloops/status", "reconciliationloops/finalizers"]
      verbs: ["get", "list", "watch", "create", "patch", "update"]
    # ── Supporting resources ──
    # Events — operator emits Events on every controller's reconcile
    # transitions and on policy/escalation actions. Two API groups:
    #   * core/v1     (legacy `""/v1` Event)
    #   * events.k8s.io/v1 (new shape used by kube-rs's Recorder)
    # Both must be granted cluster-wide because the operator emits
    # Events in *workspace* namespaces (cloudflare-pleme, pleme-io-
    # opensource, …), not just pangea-system. Pre-0.8.2 only the
    # legacy group was granted, so every reconcile in a workspace
    # namespace hit "events.events.k8s.io is forbidden" — visible in
    # operator logs as a WARN per reconcile, no functional impact
    # other than the missing audit trail for those Events.
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch"]
    - apiGroups: ["events.k8s.io"]
      resources: ["events"]
      verbs: ["create", "patch", "update"]
    - apiGroups: [""]
      resources: ["configmaps"]
      # Write verbs for dashboard-as-code: the DashboardController renders a
      # PangeaDashboard's Grafana JSON into a grafana_dashboard=1 sidecar
      # ConfigMap in the dashboard's (arbitrary) namespace, owned by the CR.
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Secrets: read for provider creds + write for outputBindings ──
    # 0.8.12 (X2): output bindings publish tofu outputs to user-named
    # Secrets in arbitrary namespaces. Server-side-apply requires patch
    # in addition to create/update; get/list/watch retained for the
    # existing provider-creds read path.
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "watch", "create", "update", "patch"]
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # ── Batch Jobs (AmiTest + ComplianceSchedule create Jobs) ──
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# -- Container ports (primary port named 'http' to match pleme-lib probe defaults)
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP
  - name: graphql
    containerPort: 8081
    protocol: TCP

service:
  # -- Service type
  type: ClusterIP
  # -- Service ports
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 8081
      targetPort: graphql
      protocol: TCP
      name: graphql

# -- Executor configuration for external tool invocation
executor:
  tofu:
    # -- Path to OpenTofu binary inside the container
    binary: /usr/local/bin/tofu
    # -- Timeout in seconds for tofu operations
    timeout: 600
  packer:
    # -- Path to Packer binary inside the container
    binary: /usr/local/bin/packer
    # -- Timeout in seconds for packer builds
    timeout: 2700
  # -- Base directory for template workspaces
  workspaceBase: /var/pangea/workspaces
  # -- Enable verbose executor logging
  verbose: false
  # -- Number of magnus ruby owner threads in the embedded compile pool.
  # Each worker is a CRuby VM (single-VM-per-thread is a CRuby
  # constraint), so this knob trades RAM + CPU for parallel compile
  # throughput. Default 1 = single-owner shape (today's behavior, no
  # parallelism). Bumped to 4 on rio in S3 of the scale-out plan to
  # actually engage the round-robin dispatcher. Clamped to [1, 32]
  # by the operator. Only consulted when useEmbeddedRuby=true.
  rubyWorkers: 1

  # -- Magma backend (in-process IaC executor) configuration. When
  # `enabled: true` AND the operator binary was built with the
  # `executor_magma` cargo feature, the controller routes per-CR
  # to MagmaExecutor — no fork+exec, no tofu subprocess. Per-CR
  # opt-in via `Pangea.spec.executor: magma`; this flag is the
  # operator-wide default. Both backends ship side by side per
  # theory/MAGMA-OPERATOR-BACKEND.md §VI.
  magma:
    # -- Enable the magma backend at all. When true, the operator
    # pod receives `PANGEA_EXECUTOR=magma` as the default backend
    # for any CR that doesn't set `spec.executor`. Default false
    # so existing deployments keep their TofuExecutor behavior.
    enabled: false
    # -- On-disk state shape for the magma backend.
    # `magma` = typed serde format (default; magma-only fleets).
    # `tofu`  = OpenTofu-readable canonical form (use when the
    # same state is read by both backends during burn-in).
    shape: magma
    # -- Whether to write a typed plan checkpoint between plan +
    # apply for restart safety. Default true; per-CR override via
    # the operator's MagmaExecutorConfig once that ships.
    planCheckpoint: true

# -- Log level + filter for the operator's tracing-subscriber. Comma-
# separated `<target>=<level>` directives per
# https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html.
# Default scope is the operator crate at info; flip to `pangea_operator=debug`
# when chasing a live issue. The chart threads this into RUST_LOG so a
# `helm upgrade --set logLevel=...` debugs without editing the env list.
logLevel: pangea_operator=info

# -- Environment variables (executor config is auto-generated, add extras here).
# RUST_LOG is rendered from .Values.logLevel ABOVE; if you set it again here
# the deployment template's later entry wins per pleme-lib's dedup rule.
env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

# -- Extra environment variables from ConfigMaps or Secrets
envFrom: []

# -- Tiered progressive-discovery config (enjulho: config-as-reconciled-Helm).
#
# The pleme-lib.tieredConfig mixin renders the operator's shikumi
# `OperatorConfig` FILE tier as a reconciled ConfigMap the `ConfigStore`
# discovers + hot-reloads. Schema-shaped to `OperatorConfig` (see
# pangea-operator/pangea-operator/src/config.rs).
#
# DESTINATION FORM — tier-honest. Today the operator resolves its config
# through env + the pod-identity discovered tier only (its `env:` above
# already wires POD_NAME; the executor/leader/db env is rendered by
# `deployment.yaml`). It does NOT yet have a shikumi `ConfigStore` FILE
# discovery. So `config.file.enabled` defaults **false** and the live
# deployment renders byte-identical to today. Flipping it true renders the
# ConfigMap ahead of the config.rs follow-on that teaches `OperatorConfig`
# to discover `/etc/pangea/config.yaml` as its file tier (the
# kustomize/env → reconciled-Helm cutover). Until then this is the
# committed target, not a live read.
#
# SECRET BOUNDARY (non-negotiable): PGPASSWORD / PANGEA_API_TOKEN /
# PANGEA_GEM_AUTH_TOKEN are NEVER rendered here — they stay direct env /
# secretKeyRef (see gemAuth + the operator's deliberate secret exclusion).
config:
  app: pangea-operator
  configMapName: pangea-operator-config
  file:
    enabled: false            # DESTINATION: flip true once config.rs discovers the file tier
    fileName: config.yaml
    mountPath: /etc/pangea
    # The non-secret OperatorConfig surface. Example shape (leave {} to
    # render nothing; the mixin no-ops on empty data):
    #   executor: { backend: magma, forbid_tofu: true }
    #   database: { host: pangea-database-rw..., port: 5432, user: postgres, database: pangea_state }
    #   reconcile: { workers: 4, budget_per_workspace: 4, budget_global: 16 }
    #   observability: { log_format: pretty, otel_service_name: pangea-operator }
    data: {}
  # discovered tier is already wired via `env:` (POD_NAME) above; the mixin's
  # downward-API env is not injected into this chart's custom deployment.
  discovered:
    podNamespace: false
    podName: false

# -- Compiler sidecar endpoint (operator connects here for DSL compilation)
# Ignored when useEmbeddedRuby=true (operator dispatches in-process).
compilerEndpoint: http://localhost:8082

# -- Use the embedded magnus + CRuby evaluator instead of the
# pangea-compiler HTTP sidecar. When true:
#   - operator gets PANGEA_COMPILER_BACKEND=embedded;
#   - compiler sidecar is NOT rendered into the pod spec;
#   - operator pod becomes single-container.
# Operator binary MUST be built with `--features embedded_ruby`
# (CI publishes that variant under tag suffix `-embedded`).
# See theory/PANGEA-WORKSPACE-RECONCILIATION.md M8.4 + M8.5.
useEmbeddedRuby: false

# -- Ruby compile isolation strategy. Only consulted when useEmbeddedRuby=true.
#   embedded (default): one long-lived magnus VM with an in-thread worker pool
#     (PANGEA_RUBY_WORKERS). Fast, but process-global Ruby state ($LOADED_FEATURES,
#     Pangea::* constants + autoload tables) accumulates across template compiles —
#     the cross-template contamination class root-caused 2026-06-05.
#   process: PANGEA_COMPILER_BACKEND=process — each compile runs in a fresh
#     `pangea-operator --compile-worker` child that boots its own VM, serves one
#     request, and exits. Cross-template contamination is UNREPRESENTABLE by
#     construction (order-independent). Costs a magnus boot (~1-3s) per compile;
#     PANGEA_RUBY_WORKERS bounds concurrent worker processes. Requires an operator
#     image built with the embedded_ruby feature (release-train default).
rubyIsolation: embedded

# -- Sidecar containers rendered by pleme-lib into the pod spec.
# The compiler sidecar compiles Ruby DSL to Terraform/Packer JSON.
# Replaced by the embedded evaluator when useEmbeddedRuby=true.
# Set to [] to disable the compiler (only pre-compiled JSON templates will work).
sidecars:
  - name: compiler
    # Pinned to a specific tag rather than `:latest` so existing pods
    # don't drift when the registry tag is rebuilt. Override per cluster
    # if you need a different sidecar version. Use SHA-pinned tags
    # (`amd64-<sha>`) for fully deterministic kubelet caching — see
    # rio's HelmRelease for the canonical pattern.
    image: ghcr.io/pleme-io/pangea-compiler:amd64-c73d5a9
    imagePullPolicy: IfNotPresent
    ports:
      - name: compiler
        containerPort: 8082
        protocol: TCP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: compiler
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /healthz
        port: compiler
      initialDelaySeconds: 5
      periodSeconds: 10
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
      - name: workspaces
        mountPath: /var/pangea/workspaces
      - name: tmp
        mountPath: /tmp

# -- Where the embedded evaluator stores per-ArchitectureGem clones.
# Mounted as an emptyDir on the operator container when
# useEmbeddedRuby=true. Survives container restarts within a single
# Pod incarnation; re-clones on Pod recreation. Gemcache volumes
# scaling beyond emptyDir lands as M8.5+ once disk reclamation
# semantics are confirmed.
gemCacheDir: /var/pangea/gems

# -- Optional Secret carrying a GitHub auth token (PAT or App
# installation token) used by the embedded operator's gem cache to
# clone private ArchitectureGem source repos. When set, the operator
# rewrites `https://github.com/...` clone URLs to
# `https://x-access-token:$TOKEN@github.com/...`. Required for any
# CR whose source.gitRepository points at a private pleme-io repo.
# Leave unset (default) for public-only deployments.
#
# Secret must contain a key named `token` (override via `tokenKey`).
gemAuth:
  tokenSecret:
    name: ""
    key: token

# -- Resource requests and limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Workspace persistence
workspace:
  # -- Volume type: emptyDir (ephemeral) or pvc (persistent)
  type: emptyDir
  emptyDir:
    # -- Size limit for ephemeral workspace
    sizeLimit: 2Gi
  pvc:
    # -- Storage class for persistent workspace
    storageClass: ""
    # -- Access modes
    accessModes:
      - ReadWriteOnce
    # -- Storage size
    size: 10Gi

# -- Volume mounts for the operator container
volumeMounts:
  - name: workspaces
    mountPath: /var/pangea/workspaces
  - name: tmp
    mountPath: /tmp

# -- Volumes (auto-generated from workspace config, add extras here)
volumes:
  - name: workspaces
    emptyDir:
      sizeLimit: 2Gi
  - name: tmp
    emptyDir:
      sizeLimit: 256Mi

# -- Health probe configuration
health:
  # -- Liveness probe path
  path: /healthz
  # -- Readiness probe path
  readyPath: /readyz
  # -- Health port name
  port: http
  # -- Initial delay for liveness probe
  initialDelaySeconds: 5
  # -- Period between liveness probes
  periodSeconds: 10

# -- Startup probe configuration
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

# -- Deployment strategy (Recreate prevents dual reconciliation)
strategy:
  type: Recreate

# -- Termination grace period
terminationGracePeriodSeconds: 30

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Pod annotations
podAnnotations: {}

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Monitoring configuration
monitoring:
  enabled: true
  path: /metrics
  port: metrics

# -- Observability — OpenTelemetry export (X1 of the Crossplane-absorb plan).
# When `otel.endpoint` is non-empty, the operator wires an OTLP-gRPC
# exporter and emits per-phase reconcile spans (handle_pending,
# handle_compiling, handle_planning, handle_applying, …). When unset
# (default), no traces are exported — log output is unchanged. Set
# `serviceName` to override the default `pangea-operator` resource
# attribute. A Tempo / VictoriaTraces / Jaeger sink is *not* shipped
# by this chart; consumers point at their existing trace backend.
observability:
  # ── pleme-lib.observabilityBundle border (the abstracted telemetry surface) ──
  # ONE typed border → VMServiceScrape + VMRule + dashboard ConfigMap via pleme-lib
  # (templates/observability.yaml). Replaces the hand-authored servicemonitor/
  # podmonitor/prometheusrule/grafana-dashboard templates. flavor:vm = rio-native.
  # The rules groups + dashboards/pangea-operator.json are GENERATED by
  # pangea-dashboards (Pangea::Architectures::PangeaOperator) and persisted here
  # (CLOSED-LOOP persistent-spec). Re-gen: pangea-architectures
  # workspaces/rio-observability/render.rb.
  flavor: vm
  scrape:
    enabled: true
    port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  rules:
    enabled: true
    groups:
      - name: pangea-operator
        interval: 30s
        rules:
          - alert: PangeaMagmaApplyFailing
            expr: max by (template, target_namespace) (pangea_magma_resources_failed) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Magma apply partially failing for {{ $labels.template }}
              description: "{{ $value }} resources failed in the last magma apply for {{ $labels.template }} ({{ $labels.target_namespace }}) for 10m."
          - alert: PangeaOperatorDown
            expr: up{job="pangea-operator"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: pangea-operator is down
              description: The pangea-operator metrics endpoint has been unreachable for 5m.
          - alert: PangeaReconcileRateHigh
            expr: sum by (controller) (rate(pangea_controller_reconciliations_total[1m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Reconcile rate high for {{ $labels.controller }}
              description: Controller {{ $labels.controller }} is reconciling >1/s for 5m — likely a self-trigger status-write loop.
          - alert: PangeaOperatorErrorRate
            expr: rate(pangea_controller_reconciliations_total{result="error"}[5m]) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: pangea-operator reconcile error rate elevated
              description: Reconcile errors >0.5/s for 5m. Check operator logs + template status.
          - alert: PangeaTemplateNotSettled
            expr: pangea_settled == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Template not settled for {{ $labels.template }}
              description: Template {{ $labels.template }} ({{ $labels.target_namespace }}) has Settled=False for 15m.
          - alert: PangeaSettlingEscalation
            expr: increase(pangea_settling_failures_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Settling escalation for {{ $labels.template }}
              description: A settling-failure escalation fired ({{ $labels.reason }}) for {{ $labels.template }} ({{ $labels.target_namespace }}).
          - alert: PangeaTemplateStuckCompiling
            expr: pangea_template_consecutive_compile_failures >= 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Template stuck compiling: {{ $labels.name }}'
              description: "{{ $value }} consecutive compile failures for {{ $labels.target_namespace }}/{{ $labels.name }}."
          - alert: PangeaCompileQueueBacklog
            expr: pangea_compile_queue_depth > 10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Compile dispatcher queue backlog
              description: The magnus compile dispatcher queue has held >10 pending requests for 10m — compile is the serialization bottleneck.
  dashboard:
    enabled: true
    name: pangea-operator
    deploy: sidecar
    file: dashboards/pangea-operator.json
  otel:
    endpoint: ""
    serviceName: ""

# -- Grafana dashboard (loaded by kube-prometheus-stack grafana sidecar
# via the `grafana_dashboard: "1"` ConfigMap label). Renders per-template
# settling state, drift cycles, policy decisions, pending high-risk
# changes, and reconciliation throughput.
grafanaDashboard:
  enabled: true

# -- Network policy
networkPolicy:
  enabled: false

# -- Pod disruption budget
pdb:
  enabled: false
  minAvailable: 1

# -- Horizontal pod autoscaler (disabled for operators)
autoscaling:
  enabled: false

# -- Istio integration
istio:
  enabled: false

# -- Attestation annotations (sekiban integration)
attestation:
  enabled: false

# ── Breathable worker pool (NEW in v0.4.x — opt-in) ───────────────────
# When enabled: true, the controller stops running tofu plan/apply
# inline and instead emits PangeaWorkUnit CRs that are claimed by
# scale-to-zero worker pods (per-class Deployments scaled by KEDA on
# the pangea_workunit_pending_total{work_class=...} gauge).
#
# Backward-compat: workers.enabled defaults false. Existing v0.2.x
# deployments keep running the inline executor with no behavior change.
# Flip to true once the operator has emitted PangeaWorkClass CRs and
# the matching worker pools are healthy.
#
# See: pangea-operator/docs/design/0003-helmworks-chart-and-breathable-workers.md
workers:
  enabled: false

  # KEDA must be installed in the cluster (the pleme-io standard infra).
  keda:
    enabled: true
    # Prometheus-compatible metrics store the controller writes to + KEDA
    # scrapes from. Defaults match the rio cluster's vm-k8s-stack VMSingle.
    prometheusUrl: http://vmsingle-vm.monitoring.svc:8429

  # Defaults shared by every worker class. Per-class entries below
  # override individual fields.
  scaling:
    pollingInterval: 15      # seconds; KEDA poll cadence
    cooldownPeriod: 300      # seconds idle before scale-to-zero
    targetPendingPerReplica: 1

  # Provider plugin cache — RWX PVC mounted into all worker pods at
  # ~/.terraform/plugin-cache/. Avoids re-downloading provider plugins
  # per pod. Set enabled: false to skip; each pod will fetch cold.
  providerPluginCache:
    enabled: false
    storageClassName: ""
    size: 5Gi
    accessMode: ReadWriteMany

  # Per-class pools. Each enabled class gets its own Deployment, KEDA
  # ScaledObject, and PangeaWorkClass CR. Authors set spec.workClass
  # on parent CRs (PangeaArchitecture / InfrastructureTemplate /
  # PangeaNamespace); the controller looks the class up to dispatch.
  classes:
    small:
      enabled: true
      image:
        repository: ghcr.io/pleme-io/pangea-operator-worker
        tag: ""
        pullPolicy: IfNotPresent
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 1, memory: 1Gi }
      timeout: 5m
      concurrencyPerWorker: 1
      scaling:
        minReplicas: 0
        maxReplicas: 5

    medium:
      enabled: true
      image:
        repository: ghcr.io/pleme-io/pangea-operator-worker
        tag: ""
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits:   { cpu: 2, memory: 2Gi }
      timeout: 15m
      concurrencyPerWorker: 1
      scaling:
        minReplicas: 0
        maxReplicas: 10

    large:
      enabled: false           # opt-in — for big tofu graphs only
      image:
        repository: ghcr.io/pleme-io/pangea-operator-worker
        tag: ""
      resources:
        requests: { cpu: 2, memory: 4Gi }
        limits:   { cpu: 4, memory: 8Gi }
      timeout: 30m
      concurrencyPerWorker: 1
      scaling:
        minReplicas: 0
        maxReplicas: 3

# -- PrometheusRule alerts
prometheusRules:
  enabled: true
  rules:
    - alert: PangeaDriftDetected
      expr: increase(pangea_drift_detected_total[5m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Infrastructure drift detected in {{ $labels.namespace }}/{{ $labels.name }}"
        description: "Pangea operator detected infrastructure drift that may require attention."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeadriftdetected"
    - alert: PangeaReconciliationFailing
      expr: increase(pangea_reconciliation_errors_total[15m]) > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pangea reconciliation failing repeatedly"
        description: "More than 5 reconciliation errors in the last 15 minutes."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeareconciliationfailing"
    - alert: PangeaTemplateStuck
      expr: pangea_templates_by_phase{phase="Failed"} > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Pangea template stuck in Failed phase"
        description: "One or more templates have been in Failed phase for over 30 minutes."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeatemplatestuck"
    # ── State-settling + policy engine alerts (chart 0.4.0) ──
    # The whole point of the settling tracker is that "stuck" should
    # never go silent. These rules surface every flavor of stuck.
    - alert: PangeaTemplateNotSettled
      expr: pangea_settled == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Template {{ $labels.namespace }}/{{ $labels.template }} has not settled"
        description: "Settled gauge has been 0 for >15min — drift is reappearing on every drift check."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeatemplatenotsettled"
    - alert: PangeaSettlingEscalation
      expr: increase(pangea_settling_failures_total[5m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Settling escalated for {{ $labels.namespace }}/{{ $labels.template }} ({{ $labels.reason }})"
        description: "State-settling tracker fired ({{ $labels.reason }}) — investigate stuckResources status field. Auto-apply will not converge."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeasettlingescalation"
    - alert: PangeaPolicyRefuseFiring
      expr: increase(pangea_policy_decisions_total{decision="refuse"}[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Policy refuse rule blocked changes in {{ $labels.namespace }}/{{ $labels.template }}"
        description: "A spec.policies rule with decision=refuse matched {{ $value }} change(s) — plan was not applied."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeapolicyrefusefiring"
    - alert: PangeaHighRiskPending
      expr: pangea_template_drift_detail{action=~"delete|replace",risk="high"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High-risk {{ $labels.action }} pending in {{ $labels.namespace }}/{{ $labels.template }}"
        description: "{{ $value }} resource(s) with high-risk {{ $labels.action }} action sitting in pending state."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeahighriskpending"
    # ── Image Pipeline alerts ──
    - alert: PackerBuildFailed
      expr: pangea_packer_builds_by_phase{phase="Failed"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Packer build {{ $labels.name }} failed in {{ $labels.namespace }}"
        description: "A PackerBuild CR has been in Failed phase for over 5 minutes."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#packerbuildfailed--imagepipelinestuck--amitestfailed"
    - alert: ImagePipelineStuck
      expr: pangea_image_pipelines_by_phase{phase!~"Completed|Pending|Failed"} > 0
      for: 60m
      labels:
        severity: warning
      annotations:
        summary: "Image pipeline {{ $labels.name }} stuck in {{ $labels.phase }}"
        description: "An ImagePipeline has been in a non-terminal phase for over 60 minutes."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#packerbuildfailed--imagepipelinestuck--amitestfailed"
    - alert: AmiTestFailed
      expr: pangea_ami_tests_by_phase{phase="Failed"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AMI test {{ $labels.name }} failed in {{ $labels.namespace }}"
        description: "An AmiTest CR has test suites in Failed phase."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#packerbuildfailed--imagepipelinestuck--amitestfailed"
    # ── Compliance alerts ──
    - alert: ComplianceNonCompliant
      expr: pangea_compliance_schedules_by_phase{phase="NonCompliant"} > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Compliance schedule {{ $labels.name }} is non-compliant"
        description: "Infrastructure compliance checks failed. Bound targets may be gated."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#compliancenoncompliant--compliancebindinggating"
    - alert: ComplianceBindingGating
      expr: pangea_compliance_bindings_gated_targets > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "{{ $value }} targets gated by compliance binding {{ $labels.name }}"
        description: "Infrastructure targets are suspended due to compliance failure."
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#compliancenoncompliant--compliancebindinggating"
    # ── 0.8.x — Item J workqueue forensics alerts ────────────────
    - alert: PangeaTemplateStuckCompiling
      expr: pangea_template_consecutive_compile_failures >= 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Template {{ $labels.namespace }}/{{ $labels.name }} stuck compiling ({{ $value }} consecutive failures)"
        description: |
          The template's compile phase has failed {{ $value }} times in a row.
          Common causes: missing provider gem (e.g., pangea-github not bundled),
          syntax error in workspace DSL, unresolved git source. At
          settlingPolicy.maxConsecutiveDriftCycles (default 5), the operator
          escalates to phase=Failed. Check `kubectl describe infra` for the
          exact compile error message.
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeatemplatestuckcompiling"
    # ── Pause-state alerts ───────────────────────────────────────
    # The four alerts below all reflect intentional operator-pause
    # state (globalSuspend, controllerSuspend, workspaceSuspend,
    # workspaceSuspend.state=active). Severity is `info` so they
    # don't page on-call; long `for:` durations keep them out of
    # short-pause noise (a 30-min maintenance pause shouldn't fire,
    # but a multi-day forgotten pause should). Adjust thresholds
    # if your fleet's pause cadence differs.
    - alert: PangeaOperatorPaused
      # Fires only after the global pause has been continuously
      # generating skips for 1h — short maintenance windows stay
      # silent; a forgotten pause surfaces at the 1h mark.
      expr: increase(pangea_policy_skipped_total{source="global"}[1h]) > 100
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Operator globally paused for ≥1h — {{ $value }} reconciles skipped"
        description: |
          OperatorPolicy/default has spec.globalSuspend=true and the gate
          has been firing continuously for over an hour. INFO severity
          because pause is intentional; threshold is high so short
          maintenance windows stay silent. Resume by patching
          globalSuspend=false on the HelmRelease values or directly on
          the OperatorPolicy/default CR.
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeaoperatorpaused"
    - alert: PangeaControllerSuspended
      expr: increase(pangea_policy_skipped_total{source="controller"}[1h]) > 50
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Controller {{ $labels.controller }} suspended for ≥1h"
        description: |
          A specific controller has been paused via spec.controllerSuspend.{{ $labels.controller }}=true
          for over an hour. INFO severity so it doesn't page; surfaces
          on the dashboard so the partial pause is visible.
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeacontrollersuspended--pangeaworkspacepaused--pangeaactiveoverridesactive"
    - alert: PangeaWorkspacePaused
      expr: increase(pangea_policy_skipped_total{source=~"workspace|catalog"}[1h]) > 50
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Workspace {{ $labels.target }} paused for ≥1h ({{ $labels.source }})"
        description: |
          Workspace {{ $labels.target }} is paused via
          spec.workspaceSuspend.{{ $labels.source }}s — direct entry
          (workspace) or cascade from parent catalog (catalog).
          INFO severity: pause is intentional. Resolve by editing the
          OperatorPolicy/default workspaceSuspend map.
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeacontrollersuspended--pangeaworkspacepaused--pangeaactiveoverridesactive"
    - alert: PangeaActiveOverridesActive
      # for: 1h to avoid alerting on transient Active states during a
      # planned cluster recovery; a long-lived Active carve-out
      # surfaces at the 1h mark.
      expr: pangea_workspace_active_override > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "{{ $labels.kind }}/{{ $labels.name }} carved out via workspaceSuspend.state=active for ≥1h"
        description: |
          A workspace has an explicit `Active` carve-out — it keeps
          reconciling even when global/catalog/controller-level pauses
          would otherwise stop it. INFO severity; dashboards show which
          surgical exemptions are in effect during a fleet pause.
          Source: {{ $labels.source }}, namespace: {{ $labels.namespace }}.
        runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#pangeacontrollersuspended--pangeaworkspacepaused--pangeaactiveoverridesactive"

  # ── Reconcile-rate anomaly detector (defense-in-depth) ──────────
  #
  # Code-complete in chart 0.8.14 but DEFAULT OFF. Flip
  # `reconcileRateAnomaly.enabled: true` after baselining your
  # fleet's normal reconcile rate (the thresholds are tuned for
  # rio's load — adjust per cluster).
  #
  # Catches the bug class that hit rio on 2026-05-07: a status-
  # write feedback loop in `template_controller` ran ~52 reconciles
  # per second across 6 templates (123 PATCH/sec on cloudflare-
  # pleme alone), and `operator_policy_controller` ran ~76/sec on
  # OperatorPolicy/default — burning ~7.5 cores via amplified
  # k3s API churn before the diff-gates landed (operator c02ab09 →
  # 6a9663f → 4f421cb → ab859b0). With these alerts enabled, the
  # next regression of this class fires within 1m of crossing the
  # threshold instead of after a multi-hour debug session.
  reconcileRateAnomaly:
    enabled: false
    rules:
      - alert: PangeaControllerReconcileRateHigh
        # > 1 reconcile/sec sustained for 1m on any single
        # controller. The pre-fix bugs sat at 10–76/sec, well
        # above this; legitimate steady-state on rio post-fix is
        # < 0.1/sec per controller. Threshold is 10× the steady-
        # state floor — leaves room for legitimate spec-change
        # bursts without false-positives.
        expr: |
          sum by (controller) (
            rate(pangea_controller_reconciliations_total[1m])
          ) > 1
        for: 1m
        labels:
          severity: warning
          subsystem: pangea-operator
        annotations:
          summary: "{{ $labels.controller }} reconciling >1/sec for 1m+"
          description: |
            Controller `{{ $labels.controller }}` has averaged
            {{ printf "%.2f" $value }} reconciles/sec over the last
            minute — sustained rate above the steady-state floor
            (typically <0.1/sec/controller). Likely cause: a status-
            write feedback loop (the `2026-05-07` antipattern). Check
            the relevant CR's `metadata.resourceVersion` over a few
            seconds — if it bumps faster than once per requeue
            interval, there's a self-trigger watch loop. See the
            controller's `*_status_needs_patch` helper (or equivalent
            diff-gate) for the canonical fix shape.
          runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#reconcile-rate-anomaly"
      - alert: PangeaControllerReconcileRateCritical
        # >10/sec sustained for 5m: the rio bugs sat here. By 5m,
        # we're guaranteed to have dropped through any transient
        # CR mutation burst.
        expr: |
          sum by (controller) (
            rate(pangea_controller_reconciliations_total[5m])
          ) > 10
        for: 5m
        labels:
          severity: critical
          subsystem: pangea-operator
        annotations:
          summary: "{{ $labels.controller }} reconciling >10/sec for 5m+ (likely watch-loop regression)"
          description: |
            Controller `{{ $labels.controller }}` has averaged
            {{ printf "%.2f" $value }} reconciles/sec over the last
            5 minutes. This rate is mathematically not legitimate —
            no CRD spec can be hand-mutated this fast, and Action::
            requeue floors at 1/sec. The signal class is exclusively
            self-trigger watch loops driven by status-write churn.
            Pause the controller via OperatorPolicy.spec.controllerSuspend.{kind}
            while you patch the gate.
          runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#reconcile-rate-anomaly"
      - alert: PangeaOperatorErrorRateHigh
        # Catches sustained reconcile-error churn (the controller
        # is failing-and-retrying, e.g. a backend that isn't
        # responding). >0.5/sec for 10m means we're not just on
        # a transient blip.
        expr: |
          sum by (controller) (
            rate(pangea_controller_reconciliations_total{result="error"}[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          subsystem: pangea-operator
        annotations:
          summary: "{{ $labels.controller }} error reconciles >0.5/sec for 10m+"
          description: |
            Sustained reconcile-error rate of
            {{ printf "%.2f" $value }} errors/sec — likely a stuck
            external dependency (kubeapi connectivity, postgres
            backend, terraform state lock, gem fetch). Check the
            controller's recent logs for the error type and the
            CR's `.status.lastError`.
          runbook_url: "https://github.com/pleme-io/pangea-operator/blob/main/docs/RUNBOOKS.md#operator-error-rate-high"

# ────────────────────────────────────────────────────────────────────
# OperatorPolicy — fleet-wide kill-switch primitive
# ────────────────────────────────────────────────────────────────────
#
# The chart ships an `OperatorPolicy/default` CR with everything `false`
# so a fresh install matches pre-OperatorPolicy behavior. Operators
# flip flags at runtime via `kubectl patch`; static overrides via
# values.yaml are useful for clusters that should boot suspended
# (e.g., a rebuild cluster that needs CRs in place but no reconciliation
# until manually un-paused).
#
# Composes with each CR's per-resource `spec.suspend`:
#   * globalSuspend=true             → every controller skips
#   * controllerSuspend.<kind>=true  → only that controller skips
#   * spec.suspend=true on a CR      → only that CR is skipped
operatorPolicy:
  # Whether to ship the singleton `OperatorPolicy/default` CR. Set to
  # false if managing the policy externally (e.g., via Flux + a
  # separate manifest).
  create: true

  # Master kill-switch. true = pause everything.
  globalSuspend: false

  # Operator-readable string surfaced in logs + Events. Empty by default.
  globalSuspendReason: ""

  # Per-controller suspend flags. Each maps 1:1 to a reconciler.
  controllerSuspend:
    template: false
    namespace: false
    workspaceCatalog: false
    architectureGem: false
    complianceBinding: false
    complianceSchedule: false
    imagePipeline: false
    flow: false
    dashboard: false
    amiTest: false
    packerBuild: false
    synthesizerFormat: false

  # Per-workspace tri-state suspend (templates + catalogs).
  #
  # Each entry's `state` is one of:
  #
  #   * inherit (default) — fall through to controllerSuspend / globalSuspend
  #   * paused            — explicit pause regardless of more-general layer
  #   * active            — explicit run even when global/controller is paused
  #                         ("specifically configured to reconcile during a
  #                         global pause" — surgical carve-out)
  #
  # Specific overrides general: a template entry overrides the catalog
  # entry of its parent WorkspaceCatalog, both override controllerSuspend
  # and globalSuspend.
  #
  # Example layouts:
  #
  #   workspaceSuspend:
  #     templates:
  #       "pangea-system/cloudflare-pleme":
  #         state: paused
  #         reason: "investigating drift"
  #     catalogs:
  #       "opensource":
  #         state: active                     # carve out under global pause
  #         reason: "monitoring github org"
  #
  # Reason is optional throughout. Pausing means no new reconcile actions —
  # observability (status, metrics, alerts) stays fully on.
  workspaceSuspend:
    templates: {}
    catalogs: {}

# breathe resource-homeostasis (breathe.pleme.io). CPU ONLY — an external
# MemoryBand already targets this Deployment (created outside this chart,
# by lareira-observe-operator on rio/camelot); declaring a second MemoryBand
# from the chart itself would conflict/duplicate against the same target.
# Shadow-first (dryRun: true); the operator's own reconcile-rate footprint
# makes a live CPU carve worth observing before trusting.
breathe:
  enabled: true
  memory:
    enabled: false
  cpu:
    enabled: true
    dryRun: true
    disruptionPolicy: restartFreeOnly
