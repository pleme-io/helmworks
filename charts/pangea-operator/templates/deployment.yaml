{{/*
Custom deployment that injects executor env vars into the pleme-lib deployment.
We prepend the executor env vars to .Values.env before calling pleme-lib.

M8.5: when .Values.useEmbeddedRuby is true, switch the operator to
embedded mode and drop the compiler sidecar from the pod spec.
*/}}
{{- $useEmbedded := .Values.useEmbeddedRuby | default false -}}
{{/* rubyIsolation (default "embedded"): when useEmbeddedRuby=true, choose
     between the long-lived in-thread magnus VM ("embedded") and
     process-per-compile isolation ("process" → PANGEA_COMPILER_BACKEND=process,
     a fresh `--compile-worker` child per compile → cross-template contamination
     unrepresentable by construction). Default keeps today's behavior. */}}
{{- $rubyIsolation := .Values.rubyIsolation | default "embedded" -}}
{{- $compilerBackend := "http" -}}
{{- if $useEmbedded -}}
{{-   $compilerBackend = ternary "process" "embedded" (eq $rubyIsolation "process") -}}
{{- end -}}
{{- $gemAuthSecretName := (((.Values.gemAuth).tokenSecret).name | default "") -}}
{{- $gemAuthSecretKey := (((.Values.gemAuth).tokenSecret).key | default "token") -}}
{{- $magmaPg := ((.Values.executor.magma).postgres) | default dict -}}
{{/* Derive the CNPG Service host from clusterName (its own deterministic
     -rw naming convention) when host isn't set directly — see the
     clusterName comment in values.yaml for the full rationale. */}}
{{- $magmaPgHost := $magmaPg.host | default "" -}}
{{- if and (eq $magmaPgHost "") (ne ($magmaPg.clusterName | default "") "") -}}
{{- $magmaPgHost = printf "%s-rw.%s.svc.cluster.local" $magmaPg.clusterName .Release.Namespace -}}
{{- end -}}
{{- $executorEnv := list
  (dict "name" "RUST_LOG" "value" (.Values.logLevel | default "pangea_operator=info"))
  (dict "name" "TOFU_BINARY" "value" (.Values.executor.tofu.binary | default "/usr/local/bin/tofu"))
  (dict "name" "PANGEA_TIMEOUT" "value" (printf "%v" (.Values.executor.tofu.timeout | default 600)))
  (dict "name" "PACKER_BINARY" "value" (.Values.executor.packer.binary | default "/usr/local/bin/packer"))
  (dict "name" "PACKER_TIMEOUT" "value" (printf "%v" (.Values.executor.packer.timeout | default 2700)))
  (dict "name" "PANGEA_WORKSPACE_BASE" "value" (.Values.executor.workspaceBase | default "/var/pangea/workspaces"))
  (dict "name" "COMPILER_ENDPOINT" "value" (.Values.compilerEndpoint | default "http://localhost:8082"))
  (dict "name" "PANGEA_COMPILER_BACKEND" "value" $compilerBackend)
  (dict "name" "PANGEA_GEM_CACHE_DIR" "value" (.Values.gemCacheDir | default "/var/pangea/gems"))
  (dict "name" "PANGEA_RUBY_WORKERS" "value" (printf "%v" (.Values.executor.rubyWorkers | default 1)))
-}}
{{/* X1: OTLP exporter env. Operator boots with no exporter when
     endpoint is empty; logs are unchanged. */}}
{{- $otelEndpoint := (((.Values.observability).otel).endpoint | default "") -}}
{{- if ne $otelEndpoint "" }}
{{- $executorEnv = append $executorEnv (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" $otelEndpoint) }}
{{- $otelServiceName := (((.Values.observability).otel).serviceName | default "") -}}
{{- if ne $otelServiceName "" }}
{{- $executorEnv = append $executorEnv (dict "name" "OTEL_SERVICE_NAME" "value" $otelServiceName) }}
{{- end }}
{{- end }}
{{- if .Values.executor.verbose }}
{{- $executorEnv = append $executorEnv (dict "name" "PANGEA_VERBOSE" "value" "true") }}
{{- end }}
{{/* Magma backend wiring — per theory/MAGMA-OPERATOR-BACKEND.md §VI.
     When `executor.magma.enabled` is true, PANGEA_EXECUTOR=magma
     becomes the operator-wide default backend. Per-CR override via
     `Pangea.spec.executor: magma|tofu` still wins. Requires the
     operator image to be built with the `executor_magma` cargo
     feature; pleme-io's release images flip this on by default
     once the burn-in phase completes (M0.15). */}}
{{- if (((.Values.executor).magma).enabled | default false) }}
{{- $executorEnv = append $executorEnv (dict "name" "PANGEA_EXECUTOR" "value" "magma") }}
{{- $magmaShape := (((.Values.executor).magma).shape | default "magma") }}
{{- $executorEnv = append $executorEnv (dict "name" "PANGEA_MAGMA_SHAPE" "value" $magmaShape) }}
{{- if hasKey ((.Values.executor).magma) "planCheckpoint" }}
{{- $executorEnv = append $executorEnv (dict "name" "PANGEA_MAGMA_PLAN_CHECKPOINT" "value" (printf "%v" .Values.executor.magma.planCheckpoint)) }}
{{- end }}
{{/* M1 convenience surface (theory/MAGMA-POSTGRES-LIFECYCLE.md M1):
     when executor.magma.postgres.host or .clusterName is set, render
     the PG* env vars the operator's main.rs reads to wire its
     state-backend pool, instead of every consumer hand-authoring
     them. ($magmaPg/$magmaPgHost are declared at the top of this file
     so they're in scope for the pg-wait initContainer block further
     down too.) */}}
{{- if ne $magmaPgHost "" }}
{{- $executorEnv = append $executorEnv (dict "name" "PGHOST" "value" $magmaPgHost) }}
{{- $executorEnv = append $executorEnv (dict "name" "PGPORT" "value" (printf "%v" ($magmaPg.port | default 5432))) }}
{{- $executorEnv = append $executorEnv (dict "name" "PGDATABASE" "value" ($magmaPg.database | default "pangea_state")) }}
{{- $executorEnv = append $executorEnv (dict "name" "PGUSER" "valueFrom" (dict "secretKeyRef" (dict "name" $magmaPg.passwordSecretName "key" ($magmaPg.userSecretKey | default "username")))) }}
{{- $executorEnv = append $executorEnv (dict "name" "PGPASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $magmaPg.passwordSecretName "key" ($magmaPg.passwordSecretKey | default "password")))) }}
{{- end }}
{{- end }}
{{- if and $useEmbedded (ne $gemAuthSecretName "") }}
{{- $executorEnv = append $executorEnv (dict
    "name" "PANGEA_GEM_AUTH_TOKEN"
    "valueFrom" (dict "secretKeyRef" (dict "name" $gemAuthSecretName "key" $gemAuthSecretKey))) }}
{{- end }}
{{- $mergedValues := deepCopy .Values }}
{{- $_ := set $mergedValues "env" (concat $executorEnv (.Values.env | default list)) }}

{{/* When embedded, drop the compiler sidecar entirely. */}}
{{- if $useEmbedded }}
{{- $_ := set $mergedValues "sidecars" (list) }}
{{- end }}

{{/* When embedded, mount an emptyDir gem-cache on the operator
     container so prepare_gem clones land somewhere writable.
     pleme-lib reads .Values.volumes and .Values.volumeMounts. */}}
{{- if $useEmbedded }}
{{- $existingVolumes := index $mergedValues "volumes" | default (list) }}
{{- $existingMounts := index $mergedValues "volumeMounts" | default (list) }}
{{- $cacheDir := .Values.gemCacheDir | default "/var/pangea/gems" }}
{{- $cacheVolume := dict "name" "pangea-gem-cache" "emptyDir" (dict) }}
{{- $cacheMount := dict "name" "pangea-gem-cache" "mountPath" $cacheDir }}
{{- $_ := set $mergedValues "volumes" (append $existingVolumes $cacheVolume) }}
{{- $_ := set $mergedValues "volumeMounts" (append $existingMounts $cacheMount) }}
{{- end }}

{{/* M1 convenience surface, continued: the pg-wait initContainer
     (★★ UNREPRESENTABILITY gate — see the postgres.pgWait comment in
     values.yaml). Prepended ahead of any consumer-supplied
     initContainers so it is always the earliest gate. */}}
{{- if and (ne $magmaPgHost "") (($magmaPg.pgWait).enabled | default true) }}
{{- $pgWait := dict
    "name" "pg-wait"
    "image" (($magmaPg.pgWait).image | default "ghcr.io/cloudnative-pg/postgresql:16.6")
    "imagePullPolicy" "IfNotPresent"
    "command" (list "pg_isready"
        "-h" $magmaPgHost
        "-p" (printf "%v" ($magmaPg.port | default 5432))
        "-d" ($magmaPg.database | default "pangea_state")
        "-U" "postgres"
        "-t" (printf "%v" (($magmaPg.pgWait).timeoutSeconds | default 10)))
    "securityContext" (dict
        "allowPrivilegeEscalation" false
        "runAsNonRoot" true
        "capabilities" (dict "drop" (list "ALL"))
        "seccompProfile" (dict "type" "RuntimeDefault"))
    "resources" (dict
        "requests" (dict "cpu" "10m" "memory" "16Mi")
        "limits" (dict "cpu" "50m" "memory" "32Mi")) }}
{{- $existingInit := index $mergedValues "initContainers" | default (list) }}
{{- $_ := set $mergedValues "initContainers" (prepend $existingInit $pgWait) }}
{{- end }}

{{- $ctx := deepCopy . }}
{{- $_ := set $ctx "Values" $mergedValues }}
{{- include "pleme-lib.deployment" $ctx }}
