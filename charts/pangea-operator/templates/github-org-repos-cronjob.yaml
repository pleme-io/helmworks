{{/*
The derived half of github-org-repos.yaml's CR: a CronJob that resolves
org.yaml against live GitHub and patches the result into the
InfrastructureTemplate's spec.variables. Deliberately a plain Kubernetes
CronJob rather than a host-level launchd/systemd unit — see
docs/github-org-reconciliation-ryn.md for why: this is a periodic,
cluster-native concern, and Kubernetes' own CronJob controller already
gives concurrency control, a backoff bound and job history for free,
instead of a hand-rolled retry loop translated per host OS.

Everything about HOW the resolve+patch command runs (image, command, volumes)
is caller-supplied — this template does not assume an OCI-image cluster or a
native-closure one. See helmworks/charts/pangea-operator/README.md's ryn
example for the native-closure values shape.
*/}}
{{- if .Values.githubOrgReconciliation.enable }}
{{- $cj := .Values.githubOrgReconciliation.cronJob -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.githubOrgReconciliation.name | default "pleme-io-github-repos" }}-variables
  namespace: {{ .Values.githubOrgReconciliation.namespace | default "default" }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    pangea.pleme.io/owner: pleme-io
spec:
  schedule: {{ $cj.schedule | quote }}
  # A resolve that is still running when the next tick fires is a resolve
  # against a cluster still mid-write from the last one — never overlap.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $cj.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $cj.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $cj.backoffLimit }}
      activeDeadlineSeconds: {{ $cj.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
            pangea.pleme.io/owner: pleme-io
        spec:
          restartPolicy: Never
          # ★ NO `| default true` HERE — Sprig's `default` treats the
          # BOOLEAN `false` as empty and silently substitutes the default,
          # which is exactly backwards for a field whose whole point is to
          # be turned OFF. values.yaml already supplies the chart-level
          # default (true), so $cj.automountServiceAccountToken is never
          # unset by the time this renders — measured 2026-09-22: with the
          # `| default true` pipe, ryn's explicit `false` override rendered
          # as `true` anyway, silently exposing the ServiceAccount token to
          # a pod on a runtime (engenho native) that specifically cannot
          # authenticate with it.
          automountServiceAccountToken: {{ $cj.automountServiceAccountToken }}
          containers:
            - name: resolve
              image: {{ required "githubOrgReconciliation.cronJob.image is required when githubOrgReconciliation.enable is true" $cj.image }}
              {{- with $cj.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $cj.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $cj.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $cj.volumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $cj.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $cj.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with $cj.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
