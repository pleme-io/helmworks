{{/*
Override pleme-lib.prometheusrule because that helper reads
.Values.prometheusRules.groups, but every consumer (and these
values.yaml entries) define a flat .Values.prometheusRules.rules
list. Wrap them in a single group named after the chart so the
PrometheusOperator schema is satisfied.
*/}}
{{- if .Values.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pleme-lib.fullname" . }}
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
    prometheus: main
spec:
  groups:
    - name: {{ include "pleme-lib.fullname" . }}.rules
      rules:
        {{- toYaml .Values.prometheusRules.rules | nindent 8 }}
        {{- if (.Values.prometheusRules.reconcileRateAnomaly).enabled }}
        {{- /*
          Defense-in-depth alert family for the bug class that hit rio
          on 2026-05-07 (template_controller and operator_policy_controller
          self-trigger watch loops). Code-complete in 0.8.14 but flagged
          off by default — flip prometheusRules.reconcileRateAnomaly.enabled
          to true once you've baselined your fleet's normal reconcile rate.
        */}}
        {{- toYaml .Values.prometheusRules.reconcileRateAnomaly.rules | nindent 8 }}
        {{- end }}
{{- end }}
