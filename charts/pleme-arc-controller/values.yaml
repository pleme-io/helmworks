# pleme-arc-controller — wraps the upstream gha-runner-scale-set-controller
# chart and adds an ExternalSecret pulling GitHub App credentials from a
# cluster-configured ClusterSecretStore (External Secrets Operator).
#
# Deploy ONE per cluster. Multiple `pleme-arc-runner-pool` releases register
# their AutoscalingRunnerSets with this controller.
#
# Consumer responsibility: ensure the namespace exists. FluxCD HelmRelease's
# `install.createNamespace=true` is the canonical pattern.

# Placeholder for pleme-lib.labels — the chart's appVersion is used as the
# version label since no single image is canonical.
image:
  tag: ""

# ---------- ExternalSecret seeding the GitHub App credentials ----------
# When ESO + a ClusterSecretStore is the source of truth for the GitHub App
# credentials, populate `externalSecret.secrets` with one entry per Secret to
# materialize. The chart's pleme-lib.externalSecret helper renders an
# ExternalSecret per entry.
#
# When the K8s Secret is created out-of-band (SOPS-decrypted YAML in FluxCD,
# kubernetes_secret_v1 in TF, kubectl create secret, sealed-secrets, etc.),
# leave `secrets: {}` (the default) — no ExternalSecret will render and the
# chart will consume whatever Secret already exists at the name the
# gha-runner-scale-set-controller env vars reference (default `arc-github-app-secret`).
#
# Example (borealis ESO mode):
#   externalSecret:
#     clusterSecretStoreName: borealis-cluster-secret-store
#     secrets:
#       arc-github-app-secret:
#         dataFrom:
#           - extract:
#               key: /path/in/borealis/to/github-app-secret
externalSecret:
  clusterSecretStoreName: cluster-secret-store
  refreshInterval: 30m
  secrets: {}

# ---------- Attestation framework (sekiban) ----------
attestation:
  enabled: false
  signature: ""
  certificationHash: ""
  complianceHash: ""
  changesetHash: ""

# ---------- Resource-level annotations ----------
annotations: {}
additionalLabels: {}

# ---------- Upstream gha-runner-scale-set-controller chart values ----------
# All values under this key flow into the upstream chart unchanged.
# See https://github.com/actions/actions-runner-controller/blob/main/charts/gha-runner-scale-set-controller/values.yaml
gha-runner-scale-set-controller:
  # -- Replicas. Leader election kicks in when >1 (only one replica reconciles
  # at a time; others stand by).
  replicaCount: 3

  image:
    repository: "ghcr.io/actions/gha-runner-scale-set-controller"
    pullPolicy: IfNotPresent
    tag: ""                         # defaults to chart appVersion

  serviceAccount:
    create: true
    name: gha-arc-rs-controller
    annotations: {}                 # IRSA / Workload Identity wiring goes here if controller needs cloud API access

  flags:
    logLevel: info
    logFormat: text
    updateStrategy: immediate

  metrics:
    controllerManagerAddr: ":8080"
    listenerAddr: ":8080"
    listenerEndpoint: "/metrics"

  # -- GitHub App credentials env vars wired to the ExternalSecret-managed Secret.
  # Override only if using a different secret name or non-App auth model.
  env:
    - name: GITHUB_APP_ID
      valueFrom:
        secretKeyRef:
          key: github_app_id
          name: arc-github-app-secret
    - name: GITHUB_APP_INSTALLATION_ID
      valueFrom:
        secretKeyRef:
          key: github_app_installation_id
          name: arc-github-app-secret
    - name: GITHUB_APP_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          key: github_app_private_key
          name: arc-github-app-secret

  # -- Exclude argocd / FluxCD instance labels from propagation to internal
  # resources (avoids the controller's reconciliation racing with GitOps tools).
  flagsExcludeLabelPropagationPrefixes: []
