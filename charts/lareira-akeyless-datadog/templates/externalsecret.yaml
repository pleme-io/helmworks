{{/*
DD_API_KEY / DD_APP_KEY for the operator's magma datadog provider.

Off by default and REFUSES to render half-configured. The secret store and the
remote keys are environment facts that must be supplied deliberately; guessing
them yields an ExternalSecret that reconciles to nothing and a template that
fails much later with an unhelpful credential error.

The key NAMES match the fleet convention already declared in the nix profiles
(datadog/<account>/{api-key,app-key}), so the deployer and the consumer share
one name rather than two that drift.
*/}}
{{- if .Values.credentials.externalSecret.enabled }}
{{- $es := .Values.credentials.externalSecret -}}
{{- if not $es.secretStore.name }}
{{- fail "lareira-akeyless-datadog: credentials.externalSecret.enabled=true but secretStore.name is empty" }}
{{- end }}
{{- if or (not $es.remoteRef.apiKey) (not $es.remoteRef.appKey) }}
{{- fail "lareira-akeyless-datadog: credentials.externalSecret.enabled=true but remoteRef.apiKey/appKey are empty — the Datadog credential paths must be supplied, never guessed" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName | quote }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lareira-akeyless-datadog
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind }}
    name: {{ $es.secretStore.name | quote }}
  target:
    name: {{ .Values.credentials.secretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          pleme.io/secret-class: saas-api-credential
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: {{ $es.remoteRef.apiKey | quote }}
    - secretKey: DD_APP_KEY
      remoteRef:
        key: {{ $es.remoteRef.appKey | quote }}
{{- end }}
