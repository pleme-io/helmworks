namespace: ""

workspace:
  gitRepository:
    url: https://github.com/pleme-io/pangea-architectures.git
    ref: main
    path: workspaces/akeyless-datadog
  catalog: akeyless-datadog
  pangeaNamespace: akeyless-datadog

# Adoption safety. These defaults are deliberately the paranoid ones: the estate
# being adopted is a live production observability estate, and the failure mode
# for a provider with no uniqueness constraint is a silent duplicate rather than
# a visible error.
adoption:
  destroyProtection: true
  defaultDecision: requireApproval
  refreshInterval: 30m

credentials:
  secretName: dd-provider-credentials
  externalSecret:
    enabled: false
    refreshInterval: 1h
    secretStore:
      kind: ClusterSecretStore
      name: ""
    remoteRef:
      apiKey: ""
      appKey: ""

# One InfrastructureTemplate per shard. Sharding exists because a single CR
# carrying every importHint is a large object and the prepass runs them
# concurrently; smaller shards fail smaller.
#
# `importHints` maps a terraform address to its Datadog id and comes verbatim
# from the emitter's imports.json. WITHOUT IT the first apply CREATES a
# duplicate of every live object, so a shard with no hints is refused at render
# time rather than deployed and discovered later.
shards: []
