# pleme-microservice default values
# HTTP service with Service, ServiceMonitor, and NetworkPolicy

image:
  repository: ""
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

ports:
  - name: http
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

env: []
envFrom: []
volumeMounts: []
volumes: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# breathe resource-homeostasis bands (breathe.pleme.io) — carves
# resources.limits.{memory,cpu} to hold this Deployment at a target
# utilization band. See helmworks/charts/pleme-lib/templates/
# _breatheband.tpl for the full field set.
#
# ⚠️ CORRECTION 2026-07-26 — this block previously claimed "Shadow-first
# (dryRun: true): the controller decides + reports but never mutates until
# an operator flips it live". THAT WAS FALSE, and every consumer inherited
# the false assurance.
#
# `spec.dryRun` is DEAD CODE for MemoryBand/CpuBand/StorageBand: the band
# trait's `promotion_mode()` is `mode_spec().unwrap_or(ShadowConfirmEffect)`
# and never consults `dry_run()` (only HostParam/KubeParam bands still do).
# So these bands SHADOW-CONFIRMED AND THEN CARVED LIVE the whole time.
# Measured on camelot-eks 2026-07-26: three CPU bands at 74 / 56 / 53
# carves — several collapsed to their 200m floor. Writes go through
# the in-place pod RESIZE subresource, which mutates the POD and not the
# Deployment template, so Flux sees no drift and the divergence never
# appears in git. That invisibility is why this survived a config audit.
#
# `dryRun` is retained below only for wire-compatibility. The ONLY field
# that actually withholds a carve is `mode` (shadow | suspended).
#
# postureRef: `standard` — the documented successor to the retired
# `platform-default` tuple these bands were pinned to. Strictly calmer on
# the axis that hurts: shrinkBelow 0.70 → 0.60, so a downward write now
# needs ≥40% demonstrated idle. The old 0.70 with a multiplicative 0.9
# factor lands a shrink right back at the grow edge, which is what produced
# the observed shrink/grow oscillation and the large carve counts above.
#
# Left deliberately LIVE (no `mode: shadow`): these are stateless,
# restart-tolerant microservices whose degradation is contained. The
# never-shrink tiers + shadow are reserved for the database and the control
# plane (the MySQL chart / pangea-operator). To observe-only without
# carving, set `mode: shadow` here.
breathe:
  enabled: true
  postureRef: standard
  memory:
    dryRun: true
    disruptionPolicy: restartFreeOnly
  cpu:
    enabled: true
    dryRun: true
    disruptionPolicy: restartFreeOnly

health:
  path: /healthz
  readyPath: /readyz
  port: http
  livenessInitialDelay: 5
  livenessPeriod: 10
  livenessFailureThreshold: 3
  readinessInitialDelay: 5
  readinessPeriod: 5
  readinessFailureThreshold: 2

startupProbe:
  enabled: false
  path: /healthz
  port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 30

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
initContainers: []

monitoring:
  enabled: true
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true
  allowPrometheus: true
  allowDns: true
  additionalIngress: []
  additionalEgress: []

pdb:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

command: []
args: []
additionalLabels: {}
lifecycle: {}

configMaps: []
downwardApi:
  enabled: false
istio:
  enabled: false
podMonitor:
  enabled: false
prometheusRules:
  enabled: false
  groups: []

# ── bus: typed message-bus selection (viper-configured Go microservices) ─────
#
# OFF BY DEFAULT and intentionally ABSENT from this file. A chart rendered
# without a `bus:` block emits NO bus env vars and is byte-identical to the
# chart before this surface existed, so a deployment that does not opt in
# behaves exactly as it does today.
#
# The target application selects its message queue from viper config, never
# from a code fork. Two INDEPENDENT keys drive it, so one queue family can move
# to NATS while every other family stays on RabbitMQ:
#
#   families.general -> <SERVICE>_MQ_TYPE       (mq_type)
#   families.bis     -> <SERVICE>_BIS_MQ_TYPE   (bis_mq_type)
#
# `service` is the viper SetEnvPrefix of the target microservice. Not every
# service constructs an MQConfigManager; list the ones that do in
# `knownServices` and anything else becomes a render error, because the env var
# would otherwise be silently ignored. An empty/absent list disables the guard.
#
# Values are readable lowercase (rabbitmq | nats | aws) and are mapped to the
# exact case-sensitive Go constant on the wire (RABBITMQ | NATS | AWS).
# Selecting nats without a URL is a render error, not a boot crash.
#
# Flip one line to move a family; delete the line to move it back.
#
# bus:
#   enabled: true
#   service: alpha
#   knownServices: [alpha, beta, gamma]
#   families:
#     general: nats
#     bis: rabbitmq
#   natsUrl: "nats://pleme-nats.camelot-nats.svc:4222"
