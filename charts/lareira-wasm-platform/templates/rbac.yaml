{{- if .Values.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lareira-wasm-platform.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lareira-wasm-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lareira-wasm-platform.fullname" . }}
  labels:
    {{- include "lareira-wasm-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: ["wasm.pleme.io"]
    resources:
      - computeunits
      - computeunits/status
      - computeunits/finalizers
      - wasmmodules
      - wasmmodules/status
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lareira-wasm-platform.fullname" . }}
  labels:
    {{- include "lareira-wasm-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lareira-wasm-platform.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lareira-wasm-platform.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
