apiVersion: v1
kind: Service
metadata:
  name: {{ include "pleme-lib.fullname" . }}-headless
  namespace: {{ include "pleme-lib.namespace" . }}
  labels:
    {{- include "pleme-lib.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "pleme-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: rpc
      port: {{ .Values.garage.rpc.publicPort }}
      targetPort: rpc
      protocol: TCP
