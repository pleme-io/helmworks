{{- /*
  Alerts-as-code for the camelot cell — when observe.alerts.perService, range
  observe.services → one WorkloadBaseline PangeaAlert per service. backend =
  observe.alerts.backend (vmrule default | prometheusrule). Mirrors
  lareira-pangea-alerts' inline Ruby: a BARE Pangea::Architectures::AlertWorkspace
  .render_ast(...) call — NO .to_json — because pangea-operator's AlertController
  renders the returned Pangea::Alerts AST per spec.backend.

  Routing: ONE observe.routing.destination enum is stamped BOTH as a `dest: <v>`
  label AND as spec.routing.destination (the shared pleme-lib.routing seam). The
  concrete receiver (ntfy for luis) is wired cluster-side by respiro.

  params = { name, namespace, job, id: <env>-<name>-baseline }, emitted as JSON
  in a single-quoted squiggly heredoc (inert { } ( ) " #{ ), parsed in Ruby via
  JSON.parse(…, symbolize_names: true). Every CR also carries the per-cell
  compliance overlay marker.
*/ -}}
{{- $root := . -}}
{{- $o := .Values.observe -}}
{{- if $o.alerts.perService }}
{{- $ns := $o.namespace -}}
{{- $backend := $o.alerts.backend -}}
{{- if not $backend }}{{ fail "observe.alerts.backend is required (vmrule|prometheusrule)" }}{{ end }}
{{- if not (has $backend (list "vmrule" "prometheusrule")) }}{{ fail (printf "observe.alerts.backend %q unknown — must be vmrule|prometheusrule" $backend) }}{{ end }}
{{- /* Resolve + validate the destination ONCE — a bad enum fail()s here. */ -}}
{{- $dest := include "lareira-camelot-observe.dest" $root -}}
{{- range $svc := $o.services }}
{{- if not $svc.name }}{{ fail "observe.services[]: .name is required" }}{{ end }}
{{- if not $svc.job }}{{ fail (printf "observe.services[%s]: .job is required" $svc.name) }}{{ end }}
{{- $aid := printf "%s-%s-baseline" $o.env $svc.name -}}
{{- /*
  NOTE THE CLOSING `}}` — it must NOT be `-}}`.

  A right-trim here eats the newline before the `---` below, which glues
  the separator onto the last line of the PREVIOUS document. Measured
  2026-08-11 on the 9-service render: `)---` (the Ruby heredoc's closing
  paren, then the separator), one `---` in the whole file instead of
  nine. The `---` stops being a document separator and becomes the last
  line of a `|` block scalar, so all nine PangeaAlerts collapse into ONE
  document with nine sets of duplicate keys and eight alerts silently
  disappear.

  It fails quietly in the worst way: helm template exits 0, helm lint
  passes, the output looks plausible, and what applies is one alert with
  a stray `)---` inside its source. dashboards.yaml never had this
  because its equivalent dict closes with a plain `}}`; the two templates
  were one character apart.
*/ -}}
{{- $params := dict
      "name" $svc.name
      "namespace" $ns
      "job" $svc.job
      "id" $aid
}}
---
apiVersion: pangea.pleme.io/v1alpha1
kind: PangeaAlert
metadata:
  name: {{ $aid }}
  namespace: {{ $ns }}
  labels:
    {{- include "lareira-camelot-observe.labels" $root | nindent 4 }}
    pleme.io/alert-architecture: "WorkloadBaseline"
    {{- include "pleme-lib.routing.labels" (dict "destination" $dest "ctx" $svc.name) | nindent 4 }}
  annotations:
    {{- include "lareira-camelot-observe.complianceAnnotations" $root | nindent 4 }}
spec:
  backend: {{ $backend | quote }}
  routing:
    destination: {{ $dest | quote }}
  source:
    inline:
      ruby: |
        require 'pangea-dashboards'
        Pangea::Architectures::AlertWorkspace.render_ast(
          architecture: "WorkloadBaseline",
          params: JSON.parse(<<~'PANGEA_PARAMS', symbolize_names: true),
        {{ $params | toJson | indent 8 }}
        PANGEA_PARAMS
          id: {{ $aid | quote }},
        )
{{- end }}
{{- end }}
