{{- /*
  clickhouse-board.yaml — the ClickHouse analytics board (Path A).

  Path-A typed mixin: the whole board is a Pangea::Dashboards::Library
  ClickHouseAnalyticsBoard entry. Each panel is authored as raw ClickHouse SQL
  in the typed `panels:` list and rides through Render::Grafana's rawSql target
  arm at the :sql datasource (uid clickhouse, query_lang :sql — the PromQL/LogsQL
  classifier is never entered). The mixin marks every query presence: :conditional,
  so an empty analytics window does not trip the Health probe.

  The mixin derives uid from id (id.to_s.tr('_','-')): :<env>_clickhouse ⇒
  <env>-clickhouse — the SAME uid the prior Path-B board carried, so this is an
  in-place upgrade of the identical Grafana dashboard, not a new one.

  The inline Ruby's LAST expression returns the JSON string
  (Render::Grafana.render_json), which is exactly what the operator's
  render_dashboard eval contract consumes (owner.rs: Json::String => Ok).

  Queries use explicit `now() - INTERVAL` windows (not the $__timeFilter macro)
  so a panel returns rows deterministically regardless of the dashboard time
  picker — this is a "does the ClickHouse path return rows" board.
*/ -}}
{{- $root := . -}}
{{- $o := .Values.observe -}}
{{- $cb := $o.clickhouseBoard | default dict -}}
{{- if $cb.enabled }}
{{- $ns := $o.namespace -}}
{{- $folder := $o.folder | default $o.env -}}
{{- $chUid := $cb.datasourceUid | default "clickhouse" -}}
{{- $db := $cb.database | default "tendril" -}}
{{- $bid := printf "%s-clickhouse" $o.env -}}
{{- $dest := include "lareira-camelot-observe.dest" $root -}}
---
apiVersion: pangea.pleme.io/v1alpha1
kind: PangeaDashboard
metadata:
  name: {{ $bid }}
  namespace: {{ $ns }}
  labels:
    {{- include "lareira-camelot-observe.labels" $root | nindent 4 }}
    pleme.io/dashboard-architecture: "ClickHouseAnalyticsBoard"
    {{- include "pleme-lib.routing.labels" (dict "destination" $dest "ctx" "clickhouse") | nindent 4 }}
  annotations:
    {{- include "lareira-camelot-observe.complianceAnnotations" $root | nindent 4 }}
spec:
  folder: {{ $folder | quote }}
  message: {{ printf "%s · clickhouse — tendril analytics (Path-A mixin)" $o.env | quote }}
  source:
    inline:
      ruby: |
        require 'pangea-dashboards'

        db = {{ $db | quote }}
        ds = {{ $chUid | quote }}

        dash = Pangea::Dashboards::Library::ClickHouseAnalyticsBoard.build(
          id: :{{ $o.env }}_clickhouse,
          datasource: ds,
          title: {{ printf "%s · ClickHouse analytics (tendril)" $o.env | quote }},
          tags: ['clickhouse', 'tendril', 'analytics', {{ $o.env | quote }}],
          panels: [
            { title: 'Events by source (24h)', kind: :table,
              sql: "SELECT source, count() AS events FROM #{db}.events " \
                   "WHERE timestamp > now() - INTERVAL 24 HOUR GROUP BY source ORDER BY events DESC LIMIT 20" },
            { title: 'Top log levels (24h)', kind: :table,
              sql: "SELECT level, count() AS events FROM #{db}.events " \
                   "WHERE timestamp > now() - INTERVAL 24 HOUR GROUP BY level ORDER BY events DESC" },
            { title: 'Events / min (6h)', kind: :timeseries,
              sql: "SELECT toStartOfMinute(timestamp) AS time, count() AS events FROM #{db}.events " \
                   "WHERE timestamp > now() - INTERVAL 6 HOUR GROUP BY time ORDER BY time" },
            { title: 'Audit events (24h)', kind: :stat,
              sql: "SELECT count() AS audit_events FROM #{db}.akeyless_audit " \
                   "WHERE timestamp > now() - INTERVAL 24 HOUR" },
          ]
        )

        Pangea::Dashboards::Render::Grafana.render_json(dash)
{{- end }}
