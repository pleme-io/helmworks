# examples/camelot.values.yaml — the camelot instantiation of the cell.
#
# This is the concrete `observe.env=camelot` value: the 9-service akeyless SaaS
# mesh, routed to luis (zero-egress ntfy), under the fedramp-high overlay
# (shadow-first). Render it with:
#
#   helm template camelot charts/lareira-camelot-observe \
#     -f charts/lareira-camelot-observe/examples/camelot.values.yaml
#
# Expect: 9 WorkloadOverview PangeaDashboards + 4 platform PangeaDashboards +
# 9 WorkloadBaseline PangeaAlerts, every CR carrying `dest: luis` +
# compliance.pleme.io/overlay-fedramp-high.
#
# NOTE: these values equal the chart defaults — camelot IS the reference cell.
# A DIFFERENT env (e.g. a second tenant mesh) is this same file with a different
# observe.env / namespace / services list; the structure is identical.

observe:
  env: camelot
  namespace: camelot
  folder: camelot
  datasource: vm
  logsDatasource: vlogs
  logsStream: '{namespace="camelot"}'
  routing:
    destination: luis
  services:
    - { name: auth,     job: auth,     port: 2770 }
    - { name: authcert, job: authcert, port: 2770 }
    - { name: bis,      job: bis,      port: 2771 }
    - { name: uam,      job: uam,      port: 2772 }
    - { name: uamop,    job: uamop,    port: 2772 }
    - { name: kfm,      job: kfm,      port: 2773 }
    - { name: sdr,      job: sdr,      port: 2774 }
    - { name: gator,    job: gator,    port: 2779 }
    - { name: logan,    job: logan,    port: 2780 }
  platformBoards:
    - { name: secrets-platform, architecture: SecretsPlatformOverview }
    - { name: auth-methods,     architecture: AuthMethodHealth }
    - { name: audit,            architecture: AuditExplorer }
    - { name: security-posture, architecture: SecurityPostureBoard }
  alerts:
    perService: true
    backend: vmrule

compliance:
  overlays:
    - fedramp-high
  enforce: false
