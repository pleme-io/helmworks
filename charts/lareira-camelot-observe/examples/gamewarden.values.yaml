---
# The Game Warden / FedRAMP-High boundary instantiation.
#
# This file exists to be RENDERED, not read: it is the proof that a cell
# can be described with no Ruby in it anywhere. `engine: lava-only` means
# a board without a lava architecture does not fall back — it fails the
# template by name — so if this file renders at all, every PangeaDashboard
# it produced carries `spec.source.architecture`: a catalogue name and
# scalars, with no field that could hold code.
#
# That property is what lets the Ruby-free operator image serve this cell.
# The image has no Ruby evaluator to degrade to; a Ruby CR there does not
# render a worse dashboard, it fails to reconcile. So "no Ruby crosses the
# boundary" has to be decided here, at template time, on this side.
#
# `tests/gamewarden_boundary_test.yaml` renders THIS FILE and asserts the
# absence. It reads the file rather than restating its values, because a
# test that restates them proves the test's copy is Ruby-free and nothing
# about what ships.
#
# ── What is deliberately NOT here ────────────────────────────────────────
# The camelot default values carry seven platform boards. Three of them —
# SecretsPlatformOverview, AuthMethodHealth, SecurityPostureBoard — are
# absent from this file, and that is a measurement rather than a scoping
# decision. All three are built on the akeyless gateway metric family
# (`gateway_auth_total` and its siblings), which returns an EMPTY series
# on akeyless's own Datadog over a 2h window, measured 2026-08-11. Porting
# them would have produced three boards of empty panels, and an empty
# security board reads as "nothing is wrong" — the most expensive way a
# dashboard can be wrong, on the boards where it matters most.
#
# They come back when the instrumentation does. Until then this cell is
# honest about what it can see.
#
# clickhouseBoard is off for the same class of reason: it is bespoke
# inline Ruby carrying real SQL, the one CR of the eighteen that was
# genuinely code rather than config in a costume. It needs authoring, not
# porting.
#
# ── THE BOUNDARY IS NOT FULLY RUBY-FREE YET, and this file must not be
#    read as claiming otherwise ─────────────────────────────────────────
# `engine: lava-only` governs DASHBOARDS. This chart also emits
# PangeaAlert CRs from templates/alerts.yaml and cell-alerts.yaml, and
# those still carry `spec.source.inline.ruby` — ten of them in this
# render, into this same namespace, for the same operator to evaluate.
#
# It is a different CRD with a different render target (PrometheusRule /
# VMRule), and those targets are declared-but-unimplemented slots in the
# lava synthesizer, so this is a scoped gap rather than an omission. But
# it is a real one: an operator image with no Ruby evaluator cannot
# reconcile those alerts either.
#
# `tests/gamewarden_boundary_test.yaml` asserts the gap explicitly, so the
# suite cannot pass while quietly shipping Ruby beside the clean
# dashboards — and it fails the moment alerts are ported, which is when
# this paragraph needs deleting.

observe:
  env: gamewarden
  namespace: gamewarden
  folder: gamewarden
  datasource: vm
  logsDatasource: vlogs
  # Still required by the schema, and still unused on this path — the lava
  # architectures compose their stream selector from `namespace`, because a
  # value carrying double quotes cannot survive textual param binding.
  logsStream: '{namespace="gamewarden"}'

  routing:
    destination: 2f

  dashboards:
    # THE line. Not "prefer lava" — a board with no architecture fails the
    # render rather than quietly emitting Ruby into a FedRAMP boundary.
    engine: lava-only
    lavaCatalogue:
      WorkloadOverview: workload-overview
      HomeostasisControlBoard: homeostasis-control
      NervousSystemSelfHealthBoard: nervous-system-self-health
      AuditExplorer: audit-explorer
      LogExplorerDashboard: log-explorer

  services:
    - { name: auth,     job: auth,     port: 2770 }
    - { name: authcert, job: authcert, port: 2770 }
    - { name: bis,      job: bis,      port: 2771 }
    - { name: uam,      job: uam,      port: 2772 }
    - { name: uamop,    job: uamop,    port: 2772 }
    - { name: kfm,      job: kfm,      port: 2773 }
    - { name: sdr,      job: sdr,      port: 2774 }
    - { name: gator,    job: gator,    port: 2779 }
    - { name: logan,    job: logan,    port: 2780 }

  # `params` below is the RUBY mixin's kwargs and is not read on the lava
  # path — a lava architecture owns its own structure. Kept so a cell can
  # be flipped back to `engine: ruby` without re-deriving them.
  platformBoards:
    - { name: homeostasis,    architecture: HomeostasisControlBoard,      params: { datasource: vm } }
    - { name: nervous-system, architecture: NervousSystemSelfHealthBoard, params: { datasource: vm } }
    - { name: audit,          architecture: AuditExplorer,                params: { datasource: vlogs, stream: '{namespace="gamewarden"}' } }
    - { name: cdc,            architecture: LogExplorerDashboard,         params: { logs_datasource: vlogs, root_label: namespace, cascade: [app, pod], default_namespace: gamewarden } }

  clickhouseBoard:
    enabled: false

  alerts:
    perService: true
    backend: vmrule

compliance:
  overlays:
    - fedramp-high
  enforce: true
