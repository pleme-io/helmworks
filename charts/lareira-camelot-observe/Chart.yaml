apiVersion: v2
name: lareira-camelot-observe
description: >-
  lareira-camelot-observe — the PARAMETERIZED enjulho observability CELL. ONE
  values-parameterized chart that, keyed by `observe.env → camelot`, spawns the
  complete dashboards-as-code + alerts-as-code + routing structure for the
  camelot akeyless SaaS mesh (9 services) via pangea-operator CRDs. Ranges the
  9-service topology into one WorkloadOverview PangeaDashboard per service +
  4 cross-service akeyless-shaped platform PangeaDashboards + one WorkloadBaseline
  PangeaAlert per service — every CR stamped with the routing destination (the
  shared pleme-lib.routing seam) and the per-cell compliance overlay marker
  (fedramp-high, shadow-first). It owns NO new algebra: dashboards mirror the
  lareira-pangea-dashboards emitter, alerts mirror lareira-pangea-alerts, and the
  routing + compliance seams come from pleme-lib. A different `observe.env` is a
  different value — camelot is the FedRAMP-Istio instantiation of the generic
  monitoring structure. Emits ONLY CRs (no pod-bearing template ⇒ no breatheBand);
  isolation/breathe/nodeSelector/tolerations inherit from the umbrella global.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - camelot
  - observability
  - enjulho
  - dashboards-as-code
  - alerts-as-code
  - routing
  - fedramp-high
  - lareira
maintainers:
  - name: drzzln
    email: drzzln@protonmail.com
# THIN CELL — the ONLY dependency is pleme-lib, for two shared seams:
#   • pleme-lib.routing.*  — the `dest:` label stamp + the luis|akeyless|2f enum guard
#   • pleme-lib.overlay.*  — the compliance overlay marker (compliance.pleme.io/*)
# FLOOR-ONLY (>=) version per the helmworks convention (never ceilinged — a
# file:// dep resolves to exactly the in-tree chart; a ceiling is a hand-sync
# tripwire, not a safety device). The PangeaDashboard / PangeaAlert CRs are
# hand-authored here, mirroring lareira-pangea-dashboards + lareira-pangea-alerts.
dependencies:
  - name: pleme-lib
    version: ">=0.40.0"
    repository: "file://../pleme-lib"
