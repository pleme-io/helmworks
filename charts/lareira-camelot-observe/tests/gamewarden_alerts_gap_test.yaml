---
# The part of the boundary that is NOT yet Ruby-free.
#
# `gamewarden_boundary_test.yaml` proves every DASHBOARD in the boundary
# render is typed. On its own that suite would pass while this same chart
# shipped ten Ruby-bearing CRs into the same namespace — the exact
# vacuous-guard shape the dashboard work exists to remove, reintroduced by
# scoping. It was invisible until the rendered output was counted by hand.
#
# It is a separate suite because helm-unittest merges the documents of
# every template a suite lists, and merging alerts.yaml into the dashboard
# suite made the plugin misparse both. A per-test `templates:` may only
# narrow the suite list, never extend it.
#
# PangeaAlert is a different CRD with a different render target
# (PrometheusRule / VMRule), and those targets are declared-but-
# unimplemented slots in the lava synthesizer — so this is a scoped gap,
# not an oversight. `engine: lava-only` does not reach it: the enum
# governs dashboards.
#
# This asserts the CURRENT state on purpose. It FAILS when somebody ports
# alerts, which is correct: at that moment the boundary claim gets
# stronger and every file stating the gap needs editing in the same
# change.
suite: gamewarden boundary → alerts are still Ruby (known gap)
templates:
  - templates/alerts.yaml
tests:
  - it: emits one document per service, each properly separated
    values:
      - ../examples/gamewarden.values.yaml
    asserts:
      # This is the assertion that would have caught the separator bug,
      # and it is here because nothing did. Until 2026-08-11 the `$params`
      # dict above the `---` closed with `-}}`, whose right-trim ate the
      # newline before the separator and glued it to the previous
      # document's last line as `)---`. Nine PangeaAlerts collapsed into
      # ONE document with nine sets of duplicate keys; eight alerts
      # vanished.
      #
      # Every surface said fine: helm template exited 0, helm lint passed,
      # the output looked plausible. It was found by counting `kind:`
      # against `---` in a render by hand. A document COUNT is the cheap
      # standing form of that count.
      - hasDocuments:
          count: 9

  - it: still emits inline Ruby for every service alert
    values:
      - ../examples/gamewarden.values.yaml
    asserts:
      - exists:
          path: spec.source.inline.ruby
