---
# The evaluator switch — observe.dashboards.engine.
#
# This chart is the surface that decides whether Ruby reaches a cluster,
# and until this suite existed the decision was unguarded: `helm unittest`
# reported "Test Suites: 0 passed, 0 total" for the whole chart. A silent
# fallback to Ruby is exactly what `lava-only` exists to prevent, so it is
# the one behaviour that must not be trusted to a reading of the template.
#
# Three modes, and the third is the Game Warden one:
#   ruby           every board inline Ruby (the unchanged default)
#   lava-preferred typed source.architecture where a catalogue entry exists
#   lava-only      a gap FAILS THE TEMPLATE by name, never falls back
#
# Every test narrows `services` / `platformBoards` to the documents it is
# actually about. The first draft asserted against `documentIndex` on the
# full 16-document render, which reads as precise and is not: this
# plugin's index-scoped asserts still evaluate across the other documents,
# so the failures named indices that were never under test. Shrinking the
# input is both honest and stable — a board added to values.yaml does not
# renumber these.
suite: dashboards → evaluator selection
templates:
  - templates/dashboards.yaml
tests:
  - it: defaults to Ruby, so an unedited values file does not move
    set:
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards: []
      observe.clickhouseBoard.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: spec.source.inline.ruby
      - notExists:
          path: spec.source.architecture

  - it: lava-preferred emits the typed architecture variant for a service
    set:
      observe.dashboards.engine: lava-preferred
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards: []
      observe.clickhouseBoard.enabled: false
    asserts:
      - equal:
          path: spec.source.architecture.name
          value: workload-overview
      # The CR carries scalars and NO language. This is the property that
      # makes injection unrepresentable rather than merely contained:
      # there is no field here that could hold code.
      - notExists:
          path: spec.source.inline
      - equal:
          path: spec.source.architecture.params.service
          value: auth
      - equal:
          path: spec.source.architecture.params.job
          value: auth
      - equal:
          path: spec.source.architecture.params.logs_datasource
          value: vlogs
      # `signals` is gone on purpose. The Ruby CR shipped three
      # hand-generated signal definitions per service — identical across
      # all nine — because the Ruby mixin took them as an argument. That
      # structure now lives in the .tlisp.
      - notExists:
          path: spec.source.architecture.params.signals

  # ── One render, two evaluators ──────────────────────────────────────────
  # The next two tests share a values set and differ only in which document
  # they select. That pair IS the migration story: a cluster does not have
  # to move all at once, so the nine service boards can go typed while the
  # unported platform boards keep working. A flag day would have meant
  # porting seven architectures before shipping any of it.
  - it: lava-preferred leaves an unported board on Ruby rather than guessing
    set:
      observe.dashboards.engine: lava-preferred
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards:
        - { name: homeostasis, architecture: HomeostasisControlBoard, params: { datasource: vm } }
      observe.clickhouseBoard.enabled: false
    documentSelector:
      path: metadata.name
      value: camelot-homeostasis
    asserts:
      # Falling back is CORRECT here and wrong under lava-only. That
      # difference is the whole design.
      - exists:
          path: spec.source.inline.ruby
      - notExists:
          path: spec.source.architecture

  - it: ...while a ported board in the SAME render is typed
    set:
      observe.dashboards.engine: lava-preferred
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards:
        - { name: homeostasis, architecture: HomeostasisControlBoard, params: { datasource: vm } }
      observe.clickhouseBoard.enabled: false
    documentSelector:
      path: metadata.name
      value: camelot-auth
    asserts:
      - equal:
          path: spec.source.architecture.name
          value: workload-overview
      - notExists:
          path: spec.source.inline

  - it: lava-only refuses to render a board with no lava architecture
    set:
      observe.dashboards.engine: lava-only
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards:
        - { name: homeostasis, architecture: HomeostasisControlBoard, params: { datasource: vm } }
      observe.clickhouseBoard.enabled: false
    asserts:
      # Named, not a generic failure: an operator reading this needs to
      # know WHICH board is unported, or the message costs a bisect.
      - failedTemplate:
          errorPattern: "lava-only but platform board homeostasis"

  - it: lava-only renders when every board has a lava architecture
    set:
      observe.dashboards.engine: lava-only
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards: []
      observe.clickhouseBoard.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.source.architecture.name
          value: workload-overview
      - notExists:
          path: spec.source.inline

  - it: an unknown engine is rejected, never silently defaulted to Ruby
    set:
      observe.dashboards.engine: lavaa
    asserts:
      # Caught by values.schema.json's enum, BEFORE the template runs.
      # The template keeps its own `fail()` as the second line — a
      # consumer that renders this template through a library include
      # gets no schema validation, and the dangerous outcome (a typo
      # falling through to Ruby on a boundary deployment) must be loud on
      # both paths.
      - failedTemplate:
          errorPattern: "must be one of 'ruby', 'lava-preferred', 'lava-only'"

  - it: refuses a param whose value carries a quote, not just a structured one
    set:
      observe.dashboards.engine: lava-preferred
      observe.dashboards.lavaCatalogue.AuditExplorer: audit-explorer
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards:
        - name: audit
          architecture: AuditExplorer
          params: { datasource: vlogs, stream: '{namespace="camelot"}' }
      observe.clickhouseBoard.enabled: false
    asserts:
      # SCALAR IS NOT SAFE. `stream` is an ordinary string, and it is the
      # live value camelot ships. Binding is textual, so its double quotes
      # would close a tlisp string literal early and evaluate a document
      # nobody wrote — which still parses, which is why it has to be
      # refused rather than detected downstream.
      - failedTemplate:
          errorPattern: "contains a quote or backslash"

  - it: refuses a structured param for the same reason, one shape earlier
    set:
      observe.dashboards.engine: lava-preferred
      observe.dashboards.lavaCatalogue.AuthMethodHealth: auth-method-health
      observe.services:
        - { name: auth, job: auth, port: 2770 }
      observe.platformBoards:
        - name: auth-methods
          architecture: AuthMethodHealth
          params: { datasource: vm, denied_outcomes: [error, denied] }
      observe.clickhouseBoard.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "is structured; the lava binding is scalar-only"
