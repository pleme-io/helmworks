fullnameOverride: kensa-valkey

cache:
  port: 6379
  maxmemory: "128mb"
  maxmemoryPolicy: allkeys-lru
  password:
    enabled: true
    secretName: kensa-valkey-auth
    key: password
    delivery: include
    includeKey: valkey-auth.conf
  tls:
    enabled: true
    secretName: kensa-valkey-tls
    clientAuth: false
  persistence:
    enabled: false

exporter:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true
  additionalIngress:
    - name: allow-kensa
      rules:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: kensa
          ports:
            - port: 6379
              protocol: TCP

# Distroless image (pleme-io/hardened-images, valkeyPkg): the chart default stays upstream so existing
# consumers keep rendering. ryn runs the hardened build as a nix closure, set in nodes/ryn/default.nix:
#
#   pleme.engenho.helm.releases.kensa-valkey = {
#     chart = "${inputs.helmworks-src}/charts/pleme-cache";
#     libraries.pleme-lib = "${inputs.helmworks-src}/charts/pleme-lib";
#     values = {
#       image.repository = "nix:${inputs.hardened-images.packages.${pkgs.stdenv.hostPlatform.system}.valkeyPkg}";
#       command = [ "${inputs.hardened-images.packages.${pkgs.stdenv.hostPlatform.system}.valkeyPkg}/bin/valkey-server" ];
#     };
#   };
#
# A registry cluster sets image.repository: ghcr.io/pleme-io/hardened-valkey and image.tag to the published tag.
