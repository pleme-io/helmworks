# Example values for rio's pleme-ocis deployment.
# Garage S3 backend lives in the same namespace.
fullnameOverride: ocis

ocis:
  url: "https://drive.bristol.quero.cloud"

  admin:
    passwordSecretName: ocis-credentials
    passwordSecretKey: admin-password

  idp:
    secretName: ocis-credentials
    jwtSecretKey: jwt-secret
    konnectSigningKey: konnect-signing-key
    konnectEncryptionSecret: konnect-encryption-secret
    machineAuthApiKey: machine-auth-api-key
    revaTransferSecret: reva-transfer-secret
    storageSystemSecret: storage-system-secret

  storage:
    backend: s3ng
    s3:
      endpoint: "http://garage-s3:3900"
      region: "garage"
      bucket: "ocis-data"
      forcePathStyle: true
      credentialsSecretName: ocis-credentials
      accessKeyKey: s3-access-key
      secretKeyKey: s3-secret-key

persistence:
  storageClass: local-path
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi
