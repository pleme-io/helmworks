# Use-case primitive: DoD IL5 microservice (CUI national-security)
#
# Apply via:
#   helm install <name> oci://ghcr.io/pleme-io/charts/pleme-microservice \
#     -f usecases/dod-il5-microservice.yaml -f <my-overrides>.yaml
#
# Inherits: dod-il5 overlay (cascades fedramp-high, airgap-consumer,
# supplychain, fips). Requires upstream to be IronBank-mirrored into
# the cluster-local Zot.

compliance:
  overlays:
    - dod-il5
  enforce: true
  audit:
    logLevel: info
    retentionDays: 2555    # 7 years for DoD CUI
  airgap:
    role: consumer
    requireSignedImages: true
    registryService:
      name: zot
      namespace: registry
      port: 5000
    imagePullSecret: zot-pull-creds
  supplychain:
    enabled: true
    sbom:
      format: cyclonedx-1.5
    slsa:
      level: 3
    thresholds:
      critical: 0
      high: 0
    # operator supplies digests (sbom.digest, cosign.signatureRef,
    # cosign.fulcioCertFingerprint, slsa.provenanceRef, slsa.builderId,
    # scan.resultDigest) in <my-overrides>.yaml — usually injected by
    # forge at release time
  fips:
    enabled: true
    runtime: go-boringcrypto
    cmvpCertId: "4282"
    module: openssl-3-fips
  dod:
    impactLevel: il5
  authn:
    oidc:
      provider: authentik
    istio:
      mtls:
        required: true
  authz:
    role:
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "watch"]

# Workload defaults
replicaCount: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

image:
  # Operator overrides repository: zot.registry.svc.cluster.local/<team>/<svc>
  # (image-sync is what populates Zot from registry1.dso.mil).
  pullPolicy: Always

ports:
  - name: http
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

monitoring:
  enabled: true
  port: http
  path: /metrics
  interval: 30s

ingress:
  enabled: true
  className: nginx

attestation:
  enabled: true
