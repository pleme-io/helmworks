suite: pleme-cache ryn values
templates:
  - templates/statefulset.yaml
  - templates/configmap.yaml
  - templates/service.yaml
  - templates/servicemonitor.yaml
  - templates/guards.yaml
values:
  - ../../examples/kensa-valkey.yaml
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
tests:
  - it: delivers the password by include, with no initContainer and no shell
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.volumes[?(@.name == "credentials")].secret.secretName
          value: kensa-valkey-auth
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: /config/redis.conf

  - it: puts no password literal in the config
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["redis.conf"]
          pattern: "include /credentials/valkey-auth.conf"
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: "requirepass"

  - it: speaks TLS only when the switch is on
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["redis.conf"]
          pattern: "port 0\ntls-port 6379"

  - it: speaks plaintext when TLS is off
    template: templates/configmap.yaml
    set:
      cache.tls.enabled: false
    asserts:
      - notMatchRegex:
          path: data["redis.conf"]
          pattern: "tls-port"
      - matchRegex:
          path: data["redis.conf"]
          pattern: "port 6379"

  - it: has persistence off by default
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates

  - it: has persistence on behind its switch
    template: templates/statefulset.yaml
    set:
      cache.persistence.enabled: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi

  - it: serves ClusterIP with the metrics port
    template: templates/service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[1].name
          value: metrics

  - it: requests resources
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: renders a ServiceMonitor by default
    template: templates/servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: renders no ServiceMonitor when its switch is off
    template: templates/servicemonitor.yaml
    set:
      serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: drops the exporter sidecar when its switch is off
    template: templates/statefulset.yaml
    set:
      exporter.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: renders nothing when the chart is disabled
    template: templates/statefulset.yaml
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses an empty image
    template: templates/guards.yaml
    set:
      image.repository: ""
    asserts:
      - failedTemplate:
          errorPattern: image/repository

  - it: refuses a password switch with no Secret
    template: templates/guards.yaml
    set:
      cache.password.secretName: ""
    asserts:
      - failedTemplate:
          errorPattern: cache/password/secretName

  - it: refuses TLS with no Secret
    template: templates/guards.yaml
    set:
      cache.tls.secretName: ""
    asserts:
      - failedTemplate:
          errorPattern: cache/tls/secretName

  - it: keeps the shell initContainer reachable as a delivery mode
    template: templates/statefulset.yaml
    set:
      cache.password.delivery: init
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: config-init
