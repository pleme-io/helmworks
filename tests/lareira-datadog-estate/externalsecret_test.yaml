suite: lareira-datadog-estate ExternalSecret
templates:
  - templates/externalsecret.yaml
release:
  name: dd
  namespace: estate
set:
  credentials:
    secretName: dd-provider-credentials
tests:
  - it: renders nothing until asked for
    asserts:
      - hasDocuments:
          count: 0

  # The three guards exist so a half-configured ExternalSecret cannot reconcile
  # to nothing and surface much later as an unhelpful credential error.
  - it: refuses a secret store it was not given
    set:
      credentials:
        secretName: dd-provider-credentials
        externalSecret:
          enabled: true
          secretStore:
            kind: ClusterSecretStore
            name: ""
          remoteRef:
            apiKey: datadog/example-org/api-key
            appKey: datadog/example-org/app-key
    asserts:
      - failedTemplate:
          errorMessage: "lareira-datadog-estate: credentials.externalSecret.enabled=true but secretStore.name is empty"

  - it: refuses a missing api key path rather than guessing one
    set:
      credentials:
        secretName: dd-provider-credentials
        externalSecret:
          enabled: true
          secretStore:
            kind: ClusterSecretStore
            name: example-store
          remoteRef:
            apiKey: ""
            appKey: datadog/example-org/app-key
    asserts:
      - failedTemplate:
          errorMessage: "lareira-datadog-estate: credentials.externalSecret.enabled=true but remoteRef.apiKey/appKey are empty — the Datadog credential paths must be supplied, never guessed"

  - it: refuses a missing app key path too
    set:
      credentials:
        secretName: dd-provider-credentials
        externalSecret:
          enabled: true
          secretStore:
            kind: ClusterSecretStore
            name: example-store
          remoteRef:
            apiKey: datadog/example-org/api-key
            appKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "lareira-datadog-estate: credentials.externalSecret.enabled=true but remoteRef.apiKey/appKey are empty — the Datadog credential paths must be supplied, never guessed"

  # THE CROSS-REPO CONTRACT. pangea-operator resolves a datadog credential by
  # looking for these exact data keys (provider_creds.rs accepts api_key /
  # DD_API_KEY / DATADOG_API_KEY). Renaming either here breaks credential
  # resolution SILENTLY in the other repo -- the operator finds nothing, falls
  # back to the pod's ambient chain, and reports no error at all. The operator
  # side is pinned by its own test; this is the other half.
  - it: names the secret keys the operator actually looks up
    set:
      credentials:
        secretName: dd-provider-credentials
        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStore:
            kind: ClusterSecretStore
            name: example-store
          remoteRef:
            apiKey: datadog/example-org/api-key
            appKey: datadog/example-org/app-key
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.data[0].secretKey
          value: DD_API_KEY
      - equal:
          path: spec.data[1].secretKey
          value: DD_APP_KEY
      - equal:
          path: spec.data[0].remoteRef.key
          value: datadog/example-org/api-key
      - equal:
          path: spec.data[1].remoteRef.key
          value: datadog/example-org/app-key

  # The InfrastructureTemplate's providerCredentials.datadog.secretRef.name
  # points at credentials.secretName. If the ExternalSecret targeted anything
  # else, every CR would reference a Secret that does not exist.
  - it: targets the same secret the InfrastructureTemplate references
    set:
      credentials:
        secretName: some-other-name
        externalSecret:
          enabled: true
          secretStore:
            kind: ClusterSecretStore
            name: example-store
          remoteRef:
            apiKey: datadog/example-org/api-key
            appKey: datadog/example-org/app-key
    asserts:
      - equal:
          path: metadata.name
          value: some-other-name
      - equal:
          path: spec.target.name
          value: some-other-name

  - it: carries the store and refresh interval it was given
    set:
      credentials:
        secretName: dd-provider-credentials
        externalSecret:
          enabled: true
          refreshInterval: 15m
          secretStore:
            kind: SecretStore
            name: namespaced-store
          remoteRef:
            apiKey: datadog/example-org/api-key
            appKey: datadog/example-org/app-key
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 15m
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: namespaced-store
