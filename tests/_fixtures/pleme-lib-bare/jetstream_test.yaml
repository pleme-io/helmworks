suite: pleme-lib bare-fixture — pleme-lib.jetstream + jetstream-init-job
# Chart-owned NATS JetStream stream + consumer declaration: a ConfigMap of
# stream-*.json / consumer-*.json specs plus a post-install/upgrade upsert Job.
# Transitively exercises pleme-lib.bytes + pleme-lib.duration-ns + the
# jetstream-init-job sub-template.
templates:
  - templates/jetstream.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"

tests:
  - it: "renders nothing when jetstream is unset entirely"
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders nothing when jetstream.enabled but no streams/consumers"
    set:
      <<: *defaults
      jetstream:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "a declared stream emits the ConfigMap + the init Job"
    set:
      <<: *defaults
      jetstream:
        enabled: true
        serverUrl: "nats://pleme-nats.nats.svc:4222"
        streams:
          GITHUB_JOBS:
            subjects: ["github.jobs.>"]
            retention: workqueue
            storage: file
            replicas: 1
            maxMsgs: 10000
            maxBytes: "100MB"
            maxAge: "24h"
            duplicateWindow: "10m"
            discard: old
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: Job
        documentIndex: 1

  - it: "the ConfigMap stream spec converts byte + duration units (bytes/duration-ns helpers)"
    documentIndex: 0
    set:
      <<: *defaults
      jetstream:
        enabled: true
        streams:
          GITHUB_JOBS:
            subjects: ["github.jobs.>"]
            retention: workqueue
            storage: file
            maxBytes: "100MB"
            maxAge: "24h"
            duplicateWindow: "10m"
    asserts:
      - equal:
          path: kind
          value: ConfigMap
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare-jetstream
      # 100MB → 100 * 1048576 = 104857600 (bytes helper, MiB-based)
      - matchRegex:
          path: data["stream-GITHUB_JOBS.json"]
          pattern: "\"max_bytes\": 104857600"
      # 24h → 24 * 3600000000000 = 86400000000000 ns (duration-ns helper)
      - matchRegex:
          path: data["stream-GITHUB_JOBS.json"]
          pattern: "\"max_age\": 86400000000000"
      # 10m → 10 * 60000000000 = 600000000000 ns
      - matchRegex:
          path: data["stream-GITHUB_JOBS.json"]
          pattern: "\"duplicate_window\": 600000000000"

  - it: "a declared consumer carries the max_ack_pending rate-limit invariant"
    documentIndex: 0
    set:
      <<: *defaults
      jetstream:
        enabled: true
        consumers:
          GITHUB_JOBS:
            github-throttle:
              type: pull
              ackPolicy: explicit
              ackWait: "60s"
              maxAckPending: 1
              maxDeliver: 5
              filterSubject: "github.jobs.refresh.>"
    asserts:
      - matchRegex:
          path: data["consumer-GITHUB_JOBS-github-throttle.json"]
          pattern: "\"max_ack_pending\": 1"
      # 60s → 60 * 1000000000 = 60000000000 ns
      - matchRegex:
          path: data["consumer-GITHUB_JOBS-github-throttle.json"]
          pattern: "\"ack_wait\": 60000000000"

  - it: "the init Job is a Helm post-install/upgrade hook (jetstream-init-job)"
    documentIndex: 1
    set:
      <<: *defaults
      jetstream:
        enabled: true
        streams:
          GITHUB_JOBS:
            subjects: ["github.jobs.>"]
            retention: workqueue
            storage: file
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare-jetstream-init
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: spec.template.spec.containers[0].name
          value: jetstream-init
