suite: pleme-lib bare-fixture — pleme-lib.vmServiceScrape named template
templates:
  - templates/vmservicescrape.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"
  serviceAccount.create: true

tests:
  - it: "renders nothing when vmScrape is unset entirely"
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders nothing when vmScrape.enabled is false"
    set:
      <<: *defaults
      vmScrape.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "minimal vmScrape.enabled renders a VMServiceScrape with documented defaults"
    set:
      <<: *defaults
      vmScrape.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VMServiceScrape
      - equal:
          path: apiVersion
          value: operator.victoriametrics.com/v1beta1
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare
      - equal:
          path: metadata.namespace
          value: testns
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: pleme-lib-bare
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s

  - it: "honors explicit port / path / interval / scrapeTimeout overrides"
    set:
      <<: *defaults
      vmScrape:
        enabled: true
        port: metrics
        path: /actuator/prometheus
        interval: 15s
        scrapeTimeout: 5s
    asserts:
      - isKind:
          of: VMServiceScrape
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /actuator/prometheus
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 5s
