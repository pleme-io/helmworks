suite: pleme-lib bare-fixture — pleme-lib.alerts named template
# Generic PrometheusRule emitter (Observe slice of CIA): pod-restart, high-memory,
# high-error-rate, high-latency alert patterns. Each pattern renders only when its
# sub-object is present (the template gates on `and .Values.alerts.<pattern> ...`).
templates:
  - templates/alerts.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"

tests:
  - it: "renders nothing when alerts is unset entirely"
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders nothing when alerts.enabled is false"
    set:
      <<: *defaults
      alerts:
        enabled: false
        podRestarting:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "alerts.enabled emits a PrometheusRule with the standard rules group"
    set:
      <<: *defaults
      alerts:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: apiVersion
          value: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare
      - equal:
          path: spec.groups[0].name
          value: t-pleme-lib-bare.rules

  - it: "all four patterns present → all four rules render in order"
    set:
      <<: *defaults
      alerts:
        enabled: true
        podRestarting:
          threshold: 3
        highMemory:
          threshold: 90
        highErrorRate:
          threshold: 5
        highLatency:
          thresholdMs: 1000
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TPlemeLibBarePodRestarting
      - equal:
          path: spec.groups[0].rules[1].alert
          value: TPlemeLibBareHighMemory
      - equal:
          path: spec.groups[0].rules[2].alert
          value: TPlemeLibBareHighErrorRate
      - equal:
          path: spec.groups[0].rules[3].alert
          value: TPlemeLibBareHighLatency

  - it: "a single pattern with an overridden threshold renders only that rule"
    set:
      <<: *defaults
      alerts:
        enabled: true
        highErrorRate:
          threshold: 2
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TPlemeLibBareHighErrorRate
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: "> 2"

  - it: "an absent pattern is skipped — only the present one renders"
    # NOTE: the template gates each pattern on `and .Values.alerts.<p> ...`, so
    # an ABSENT sub-object skips that rule. (A present `enabled: false` does NOT
    # skip — `default true false` returns true; that is pre-existing template
    # behaviour, not asserted here.)
    set:
      <<: *defaults
      alerts:
        enabled: true
        highMemory:
          threshold: 90
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TPlemeLibBareHighMemory

  - it: "pod-restart threshold override lands on the rendered expr"
    set:
      <<: *defaults
      alerts:
        enabled: true
        podRestarting:
          threshold: 7
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TPlemeLibBarePodRestarting
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: "> 7"
