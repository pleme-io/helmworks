suite: pleme-lib bare-fixture — pleme-lib.secret-ref (typed reference, read-only mount)
templates:
  - templates/secret-ref.yaml
  - templates/deployment.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"
ref: &ref
  name: kensa-db
  store: akeyless
  key: /pleme/kensa/db-password
  path: /var/run/secrets/kensa-db

tests:
  - it: renders nothing when secretRefs is absent
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: a reference renders one ExternalSecret from its store and key
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs: [*ref]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: kensa-db
      - equal:
          path: spec.secretStoreRef
          value: { kind: ClusterSecretStore, name: akeyless }
      - equal:
          path: spec.data
          value: [{ secretKey: db-password, remoteRef: { key: /pleme/kensa/db-password } }]
      - equal:
          path: spec.target
          value: { name: kensa-db, creationPolicy: Owner }

  - it: property names the field and the file, storeKind picks a namespaced store
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - name: kensa-db
          store: local
          storeKind: SecretStore
          key: /pleme/kensa/db
          property: password
          path: /var/run/secrets/kensa-db
          refreshInterval: 1h
    asserts:
      - equal:
          path: spec.secretStoreRef
          value: { kind: SecretStore, name: local }
      - equal:
          path: spec.data
          value: [{ secretKey: password, remoteRef: { key: /pleme/kensa/db, property: password } }]
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: the deployment mounts the Secret read-only at the declared path
    template: templates/deployment.yaml
    set:
      <<: *defaults
      secretRefs: [*ref]
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value: [{ name: secret-kensa-db, secret: { secretName: kensa-db } }]
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value: [{ name: secret-kensa-db, mountPath: /var/run/secrets/kensa-db, readOnly: true }]

  - it: a secret path may not also be an access path
    template: templates/deployment.yaml
    set:
      <<: *defaults
      secretRefs: [*ref]
      access:
        reads: [{ path: /var/run/secrets/kensa-db, secret: kensa-db }]
    asserts:
      - failedTemplate:
          errorPattern: "one path is read or written, never both"

  - it: refuses a literal value
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - { name: kensa-db, store: akeyless, key: /k, path: /s, value: hunter2 }
    asserts:
      - failedTemplate:
          errorPattern: "holds a literal"

  - it: refuses an unknown field
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - { name: kensa-db, store: akeyless, key: /k, path: /s, mountPath: /s }
    asserts:
      - failedTemplate:
          errorPattern: "mountPath is not a secret-reference field"

  - it: refuses a reference with no store
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - { name: kensa-db, key: /k, path: /s }
    asserts:
      - failedTemplate:
          errorPattern: "secretRefs\\[0\\].store is required"

  - it: refuses a relative mount path
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - { name: kensa-db, store: akeyless, key: /k, path: secrets }
    asserts:
      - failedTemplate:
          errorPattern: "is not a mount point"

  - it: refuses two references at one path
    template: templates/secret-ref.yaml
    set:
      <<: *defaults
      secretRefs:
        - { name: a, store: s, key: /a, path: /s }
        - { name: b, store: s, key: /b, path: /s }
    asserts:
      - failedTemplate:
          errorPattern: "another secret reference already mounts"
