suite: pleme-lib bare-fixture — pleme-lib.resilience named template
# Network slice (CIA): Istio DestinationRule with circuit breaker, connection
# pooling, and outlier detection.
templates:
  - templates/resilience.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"

tests:
  - it: "renders nothing when resilience is unset entirely"
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders nothing when resilience.enabled is false"
    set:
      <<: *defaults
      resilience:
        enabled: false
        connectionPool:
          maxConnections: 50
    asserts:
      - hasDocuments:
          count: 0

  - it: "resilience.enabled emits a DestinationRule for the chart's own service"
    set:
      <<: *defaults
      resilience:
        enabled: true
        connectionPool: {}
        circuitBreaker: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DestinationRule
      - equal:
          path: apiVersion
          value: networking.istio.io/v1
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare
      - equal:
          path: spec.host
          value: t-pleme-lib-bare.testns.svc.cluster.local

  - it: "connection-pool defaults fill in around an explicit field"
    set:
      <<: *defaults
      resilience:
        enabled: true
        connectionPool:
          maxConnections: 100
    asserts:
      - equal:
          path: spec.trafficPolicy.connectionPool.tcp.maxConnections
          value: 100
      - equal:
          path: spec.trafficPolicy.connectionPool.http.http2MaxRequests
          value: 100
      - equal:
          path: spec.trafficPolicy.connectionPool.http.maxRequestsPerConnection
          value: 10

  - it: "circuit-breaker outlier-detection defaults + overrides apply"
    set:
      <<: *defaults
      resilience:
        enabled: true
        connectionPool:
          maxConnections: 200
        circuitBreaker:
          consecutive5xx: 10
          maxEjectionPercent: 75
    asserts:
      - equal:
          path: spec.trafficPolicy.connectionPool.tcp.maxConnections
          value: 200
      - equal:
          path: spec.trafficPolicy.outlierDetection.consecutive5xxErrors
          value: 10
      - equal:
          path: spec.trafficPolicy.outlierDetection.maxEjectionPercent
          value: 75
      - equal:
          path: spec.trafficPolicy.outlierDetection.interval
          value: 30s
