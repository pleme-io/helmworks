suite: pleme-lib bare-fixture — pleme-lib.webhookInjection named template
# Mutating Admission Webhook + backing Service — generic sidecar-injection pattern.
templates:
  - templates/webhook-injection.yaml
release:
  name: t
  namespace: testns
defaults: &defaults
  image.repository: ghcr.io/x/y
  image.tag: "1.0.0"

tests:
  - it: "renders nothing when webhook is unset entirely"
    set:
      <<: *defaults
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders nothing when webhook.enabled is false"
    set:
      <<: *defaults
      webhook:
        enabled: false
        port: 8443
    asserts:
      - hasDocuments:
          count: 0

  - it: "webhook.enabled emits a MutatingWebhookConfiguration + Service pair"
    set:
      <<: *defaults
      webhook:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: MutatingWebhookConfiguration
        documentIndex: 0
      - isKind:
          of: Service
        documentIndex: 1

  - it: "the webhook config carries the mutate rule + namespace selector"
    documentIndex: 0
    set:
      <<: *defaults
      webhook:
        enabled: true
    asserts:
      - equal:
          path: apiVersion
          value: admissionregistration.k8s.io/v1
      - equal:
          path: metadata.name
          value: t-pleme-lib-bare-webhook
      - equal:
          path: webhooks[0].name
          value: t-pleme-lib-bare.mutate
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /mutate
      - equal:
          path: webhooks[0].failurePolicy
          value: Ignore
      - contains:
          path: webhooks[0].rules[0].operations
          content: CREATE
      - equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0].key
          value: t-pleme-lib-bare-injection

  - it: "failurePolicy + metricsPort overrides apply to config + service"
    set:
      <<: *defaults
      webhook:
        enabled: true
        failurePolicy: Fail
        metricsPort: 8090
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: spec.ports[1].name
          value: metrics
        documentIndex: 1
      - equal:
          path: spec.ports[1].port
          value: 8090
        documentIndex: 1
