suite: pleme-saber externalsecret tests
templates:
  - templates/externalsecret.yaml
values:
  - ../../examples/saber.yaml
tests:
  - it: should render exactly one ExternalSecret named saber-db
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: saber-db

  - it: should reference the cluster-secret-store (cofre/Borealis, not plaintext)
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-secret-store

  - it: should extract DATABASE_URL from the cofre key path
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: /pleme-io/saber/database-url

  - it: should materialize a Secret named saber-db with Owner creation policy
    asserts:
      - equal:
          path: spec.target.name
          value: saber-db
      - equal:
          path: spec.target.creationPolicy
          value: Owner
