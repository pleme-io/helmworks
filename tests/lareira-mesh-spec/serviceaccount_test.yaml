suite: lareira-mesh-spec ServiceAccount fallbacks
templates:
  - templates/serviceaccounts.yaml
release:
  namespace: mesh-system
tests:
  - it: only emits SAs for entries with createServiceAccount=true (default = openclaw-web + cloudflared)
    asserts:
      - hasDocuments:
          count: 2

  - it: openclaw-web SA in mesh home namespace
    documentSelector:
      path: metadata.name
      value: openclaw-stack-openclaw-web
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.namespace
          value: openclaw

  - it: cloudflared SA in cloudflared namespace
    documentSelector:
      path: metadata.name
      value: cloudflared
    asserts:
      - equal:
          path: metadata.namespace
          value: cloudflared

  - it: omits SA when chart already creates one
    set:
      servicos:
        - name: foo
          serviceAccount: pre-existing-sa  # operator-supplied, no createServiceAccount key
          podSelector: { app: foo }
      participants: []
    asserts:
      - hasDocuments:
          count: 0

  - it: emits SA when explicitly asked (Servico)
    set:
      servicos:
        - name: foo
          serviceAccount: foo-sa
          createServiceAccount: true
          podSelector: { app: foo }
      participants: []
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: foo-sa
