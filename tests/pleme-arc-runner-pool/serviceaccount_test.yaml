suite: pleme-arc-runner-pool serviceaccount tests
templates:
  - templates/serviceaccount.yaml
values:
  - ../../examples/example-arc-runner-pool.yaml
tests:
  - it: should render a ServiceAccount
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: should name the SA from values
    asserts:
      - equal:
          path: metadata.name
          value: example-runner-sa

  - it: should carry the IRSA annotation
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/example-runner-role"
