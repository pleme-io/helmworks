suite: pleme-arc-runner-pool Karpenter tests
templates:
  - templates/karpenter.yaml
values:
  - ../../examples/example-arc-runner-pool.yaml
tests:
  - it: should render a NodePool (no EC2NodeClass — example references existing `general`)
    asserts:
      - hasDocuments:
          count: 1

  - it: NodePool name + isolation taint
    documentIndex: 0
    asserts:
      - isKind:
          of: NodePool
      - equal:
          path: metadata.name
          value: example-runner-pool
      - equal:
          path: spec.template.spec.taints[0].key
          value: arc-runner
      - equal:
          path: spec.template.spec.taints[0].effect
          value: NoSchedule
      - equal:
          path: spec.template.spec.nodeClassRef.name
          value: general
      - equal:
          path: spec.disruption.consolidationPolicy
          value: WhenEmpty
