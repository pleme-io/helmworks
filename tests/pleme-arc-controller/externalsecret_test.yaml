suite: pleme-arc-controller ExternalSecret tests
templates:
  - templates/externalsecret.yaml
values:
  - ../../examples/example-arc-controller.yaml
tests:
  - it: should render exactly one ExternalSecret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret

  - it: targets the configured cluster secret store
    asserts:
      - equal:
          path: metadata.name
          value: arc-github-app-secret
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-secret-store

  - it: pulls from the configured backend path
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: /example/secrets/arc-github-app-secret

  - it: defaults to creating a Secret with the same name (Owner policy)
    asserts:
      - equal:
          path: spec.target.name
          value: arc-github-app-secret
      - equal:
          path: spec.target.creationPolicy
          value: Owner
