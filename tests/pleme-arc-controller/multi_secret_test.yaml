suite: pleme-arc-controller multi-secret + custom store tests
templates:
  - templates/externalsecret.yaml
values:
  - ../../examples/example-arc-controller.yaml
set:
  externalSecret:
    clusterSecretStoreName: cluster-secret-store
    refreshInterval: 1h
    secrets:
      arc-github-app-secret:
        dataFrom:
          - extract:
              key: /example/secrets/arc-github-app-secret
      arc-additional-secret:
        clusterSecretStoreName: vault-cluster-secret-store
        refreshInterval: 5m
        data:
          - secretKey: api-token
            remoteRef:
              key: secret/path/api-token
tests:
  - it: renders 2 ExternalSecrets
    asserts:
      - hasDocuments:
          count: 2

  - it: first secret uses default store + default refresh
    documentSelector:
      path: metadata.name
      value: arc-github-app-secret
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-secret-store
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: second secret overrides both store + refresh interval
    documentSelector:
      path: metadata.name
      value: arc-additional-secret
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: vault-cluster-secret-store
      - equal:
          path: spec.refreshInterval
          value: 5m
      - equal:
          path: spec.data[0].secretKey
          value: api-token
