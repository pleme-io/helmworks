suite: engenho-unit daemonset
templates:
  - templates/daemonset.yaml
release:
  name: wyoming-openwakeword
  namespace: default
set:
  unit: /nix/store/aaaa-unit-wyoming-openwakeword.service/wyoming-openwakeword.service
  engenho.package: /nix/store/bbbb-engenho
tests:
  - it: runs the unit through the engenho closure, named after the release
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: wyoming-openwakeword
      - equal:
          path: spec.template.spec.containers[0].image
          value: nix:/nix/store/bbbb-engenho
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /nix/store/bbbb-engenho/bin/engenho
            - unit-run
            - --unit
            - /nix/store/aaaa-unit-wyoming-openwakeword.service/wyoming-openwakeword.service
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: wyoming-openwakeword
  - it: passes an account, and the group defaults to it
    set:
      user: wyoming-openwakeword
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /nix/store/bbbb-engenho/bin/engenho
            - unit-run
            - --unit
            - /nix/store/aaaa-unit-wyoming-openwakeword.service/wyoming-openwakeword.service
            - --user
            - wyoming-openwakeword
            - --group
            - wyoming-openwakeword
  - it: passes an explicit group
    set:
      user: esphome
      group: dialout
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[7]
          value: dialout
  - it: passes no identity when the unit keeps its own User=
    set:
      group: dialout
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].command
          count: 4
  - it: refuses a unit that is not a store path
    set:
      unit: /etc/systemd/system/x.service
    asserts:
      - failedTemplate: {}
