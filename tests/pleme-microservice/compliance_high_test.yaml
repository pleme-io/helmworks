suite: pleme-microservice — fedramp-high invariants
templates:
  - templates/deployment.yaml
  - templates/networkpolicy.yaml
  - templates/serviceaccount.yaml
  - templates/servicemonitor.yaml
  - templates/pdb.yaml
  - templates/compliance-manifest.yaml
release:
  name: testapp
  namespace: testns
values:
  - ../../examples/fedramp-high.yaml
tests:
  - it: deployment carries compliance baseline label
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["compliance.pleme.io/baseline"]
          value: fedramp-high

  - it: deployment carries compliance control coverage annotation (high-only controls present)
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: metadata.annotations["compliance.pleme.io/controls"]
          pattern: "SC-28"
      - matchRegex:
          path: metadata.annotations["compliance.pleme.io/controls"]
          pattern: "SI-7"
      - matchRegex:
          path: metadata.annotations["compliance.pleme.io/controls"]
          pattern: "SC-5"
      - matchRegex:
          path: metadata.annotations["compliance.pleme.io/controls"]
          pattern: "AC-3"

  - it: pod security context forces runAsNonRoot and seccomp RuntimeDefault
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: container security context forbids privilege escalation and root
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: serviceAccount token automounting is disabled
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: image is digest-pinned and pullPolicy is Always
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "@?sha256:[0-9a-f]{64}$"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: topology spread constraints are present
    template: templates/deployment.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.spec.topologySpreadConstraints
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: serviceAccount disables automountServiceAccountToken
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: default-deny NetworkPolicy is rendered
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: testapp-pleme-microservice-compliance-deny-all
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  - it: allow-dns NetworkPolicy is rendered
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: testapp-pleme-microservice-compliance-allow-dns
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            port: 53
            protocol: UDP

  - it: allow-tls-egress NetworkPolicy is rendered
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: testapp-pleme-microservice-compliance-allow-tls-egress
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            port: 443
            protocol: TCP

  - it: PodDisruptionBudget is rendered
    template: templates/pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: testapp-pleme-microservice-compliance

  - it: ServiceMonitor is rendered
    template: templates/servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: compliance manifest ConfigMap is emitted
    template: templates/compliance-manifest.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.baseline
          value: fedramp-high
      - equal:
          path: data.framework
          value: nist-800-53-rev5
      - matchRegex:
          path: data.controls
          pattern: "AC-3"
      - matchRegex:
          path: data.controls
          pattern: "AC-17"
      - matchRegex:
          path: data.controls
          pattern: "SC-28"
