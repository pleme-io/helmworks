suite: pleme-lib.serviceAccounts — multiple ServiceAccounts from a values map
templates:
  - templates/service-accounts.yaml
release:
  name: t
  namespace: testns
tests:
  - it: no-op when the map is empty/absent
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one SA per entry with verbatim name + release namespace
    set:
      serviceAccounts:
        pitr-runner:
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/pitr-runner"
        reaper: {}
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.name
          value: pitr-runner
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: testns
      - documentIndex: 0
        equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::000000000000:role/pitr-runner"

  - it: per-entry namespace override + automount passthrough
    set:
      serviceAccounts:
        sa:
          namespace: crossplane-system
          automountServiceAccountToken: false
    asserts:
      - equal:
          path: metadata.namespace
          value: crossplane-system
      - equal:
          path: automountServiceAccountToken
          value: false
