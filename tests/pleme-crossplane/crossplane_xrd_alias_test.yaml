suite: pleme-lib.crossplaneXRD — alias of crossplaneCompositeResourceDefinition
# The alias define delegates verbatim to the canonical define; this suite proves
# the alias name is exercised (covers it directly, not just transitively).
templates:
  - templates/crossplane-xrd-alias.yaml
release:
  name: t
  namespace: testns
tests:
  - it: the alias renders the same XRD the canonical define produces
    set:
      crossplane:
        compositeResourceDefinitions:
          xdatabases:
            group: platform.example.org
            names:
              kind: XDatabase
              plural: xdatabases
            scope: Namespaced
            versions:
              - name: v1alpha1
                served: true
                referenceable: true
                schema:
                  openAPIV3Schema:
                    type: object
                    properties:
                      spec: { type: object }
                      status:
                        type: object
                        properties:
                          ready: { type: boolean }
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CompositeResourceDefinition
      - equal:
          path: apiVersion
          value: apiextensions.crossplane.io/v2
      - equal:
          path: metadata.name
          value: xdatabases
      - equal:
          path: spec.group
          value: platform.example.org

  - it: the alias is a no-op on an empty map
    set:
      crossplane:
        compositeResourceDefinitions: {}
    asserts:
      - hasDocuments:
          count: 0
