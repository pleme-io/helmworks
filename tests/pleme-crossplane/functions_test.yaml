suite: pleme-lib.crossplaneFunction — generic Function from a values map
templates:
  - templates/functions.yaml
release:
  name: t
  namespace: testns
tests:
  - it: renders one Function per entry with assembled package + verbatim name
    set:
      crossplane:
        functions:
          function-kcl:
            registry: xpkg.upbound.io/crossplane-contrib
            name: function-kcl
            version: "0.11.0"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Function
      - equal:
          path: apiVersion
          value: pkg.crossplane.io/v1beta1
      - equal:
          path: metadata.name
          value: function-kcl
      - equal:
          path: spec.package
          value: "xpkg.upbound.io/crossplane-contrib/function-kcl:v0.11.0"
      - notExists:
          path: metadata.namespace

  - it: per-entry annotations passthrough renders on the Function
    set:
      crossplane:
        functions:
          function-kcl:
            registry: xpkg.upbound.io/crossplane-contrib
            name: function-kcl
            version: "0.11.0"
            annotations:
              argocd.argoproj.io/sync-wave: "-2"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
