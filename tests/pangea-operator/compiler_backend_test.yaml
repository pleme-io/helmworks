suite: pangea-operator — compiler backend selection and postgres auth
templates:
  - templates/deployment.yaml
release:
  name: pangea-operator
  namespace: pangea-system
tests:
  - it: "selects lava when nothing names a backend"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_COMPILER_BACKEND
            value: lava
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: "compiles Ruby templates in lava unless configured off"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_LAVA_RUBY
            value: "on"

  - it: "renders lava-ruby off when disabled"
    set:
      lavaRuby.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_LAVA_RUBY
            value: "off"

  - it: "renders no lava-ruby load path by default, so the image gem root applies"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_LAVA_RUBY_LOAD_PATH
          any: true

  - it: "renders an explicit lava-ruby load path"
    set:
      lavaRuby.loadPath: /gems/a/lib:/gems/b/lib
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_LAVA_RUBY_LOAD_PATH
            value: /gems/a/lib:/gems/b/lib

  - it: "keeps useEmbeddedRuby true on the embedded backend"
    set:
      useEmbeddedRuby: true
      gemAuth.tokenSecret.name: gem-auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_COMPILER_BACKEND
            value: embedded

  - it: "keeps http reachable when named"
    set:
      compilerBackend: http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGEA_COMPILER_BACKEND
            value: http

  - it: "refuses an unknown backend"
    set:
      compilerBackend: cobol
    asserts:
      - failedTemplate: {}

  - it: "renders postgres credentials from the secret by default"
    set:
      executor.magma.enabled: true
      executor.magma.postgres.host: 127.0.0.1
      executor.magma.postgres.passwordSecretName: pg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: pg
                key: password

  - it: "renders a literal user and no password under trust"
    set:
      executor.magma.enabled: true
      executor.magma.postgres.host: 127.0.0.1
      executor.magma.postgres.auth: trust
      executor.magma.postgres.user: pangea
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: pangea
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
          any: true

  - it: "refuses an unknown postgres auth"
    set:
      executor.magma.enabled: true
      executor.magma.postgres.host: 127.0.0.1
      executor.magma.postgres.auth: kerberos
    asserts:
      - failedTemplate: {}
