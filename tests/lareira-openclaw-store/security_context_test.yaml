suite: lareira-openclaw-store — security context hardening
templates:
  - charts/pleme-microservice/templates/deployment.yaml
release:
  name: openclaw-store
  namespace: openclaw
defaults: &defaults
  pleme-microservice.image.tag: "sha256:abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234"
  pleme-microservice.attestation.signature: "blake3:test-sig-aaaaaaaaaaaaaaaa"
  pleme-microservice.attestation.certificationHash: "blake3:test-cert-bbbbbbbbbbbb"
  pleme-microservice.attestation.complianceHash: "blake3:test-comp-cccccccccccc"
tests:
  - it: pod runs as non-root
    set:
      <<: *defaults
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: container drops ALL capabilities
    set:
      <<: *defaults
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: container has read-only root filesystem
    set:
      <<: *defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: replicaCount >= 2 satisfies CP-2 (HPA disabled path)
    set:
      <<: *defaults
      pleme-microservice.autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: postgres password is mounted via secretKeyRef when backend=postgres
    set:
      <<: *defaults
      persistence.backend: postgres
      persistence.postgres.host: cnpg-rw.openclaw.svc
      pleme-microservice.env:
        - name: OPENCLAW_PKI_HOST
          value: "openclaw-pki-lareira-openclaw-pki"
        - name: OPENCLAW_PKI_PORT
          value: "8090"
        - name: RUST_LOG
          value: "info"
        - name: OPENCLAW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openclaw-store-postgres
              key: password
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[3].name
          pattern: '(OPENCLAW_DB_PASSWORD|OPENCLAW_PKI_HOST|RUST_LOG)'
