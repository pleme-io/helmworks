# Run every chart's helm-unittest suites on PR and on merge.
#
# A 5-line shim over substrate's reusable, per ★★ Super-Cache-CI: the
# vocabulary lives once, upstream, and a consumer is configuration.
#
# WHY THIS REPO HAD NO SUCH WORKFLOW UNTIL 2026-08-11: it had exactly one,
# auto-release.yml. So every helm-unittest suite in this repo — the surface
# that decides whether Ruby reaches a FedRAMP boundary among them — was a
# file nothing executed. `helm unittest .` passing on a laptop is not a
# gate; this is.
#
# The floor is deliberately below today's count so adding a suite never
# demands an edit here, while a repo that silently loses most of them still
# fails. A gate that makes every new test a two-file change acquires a
# reputation for friction and then gets deleted.
name: chart-tests

# PR-ONLY since 2026-08-19. The merge-to-main run moved into auto-release.yml
# as a `needs:` of the publish job — see that file's `charts:` comment. Keeping
# `push: branches:[main]` here as well would run the same suite twice per merge
# and, worse, would leave a SECOND green/red signal on main that gates nothing,
# which is exactly the shape that let a chart publish past a red suite.
on:
  pull_request:

permissions:
  contents: read

jobs:
  charts:
    uses: pleme-io/substrate/.github/workflows/helm-unittest.yml@main
    with:
      chartsDir: charts
      # ★ WIRED 2026-08-29. `tests/_fixtures/*` are bare CONSUMER charts that
      # exist only to exercise pleme-lib's named templates — a library chart
      # renders nothing, so neither the chartsDir loop nor externalTestsDir can
      # reach one. They had never been executed: 191 passing tests and one
      # RED one sat in git, in the repo whose own header above warns about
      # exactly that. The floor is 1 (two fixtures exist) — anti-vacuity, so a
      # moved or renamed tree fails instead of silently verifying nothing.
      fixtureChartsDir: tests/_fixtures
      fixtureChartsFloor: 1
      # Measured 2026-08-11 over all 148 charts, with `helm dependency
      # update` run first: 0 lint failures, 15 charts carrying suites, 0
      # test failures. So this repo needs no lint ratchet — the reusable's
      # `lintFailureCeiling` defaults to 0 and that is already met.
      #
      # Floor is half of 15, deliberately. Adding a suite must never
      # require editing this file, while a repo that silently loses most of
      # them still fails.
      chartsWithTestsFloor: 7
