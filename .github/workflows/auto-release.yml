# AUTO-RELEASE (default-on): publish every hand-bumped chart to OCI on merge.
# The whole footprint is this shim around the substrate monorepo reusable, which
# runs `nix run .#release` (forge helm release-all — discover→lint→package→push,
# 404-idempotent so already-published (name,version) pairs are skipped). Bump a
# chart's Chart.yaml version in its own commit; merging it is what ships it.
name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ── THE GATE: publication is now a FUNCTION of the tests ──────────────────
  #
  # Until 2026-08-19 this workflow and chart-tests.yml were two INDEPENDENT
  # workflows on the same `push: branches:[main]` event, so a chart published
  # while its suite was red. Not theoretical — measured on one push:
  # run 32168256181 (chart-tests) FAILED at 17:56:20Z and run 32168256381
  # (auto-release) SUCCEEDED at 18:03:08Z, publishing a chart
  # 0.9.0 seven minutes later. That independence is why a version-pair defect
  # in the shared reusable survived 8 days and 9 pitr releases, and why 14
  # charts (180 assertions) have shipped every version they have ever had
  # without one of those assertions executing.
  #
  # Same reusable, same inputs as chart-tests.yml — deliberately duplicated
  # rather than factored, because a `workflow_run` trigger resolves against
  # the DEFAULT BRANCH's workflow file and adds a second run record; `needs:`
  # inside one workflow is exact and reads in one place.
  #
  # NOT enforced additionally by branch protection: pleme-io is on the GitHub
  # Free plan, where required status checks on a private/org ruleset are not
  # available. `needs:` is therefore the whole gate, which is why it lives
  # here rather than in a repo setting.
  charts:
    uses: pleme-io/substrate/.github/workflows/helm-unittest.yml@main
    with:
      chartsDir: charts
      # ★ WIRED 2026-08-29. `tests/_fixtures/*` are bare CONSUMER charts that
      # exist only to exercise pleme-lib's named templates — a library chart
      # renders nothing, so neither the chartsDir loop nor externalTestsDir can
      # reach one. They had never been executed: 191 passing tests and one
      # RED one sat in git, in the repo whose own header above warns about
      # exactly that. The floor is 1 (two fixtures exist) — anti-vacuity, so a
      # moved or renamed tree fails instead of silently verifying nothing.
      fixtureChartsDir: tests/_fixtures
      fixtureChartsFloor: 1
      # Kept in lockstep with chart-tests.yml's floor — see its comment for why
      # the floor is deliberately half the measured count.
      chartsWithTestsFloor: 7
      # ── RATCHET SET AT ADOPTION, NOT RAISED TO PASS A BREAK ───────────────
      # The first run of this gate (32263532063) measured
      # `scanned=147 linted=140 lint_failed=7 with-suites=14 test_failed=0`.
      # Note test_failed=0 — every suite that ran, passed. The 7 are ONE
      # pre-existing defect with seven victims: lareira-{cartorio,lacre} and the
      # five lareira-openclaw-* all vendor pleme-microservice-0.6.0.tgz, whose
      # embedded pleme-lib predates `pleme-lib.shinkaDatabaseMigration`, so
      # charts/pleme-microservice/templates/shinka-migration.yaml:1:4 renders
      # `no template "pleme-lib.shinkaDatabaseMigration" associated with
      # template "gotpl"`. The helper exists in pleme-lib 0.44.1
      # (templates/_shinka.tpl); the vendored tarball is what is stale. Those
      # charts would fail at INSTALL time too, not only at lint.
      #
      # 7 is therefore the honest count on the day the gate was first able to
      # run, not a concession. chart-tests.yml's standing claim of "0 lint
      # failures, measured 2026-08-11" was taken while this workflow could never
      # start, so it measured nothing.
      #
      # This is the ratchet's intended use — adopt at the true current state,
      # then lower. It is NOT the forbidden move, which is raising the ceiling
      # so a NEW break passes: an 8th lint failure still fails this gate, and
      # helm unittest failures are never ratcheted and still gate at zero.
      # LOWER THIS TO 0 once the vendored pleme-lib skew is fixed.
      # `pending-pleme-microservice-lib-skew: 7 charts, one stale vendored tgz`
      lintFailureCeiling: 7

  release:
    needs: [charts]
    uses: pleme-io/substrate/.github/workflows/helm-monorepo-auto-release.yml@main
    secrets: inherit

  # ── BUMP DRIFT: a chart edited without its version bumped ships NOWHERE ────
  # release above is 404-idempotent, so a chart whose Chart.yaml version is
  # already published is SKIPPED — and a template edit committed after that
  # publish reaches no cluster while everything stays green. Measured
  # 2026-08-01: FOUR charts were in that state at once, plus a fifth created by
  # the very commit that documented the problem.
  #
  # DELIBERATELY NOT A `needs:` OF release, and not in the same job. One
  # drifted chart must not block publication of the other 148 — this is meant
  # to be LOUD, not blocking. The run goes red; the charts still ship.
  #
  # Skipped on a branch's first push, where github.event.before is the all-zero
  # sha and there is no range to diff. That is a real absence, not a pass: the
  # script itself REFUSES an empty BASE_SHA rather than reporting zero
  # violations, so the only way to get a green here is to actually have none.
  bump-drift:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The script needs pleme-io's tlisp stdlib (`status-of`, `exec-capture`,
      # `log-error`, …) — verified by running it standalone, which fails with
      # `unbound symbol status-of`. Both repos are public, so the default token
      # is enough.
      - uses: actions/checkout@v4
        with:
          repository: pleme-io/actions
          path: .pleme-actions
          ref: main
      - id: src
        shell: bash
        run: |
          {
            echo 'script<<TLISP_EOF'
            cat .pleme-actions/_tlisp-stdlib/stdlib.tlisp
            echo
            cat tools/bump-drift.tlisp
            echo 'TLISP_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: pleme-io/actions/tatara-script@main
        with:
          script: ${{ steps.src.outputs.script }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FAIL_ON_DRIFT: "true"
