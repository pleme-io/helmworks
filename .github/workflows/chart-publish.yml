# Chart delivery trigger — the whole repo-specific surface is this file.
#
# Flat and matrix-FREE on purpose (measured 2026-11-21): GitHub
# startup_fails a job that combines `uses:` with `strategy.matrix` —
# runs 44861052761, 44862261383, 44862322663 — so the changed-only loop
# lives inside actions/helm-oci-publish (charts input), and this caller
# is one detect job (actions/changed-charts) + one publish call
# (flows/helm-publish at depth 2). A new chart repo copies this file and
# changes nothing.
#
# Credential: this repo's own GITHUB_TOKEN (ghcr rejects App installation
# tokens outright — measured 2026-11-20); a package this repo creates
# inherits its access (org default ON). First publish lands private —
# flip it public once on the package settings page so pulls are anonymous.
name: chart-publish

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch: {}

jobs:
  changes:
    name: Changed charts
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.set.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: set
        uses: pleme-io/actions/changed-charts@main
        with:
          before: ${{ github.event.before }}

  publish:
    name: Publish
    needs: changes
    if: needs.changes.outputs.names != ''
    uses: pleme-io/flows/.github/workflows/helm-publish.yml@main
    with:
      # This repository is PUBLIC, and an org runner group answering
      # allows_public_repositories=false can never dispatch its jobs. The
      # helmworks-release pool (nix repo, ci-server profile) is registered
      # to THIS repository alone — the one-repo registration a public repo
      # can reach — and its job tokens carry packages:write for the push.
      chartPath: ./charts
      charts: ${{ needs.changes.outputs.names }}
      runner: pleme-helmworks-release
    secrets: inherit
