# Publish helm charts to oci://ghcr.io/pleme-io/charts on push to main.
#
# Detects which charts changed in the push and publishes only those —
# avoids re-publishing the entire fleet on every commit. Uses the
# substrate reusable helm-publish workflow so chart-publish logic stays
# centralized.

name: chart-publish

on:
  push:
    branches: [main]
    paths:
      - 'charts/**/Chart.yaml'
      - 'charts/**/values.yaml'
      - 'charts/**/templates/**'
      - 'charts/**/crds/**'
      - 'charts/**/files/**'
  workflow_dispatch:
    inputs:
      chart:
        description: "Specific chart to republish (e.g. pangea-operator). Empty = all changed since last commit."
        type: string
        default: ""

jobs:
  detect-changed-charts:
    name: Detect changed charts
    runs-on: ubuntu-24.04
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed chart dirs
        id: detect
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.chart }}" ]; then
            charts="${{ github.event.inputs.chart }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No specific chart + workflow_dispatch with empty input — republish all charts.
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d ! -name 'pleme-lib' -exec basename {} \; | tr '\n' ' ')
          else
            # On push: pick charts whose Chart.yaml or templates changed in the push.
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
                      | awk -F/ '/^charts\// && $2 != "pleme-lib" {print $2}' \
                      | sort -u | tr '\n' ' ')
            charts="$changed"
          fi
          # Also bump pleme-lib if any consumer changed (cheap; deduplicated below).
          if [ -n "$charts" ] && find charts/pleme-lib -newer .git/HEAD 2>/dev/null | grep -q .; then
            charts="pleme-lib $charts"
          fi
          echo "Charts to publish: '$charts'"
          # Convert to JSON array for the matrix.
          if [ -z "$charts" ]; then
            echo "charts=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(echo "$charts" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
            echo "charts=$json" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.chart }}
    needs: detect-changed-charts
    if: ${{ needs.detect-changed-charts.outputs.charts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.detect-changed-charts.outputs.charts) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Log in to GHCR
        # Prefer the org-level GHCR_TOKEN (classic PAT with write:packages
        # on pleme-io). Falls back to the workflow's GITHUB_TOKEN — works
        # only for packages this repo originally created.
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Lint, package, push ${{ matrix.chart }}
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          # If the chart depends on pleme-lib via file://, set it up
          # alongside so dependency resolution works.
          if grep -q '^\s*repository:.*file://' "$chart_dir/Chart.yaml" 2>/dev/null; then
            helm dependency build "$chart_dir"
          fi
          helm lint "$chart_dir"
          mkdir -p dist
          helm package "$chart_dir" --destination dist
          tgz=$(ls -1 dist/*.tgz | head -n1)
          helm push "$tgz" oci://ghcr.io/pleme-io/charts
